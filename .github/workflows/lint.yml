name: Lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    name: JavaScript and TypeScript lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        if: ${{ hashFiles('package.json') != '' && (hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != '') }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run ESLint
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f node_modules/.bin/eslint ]]; then
            echo "::notice::ESLint is not installed; skipping JavaScript lint."
            exit 0
          fi
          if node -e '
            const pkg = require("./package.json");
            process.exit(pkg.scripts?.lint ? 0 : 1);
          '; then
            npm run lint
          else
            echo "::notice::No npm lint script is configured; running ESLint on tracked JS/TS files."
            mapfile -d '' files < <(
              git ls-files -z -- '*.js' '*.cjs' '*.mjs' '*.jsx' '*.ts' '*.tsx'
            )
            if [[ "${#files[@]}" -gt 0 ]]; then
              ./node_modules/.bin/eslint "${files[@]}"
            else
              echo "No tracked JavaScript or TypeScript files found."
            fi
          fi
  python:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect Python files
        id: detect
        shell: bash
        run: |
          if find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -path './.agent-backup' -prune -o \
            -type f -name '*.py' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: ${{ steps.detect.outputs.found == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        if: ${{ steps.detect.outputs.found == 'true' }}
        run: python -m pip install ruff
      - name: Run Ruff checks
        if: ${{ steps.detect.outputs.found == 'true' }}
        run: |
          ruff check .
          ruff format --check .
      - name: Skip Python lint
        if: ${{ steps.detect.outputs.found != 'true' }}
        run: echo "No Python files found; skipping Python lint."
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check merge conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- \
            ':!*.lock' \
            ':!*.svg'; then
            echo "::error::Possible merge conflict markers found."
            exit 1
          else
            status=$?
            if [[ "$status" -gt 1 ]]; then
              echo "::error::git grep failed."
              exit "$status"
            fi
          fi
          echo "No standard merge conflict markers found."
      - name: Check trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '[[:blank:]]+$' -- \
            '*.js' '*.cjs' '*.mjs' '*.jsx' '*.ts' '*.tsx' \
            '*.py' '*.html' '*.css' '*.json' '*.yml' '*.yaml' \
            '*.sh' '*.md'; then
            echo "::error::Trailing whitespace found in tracked files."
            exit 1
          else
            status=$?
            if [[ "$status" -gt 1 ]]; then
              echo "::error::git grep failed."
              exit "$status"
            fi
          fi
          echo "No trailing whitespace found in checked file types."