# File: .github/workflows/lint.yml
name: MedOrbits Lint and Code Quality
on:
  push:
    branches:
      - main
      - master
      - develop
      - staging
  pull_request:
    branches:
      - main
      - master
      - develop
      - staging
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medorbits-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  lint:
    name: Lint and validate code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify project files
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
      - name: Validate package metadata
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (!pkg.name || !pkg.version) {
            throw new Error('Package name and version are required.');
          }
          if (!Number.isInteger(lock.lockfileVersion)) {
            throw new Error('Invalid or missing lockfileVersion.');
          }
          if (lock.name && lock.name !== pkg.name) {
            throw new Error('Package name mismatch.');
          }
          if (lock.version && lock.version !== pkg.version) {
            throw new Error('Package version mismatch.');
          }
          console.log(`Validated ${pkg.name}@${pkg.version}`);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const excluded = new Set([
            '.git',
            'node_modules',
            'coverage',
            'dist',
            'build',
            '.next',
            '.wrangler'
          ]);
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = path.join(dir, entry.name);
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) walk(full);
              } else if (
                entry.isFile() &&
                entry.name.endsWith('.js')
              ) {
                files.push(full);
              }
            }
          }
          walk('.');
          let failed = false;
          for (const file of files) {
            const result = spawnSync(
              process.execPath,
              ['--check', file],
              { encoding: 'utf8' }
            );
            if (result.status !== 0) {
              failed = true;
              console.error(`FAIL ${file}`);
              if (result.stderr) console.error(result.stderr);
              if (result.stdout) console.error(result.stdout);
            } else {
              console.log(`PASS ${file}`);
            }
          }
          if (failed) process.exit(1);
          console.log(`Syntax checked ${files.length} JavaScript files.`);
          NODE
      - name: Validate JSON files
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const excluded = new Set([
            '.git',
            'node_modules',
            'coverage',
            'dist',
            'build',
            '.next',
            '.wrangler'
          ]);
          const files = [];
          let failed = false;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = path.join(dir, entry.name);
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) walk(full);
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith('.json')
              ) {
                files.push(full);
              }
            }
          }
          walk('.');
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log(`PASS ${file}`);
            } catch (error) {
              failed = true;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }
          if (failed) process.exit(1);
          console.log(`Validated ${files.length} JSON files.`);
          NODE
      - name: Run configured lint script
        run: |
          set -euo pipefail
          if npm run | grep -Eq '^[[:space:]]+lint([[:space:]]|$)'; then
            npm run lint
          else
            echo "::warning::No lint script is configured in package.json."
          fi
      - name: Run configured formatting check
        run: |
          set -euo pipefail
          if npm run | grep -Eq '^[[:space:]]+format:check([[:space:]]|$)'; then
            npm run format:check
          else
            echo "No format:check script configured; skipping."
          fi
      - name: Report result
        if: success()
        run: echo "MedOrbits lint and code-quality checks completed successfully."
      - name: Report failure
        if: failure()
        run: |
          echo "::error::A lint or validation check failed."
          echo "Review the failed step logs before merging."