name: Validate JSON
on:
  push:
    branches:
      - main
    paths:
      - "**/*.json"
      - ".github/workflows/validate-json.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.json"
      - ".github/workflows/validate-json.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-json-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' json_files < <(
            find . \
              -path './.git' -prune -o \
              -type f -name '*.json' -print0
          )
          if [[ "${#json_files[@]}" -eq 0 ]]; then
            echo "No JSON files found."
            exit 0
          fi
          failed=0
          for file in "${json_files[@]}"; do
            if node -e '
              const fs = require("node:fs");
              const file = process.argv[1];
              JSON.parse(fs.readFileSync(file, "utf8"));
            ' "$file"; then
              echo "Valid JSON: $file"
            else
              echo "::error file=$file::Invalid JSON syntax."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi