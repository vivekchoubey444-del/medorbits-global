
name: Security Audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate package manifest
        id: npm-project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json found; npm audit will be skipped."
            exit 0
          fi

          node <<'JS'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            console.error("::error::package.json must contain a JSON object.");
            process.exit(1);
          }

          for (const field of ["dependencies", "devDependencies", "optionalDependencies"]) {
            if (pkg[field] !== undefined &&
                (!pkg[field] || typeof pkg[field] !== "object" || Array.isArray(pkg[field]))) {
              console.error(`::error::package.json ${field} must be an object.`);
              process.exit(1);
            }
          }

          console.log(`Auditing ${pkg.name || "unnamed package"}`);
          JS

          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Require a committed lockfile
        if: steps.npm-project.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f npm-shrinkwrap.json && ! -f package-lock.json ]]; then
            echo "::error::No npm lockfile found. Generate and commit package-lock.json or npm-shrinkwrap.json."
            exit 1
          fi

      - name: Validate lockfile
        if: steps.npm-project.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lockPath = fs.existsSync("npm-shrinkwrap.json")
            ? "npm-shrinkwrap.json"
            : "package-lock.json";

          let lock;

          try {
            lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          } catch (error) {
            console.error(`::error::Invalid ${lockPath}: ${error.message}`);
            process.exit(1);
          }

          if (!lock || typeof lock !== "object" || Array.isArray(lock)) {
            console.error(`::error::${lockPath} must contain a JSON object.`);
            process.exit(1);
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            console.error(`::error::Unsupported lockfileVersion: ${lock.lockfileVersion}`);
            process.exit(1);
          }

          if (!lock.packages || typeof lock.packages !== "object" ||
              Array.isArray(lock.packages)) {
            console.error(`::error::${lockPath} is missing a valid packages object.`);
            process.exit(1);
          }

          const root = lock.packages[""];

          if (!root || typeof root !== "object") {
            console.error(`::error::${lockPath} is missing packages[""].`);
            process.exit(1);
          }

          for (const field of ["name", "version"]) {
            if (manifest[field] !== undefined &&
                root[field] !== undefined &&
                manifest[field] !== root[field]) {
              console.error(`::error::package.json ${field} does not match ${lockPath}.`);
              process.exit(1);
            }
          }

          console.log(`Validated ${lockPath}.`);
          JS

      - name: Install locked dependencies
        if: steps.npm-project.outputs.found == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run npm security audit
        if: steps.npm-project.outputs.found == 'true'
        run: npm audit --audit-level=high

      - name: Check tracked files for suspicious credential patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          excluded = {
              ".git",
              "node_modules",
              "vendor",
              "dist",
              "build",
              "coverage",
          }

          patterns = [
              re.compile(
                  r"-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
              ),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{30,}\b"),
              re.compile(
                  r"\b(?:sk_live|rk_live)_[A-Za-z0-9]{16,}\b"
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          tracked = [
              item.decode("utf-8", errors="replace")
              for item in result.stdout.split(b"\0")
              if item
          ]

          matches = []

          for name in tracked:
              path = Path(name)

              if any(part in excluded for part in path.parts):
                  continue

              try:
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue

                  content = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
              except OSError:
                  continue

              for number, line in enumerate(content.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      matches.append((name, number))
                      break

          if matches:
              print(
                  "::error::Potential credential patterns found. "
                  "Secret values will not be printed."
              )

              for name, number in matches:
                  print(f" - {name}:{number}")

              print(
                  "Review the matches. If a real credential was exposed, "
                  "revoke or rotate it immediately. Removing it from the "
                  "latest commit alone does not erase repository history."
              )
              sys.exit(1)

          print("No configured credential patterns detected.")
          PY

      - name: Audit summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Security Audit"
            echo
            echo "- Result: ${STATUS}"
            echo "- npm dependency audit: configured when a root npm project exists"
            echo "- Credential-pattern scan: configured"
            echo "- Repository write permissions: disabled"
            echo
            echo "These checks are limited safeguards, not comprehensive secret scanning or a guarantee of vulnerability-free dependencies."
          } >> "$GITHUB_STEP_SUMMARY"
