
name: Security Audit

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 4 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: Repository Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package manifest
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json found; npm audit is not applicable."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (
            pkg === null ||
            typeof pkg !== "object" ||
            Array.isArray(pkg)
          ) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (
            pkg.name !== undefined &&
            typeof pkg.name !== "string"
          ) {
            throw new Error("package.json name must be a string.");
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Version: ${pkg.version || "unspecified"}`);
          NODE

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Validate npm lockfile and audit dependencies
        if: steps.package.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f npm-shrinkwrap.json ]]; then
            lockfile="npm-shrinkwrap.json"
          elif [[ -f package-lock.json ]]; then
            lockfile="package-lock.json"
          else
            echo "::error::package.json exists but no npm lockfile was found."
            exit 1
          fi

          echo "Using lockfile: $lockfile"

          npm ci --ignore-scripts --no-fund --no-audit

          npm audit \
            --audit-level=high \
            --registry=https://registry.npmjs.org/

      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import subprocess
          import sys

          patterns = [
              (
                  "Private key material",
                  re.compile(
                      r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
                  ),
              ),
              (
                  "AWS access key identifier",
                  re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              ),
              (
                  "GitHub token",
                  re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              ),
              (
                  "GitHub fine-grained token",
                  re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              ),
              (
                  "Possible hardcoded credential",
                  re.compile(
                      r"""(?i)\b(?:password|passwd|secret|api[_-]?key|access[_-]?token)\b"""
                      r"""\s*[:=]\s*["'][^"'\r\n]{8,}["']"""
                  ),
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          ignored_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".woff", ".woff2", ".ttf",
              ".eot", ".mp4", ".mp3",
          }

          findings = []
          scanned = 0
          oversized = []

          for raw in result.stdout.split(b"\0"):
              if not raw:
                  continue

              filename = raw.decode(
                  "utf-8", errors="surrogateescape"
              )

              if filename.lower().endswith(tuple(ignored_suffixes)):
                  continue

              try:
                  with open(filename, "rb") as handle:
                      data = handle.read(2_000_001)
              except FileNotFoundError:
                  # Deleted tracked files are not in the working tree.
                  continue
              except OSError:
                  print(
                      f"::error::Unable to read tracked file: {filename}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if len(data) > 2_000_000:
                  oversized.append(filename)
                  continue

              if b"\0" in data:
                  continue

              scanned += 1
              content = data.decode("utf-8", errors="replace")

              for line_number, line in enumerate(content.splitlines(), 1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          findings.append(
                              (filename, line_number, label)
                          )

          if oversized:
              for filename in oversized:
                  print(
                      f"::warning::Secret pattern scan skipped oversized file: {filename}"
                  )

          if findings:
              print(
                  f"Potential secret patterns found: {len(findings)}",
                  file=sys.stderr,
              )

              for filename, line_number, label in findings:
                  safe_filename = (
                      filename.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A")
                  )

                  print(
                      f"::error file={safe_filename},line={line_number}::{label}",
                      file=sys.stderr,
                  )

              print(
                  "Secret values were not printed.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Scanned {scanned} tracked text files.")
          print("No configured secret patterns were detected.")
          PY

      - name: Check for risky JavaScript patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import subprocess

          extensions = {
              ".js", ".cjs", ".mjs", ".jsx", ".ts", ".tsx"
          }

          excluded = {
              "node_modules", ".git", "dist", "build",
              "coverage", "vendor", ".venv", "venv",
          }

          patterns = [
              (
                  "Dynamic code execution using eval",
                  re.compile(r"\beval\s*\("),
              ),
              (
                  "Function constructor",
                  re.compile(r"\bnew\s+Function\s*\("),
              ),
              (
                  "Potentially unsafe HTML insertion",
                  re.compile(r"\.innerHTML\s*="),
              ),
              (
                  "Potentially unsafe document.write",
                  re.compile(r"\bdocument\.write\s*\("),
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          files = []

          for raw in result.stdout.split(b"\0"):
              if not raw:
                  continue

              filename = raw.decode(
                  "utf-8", errors="surrogateescape"
              )

              parts = filename.split("/")

              if any(part in excluded for part in parts):
                  continue

              if "." not in parts[-1]:
                  continue

              suffix = "." + parts[-1].rsplit(".", 1)[-1].lower()

              if suffix in extensions:
                  files.append(filename)

          findings = []

          for filename in files:
              try:
                  with open(
                      filename,
                      encoding="utf-8",
                      errors="replace",
                  ) as handle:
                      for line_number, line in enumerate(handle, 1):
                          for label, pattern in patterns:
                              if pattern.search(line):
                                  findings.append(
                                      (filename, line_number, label)
                                  )
              except OSError:
                  print(
                      f"::error::Unable to inspect tracked source file: {filename}"
                  )
                  raise

          if findings:
              print(
                  f"Found {len(findings)} potentially risky code pattern(s)."
              )

              for filename, line_number, label in findings:
                  safe_filename = (
                      filename.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A")
                  )
                  print(
                      f"::warning file={safe_filename},line={line_number}::{label}"
                  )

              print(
                  "Review findings manually; these heuristic matches "
                  "do not establish that a vulnerability exists."
              )
          else:
              print("No configured risky JavaScript patterns detected.")
          PY

      - name: Security audit summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Security Audit"
            echo
            echo "- Job result: $JOB_STATUS"
            echo "- Repository write access: disabled"
            echo "- Automatic remediation: disabled"
            echo "- Automatic deployment: disabled"
            echo "- Automatic merge: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
