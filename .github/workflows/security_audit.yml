
name: Security Audit

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "30 4 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate package manifest
        id: npm-project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json found."
            exit 0
          fi

          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

            if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
              throw new Error("package.json must contain a JSON object.");
            }

            console.log(`Auditing ${pkg.name || "unnamed package"}`);
          '

          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        if: steps.npm-project.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f npm-shrinkwrap.json || -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "::warning::No npm lockfile found; using npm install."
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Run npm security audit
        if: steps.npm-project.outputs.found == 'true'
        run: npm audit --audit-level=high

      - name: Check tracked files for suspicious credential patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          excluded = {
              ".git",
              "node_modules",
              "vendor",
              "dist",
              "build",
              "coverage",
          }

          patterns = [
              re.compile(
                  r"-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
              ),
              re.compile(
                  r"\bAKIA[0-9A-Z]{16}\b"
              ),
              re.compile(
                  r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          tracked = [
              item.decode("utf-8", errors="replace")
              for item in result.stdout.split(b"\0")
              if item
          ]

          matches = []

          for name in tracked:
              path = Path(name)

              if any(part in excluded for part in path.parts):
                  continue

              try:
                  if not path.is_file() or path.stat().st_size > 2_000_000:
                      continue

                  content = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
              except (OSError, UnicodeError):
                  continue

              for number, line in enumerate(content.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      matches.append((name, number))
                      break

          if matches:
              print(
                  "::error::Potential credential patterns found. "
                  "Review the listed files without printing secret values."
              )

              for name, number in matches:
                  print(f" - {name}:{number}")

              print(
                  "If a real credential was committed, revoke or rotate it "
                  "immediately. Removing it from the latest commit alone "
                  "does not erase repository history."
              )
              sys.exit(1)

          print("No configured credential patterns detected.")
          PY

      - name: Audit summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Security Audit"
            echo
            echo "- Result: $STATUS"
            echo "- npm dependency audit: configured"
            echo "- Credential-pattern scan: configured"
            echo "- Repository write permissions: disabled"
            echo
            echo "This audit covers configured checks only; it cannot guarantee that all secrets or vulnerabilities are detected."
          } >> "$GITHUB_STEP_SUMMARY"
