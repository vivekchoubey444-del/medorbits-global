
name: Security Audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: Repository Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate package manifest
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root package.json found; skipping npm audit."
            exit 0
          fi

          node - <<'NODE'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            console.error("package.json must contain a JSON object.");
            process.exit(1);
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Version: ${pkg.version || "unspecified"}`);
          NODE

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Audit npm dependencies
        if: steps.package.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "::warning::No npm lockfile found; dependency audit skipped."
            exit 0
          fi

          npm audit --audit-level=high

      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import re
          import subprocess
          import sys

          patterns = [
              (
                  "Private key material",
                  re.compile(
                      r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
                  ),
              ),
              (
                  "AWS access key identifier",
                  re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              ),
              (
                  "Possible hardcoded credential assignment",
                  re.compile(
                      r"""(?i)\b(?:password|passwd|secret|api[_-]?key|access[_-]?token)\b"""
                      r"""\s*[:=]\s*["'][^"'\r\n]{8,}["']"""
                  ),
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          files = [
              item.decode("utf-8", errors="surrogateescape")
              for item in result.stdout.split(b"\0")
              if item
          ]

          excluded_suffixes = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".pdf", ".zip", ".gz", ".lock",
          )

          findings = []
          scanned = 0

          for filename in files:
              if filename.lower().endswith(excluded_suffixes):
                  continue

              try:
                  with open(filename, "rb") as handle:
                      data = handle.read(2_000_000)
              except OSError:
                  print(
                      f"::warning::Could not read tracked file: {filename}"
                  )
                  continue

              if b"\0" in data:
                  continue

              scanned += 1
              text = data.decode("utf-8", errors="replace")

              for line_number, line in enumerate(text.splitlines(), 1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          findings.append(
                              (filename, line_number, label)
                          )

          if findings:
              print(
                  f"Potential secret patterns found: {len(findings)}",
                  file=sys.stderr,
              )

              for filename, line_number, label in findings:
                  print(
                      f"::error file={filename},line={line_number}::{label}",
                      file=sys.stderr,
                  )

              print(
                  "Matching secret values were not printed.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Scanned {scanned} tracked text files.")
          print("No configured secret patterns were detected.")
          PY

      - name: Check for risky JavaScript patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import re
          import subprocess

          extensions = {
              ".js", ".cjs", ".mjs", ".jsx", ".ts", ".tsx"
          }

          excluded = {
              "node_modules", ".git", "dist", "build",
              "coverage", "vendor", ".venv",
          }

          patterns = [
              ("Dynamic code execution", re.compile(r"\beval\s*\(")),
              (
                  "Function constructor",
                  re.compile(r"\bnew\s+Function\s*\("),
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          files = []

          for raw in result.stdout.split(b"\0"):
              if not raw:
                  continue

              filename = raw.decode(
                  "utf-8", errors="surrogateescape"
              )
              parts = filename.split("/")

              if any(part in excluded for part in parts):
                  continue

              suffix = "." + parts[-1].rsplit(".", 1)[-1] \
                  if "." in parts[-1] else ""

              if suffix in extensions:
                  files.append(filename)

          findings = []

          for filename in files:
              try:
                  with open(
                      filename, encoding="utf-8", errors="replace"
                  ) as handle:
                      for line_number, line in enumerate(handle, 1):
                          for label, pattern in patterns:
                              if pattern.search(line):
                                  findings.append(
                                      (filename, line_number, label)
                                  )
              except OSError:
                  print(
                      f"::warning::Could not inspect {filename}"
                  )

          if findings:
              print(
                  "Potentially risky JavaScript patterns require review."
              )

              for filename, line_number, label in findings:
                  print(
                      f"::warning file={filename},line={line_number}::{label}"
                  )

              print(
                  "These heuristic matches do not prove a vulnerability."
              )
          else:
              print("No configured risky JavaScript patterns detected.")
          PY

      - name: Security audit summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Security Audit"
            echo
            echo "- Job result: $JOB_STATUS"
            echo "- Automatic remediation: disabled"
            echo "- Automatic deployment: disabled"
            echo "- Automatic merge: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
