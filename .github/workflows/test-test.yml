# File: .github/workflows/test-test.yml
name: MedOrbits Test Validation
on:
  push:
    branches:
      - main
      - master
      - develop
      - staging
  pull_request:
    branches:
      - main
      - master
      - develop
      - staging
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medorbits-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  repository-validation:
    name: Repository and JSON validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required files
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
      - name: Validate package metadata
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (!pkg.name || !pkg.version) {
            throw new Error('Package name and version are required.');
          }
          if (!Number.isInteger(lock.lockfileVersion)) {
            throw new Error('Invalid or missing lockfileVersion.');
          }
          if (lock.name && lock.name !== pkg.name) {
            throw new Error('Package name mismatch.');
          }
          if (lock.version && lock.version !== pkg.version) {
            throw new Error('Package version mismatch.');
          }
          console.log(`Package: ${pkg.name}@${pkg.version}`);
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          NODE
      - name: Validate repository JSON files
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const excluded = new Set([
            '.git',
            'node_modules',
            'coverage',
            'dist',
            'build',
            '.next',
            '.wrangler'
          ]);
          const files = [];
          let failed = false;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = path.join(dir, entry.name);
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) walk(full);
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith('.json')
              ) {
                files.push(full);
              }
            }
          }
          walk('.');
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log(`PASS ${file}`);
            } catch (error) {
              failed = true;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }
          if (failed) process.exit(1);
          console.log(`Validated ${files.length} JSON files.`);
          NODE
  application-tests:
    name: Application tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: repository-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test --if-present
      - name: Run project checks
        run: npm run check --if-present
      - name: Run lint
        run: npm run lint --if-present
      - name: Build application
        run: npm run build --if-present
      - name: Report test result
        if: success()
        run: echo "MedOrbits test validation completed successfully."
      - name: Report failure
        if: failure()
        run: |
          echo "::error::One or more tests or validation steps failed."
          echo "Review the failed step logs before merging."