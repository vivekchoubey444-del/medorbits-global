name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-validation:
    name: Validate repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if node -e '
              const fs = require("node:fs");
              JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            ' "$file"; then
              echo "PASS: $file"
            else
              echo "::error file=$file::Invalid JSON syntax."
              failed=1
            fi
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f -name '*.json' -print0
          )
          echo "Checked $count JSON file(s)."
          exit "$failed"
      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install yamllint
          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f \( -name '*.yml' -o -name '*.yaml' \) -print0
          )
          if [[ "${#files[@]}" -gt 0 ]]; then
            yamllint \
              --no-warnings \
              -d "{extends: relaxed, rules: {line-length: disable, truthy: {allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']}}}" \
              "${files[@]}"
          else
            echo "No YAML files found."
          fi
      - name: Check for merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- \
            ':!*.lock' ':!*.svg'; then
            echo "::error::Possible merge-conflict markers found."
            exit 1
          else
            status=$?
            if [[ "$status" -gt 1 ]]; then
              echo "::error::Unable to complete conflict-marker check."
              exit "$status"
            fi
          fi
          echo "No standard merge-conflict markers found."
  node-checks:
    name: Node.js dependency, test and lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "::error::package.json exists but no npm lockfile was found."
            exit 1
          fi
      - name: Run tests
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::notice::No npm test script is configured; skipping tests."
          fi
      - name: Run lint
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "::notice::No npm lint script is configured; skipping lint."
          fi