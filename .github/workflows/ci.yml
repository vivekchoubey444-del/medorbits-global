"Review workflow and dependency-action versions periodically."
]}
{@body const [checked, setChecked] = DIL.useState([])}
CI setup checklist
{checked.length}/{checks.length} complete
<box background="surface-inverted" radius="full" height="5px" width={${checked.length / checks.length * 100}%} />
{#each checks as item, i}
<checkbox key={item} checked={checked.includes(i)} onChange={value => setChecked(old => value ? […old, i] : old.filter(n => n !== i))}>{item}
{/each}
Compatibility and implementation notes

* Node.js: This workflow uses Node.js 22. If your package.json requires a different version, update the workflow accordingly.
* npm installation: npm ci deliberately fails if the lockfile and package.json are inconsistent.
* JavaScript syntax: Checks tracked .js, .mjs, and .cjs files without executing application code.
* JSON validation: Recursively validates JSON files while skipping common generated directories.
* Optional scripts: Missing lint, test, and build scripts produce notices or warnings rather than causing an immediate failure. For stronger enforcement, add these scripts and make them mandatory.
* Pull request gate: The readiness job runs only on pull requests and only after the quality job succeeds.
* Security: The workflow uses read-only repository permissions and disables persisted checkout credentials.
* Scope: This is a CI quality workflow, not a complete security audit. It does not replace dependency review, secret scanning, code scanning, accessibility testing, or integration tests.

Final recommendation: Keep this as .github/workflows/ci.yml alongside .github/workflows/dependency-review.yml. Configure branch protection to require the relevant CI checks; merely defining the jobs does not enforce merge restrictions.