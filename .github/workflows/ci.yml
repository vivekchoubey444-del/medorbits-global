
# ============================================================
# MEDORBITS -- CONTINUOUS INTEGRATION
# File: .github/workflows/ci.yml
# Purpose: Repository validation, tests, security and reporting
# Runtime: Node.js 20+ | Python 3.10+ | Bash
# ============================================================

name: MedOrbits CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: medorbits-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test
  FORCE_COLOR: "0"

jobs:

  # ==========================================================
  # 1. REPOSITORY VALIDATION
  # ==========================================================

  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "package.json"
            "package-lock.json"
            ".github/workflows"
            ".github/scripts"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Required path is missing: $path"
              exit 1
            fi
          done

          echo "Required repository paths verified."

      - name: Validate repository structure
        run: |
          python .github/scripts/validate-repository.py

      - name: Validate JSON files
        run: |
          python .github/scripts/validate-json.py --recursive

      - name: Validate environment example
        run: |
          python .github/scripts/check-env-example.py

      - name: Validate local links
        run: |
          python .github/scripts/check-links.py

      - name: Test commit message validator
        shell: bash
        run: |
          bash .github/scripts/test-validate-commit-message.sh

  # ==========================================================
  # 2. NODE.JS VALIDATION
  # ==========================================================

  node-validation:
    name: Node.js Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail

          node -e "
            const pkg = require('./package.json');

            if (!pkg.name) {
              throw new Error('package.json must define a package name');
            }

            console.log('Package:', pkg.name);
            console.log('Version:', pkg.version || 'Not specified');
            console.log('Node requirement:', pkg.engines?.node || 'Not specified');
          "

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            node --check "$file"
          done < <(
            find . \
              -type d \( \
                -name node_modules -o \
                -name .git -o \
                -name .next -o \
                -name dist -o \
                -name build -o \
                -name coverage \
              \) -prune -o \
              -type f \( \
                -name "*.js" -o \
                -name "*.cjs" -o \
                -name "*.mjs" \
              \) -print0
          )

      - name: Validate CI JavaScript scripts
        run: |
          node --check .github/scripts/dependency-report.js
          node --check .github/scripts/ci-summary.js

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build application
        run: npm run build --if-present

  # ==========================================================
  # 3. PYTHON VALIDATION
  # ==========================================================

  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        run: |
          python -m compileall -q .github/scripts

      - name: Validate Python files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            python -m py_compile "$file"
          done < <(
            find . \
              -type d \( \
                -name .git -o \
                -name node_modules -o \
                -name .venv -o \
                -name venv -o \
                -name __pycache__ \
              \) -prune -o \
              -type f -name "*.py" -print0
          )

          echo "Python syntax validation completed."

  # ==========================================================
  # 4. SECURITY VALIDATION
  # ==========================================================

  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan repository for potential secrets
        run: |
          python .github/scripts/check-secrets.py

      - name: Audit npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm audit --audit-level=high
          else
            echo "::error::package-lock.json is required for dependency auditing."
            exit 1
          fi

      - name: Check dependency report script
        run: |
          node .github/scripts/dependency-report.js

  # ==========================================================
  # 5. CI SUMMARY
  # ==========================================================

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - repository-validation
      - node-validation
      - python-validation
      - security-validation

    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate CI report
        env:
          REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
          NODE_RESULT: ${{ needs.node-validation.result }}
          PYTHON_RESULT: ${{ needs.python-validation.result }}
          SECURITY_RESULT: ${{ needs.security-validation.result }}
        run: |
          node .github/scripts/ci-summary.js

      - name: Enforce CI result
        if: |
          needs.repository-validation.result != 'success' ||
          needs.node-validation.result != 'success' ||
          needs.python-validation.result != 'success' ||
          needs.security-validation.result != 'success'
        run: |
          echo "::error::One or more MedOrbits CI jobs failed."
          exit 1
