File: .github/workflows/ci.yml

name: MedOrbits CI
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medorbits-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Code Quality and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "::error::package.json was not found in the repository root."
            exit 1
          fi
          if [[ ! -f package-lock.json ]]; then
            echo "::error::package-lock.json is required for npm ci."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          let pkg;
          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package.json: ${error.message}`);
            process.exit(1);
          }
          if (!pkg.name) {
            console.warn("::notice::package.json does not declare a package name.");
          }
          if (pkg.engines?.node) {
            console.log(`Declared Node.js requirement: ${pkg.engines.node}`);
          } else {
            console.warn("::notice::No Node.js engine requirement is declared.");
          }
          console.log(`Project: ${pkg.name || "Unnamed project"}`);
          console.log(`Node.js: ${process.version}`);
          console.log(`npm: ${require("node:child_process").execSync("npm --version", {
            encoding: "utf8"
          }).trim()}`);
          NODE
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          CI: "true"
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking JavaScript syntax: $file"
            node --check "$file"
            count=$((count + 1))
          done < <(
            git ls-files -z -- '*.js' '*.mjs' '*.cjs'
          )
          if [[ "$count" -eq 0 ]]; then
            echo "::notice::No tracked JavaScript files found."
          else
            echo "Successfully checked $count JavaScript file(s)."
          fi
      - name: Validate JSON files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const excludedDirectories = new Set([
            ".git",
            "node_modules",
            ".next",
            "coverage",
            "dist",
            "build",
            ".cache",
            ".turbo"
          ]);
          const files = [];
          const failures = [];
          function walk(directory) {
            let entries;
            try {
              entries = fs.readdirSync(directory, {
                withFileTypes: true
              });
            } catch (error) {
              failures.push(`${directory}: ${error.message}`);
              return;
            }
            for (const entry of entries) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                if (!excludedDirectories.has(entry.name)) {
                  walk(fullPath);
                }
                continue;
              }
              if (entry.isFile() && entry.name.endsWith(".json")) {
                files.push(fullPath);
              }
            }
          }
          walk(".");
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`PASS ${file}`);
            } catch (error) {
              failures.push(`${file}: ${error.message}`);
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }
          console.log(`Validated ${files.length} JSON file(s).`);
          if (failures.length > 0) {
            console.error(
              `${failures.length} JSON validation error(s) detected.`
            );
            process.exitCode = 1;
          }
          NODE
      - name: Run lint checks
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::notice::No lint script is configured; lint checks skipped."
          fi
      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::warning::No test script is configured. Add automated tests to strengthen CI."
          fi
      - name: Run production build
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::notice::No build script is configured; build check skipped."
          fi
  pull-request-check:
    name: Pull Request Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Confirm quality checks completed
        shell: bash
        run: |
          set -euo pipefail
          echo "MedOrbits CI quality checks completed successfully."
          echo "JavaScript syntax, JSON validation, and configured npm scripts passed."
          echo "The pull request is ready for the next review stage."

Recommended repository configuration

