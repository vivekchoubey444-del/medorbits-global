
name: MedOrbits CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medorbits-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json is missing."
            exit 1
          }

          node <<'NODE'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg.engines?.node) {
            console.warn("::warning::No Node.js engine requirement is declared.");
          }

          console.log(`Project: ${pkg.name || "Unnamed project"}`);
          console.log(`Node.js: ${process.version}`);
          console.log(`npm: ${require("node:child_process")
            .execSync("npm --version", { encoding: "utf8" })
            .trim()}`);
          NODE

      - name: Install dependencies
        run: npm ci
        env:
          CI: "true"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            node --check "$file"
            count=$((count + 1))
          done < <(
            git ls-files -z -- '*.js' '*.mjs' '*.cjs'
          )

          echo "Checked $count tracked JavaScript file(s)."

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const files = execFileSync(
            "git",
            ["ls-files", "-z", "--", "*.json"],
            { encoding: "utf8" }
          ).split("\0").filter(Boolean);

          let failures = 0;

          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`PASS ${file}`);
            } catch (error) {
              failures++;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }

          console.log(`Checked ${files.length} tracked JSON file(s).`);

          if (failures) {
            console.error(`${failures} JSON file(s) failed validation.`);
            process.exitCode = 1;
          }
          NODE

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          let YAML;

          try {
            YAML = require("yaml");
          } catch {
            console.error(
              "::error::YAML validation requires the 'yaml' package. Add it to devDependencies."
            );
            process.exit(1);
          }

          const files = execFileSync(
            "git",
            ["ls-files", "-z", "--", "*.yml", "*.yaml"],
            { encoding: "utf8" }
          ).split("\0").filter(Boolean);

          let failures = 0;

          for (const file of files) {
            try {
              const source = fs.readFileSync(file, "utf8");
              const document = YAML.parseDocument(source, {
                uniqueKeys: true,
                strict: true
              });

              if (document.errors.length) {
                throw document.errors[0];
              }

              console.log(`PASS ${file}`);
            } catch (error) {
              failures++;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }

          console.log(`Checked ${files.length} tracked YAML file(s).`);

          if (failures) {
            console.error(`${failures} YAML file(s) failed validation.`);
            process.exitCode = 1;
          }
          NODE

      - name: Run lint checks
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "::notice::No lint script configured; lint checks skipped."
          fi

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::warning::No test script configured."
          fi

      - name: Run production build
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::notice::No build script configured; build skipped."
          fi

  pull-request-check:
    name: Pull Request Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Confirm quality checks completed
        shell: bash
        run: |
          set -euo pipefail
          echo "MedOrbits CI quality checks completed successfully."
          echo "The pull request is ready for the next review stage."
