
name: MedOrbits CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medorbits-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          let pkg;
          let lock;

          try {
            pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          } catch (error) {
            console.error(`Invalid package metadata: ${error.message}`);
            process.exit(1);
          }

          if (typeof pkg.name !== 'string' || !pkg.name.trim()) {
            throw new Error('package.json must define a package name.');
          }

          if (!lock.packages || !lock.packages['']) {
            throw new Error(
              'package-lock.json must contain a root packages[""] entry.'
            );
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          const root = lock.packages[''];

          if (pkg.name !== root.name) {
            throw new Error(
              'package.json and package-lock.json package names differ.'
            );
          }

          if (pkg.version && root.version && pkg.version !== root.version) {
            throw new Error(
              'package.json and package-lock.json versions differ.'
            );
          }

          if (pkg.engines?.node) {
            console.log(`Required Node.js version: ${pkg.engines.node}`);
          }

          console.log(`Project: ${pkg.name}`);
          console.log(`Node.js: ${process.version}`);
          console.log(`npm: ${cp.execSync('npm --version', {
            encoding: 'utf8'
          }).trim()}`);
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          CI: "true"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "Checking JavaScript syntax: $file"
            node --check "$file"
            count=$((count + 1))
          done < <(
            git ls-files -z -- '*.js' '*.mjs' '*.cjs'
          )

          if [[ "$count" -eq 0 ]]; then
            echo "::warning::No tracked JavaScript files were found."
          else
            echo "Successfully checked $count JavaScript file(s)."
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const excludedDirectories = new Set([
            '.git',
            'node_modules',
            '.next',
            'coverage',
            'dist',
            'build',
            '.cache',
            '.turbo'
          ]);

          const files = [];
          const failures = [];

          function walk(directory) {
            let entries;

            try {
              entries = fs.readdirSync(directory, {
                withFileTypes: true
              });
            } catch (error) {
              failures.push(`${directory}: ${error.message}`);
              return;
            }

            for (const entry of entries) {
              const fullPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                if (!excludedDirectories.has(entry.name)) {
                  walk(fullPath);
                }
                continue;
              }

              if (entry.isFile() && entry.name.endsWith('.json')) {
                files.push(fullPath);
              }
            }
          }

          walk('.');

          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log(`PASS ${file}`);
            } catch (error) {
              failures.push(`${file}: ${error.message}`);
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }

          console.log(`Validated ${files.length} JSON file(s).`);

          if (files.length === 0) {
            console.warn('No JSON files were found.');
          }

          if (failures.length > 0) {
            console.error(
              `${failures.length} JSON validation error(s) detected.`
            );
            process.exitCode = 1;
          }
          NODE

      - name: Run lint checks
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(typeof require('./package.json').scripts?.lint === 'string' ? 0 : 1)"; then
            npm run lint
          else
            echo "::warning::No lint script configured; lint checks skipped."
          fi

      - name: Run automated tests
        shell: bash
        env:
          CI: "true"
          NODE_ENV: test
        run: |
          set -euo pipefail

          if node -e "process.exit(typeof require('./package.json').scripts?.test === 'string' ? 0 : 1)"; then
            npm test
          else
            echo "::warning::No test script configured; automated tests skipped."
          fi

      - name: Run production build
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(typeof require('./package.json').scripts?.build === 'string' ? 0 : 1)"; then
            npm run build
          else
            echo "::notice::No build script configured; build check skipped."
          fi

      - name: Write CI summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## MedOrbits CI -- Quality and Data Validation"
            echo
            echo "- **Job status:** \`${JOB_STATUS}\`"
            echo "- **Node.js:** \`$(node --version)\`"
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Ref:** \`${GITHUB_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request-check:
    name: Pull Request Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - quality

    if: ${{ github.event_name == 'pull_request' }}

    permissions:
      contents: read

    steps:
      - name: Confirm quality checks completed
        shell: bash
        run: |
          set -euo pipefail

          echo "MedOrbits CI quality checks completed successfully."
          echo "JavaScript syntax and JSON validation passed."
          echo "Configured npm quality checks completed."
          echo "The pull request is ready for review."

      - name: Write readiness summary
        shell: bash
        run: |
          {
            echo "## MedOrbits Pull Request Readiness"
            echo
            echo "All prerequisite quality checks passed."
            echo
            echo "This check confirms CI completion; it does not approve or merge the pull request."
          } >> "$GITHUB_STEP_SUMMARY"
