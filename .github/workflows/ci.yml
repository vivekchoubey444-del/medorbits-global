
# ============================================================
# MEDORBITS -- CONTINUOUS INTEGRATION
# File: /.github/workflows/ci.yml
# Purpose: Automated validation, testing, security and build
# Runtime: Node.js 20+
# ============================================================

name: MedOrbits CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

# ------------------------------------------------------------
# GLOBAL PERMISSIONS
# ------------------------------------------------------------
permissions:
  contents: read

# Cancel outdated workflow runs for the same branch.
concurrency:
  group: medorbits-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------
# ENVIRONMENT
# ------------------------------------------------------------
env:
  CI: true
  NODE_ENV: test
  FORCE_COLOR: 0

jobs:

  # ==========================================================
  # 1. REPOSITORY VALIDATION
  # ==========================================================
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required repository structure
        run: |
          echo "Checking MedOrbits repository structure..."

          required_paths=(
            "package.json"
            ".github"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing required path: $path"
              exit 1
            fi
          done

          echo "Repository structure validation passed."

      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(".")

          excluded = {
              "node_modules",
              ".git",
              "dist",
              "build",
              "coverage"
          }

          files = [
              p for p in root.rglob("*.json")
              if not any(part in excluded for part in p.parts)
          ]

          errors = []

          for file in files:
              try:
                  with file.open(encoding="utf-8") as stream:
                      json.load(stream)
              except Exception as exc:
                  errors.append(f"{file}: {exc}")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}")
              sys.exit(1)

          print(f"Validated {len(files)} JSON files.")
          PY

  # ==========================================================
  # 2. NODE.JS INSTALLATION AND VALIDATION
  # ==========================================================
  node-validation:
    name: Node.js Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.name) {
              throw new Error('Missing package name');
            }
            console.log('Package:', pkg.name);
            console.log('Version:', pkg.version || 'Not specified');
          "

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::error::package-lock.json is required for reproducible CI."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -type f \( -name "*.js" -o -name "*.cjs" \) \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run lint
        run: |
          if npm run | grep -qE '^[[:space:]]+lint'; then
            npm run lint
          else
            echo "Lint script not configured. Skipping."
          fi

      - name: Run tests
        run: |
          if npm run | grep -qE '^[[:space:]]+test'; then
            npm test -- --runInBand
          else
            echo "Test script not configured. Skipping."
          fi

      - name: Build application
        run: |
          if npm run | grep -qE '^[[:space:]]+build'; then
            npm run build
          else
            echo "Build script not configured. Skipping."
          fi

  # ==========================================================
  # 3. PYTHON VALIDATION
  # ==========================================================
  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          excluded = {
              ".git",
              "node_modules",
              ".venv",
              "venv",
              "__pycache__"
          }

          files = [
              path for path in pathlib.Path(".").rglob("*.py")
              if not any(part in excluded for part in path.parts)
          ]

          errors = []

          for file in files:
              try:
                  py_compile.compile(str(file), doraise=True)
              except Exception as exc:
                  errors.append(f"{file}: {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(files)} Python files.")
          PY

  # ==========================================================
  # 4. SECURITY VALIDATION
  # ==========================================================
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for accidentally committed secrets
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          excluded = {
              ".git",
              "node_modules",
              ".venv",
              "venv",
              "coverage",
              "dist",
              "build"
          }

          patterns = {
              "Private key": re.compile(
                  r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              ),
              "Hardcoded API key": re.compile(
                  r"""(?i)(?:api[_-]?key|secret[_-]?key)\s*[:=]\s*["'][^"']{16,}["']"""
              ),
              "Hardcoded access token": re.compile(
                  r"""(?i)(?:access[_-]?token)\s*[:=]\s*["'][^"']{16,}["']"""
              )
          }

          errors = []

          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(part in excluded for part in path.parts):
                  continue

              if path.name in {".env.example", ".env.sample"}:
                  pass

              try:
                  if path.stat().st_size > 1_000_000:
                      continue
                  content = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except OSError:
                  continue

              for name, pattern in patterns.items():
                  if pattern.search(content):
                      errors.append(f"{name} detected in {path}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("No matching hardcoded secret patterns detected.")
          PY

      - name: Dependency vulnerability audit
        run: |
          if [ -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit
            npm audit --omit=dev --audit-level=high
          else
            echo "No npm lockfile available."
          fi

  # ==========================================================
  # 5. CI SUMMARY
  # ==========================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - repository-validation
      - node-validation
      - python-validation
      - security-validation

    if: always()

    steps:
      - name: Generate workflow summary
        env:
          REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
          NODE_RESULT: ${{ needs.node-validation.result }}
          PYTHON_RESULT: ${{ needs.python-validation.result }}
          SECURITY_RESULT: ${{ needs.security-validation.result }}
        run: |
          {
            echo "# MedOrbits CI Report"
            echo ""
            echo "| Validation | Result |"
            echo "|---|---|"
            echo "| Repository | $REPOSITORY_RESULT |"
            echo "| Node.js | $NODE_RESULT |"
            echo "| Python | $PYTHON_RESULT |"
            echo "| Security | $SECURITY_RESULT |"
            echo ""
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$REPOSITORY_RESULT" != "success" ||
                "$NODE_RESULT" != "success" ||
                "$PYTHON_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi

          echo "All MedOrbits CI checks passed."
