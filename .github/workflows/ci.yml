name: MedOrbits CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medorbits-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: Validate repository and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required files
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
      - name: Validate package.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          if (!pkg || typeof pkg !== 'object' || Array.isArray(pkg)) {
            throw new Error('package.json must contain a JSON object.');
          }
          if (typeof pkg.name !== 'string' || !pkg.name.trim()) {
            throw new Error('Missing package name.');
          }
          if (!pkg.scripts || typeof pkg.scripts !== 'object') {
            throw new Error('Missing npm scripts configuration.');
          }
          console.log(`Valid package.json: ${pkg.name}`);
          NODE
      - name: Validate package-lock.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (!Number.isInteger(lock.lockfileVersion)) {
            throw new Error('Missing or invalid lockfileVersion.');
          }
          if (lock.name && pkg.name && lock.name !== pkg.name) {
            throw new Error('Package name mismatch.');
          }
          if (
            lock.version &&
            pkg.version &&
            lock.version !== pkg.version
          ) {
            throw new Error('Package version mismatch.');
          }
          const root = lock.packages?.[''];
          if (root?.name && pkg.name && root.name !== pkg.name) {
            throw new Error('Root package name mismatch.');
          }
          if (
            root?.version &&
            pkg.version &&
            root.version !== pkg.version
          ) {
            throw new Error('Root package version mismatch.');
          }
          console.log('Lockfile JSON and metadata are valid.');
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          NODE
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate JSON files
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const excluded = new Set([
            '.git',
            'node_modules',
            'coverage',
            'dist',
            'build',
            '.next',
            '.wrangler'
          ]);
          const files = [];
          let failed = false;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = path.join(dir, entry.name);
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) walk(full);
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith('.json')
              ) {
                files.push(full);
              }
            }
          }
          walk('.');
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log(`PASS ${file}`);
            } catch (error) {
              failed = true;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }
          if (failed) {
            process.exit(1);
          }
          console.log(`Validated ${files.length} JSON files.`);
          NODE
      - name: Validate application data
        run: npm run check:data --if-present
      - name: Run unit and integration tests
        run: npm test --if-present
      - name: Run project checks
        run: npm run check --if-present
      - name: Run lint
        run: npm run lint --if-present
      - name: Build application
        run: npm run build --if-present
      - name: Validate OpenAPI specification
        run: |
          set -euo pipefail
          if [[ ! -f openai/openapi.yaml ]]; then
            echo "OpenAPI specification not present; skipping."
            exit 0
          fi
          if node <<'NODE'
          const pkg = require('./package.json');
          const deps = {
            ...pkg.dependencies,
            ...pkg.devDependencies
          };
          process.exit(deps['@redocly/cli'] ? 0 : 1);
          NODE
          then
            npx --no-install redocly lint openai/openapi.yaml
          else
            echo "::warning::Redocly CLI is not installed; OpenAPI validation was skipped."
          fi
      - name: Verify workflow directory
        run: |
          set -euo pipefail
          if [[ ! -d .github/workflows ]]; then
            echo "::error::Missing .github/workflows directory."
            exit 1
          fi
          count="$(find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No workflow YAML files found."
            exit 1
          fi
          echo "Found $count workflow YAML files."
      - name: Report validation result
        if: success()
        run: echo "MedOrbits CI validation completed successfully."
      - name: Report failure
        if: failure()
        run: |
          echo "::error::One or more CI checks failed. Review the logs before merging."