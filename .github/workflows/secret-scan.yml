
name: Secret Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "15 4 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Gitleaks configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f .gitleaks.toml ]]; then
            echo "Custom Gitleaks configuration detected."
          else
            echo "Using Gitleaks default detection rules."
          fi

      - name: Scan Git history and working tree
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_VERSION: "latest"

      - name: Record successful scan
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Secret Scan"
            echo
            echo "- Status: Passed"
            echo "- Scanner: Gitleaks"
            echo "- Git history: Available for scanning"
            echo "- Repository permissions: Read-only"
            echo "- Automatic secret remediation: Disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed scan
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Secret Scan"
            echo
            echo "- Status: Failed"
            echo "- Review the Gitleaks step logs for diagnostic information."
            echo "- Do not paste detected secret values into issues, pull requests, or logs."
            echo "- Revoke and rotate any confirmed exposed credentials."
          } >> "$GITHUB_STEP_SUMMARY"
