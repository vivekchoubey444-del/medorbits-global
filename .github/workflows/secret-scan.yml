
name: MedOrbits Secret Scan

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

  schedule:
    # Every Monday at 03:30 UTC.
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: medorbits-secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan Git History for Exposed Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository with Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Record scan completion
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          {
            echo "## MedOrbits Secret Scan"
            echo
            echo "- **Scanner:** Gitleaks"
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Ref:** \`${GITHUB_REF}\`"
            echo "- **Scan step outcome:** \`${SCAN_OUTCOME:-unknown}\`"
            echo
            if [[ "$SCAN_OUTCOME" == "success" ]]; then
              echo "The Gitleaks scan step completed successfully."
            elif [[ "$SCAN_OUTCOME" == "failure" ]]; then
              echo "The Gitleaks scan step failed. Review the job logs and findings."
            else
              echo "The scan did not report a normal success outcome. Review the job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
