
name: Secret Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 5 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan Repository Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        id: scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report scan result
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Secret Scan"
            echo
            echo "- Result: ${STATUS}"
            echo "- Scanner: Gitleaks"
            echo "- Scan scope: repository history available to the checkout"
            echo "- Repository contents permission: read-only"
            echo
            echo "If a real secret is exposed, revoke or rotate it immediately."
            echo "A clean scan does not prove that no credentials are present."
          } >> "$GITHUB_STEP_SUMMARY"
