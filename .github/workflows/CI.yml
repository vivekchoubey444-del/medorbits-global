
name: MedOrbits CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository and Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Validate YAML syntax and duplicate keys
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          from pathlib import Path
          import sys
          import yaml

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv", "vendor",
              "__pycache__", ".next", "dist", "build", "coverage"
          }

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)

                  try:
                      duplicate = key in mapping
                  except TypeError:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          "unhashable mapping key",
                          key_node.start_mark,
                      )

                  if duplicate:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"duplicate key {key!r}",
                          key_node.start_mark,
                      )

                  mapping[key] = loader.construct_object(
                      value_node, deep=deep
                  )

              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          result = __import__("subprocess").run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=__import__("subprocess").PIPE,
          )

          files = sorted(
              Path(name)
              for name in result.stdout.decode(
                  "utf-8", errors="surrogateescape"
              ).split("\0")
              if name.lower().endswith((".yaml", ".yml"))
              and name
              and not any(part in EXCLUDED for part in Path(name).parts)
              and Path(name).is_file()
          )

          errors = []

          for path in files:
              try:
                  with path.open(encoding="utf-8-sig") as stream:
                      list(yaml.load_all(stream, Loader=UniqueKeyLoader))
                  print(f"[PASS] {path}")
              except (OSError, UnicodeError, yaml.YAMLError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\nYAML validation failed:", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          print(f"YAML validation passed: {len(files)} file(s).")
          PY

      - name: Validate JSON syntax and duplicate keys
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv", "vendor",
              "__pycache__", ".next", "dist", "build", "coverage"
          }

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"Duplicate JSON key: {key!r}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"Non-standard JSON constant: {value}")

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.decode("utf-8", errors="surrogateescape").split("\0")

          files = sorted(
              Path(name) for name in tracked
              if name.lower().endswith(".json")
              and name
              and not any(part in EXCLUDED for part in Path(name).parts)
              and Path(name).is_file()
          )

          errors = []

          for path in files:
              try:
                  with path.open(encoding="utf-8-sig") as stream:
                      json.load(
                          stream,
                          object_pairs_hook=reject_duplicates,
                          parse_constant=reject_constant,
                      )
                  print(f"[PASS] {path}")
              except (OSError, UnicodeError, ValueError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\nJSON validation failed:", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          print(f"JSON validation passed: {len(files)} file(s).")
          PY

      - name: Validate TOML syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv", "vendor",
              "__pycache__", ".next", "dist", "build", "coverage"
          }

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.decode("utf-8", errors="surrogateescape").split("\0")

          files = sorted(
              Path(name) for name in tracked
              if name.lower().endswith(".toml")
              and name
              and not any(part in EXCLUDED for part in Path(name).parts)
              and Path(name).is_file()
          )

          errors = []

          for path in files:
              try:
                  with path.open("rb") as stream:
                      tomllib.load(stream)
                  print(f"[PASS] {path}")
              except (OSError, tomllib.TOMLDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\nTOML validation failed:", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          print(f"TOML validation passed: {len(files)} file(s).")
          PY

      - name: Validate Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import ast
          import subprocess
          import sys
          from pathlib import Path

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv", "vendor",
              "__pycache__", ".next", "dist", "build", "coverage"
          }

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.decode("utf-8", errors="surrogateescape").split("\0")

          files = sorted(
              Path(name) for name in tracked
              if name.lower().endswith(".py")
              and name
              and not any(part in EXCLUDED for part in Path(name).parts)
              and Path(name).is_file()
          )

          errors = []

          for path in files:
              try:
                  ast.parse(
                      path.read_text(encoding="utf-8-sig"),
                      filename=str(path),
                  )
                  print(f"[PASS] {path}")
              except (OSError, UnicodeError, SyntaxError, ValueError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\nPython syntax validation failed:", file=sys.stderr)
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          print(f"Python syntax validation passed: {len(files)} file(s).")
          PY

  javascript-validation:
    name: JavaScript and Node.js Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect root Node.js project
        id: node-project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json; root Node.js checks will be skipped."
          fi

      - name: Set up Node.js
        if: steps.node-project.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Validate package manifest
        if: steps.node-project.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            throw new Error(`Invalid package.json: ${error.message}`);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (typeof pkg.name !== "string" || !pkg.name.trim()) {
            throw new Error('package.json needs a non-empty "name".');
          }

          if (
            pkg.scripts !== undefined &&
            (!pkg.scripts || typeof pkg.scripts !== "object" ||
             Array.isArray(pkg.scripts))
          ) {
            throw new Error("package.json scripts must be an object.");
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Node.js: ${process.version}`);
          JS

      - name: Check lockfile prerequisites
        id: lockfile
        if: steps.node-project.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f npm-shrinkwrap.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "file=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "file=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::Root npm lockfile is missing. Generate and commit a real lockfile."
            exit 1
          fi

      - name: Validate lockfile consistency
        if: steps.node-project.outputs.present == 'true'
        env:
          LOCKFILE: ${{ steps.lockfile.outputs.file }}
        shell: bash
        run: |
          set -Eeuo pipefail

          LOCKFILE="$LOCKFILE" node <<'JS'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync(process.env.LOCKFILE, "utf8"));

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error("Unsupported npm lockfile version.");
          }

          if (!lock.packages || typeof lock.packages !== "object" ||
              Array.isArray(lock.packages)) {
            throw new Error("Lockfile is missing a valid packages object.");
          }

          const root = lock.packages[""];

          if (!root || typeof root !== "object") {
            throw new Error('Lockfile is missing packages[""].');
          }

          for (const key of ["name", "version"]) {
            if (manifest[key] !== undefined && root[key] !== manifest[key]) {
              throw new Error(
                `Root lockfile ${key} must exactly match package.json.`
              );
            }
          }

          console.log(`Lockfile metadata validated: ${process.env.LOCKFILE}`);
          JS

      - name: Install locked dependencies
        if: steps.node-project.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const excluded = new Set([
            ".git", "node_modules", ".venv", "venv", "vendor",
            "__pycache__", ".next", "dist", "build", "coverage"
          ]);

          const extensions = new Set([".js", ".mjs", ".cjs"]);
          const result = spawnSync("git", ["ls-files", "-z"], {
            encoding: "utf8"
          });

          if (result.error || result.status !== 0) {
            throw result.error || new Error("git ls-files failed");
          }

          const files = result.stdout
            .split("\0")
            .filter(Boolean)
            .filter(file => extensions.has(path.extname(file).toLowerCase()))
            .filter(file => !file.split(/[\\/]/).some(part => excluded.has(part)))
            .filter(file => fs.existsSync(file) && fs.statSync(file).isFile())
            .sort();

          let failed = false;

          for (const file of files) {
            const check = spawnSync(process.execPath, ["--check", file], {
              encoding: "utf8"
            });

            if (check.error || check.status !== 0) {
              failed = true;
              console.error(`\n[FAIL] ${file}`);
              if (check.stderr) console.error(check.stderr.trim());
              if (check.error) console.error(check.error.message);
            } else {
              console.log(`[PASS] ${file}`);
            }
          }

          console.log(`JavaScript files checked: ${files.length}`);

          if (failed) process.exit(1);
          JS

      - name: Run configured lint script
        if: steps.node-project.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "No npm lint script configured; lint check skipped."
          fi

      - name: Run configured tests
        if: steps.node-project.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "No npm test script configured; test check skipped."
          fi

  shell-validation:
    name: Shell Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' files < <(
            git ls-files -z -- '*.sh'
          )

          failed=0

          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue

            if bash -n "$file"; then
              printf '[PASS] %s\n' "$file"
            else
              printf '::error file=%s::Shell syntax validation failed.\n' "$file"
              failed=1
            fi
          done

          if (( failed )); then
            exit 1
          fi

          echo "Validated ${#files[@]} tracked shell script(s)."

      - name: Test commit-message validator
        shell: bash
        run: |
          set -Eeuo pipefail

          validator=".github/scripts/validate-commit-message.sh"
          tests=".github/scripts/test-validate-commit-message.sh"

          if [[ ! -f "$validator" && ! -f "$tests" ]]; then
            echo "Commit-message validator suite not configured; check skipped."
            exit 0
          fi

          if [[ ! -f "$validator" ]]; then
            echo "::error::Missing $validator"
            exit 1
          fi

          if [[ ! -f "$tests" ]]; then
            echo "::error::Missing $tests"
            exit 1
          fi

          bash -n "$validator"
          bash -n "$tests"
          bash "$tests"

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - repository-validation
      - javascript-validation
      - shell-validation
    if: always()
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Evaluate validation results
        env:
          REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript-validation.result }}
          SHELL_RESULT: ${{ needs.shell-validation.result }}
        shell: bash
        run: |
          set -Eeuo pipefail

          printf 'Repository validation: %s\n' "$REPOSITORY_RESULT"
          printf 'JavaScript validation: %s\n' "$JAVASCRIPT_RESULT"
          printf 'Shell validation: %s\n' "$SHELL_RESULT"

          if [[ "$REPOSITORY_RESULT" != "success" ||
                "$JAVASCRIPT_RESULT" != "success" ||
                "$SHELL_RESULT" != "success" ]]; then
            echo "::error::One or more CI jobs failed, were skipped, or were cancelled."
            exit 1
          fi

          echo "All configured CI jobs completed successfully."
