
name: Repository Security Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Python syntax
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import ast
          import sys
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv", "vendor",
              "__pycache__", ".next", "dist", "build", "coverage"
          }
          files = [
              p for p in Path(".").rglob("*.py")
              if p.is_file() and not any(x in excluded for x in p.parts)
          ]
          errors = []

          for path in sorted(files):
              try:
                  ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
                  print(f"[PASS] {path}")
              except (SyntaxError, UnicodeError, OSError, ValueError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          print(f"Python syntax passed: {len(files)} file(s)")
          PY

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -uo pipefail
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const excluded = new Set([
            ".git", "node_modules", ".venv", "venv", "vendor",
            "__pycache__", ".next", "dist", "build", "coverage"
          ]);
          const files = [];
          const errors = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory() && excluded.has(entry.name)) continue;

              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.isFile() && file.toLowerCase().endsWith(".json")) {
                files.push(file);
              }
            }
          }

          walk(".");

          for (const file of files.sort()) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`[PASS] ${file}`);
            } catch (error) {
              errors.push(`${file}: ${error.message}`);
            }
          }

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          console.log(`JSON syntax passed: ${files.length} file(s)`);
          JS

      - name: Validate shell scripts
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          count=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if bash -n "$file"; then
              echo "[PASS] $file"
            else
              echo "::error file=$file::Shell syntax error"
              failed=1
            fi
          done < <(
            find . \
              -type d \( -name .git -o -name node_modules -o -name vendor \
                -o -name .venv -o -name venv -o -name dist -o -name build \) \
              -prune -o -type f -name '*.sh' -print0
          )

          echo "Shell scripts checked: $count"
          exit "$failed"

      - name: Validate root package manifest
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "No root package.json; Node project check skipped."
            exit 0
          fi

          node <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must be a JSON object.");
          }

          if (typeof pkg.name !== "string" || !pkg.name.trim()) {
            throw new Error('package.json requires a non-empty "name".');
          }

          if (
            pkg.scripts !== undefined &&
            (!pkg.scripts || typeof pkg.scripts !== "object" ||
             Array.isArray(pkg.scripts))
          ) {
            throw new Error("package.json scripts must be an object.");
          }

          console.log(`[PASS] package.json: ${pkg.name}`);
          JS

      - name: Validate npm lockfile when present
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "No package.json; lockfile check skipped."
            exit 0
          fi

          if [[ -f npm-shrinkwrap.json ]]; then
            LOCKFILE=npm-shrinkwrap.json
          elif [[ -f package-lock.json ]]; then
            LOCKFILE=package-lock.json
          else
            echo "::warning::No npm lockfile found. Generate and commit one separately."
            exit 0
          fi

          LOCKFILE="$LOCKFILE" node <<'JS'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync(process.env.LOCKFILE, "utf8"));

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error("Expected npm lockfile version 2 or 3.");
          }

          if (!lock.packages || !lock.packages[""]) {
            throw new Error('Lockfile must contain packages[""].');
          }

          const root = lock.packages[""];

          for (const key of ["name", "version"]) {
            if (manifest[key] !== undefined &&
                root[key] !== undefined &&
                manifest[key] !== root[key]) {
              throw new Error(`Lockfile ${key} differs from package.json.`);
            }
          }

          console.log(`[PASS] ${process.env.LOCKFILE}`);
          JS

      - name: Write validation summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "# Repository Validation"
            echo
            echo "- Result: ${RESULT}"
            echo "- Python syntax checked"
            echo "- JSON syntax checked"
            echo "- Shell syntax checked"
            echo "- Root package manifest checked when present"
            echo "- npm lockfile checked when present"
            echo
            echo "JavaScript syntax scanning is intentionally not performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
