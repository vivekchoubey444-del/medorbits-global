
# ==============================================================================
# MedOrbits -- Dependabot Security Gate
# File: .github/workflows/dependabot-security-gate.yml
# Release target: 3.0.0
#
# Purpose:
#   Validate Dependabot pull requests and reject destructive file changes.
#
# Security policy:
#   - Accept only Dependabot-authored pull requests.
#   - Read-only repository permissions.
#   - No automatic merging, committing, pushing, or deployment.
#   - Do not expose repository secrets to pull-request code.
#   - Block tracked file deletions by default.
#   - Block newly emptied files and suspicious source-code truncation.
#   - Validate npm dependencies, configured tests, and repository integrity.
#
# IMPORTANT:
#   Require the named checks in GitHub branch protection or rulesets.
#   A workflow check cannot independently prevent all unprotected merges.
# ==============================================================================

name: Dependabot Security Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize pull request
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Verify pull request author
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$PR_AUTHOR" != "dependabot[bot]" ]]; then
            echo "::error::Only pull requests authored by dependabot[bot] are accepted."
            exit 1
          fi

          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "::error::This gate only accepts pull requests targeting main."
            exit 1
          fi

          echo "Dependabot author and target branch verified."
          echo "Draft status: $PR_DRAFT"

  integrity:
    name: Prevent destructive repository changes
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect changes against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          python - <<'PY'
          import os
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          result = subprocess.run(
              ["git", "diff", "--name-status", "-z", "--find-renames",
               f"{base}...{head}", "--"],
              check=True,
              stdout=subprocess.PIPE,
          )

          fields = result.stdout.decode("utf-8", errors="surrogateescape").split("\0")
          fields = fields[:-1] if fields and fields[-1] == "" else fields

          changes = []
          index = 0

          while index < len(fields):
              status = fields[index]
              index += 1

              if status.startswith(("R", "C")):
                  if index + 1 >= len(fields):
                      print("::error::Malformed Git rename/copy output.")
                      sys.exit(1)

                  old_path = fields[index]
                  new_path = fields[index + 1]
                  index += 2
                  changes.append((status, old_path, new_path))
              else:
                  if index >= len(fields):
                      print("::error::Malformed Git diff output.")
                      sys.exit(1)

                  path = fields[index]
                  index += 1
                  changes.append((status, path, path))

          failures = []

          for status, old_path, new_path in changes:
              if status.startswith("D"):
                  failures.append(
                      f"Deleted tracked file: {old_path}"
                  )

          if failures:
              print("::error::Destructive file deletions detected.")
              for failure in failures:
                  print(f"- {failure}")
              print(
                  "::error::Restore deleted files or submit an independently "
                  "reviewed change outside this automated dependency update."
              )
              sys.exit(1)

          print(f"Inspected {len(changes)} changed paths.")
          print("No tracked files were deleted.")
          PY

      - name: Reject empty files and suspicious source truncation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          result = subprocess.run(
              ["git", "diff", "--name-status", "-z", "--find-renames",
               f"{base}...{head}", "--"],
              check=True,
              stdout=subprocess.PIPE,
          )

          fields = result.stdout.decode("utf-8", errors="surrogateescape").split("\0")
          fields = fields[:-1] if fields and fields[-1] == "" else fields

          changes = []
          index = 0

          while index < len(fields):
              status = fields[index]
              index += 1

              if status.startswith(("R", "C")):
                  if index + 1 >= len(fields):
                      sys.exit("Malformed rename/copy diff output.")
                  old_path, new_path = fields[index:index + 2]
                  index += 2
                  changes.append((status, old_path, new_path))
              else:
                  if index >= len(fields):
                      sys.exit("Malformed Git diff output.")
                  path = fields[index]
                  index += 1
                  changes.append((status, path, path))

          source_extensions = {
              ".py", ".pyi", ".js", ".cjs", ".mjs",
              ".jsx", ".ts", ".tsx",
              ".html", ".htm", ".css", ".scss", ".sass",
              ".json", ".jsonc", ".yaml", ".yml",
              ".sh", ".bash", ".sql", ".php",
              ".java", ".kt", ".go", ".rs",
              ".c", ".h", ".cpp", ".hpp",
              ".vue", ".svelte", ".xml", ".toml",
              ".ini", ".cfg", ".conf",
              ".md", ".rst",
          }

          protected_names = {
              "package.json",
              "package-lock.json",
              "requirements.txt",
              "pyproject.toml",
              "Cargo.toml",
              "go.mod",
              "Makefile",
              "Dockerfile",
          }

          failures = []
          inspected = 0

          for status, old_path, new_path in changes:
              if status.startswith("D"):
                  continue

              path = pathlib.PurePosixPath(new_path)
              name = path.name.lower()

              # Do not treat dependency lockfiles as application source
              # for the percentage-shrink heuristic.
              is_lockfile = (
                  name in {
                      "package-lock.json",
                      "npm-shrinkwrap.json",
                      "pnpm-lock.yaml",
                      "yarn.lock",
                      "poetry.lock",
                      "uv.lock",
                      "pipfile.lock",
                  }
                  or name.endswith(".min.js")
              )

              try:
                  current = subprocess.run(
                      ["git", "show", f"{head}:{new_path}"],
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                  ).stdout
              except subprocess.CalledProcessError:
                  failures.append(
                      f"Changed file cannot be read from proposed commit: {new_path}"
                  )
                  continue

              inspected += 1
              previously_existed = not status.startswith("A")

              if previously_existed:
                  try:
                      previous = subprocess.run(
                          ["git", "show", f"{base}:{old_path}"],
                          check=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                      ).stdout
                  except subprocess.CalledProcessError:
                      previous = b""

                  if previous.strip() and not current.strip():
                      failures.append(
                          f"Previously non-empty file is now empty: {new_path}"
                      )
                      continue

                  # Catch severe truncation of substantial source files.
                  # This is a heuristic; legitimate large refactors should
                  # be reviewed and split into a separate pull request.
                  if (
                      not is_lockfile
                      and path.suffix.lower() in source_extensions
                      and len(previous) >= 1000
                      and len(current) < len(previous) * 0.20
                  ):
                      failures.append(
                          f"Suspicious source truncation: {new_path} "
                          f"({len(previous)} -> {len(current)} bytes)"
                      )

              if (
                  name in protected_names
                  and not current.strip()
              ):
                  failures.append(
                      f"Required project file is empty: {new_path}"
                  )

          if failures:
              print("::error::Repository integrity checks failed.")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print(f"Inspected {inspected} changed files.")
          print("No empty files or suspicious source truncation detected.")
          PY

      - name: Verify essential npm manifest fields
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::Root package-lock.json is missing."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          def read_manifest(revision):
              result = subprocess.run(
                  ["git", "show", f"{revision}:package.json"],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return json.loads(result.stdout)

          try:
              old = read_manifest(base)
              new = read_manifest(head)
          except (subprocess.CalledProcessError, json.JSONDecodeError) as exc:
              print(f"::error::Cannot validate package manifests: {exc}")
              sys.exit(1)

          failures = []

          old_scripts = old.get("scripts", {})
          new_scripts = new.get("scripts", {})

          # Dependency bots should not silently remove existing scripts.
          for name, command in old_scripts.items():
              if name not in new_scripts:
                  failures.append(f"Removed npm script: {name}")
              elif not str(new_scripts[name]).strip():
                  failures.append(f"Emptied npm script: {name}")

          # Preserve application identity.
          if old.get("name") and new.get("name") != old["name"]:
              failures.append("Changed package name.")

          if old.get("version") and new.get("version") != old["version"]:
              failures.append("Changed package version.")

          # Preserve dependencies by default. Dependabot updates existing
          # version ranges; it should not silently remove dependency entries.
          dependency_groups = (
              "dependencies",
              "devDependencies",
              "optionalDependencies",
              "peerDependencies",
          )

          for group in dependency_groups:
              previous = old.get(group, {})
              current = new.get(group, {})

              if not isinstance(previous, dict) or not isinstance(current, dict):
                  failures.append(f"Invalid dependency group: {group}")
                  continue

              for package in previous:
                  if package not in current:
                      failures.append(
                          f"Removed {group} entry: {package}"
                      )

          if failures:
              print("::error::Unexpected package.json changes detected.")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print("Package identity, existing scripts, and dependency entries preserved.")
          PY

  validate:
    name: Validate dependency update
    needs:
      - authorize
      - integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm manifests
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s package.json || {
            echo "::error::package.json is missing or empty."
            exit 1
          }

          test -s package-lock.json || {
            echo "::error::package-lock.json is missing or empty."
            exit 1
          }

          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));

            if (!lock.lockfileVersion) {
              throw new Error("Missing lockfileVersion.");
            }

            if (
              lock.name && pkg.name &&
              lock.name !== pkg.name
            ) {
              throw new Error("Package name mismatch.");
            }

            if (
              lock.version && pkg.version &&
              lock.version !== pkg.version
            ) {
              throw new Error("Package version mismatch.");
            }

            console.log("Manifest and lockfile parsed successfully.");
          '

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check dependency tree
        run: npm ls --depth=0

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run configured repository tests
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! node -e '
            const p = require("./package.json");
            process.exit(p.scripts && p.scripts.test ? 0 : 1);
          '; then
            echo "::error::No npm test script is configured."
            exit 1
          fi

          npm test

      - name: Validate commit-message scripts when present
        shell: bash
        run: |
          set -Eeuo pipefail

          validator=".github/scripts/validate-commit-message.sh"
          tests=".github/scripts/test-validate-commit-message.sh"

          if [[ -f "$validator" && -f "$tests" ]]; then
            bash -n "$validator"
            bash -n "$tests"
            bash "$tests"
          elif [[ -f "$validator" || -f "$tests" ]]; then
            echo "::error::Commit-message validator and tests must both exist."
            exit 1
          else
            echo "Commit-message validator suite is not configured; skipping."
          fi

  security-summary:
    name: Security gate summary
    needs:
      - authorize
      - integrity
      - validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions: {}

    steps:
      - name: Evaluate required jobs
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          INTEGRITY_RESULT: ${{ needs.integrity.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## MedOrbits Dependabot Security Gate"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Authorize pull request | $AUTHORIZE_RESULT |"
            echo "| Repository integrity | $INTEGRITY_RESULT |"
            echo "| Dependency validation | $VALIDATE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$AUTHORIZE_RESULT" != "success" ||
                "$INTEGRITY_RESULT" != "success" ||
                "$VALIDATE_RESULT" != "success" ]]; then
            echo "::error::Dependabot security gate failed."
            exit 1
          fi

          echo "All required checks passed."
