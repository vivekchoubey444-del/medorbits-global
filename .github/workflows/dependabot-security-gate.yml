
# ==============================================================================
# MedOrbits -- Dependabot Security Gate
# File: .github/workflows/dependabot-security-gate.yml
# Release: 2.1.1
#
# Purpose:
#   Validate Dependabot pull request metadata and summarize dependency changes.
#
# Security:
#   - Read-only GitHub API access.
#   - Never checks out or executes pull request code.
#   - Never approves, merges, comments on, or modifies pull requests.
#   - Accepts only Dependabot-authored, open PRs targeting main or develop.
# ==============================================================================

name: Dependabot Security Gate

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open Dependabot pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-security-gate-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Validate Dependabot Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Resolve pull request number
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$EVENT_AUTHOR" != "dependabot[bot]" ]]; then
              echo "::error::Rejected: pull request is not authored by Dependabot."
              exit 1
            fi

            number="$EVENT_PR_NUMBER"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            number="$INPUT_PR_NUMBER"

            if [[ ! "$number" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::A valid positive pull request number is required."
              exit 1
            fi
          else
            echo "::error::Unsupported workflow event: $EVENT_NAME"
            exit 1
          fi

          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

      - name: Verify pull request using GitHub API
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -Eeuo pipefail

          response="$RUNNER_TEMP/dependabot-security-pr.json"

          gh api \
            "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            > "$response"

          author="$(jq -r '.user.login // ""' "$response")"
          state="$(jq -r '.state // ""' "$response")"
          merged="$(jq -r '.merged // false' "$response")"
          draft="$(jq -r '.draft // false' "$response")"
          base_branch="$(jq -r '.base.ref // ""' "$response")"
          base_repo="$(jq -r '.base.repo.full_name // ""' "$response")"
          head_sha="$(jq -r '.head.sha // ""' "$response")"

          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "::error::Pull request author verification failed."
            exit 1
          fi

          if [[ "$state" != "open" || "$merged" == "true" ]]; then
            echo "::error::Pull request must be open and unmerged."
            exit 1
          fi

          if [[ "$base_branch" != "main" && "$base_branch" != "develop" ]]; then
            echo "::error::Disallowed target branch: $base_branch"
            exit 1
          fi

          if [[ "$base_repo" != "$REPOSITORY" ]]; then
            echo "::error::Pull request targets a different base repository."
            exit 1
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::Missing or invalid pull request head SHA."
            exit 1
          fi

          {
            echo "base_branch=$base_branch"
            echo "draft=$draft"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## MedOrbits Dependabot Security Gate"
            echo
            echo "- Pull request: #$PR_NUMBER"
            echo "- Author: $author"
            echo "- State: $state"
            echo "- Target branch: $base_branch"
            echo "- Draft: $draft"
            echo "- Head SHA: \`$head_sha\`"
            echo "- Metadata verification: passed"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect dependency-related file changes
        id: files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -Eeuo pipefail

          response="$RUNNER_TEMP/dependabot-changed-files.json"

          gh api --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --slurp > "$response"

          python - "$response" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])

          dependency_names = {
              "package.json",
              "package-lock.json",
              "npm-shrinkwrap.json",
              "yarn.lock",
              "pnpm-lock.yaml",
              "requirements.txt",
              "pyproject.toml",
              "poetry.lock",
              "uv.lock",
              "pipfile",
              "pipfile.lock",
              "cargo.toml",
              "cargo.lock",
              "go.mod",
              "go.sum",
              "gemfile",
              "gemfile.lock",
              "composer.json",
              "composer.lock",
          }

          try:
              pages = json.loads(source.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Could not parse GitHub file metadata: {exc}")

          if not isinstance(pages, list):
              raise SystemExit("Unexpected GitHub API response.")

          records = []
          for page in pages:
              if isinstance(page, list):
                  records.extend(page)
              else:
                  raise SystemExit("Unexpected changed-file page.")

          if not records:
              raise SystemExit("No changed-file metadata was returned.")

          dependency_count = 0
          additions = 0
          deletions = 0

          print("### Changed Files")
          print()
          print("| Category | File | Status | Added | Deleted |")
          print("|---|---|---|---:|---:|")

          for record in records:
              if not isinstance(record, dict):
                  raise SystemExit("Invalid changed-file record.")

              path = str(record.get("filename", ""))
              if not path:
                  raise SystemExit("Changed-file record has no filename.")

              status = str(record.get("status", "unknown"))
              added = int(record.get("additions", 0))
              removed = int(record.get("deletions", 0))
              basename = path.rsplit("/", 1)[-1].lower()

              category = (
                  "Dependency"
                  if basename in dependency_names
                  else "Other"
              )

              if category == "Dependency":
                  dependency_count += 1

              additions += added
              deletions += removed

              safe_path = path.replace("|", "\\|").replace("\n", " ")
              print(
                  f"| {category} | `{safe_path}` | {status} "
                  f"| {added} | {removed} |"
              )

          print()
          print("### Change Statistics")
          print()
          print(f"- Changed files: {len(records)}")
          print(f"- Dependency-related files: {dependency_count}")
          print(f"- Lines added: {additions}")
          print(f"- Lines deleted: {deletions}")
          print()
          print("> File classification is informational. It does not prove that")
          print("> dependencies are vulnerability-free or that changes are safe.")
          PY

      - name: Publish security gate result
        if: always()
        shell: bash
        env:
          JOB_RESULT: ${{ job.status }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          BASE_BRANCH: ${{ steps.verify.outputs.base_branch }}
        run: |
          set -Eeuo pipefail

          {
            echo
            echo "### Security Gate Result"
            echo
            echo "- Job result: $JOB_RESULT"
            echo "- Pull request: #${PR_NUMBER:-unavailable}"
            echo "- Verified target: ${BASE_BRANCH:-not verified}"
            echo "- Pull request code executed: No"
            echo "- Repository checkout performed: No"
            echo "- Automatic approval: No"
            echo "- Automatic merge: No"
            echo "- PR comments: No"
            echo "- Repository modifications: No"
            echo
            echo "This workflow validates metadata and summarizes file changes."
            echo "It does not replace dependency vulnerability scanning or required CI tests."
          } >> "$GITHUB_STEP_SUMMARY"
