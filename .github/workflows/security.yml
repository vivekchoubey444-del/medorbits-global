name: Security Checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Monday at 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "No root package.json found; skipping npm audit."
            exit 0
          fi
          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "::error::package.json exists, but no npm lockfile was found."
            exit 1
          fi
          npm audit --audit-level=high
  secret-scan:
    name: Scan for exposed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
  repository-security:
    name: Repository security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for accidentally committed environment files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            case "$file" in
              .env.example|.env.sample|.env.template|*/.env.example|*/.env.sample|*/.env.template)
                continue
                ;;
            esac
            case "$file" in
              .env|.env.*|*/.env|*/.env.*)
                echo "::warning file=$file::Tracked environment file found. Verify that it contains no secrets."
                ;;
            esac
          done < <(git ls-files)
          echo "Environment-file review completed."
          echo "Gitleaks is responsible for detecting potential secret values."
      - name: Check workflow permission declarations
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ruby >/dev/null 2>&1; then
            echo "::notice::Ruby unavailable; skipping YAML permission checks."
            exit 0
          fi
          ruby <<'RUBY'
          require "yaml"
          files = Dir.glob(".github/workflows/*.{yml,yaml}")
          errors = []
          files.each do |file|
            begin
              workflow = YAML.load_file(file, aliases: true)
              unless workflow.is_a?(Hash)
                errors << "#{file}: workflow must be a YAML mapping"
                next
              end
              unless workflow.key?("permissions")
                puts "::warning file=#{file}::No top-level permissions block found; review the workflow's default token permissions."
              end
            rescue StandardError => e
              errors << "#{file}: #{e.message}"
            end
          end
          errors.each { |error| warn "::error::#{error}" }
          abort "Workflow YAML validation failed." unless errors.empty?
          puts "Workflow YAML files parsed successfully."
          RUBY