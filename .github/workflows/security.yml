
name: Security Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Repository Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted(
              path
              for path in Path(".").rglob("*.json")
              if not any(part in excluded for part in path.parts)
          )

          if not files:
              print("No JSON files found; skipping.")
              sys.exit(0)

          failures = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      json.load(handle)
                  print(f"PASS {path}")
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failures.append(path)

          if failures:
              sys.exit(1)

          print(f"Validated {len(files)} JSON file(s).")
          PY

      - name: Validate YAML configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check PyYAML

          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted({
              path
              for pattern in ("*.yaml", "*.yml")
              for path in Path(".").rglob(pattern)
              if not any(part in excluded for part in path.parts)
          })

          if not files:
              print("No YAML files found; skipping.")
              sys.exit(0)

          failures = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      list(yaml.safe_load_all(handle))
                  print(f"PASS {path}")
              except (OSError, UnicodeError, yaml.YAMLError) as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failures.append(path)

          if failures:
              sys.exit(1)

          print(f"Validated {len(files)} YAML file(s).")
          PY

      - name: Validate npm dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "No root package.json found; skipping npm audit."
            exit 0
          fi

          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
              throw new Error("package.json must contain a JSON object");
            }
            console.log(`Package: ${pkg.name || "unnamed"}`);
          '

          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm audit --audit-level=high
          else
            echo "::warning::No npm lockfile found; skipping dependency audit."
          fi

      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import re
          import subprocess
          import sys

          patterns = [
              (
                  "Private key material",
                  re.compile(
                      r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
                  ),
              ),
              (
                  "AWS access key identifier",
                  re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              ),
              (
                  "Possible hardcoded credential assignment",
                  re.compile(
                      r"""(?i)\b(?:password|passwd|secret|api[_-]?key|access[_-]?token)\b"""
                      r"""\s*[:=]\s*["'][^"'\r\n]{8,}["']"""
                  ),
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          excluded = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp",
              ".ico", ".pdf", ".zip", ".gz", ".lock",
          }

          findings = []
          scanned = 0

          for raw in result.stdout.split(b"\0"):
              if not raw:
                  continue

              filename = raw.decode("utf-8", errors="surrogateescape")

              if filename.lower().endswith(tuple(excluded)):
                  continue

              try:
                  with open(filename, "rb") as handle:
                      data = handle.read(2_000_000)
              except OSError:
                  print(
                      f"::warning::Could not read tracked file: {filename}"
                  )
                  continue

              if b"\0" in data:
                  continue

              scanned += 1
              content = data.decode("utf-8", errors="replace")

              for line_number, line in enumerate(content.splitlines(), 1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          findings.append(
                              (filename, line_number, label)
                          )

          if findings:
              print(
                  f"Potential secret patterns found: {len(findings)}",
                  file=sys.stderr,
              )

              for filename, line_number, label in findings:
                  print(
                      f"::error file={filename},line={line_number}::{label}",
                      file=sys.stderr,
                  )

              print(
                  "Matching secret values were not printed.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Scanned {scanned} tracked text files.")
          print("No configured secret patterns were detected.")
          PY

      - name: Validate shell-script syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          count=0

          while IFS= read -r -d '' file; do
            bash -n "$file"
            echo "PASS $file"
            count=$((count + 1))
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.venv' -prune -o \
              -path './vendor' -prune -o \
              -type f -name '*.sh' -print0
          )

          echo "Validated $count shell script(s)."

      - name: Security summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Security Checks"
            echo
            echo "- Result: $JOB_STATUS"
            echo "- Repository write access: disabled"
            echo "- Automatic remediation: disabled"
            echo "- Automatic merge: disabled"
            echo "- Automatic deployment: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
