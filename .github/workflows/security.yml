
name: Security Checks

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "0 4 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Repository Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import sys
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted(
              path for path in Path(".").rglob("*.json")
              if not any(part in excluded for part in path.parts)
          )

          failures = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      json.load(handle)
                  print(f"PASS {path}")
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failures.append(path)

          if failures:
              print(f"Invalid JSON files: {len(failures)}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(files)} JSON file(s).")
          PY

      - name: Validate YAML configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

          python <<'PY'
          import sys
          from pathlib import Path

          import yaml

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted({
              path
              for pattern in ("*.yaml", "*.yml")
              for path in Path(".").rglob(pattern)
              if not any(part in excluded for part in path.parts)
          })

          failures = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      list(yaml.safe_load_all(handle))
                  print(f"PASS {path}")
              except (OSError, UnicodeError, yaml.YAMLError) as exc:
                  print(f"FAIL {path}: {exc}", file=sys.stderr)
                  failures.append(path)

          if failures:
              print(f"Invalid YAML files: {len(failures)}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(files)} YAML file(s).")
          PY

      - name: Validate root npm manifest
        id: npm-project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json found."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (
            pkg === null ||
            typeof pkg !== "object" ||
            Array.isArray(pkg)
          ) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (
            pkg.name !== undefined &&
            typeof pkg.name !== "string"
          ) {
            throw new Error("package.json name must be a string.");
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          NODE

          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Validate npm lockfile and audit dependencies
        if: steps.npm-project.outputs.present == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f npm-shrinkwrap.json ]]; then
            lockfile="npm-shrinkwrap.json"
          elif [[ -f package-lock.json ]]; then
            lockfile="package-lock.json"
          else
            echo "::error::package.json exists, but no npm lockfile was found."
            exit 1
          fi

          echo "Using authoritative lockfile: $lockfile"

          npm ci --ignore-scripts --no-fund --no-audit

          npm audit \
            --audit-level=high \
            --registry=https://registry.npmjs.org/

      - name: Scan tracked files for common secret patterns
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          patterns = [
              (
                  "Private key material",
                  re.compile(
                      r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
                  ),
              ),
              (
                  "AWS access key identifier",
                  re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              ),
              (
                  "GitHub token",
                  re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              ),
              (
                  "GitHub fine-grained token",
                  re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              ),
              (
                  "Possible hardcoded credential",
                  re.compile(
                      r"""(?i)\b(?:password|passwd|secret|api[_-]?key|access[_-]?token)\b"""
                      r"""\s*[:=]\s*["'][^"'\r\n]{8,}["']"""
                  ),
              ),
          ]

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          ignored_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp",
              ".ico", ".pdf", ".zip", ".gz", ".woff",
              ".woff2", ".ttf", ".eot", ".mp4", ".mp3",
          }

          findings = []
          scanned = 0

          for raw in result.stdout.split(b"\0"):
              if not raw:
                  continue

              filename = raw.decode("utf-8", errors="surrogateescape")
              path = Path(filename)

              if path.suffix.lower() in ignored_suffixes:
                  continue

              try:
                  with path.open("rb") as handle:
                      data = handle.read(2_000_001)
              except OSError:
                  # A tracked file deleted from the working tree cannot
                  # be scanned here; history scanning should be handled
                  # by a dedicated secret scanner.
                  continue

              if len(data) > 2_000_000:
                  print(f"SKIP oversized file: {filename}")
                  continue

              if b"\0" in data:
                  continue

              scanned += 1
              content = data.decode("utf-8", errors="replace")

              for line_number, line in enumerate(content.splitlines(), 1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          findings.append(
                              (filename, line_number, label)
                          )

          if findings:
              print(
                  f"Potential secret patterns found: {len(findings)}",
                  file=sys.stderr,
              )

              for filename, line_number, label in findings:
                  safe_filename = filename.replace("%", "%25") \
                      .replace("\r", "%0D").replace("\n", "%0A")
                  print(
                      f"::error file={safe_filename},line={line_number}::{label}",
                      file=sys.stderr,
                  )

              print(
                  "Secret values were not printed. Review findings securely.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Scanned {scanned} tracked text files.")
          print("No configured secret patterns were detected.")
          PY

      - name: Validate shell-script syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          count=0

          while IFS= read -r -d '' file; do
            bash -n "$file"
            echo "PASS $file"
            count=$((count + 1))
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.venv' -prune -o \
              -path './venv' -prune -o \
              -path './vendor' -prune -o \
              -path './dist' -prune -o \
              -path './build' -prune -o \
              -type f -name '*.sh' -print0
          )

          echo "Validated $count shell script(s)."

      - name: Security summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Security Checks"
            echo
            echo "- Result: $JOB_STATUS"
            echo "- Repository write access: disabled"
            echo "- Automatic remediation: disabled"
            echo "- Automatic merge: disabled"
            echo "- Automatic deployment: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
