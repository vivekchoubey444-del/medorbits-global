Important operational notes

* CodeQL: The workflow uses CodeQL action v4 with security-extended queries. Confirm your repository and plan support CodeQL code scanning.
* Dependency auditing: The production audit and full audit are deliberately separate. Both use a high-severity threshold; development dependency findings are included in the full audit.
* Install scripts: npm ci --ignore-scripts reduces execution of third-party lifecycle scripts during this audit job. If a dependency requires lifecycle scripts for correct installation, assess that requirement before changing the setting.
* Secret scanning: Full-history checkout improves historical coverage, but Gitleaks cannot revoke a credential. Revoke or rotate any confirmed exposed secret immediately.
* Duplicate workflows: You already have separate CI, CodeQL, and secret-scanning workflows. Running them here as well may increase runtime and duplicate alerts. Decide whether this file should be the consolidated security workflow or whether you prefer to retain separate workflows.
* Action pinning: Major-version references such as @v7 and @v4 are convenient to maintain, but they are not immutable. For a stricter supply-chain policy, pin actions to reviewed full commit SHAs.

Recommended merge protection: Configure Security checks summary as a required status check. The summary job fails if any required security job fails or is skipped, so it provides a single security gate for pull requests.