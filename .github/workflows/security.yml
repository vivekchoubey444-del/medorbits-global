
name: Security Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect and validate npm project
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          node <<'JS'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            console.error("::error::package.json must contain a JSON object.");
            process.exit(1);
          }

          if (pkg.workspaces) {
            console.log("npm workspaces detected; audit behavior depends on the root lockfile.");
          }
          JS

      - name: Require a lockfile
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f npm-shrinkwrap.json && ! -f package-lock.json ]]; then
            echo "::error::A committed npm-shrinkwrap.json or package-lock.json is required for reproducible security auditing."
            echo "Generate and commit the lockfile before running this workflow."
            exit 1
          fi

      - name: Validate lockfile
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lockPath = fs.existsSync("npm-shrinkwrap.json")
            ? "npm-shrinkwrap.json"
            : "package-lock.json";

          let lock;

          try {
            lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          } catch (error) {
            console.error(`::error::Invalid ${lockPath}: ${error.message}`);
            process.exit(1);
          }

          if (!lock || typeof lock !== "object" || Array.isArray(lock)) {
            console.error(`::error::${lockPath} must contain a JSON object.`);
            process.exit(1);
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            console.error(`::error::Unsupported lockfileVersion: ${lock.lockfileVersion}`);
            process.exit(1);
          }

          if (!lock.packages || typeof lock.packages !== "object") {
            console.error(`::error::${lockPath} is missing the packages object.`);
            process.exit(1);
          }

          const root = lock.packages[""];

          if (!root || typeof root !== "object") {
            console.error(`::error::${lockPath} is missing packages[""].`);
            process.exit(1);
          }

          for (const key of ["name", "version"]) {
            if (
              manifest[key] !== undefined &&
              root[key] !== undefined &&
              manifest[key] !== root[key]
            ) {
              console.error(
                `::error::package.json ${key} does not match ${lockPath}.`
              );
              process.exit(1);
            }
          }

          console.log(`Validated ${lockPath}.`);
          JS

      - name: Install locked dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm audit --audit-level=high

      - name: Report missing npm project
        if: steps.detect.outputs.found == 'false'
        run: |
          echo "::notice::No root package.json found; npm auditing was skipped."
          echo "This job does not discover nested npm projects automatically."

  repository-hygiene:
    name: Repository Security Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for accidentally tracked environment files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              item.decode("utf-8", errors="replace")
              for item in result.stdout.split(b"\0")
              if item
          ]

          allowed_templates = {
              ".env.example",
              ".env.sample",
              ".env.template",
          }

          suspicious = []

          for path in paths:
              name = path.rsplit("/", 1)[-1]

              if name == ".env":
                  suspicious.append(path)
              elif name.startswith(".env.") and name not in allowed_templates:
                  suspicious.append(path)

          if suspicious:
              print("::error::Potentially sensitive environment files are tracked:")
              for path in suspicious:
                  print(f" - {path}")
              print(
                  "Review these files. Remove exposed secrets from version control "
                  "and rotate credentials if necessary."
              )
              sys.exit(1)

          print("No disallowed tracked .env filenames detected.")
          PY

      - name: Check for common private-key filenames
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              item.decode("utf-8", errors="replace")
              for item in result.stdout.split(b"\0")
              if item
          ]

          private_key_names = {
              "id_rsa",
              "id_ed25519",
              "id_ecdsa",
              "server.key",
              "private.key",
          }

          suspicious = [
              path for path in paths
              if path.rsplit("/", 1)[-1].lower() in private_key_names
          ]

          if suspicious:
              print("::error::Potential private-key files are tracked:")
              for path in suspicious:
                  print(f" - {path}")
              sys.exit(1)

          print("No common private-key filenames detected.")
          PY

      - name: Check for committed private-key content
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "grep", "-I", "-n", "-E",
               "-----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----",
               "--", "."],
              capture_output=True,
              text=True,
              check=False,
          )

          if result.returncode == 0:
              print("::error::Potential private-key material found in tracked files.")
              print(result.stdout)
              sys.exit(1)

          if result.returncode not in (1,):
              print("::error::git grep failed unexpectedly.")
              print(result.stderr)
              sys.exit(result.returncode)

          print("No common private-key PEM markers detected.")
          PY

      - name: Security summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Repository Security Hygiene"
            echo
            echo "- Status: ${STATUS}"
            echo "- Environment-file filename check: enabled"
            echo "- Common private-key filename check: enabled"
            echo "- Private-key content marker check: enabled"
            echo
            echo "These checks are basic safeguards, not a replacement for dedicated secret scanning."
          } >> "$GITHUB_STEP_SUMMARY"
