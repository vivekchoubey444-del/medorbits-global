
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to authorize production deployment"
        required: true
        type: string

  push:
    branches:
      - main
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "render.yaml"
      - "api/**"
      - "config/**"
      - "controllers/**"
      - "middleware/**"
      - "models/**"
      - "routes/**"
      - "services/**"
      - "public/**"
      - ".github/workflows/deploy_production.yml"

permissions:
  contents: read

concurrency:
  group: medorbits-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check manual deployment confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Deployment cancelled. Enter exactly 'deploy' to continue."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Validate package manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (typeof pkg.name !== "string" || !pkg.name.trim()) {
            throw new Error("package.json must define a package name.");
          }

          if (typeof pkg.version !== "string" || !pkg.version.trim()) {
            throw new Error("package.json must define a version.");
          }

          if (pkg.private === true) {
            console.log("Package is private; production deployment remains permitted.");
          }

          if (
            pkg.scripts !== undefined &&
            (!pkg.scripts ||
             typeof pkg.scripts !== "object" ||
             Array.isArray(pkg.scripts))
          ) {
            throw new Error("package.json scripts must be an object.");
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          NODE

      - name: Validate npm lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f npm-shrinkwrap.json ]]; then
            LOCKFILE="npm-shrinkwrap.json"
          elif [[ -f package-lock.json ]]; then
            LOCKFILE="package-lock.json"
          else
            echo "::error::A committed package-lock.json or npm-shrinkwrap.json is required."
            exit 1
          fi

          LOCKFILE="$LOCKFILE" node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync(process.env.LOCKFILE, "utf8"));

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error("Unsupported npm lockfile version.");
          }

          if (!lock.packages || typeof lock.packages !== "object") {
            throw new Error("Lockfile is missing the packages object.");
          }

          const root = lock.packages[""];

          if (!root || typeof root !== "object") {
            throw new Error('Lockfile is missing packages[""].');
          }

          for (const key of ["name", "version"]) {
            if (
              manifest[key] !== undefined &&
              root[key] !== undefined &&
              manifest[key] !== root[key]
            ) {
              throw new Error(`package.json ${key} does not match the lockfile.`);
            }
          }

          console.log(`Lockfile metadata validated: ${process.env.LOCKFILE}`);
          NODE

          npm ci --no-audit --no-fund

      - name: Check application entry point
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f server.js ]]; then
            echo "::error::server.js is missing. Update this check if the production entry point differs."
            exit 1
          fi

          node --check server.js

      - name: Check configured JavaScript files
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");

          const files = execFileSync(
            "git",
            ["ls-files", "-z"],
            { encoding: "utf8" }
          ).split("\0").filter(Boolean);

          const ignored = new Set([
            "node_modules", ".git", "dist", "build", "coverage"
          ]);

          const scripts = files.filter(file => {
            const parts = file.split(/[\\/]/);
            return (
              !parts.some(part => ignored.has(part)) &&
              [".js", ".cjs", ".mjs"].includes(path.extname(file).toLowerCase()) &&
              fs.existsSync(file)
            );
          });

          for (const file of scripts) {
            execFileSync(process.execPath, ["--check", file], {
              stdio: "inherit"
            });
          }

          console.log(`Checked ${scripts.length} JavaScript file(s).`);
          NODE

      - name: Run configured lint script
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "::warning::No npm lint script configured; lint check skipped."
          fi

      - name: Run configured tests
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::error::No npm test script configured. Configure tests before production deployment."
            exit 1
          fi

      - name: Run configured production build
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm run build
          else
            echo "No build script configured; skipping build."
          fi

      - name: Write validation summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Production Validation"
            echo
            echo "- Status: ${STATUS}"
            echo "- Node.js: 22"
            echo "- Lockfile validation: enabled"
            echo "- JavaScript syntax checks: enabled"
            echo "- Repository write permissions: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger Render Production Deployment
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK:-}" ]]; then
            echo "::error::Configure RENDER_DEPLOY_HOOK in the production environment secrets."
            exit 1
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::The Render deploy hook must be a valid HTTPS URL without whitespace."
            exit 1
          fi

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 0 \
              "$RENDER_DEPLOY_HOOK"
          )"; then
            echo "::error::Unable to complete the Render deployment request."
            exit 1
          fi

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Render returned HTTP $http_code."
            exit 1
          fi

          {
            echo "## Render Production Deployment"
            echo
            echo "- Request status: accepted"
            echo "- HTTP status: ${http_code}"
            echo "- Environment: production"
            echo
            echo "Verify build completion and application health in Render."
          } >> "$GITHUB_STEP_SUMMARY"
