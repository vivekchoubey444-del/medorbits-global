
# ==============================================================================
# MedOrbits -- Production Deployment
# File: .github/workflows/deploy_production.yml
# Release target: 2.0.0
#
# Purpose:
#   Validate the production application and trigger a Render deployment.
#
# Policy:
#   - Least-privilege GitHub permissions.
#   - Manual deployment requires explicit confirmation.
#   - Automatic deployment only for relevant changes on main.
#   - No automatic merging or source modification.
#   - A successful HTTP response confirms request acceptance only.
# ==============================================================================

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to authorize production deployment"
        required: true
        type: string

  push:
    branches:
      - main
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "render.yaml"
      - "api/**"
      - "config/**"
      - "controllers/**"
      - "middleware/**"
      - "models/**"
      - "routes/**"
      - "services/**"
      - "public/**"
      - ".github/workflows/deploy_production.yml"

permissions:
  contents: read

concurrency:
  group: medorbits-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check manual deployment confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Deployment cancelled. Enter exactly 'deploy' to continue."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
          cache: ${{ hashFiles('npm-shrinkwrap.json') != '' && 'npm' || (hashFiles('package-lock.json') != '' && 'npm' || '') }}
          cache-dependency-path: |
            package-lock.json
            npm-shrinkwrap.json

      - name: Validate package manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            console.error("package.json must contain a JSON object.");
            process.exit(1);
          }

          if (typeof pkg.name !== "string" || !pkg.name.trim()) {
            console.error("package.json must define a non-empty package name.");
            process.exit(1);
          }

          if (typeof pkg.version !== "string" || !pkg.version.trim()) {
            console.error("package.json must define a non-empty version.");
            process.exit(1);
          }

          if (
            pkg.scripts !== undefined &&
            (!pkg.scripts ||
             typeof pkg.scripts !== "object" ||
             Array.isArray(pkg.scripts))
          ) {
            console.error("package.json scripts must be an object.");
            process.exit(1);
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          NODE

      - name: Validate npm lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f npm-shrinkwrap.json ]]; then
            echo "Using npm-shrinkwrap.json as the authoritative lockfile."
            npm ci --ignore-scripts --no-audit --no-fund
          elif [[ -f package-lock.json ]]; then
            echo "Using package-lock.json."
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "::error::Neither package-lock.json nor npm-shrinkwrap.json exists."
            echo "Production deployment requires a committed npm lockfile."
            exit 1
          fi

      - name: Check application entry point
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f server.js ]]; then
            echo "::error::server.js is missing. Update this check if the production entry point differs."
            exit 1
          fi

          node --check server.js

      - name: Run configured production validation
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          const scripts = pkg.scripts || {};
          const required = ["lint", "test"];

          for (const name of required) {
            if (scripts[name]) {
              console.log(`Configured npm script found: ${name}`);
            } else {
              console.log(`No npm ${name} script configured; check skipped.`);
            }
          }
          NODE

      - name: Run configured lint script
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            npm run lint
          else
            echo "No npm lint script configured; lint check skipped."
          fi

      - name: Run configured tests
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "No npm test script configured; test check skipped."
          fi

  deploy:
    name: Trigger Render production deployment
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Validate Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::error::Configure RENDER_DEPLOY_HOOK in the production environment secrets."
            exit 1
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK" =~ ^https:// ]]; then
            echo "::error::The Render deploy hook must use HTTPS."
            exit 1
          fi

          if [[ "$RENDER_DEPLOY_HOOK" == *$'\n'* ||
                "$RENDER_DEPLOY_HOOK" == *$'\r'* ]]; then
            echo "::error::The Render deploy hook contains invalid line breaks."
            exit 1
          fi

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 0 \
              "$RENDER_DEPLOY_HOOK"
          )"; then
            echo "::error::Could not contact Render or complete the deployment request."
            exit 1
          fi

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Render returned HTTP $http_code."
            exit 1
          fi

          echo "Render accepted the deployment request."
          echo "This does not confirm build completion or application health."
          echo "Verify the deployment and service health in Render."
