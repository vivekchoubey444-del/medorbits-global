
# ==============================================================================
# MedOrbits -- Deploy Staging
# File: .github/workflows/deploy_staging.yml
# Release: 3.0.0
#
# Purpose:
#   Validate the staging application and request a Render deployment.
#
# Security:
#   - Read-only GitHub repository permissions.
#   - Production environment remains separate.
#   - Manual deployment requires explicit confirmation.
#   - Render hook stored in staging environment secrets.
#   - No automatic commits, pushes, or merges.
#   - No deployment from pull requests.
# ==============================================================================

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to confirm staging deployment"
        required: true
        type: string

  push:
    branches:
      - staging
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - ".npmrc"
      - "render.yaml"
      - "api/**"
      - "config/**"
      - "controllers/**"
      - "middleware/**"
      - "models/**"
      - "routes/**"
      - "services/**"
      - "public/**"
      - ".github/workflows/deploy_staging.yml"

permissions:
  contents: read

concurrency:
  group: medorbits-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Staging Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$REF" != "refs/heads/staging" ]]; then
            echo "::error::Staging deployment is permitted only from the staging branch."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" &&
                "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Enter exactly 'deploy' to confirm staging deployment."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" &&
                "$EVENT_NAME" != "push" ]]; then
            echo "::error::Unsupported deployment event."
            exit 1
          fi

          echo "Staging deployment source verified."

      - name: Verify required files
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in package.json server.js; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done

          if [[ -f npm-shrinkwrap.json ]]; then
            echo "LOCKFILE=npm-shrinkwrap.json" >> "$GITHUB_ENV"
          elif [[ -f package-lock.json ]]; then
            echo "LOCKFILE=package-lock.json" >> "$GITHUB_ENV"
          else
            echo "::error::A root npm lockfile is required."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Validate package and lockfile metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (
            pkg === null ||
            typeof pkg !== "object" ||
            Array.isArray(pkg)
          ) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (!pkg.scripts || typeof pkg.scripts !== "object") {
            throw new Error("package.json must define scripts.");
          }

          if (!pkg.scripts.test) {
            throw new Error("A working test script is required.");
          }

          const lock = JSON.parse(
            fs.readFileSync(process.env.LOCKFILE, "utf8")
          );

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          const root = lock.packages?.[""];

          if (!root) {
            throw new Error("Lockfile is missing packages[''] metadata.");
          }

          if (
            pkg.name &&
            (root.name || lock.name) !== pkg.name
          ) {
            throw new Error("Manifest and lockfile names differ.");
          }

          if (
            pkg.version &&
            (root.version || lock.version) !== pkg.version
          ) {
            throw new Error("Manifest and lockfile versions differ.");
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Version: ${pkg.version || "unspecified"}`);
          console.log(`Lockfile: ${process.env.LOCKFILE}`);
          console.log("Manifest and lockfile validated.");
          NODE

          node --check server.js

      - name: Install locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check dependency tree
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ls --depth=0

      - name: Run staging tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test

      - name: Run configured build
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e '
            const pkg = require("./package.json");
            process.exit(pkg.scripts?.build ? 0 : 1);
          '; then
            npm run build
          else
            echo "::notice::No build script is configured; build skipped."
          fi

      - name: Summarize validation
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## Staging Pre-deployment Validation"
            echo
            echo "- Result: passed"
            echo "- Branch: staging"
            echo "- Commit: $COMMIT_SHA"
            echo "- Dependency installation: passed"
            echo "- Tests: passed"
            echo "- Repository writes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Request Render Staging Deployment
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: staging

    permissions:
      contents: read

    steps:
      - name: Validate Render staging hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK:-}" ]]; then
            echo "::error::Configure RENDER_STAGING_DEPLOY_HOOK in the staging environment secrets."
            exit 1
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK" =~ ^https://api\.render\.com/deploy/[^[:space:]]+$ ]]; then
            echo "::error::The Render deployment hook URL is invalid."
            exit 1
          fi

          echo "Render staging hook format validated."

      - name: Trigger Render staging deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              --max-redirs 0 \
              "$RENDER_DEPLOY_HOOK"
          )"; then
            echo "::error::Unable to contact Render staging."
            exit 1
          fi

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Render returned HTTP $http_code."
            echo "Response body withheld from workflow logs."
            exit 1
          fi

          {
            echo "## Render Staging Deployment"
            echo
            echo "- Request status: accepted"
            echo "- HTTP status: $http_code"
            echo "- Environment: staging"
            echo
            echo "Verify build completion and application health in Render."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          {
            echo
            echo "### Staging Deployment Workflow"
            echo
            echo "- Result: ${JOB_STATUS:-unknown}"
            echo "- Source: $REF"
            echo "- Event: $EVENT_NAME"
            echo "- Commit: $COMMIT_SHA"
            echo "- Automatic commits and pushes: disabled"
            echo "- Application health: verify separately"
          } >> "$GITHUB_STEP_SUMMARY"
