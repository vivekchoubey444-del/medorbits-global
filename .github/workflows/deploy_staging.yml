name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to confirm staging deployment"
        required: true
        type: string
  push:
    branches:
      - staging
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "api/**"
      - "config/**"
      - "controllers/**"
      - "middleware/**"
      - "models/**"
      - "routes/**"
      - "services/**"
      - "public/**"
      - ".github/workflows/deploy_staging.yml"
permissions:
  contents: read
concurrency:
  group: medorbits-staging
  cancel-in-progress: false
jobs:
  validate:
    name: Validate staging build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate package.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            console.log(`Package: ${pkg.name || "unnamed"}`);
            console.log(`Version: ${pkg.version || "unspecified"}`);
            console.log(`Node requirement: ${pkg.engines?.node || "not specified"}`);
          '
      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "::error::No npm lockfile found."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const file = fs.existsSync("npm-shrinkwrap.json")
              ? "npm-shrinkwrap.json"
              : "package-lock.json";
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`Valid JSON lockfile: ${file}`);
          '
      - name: Check manual deployment confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Deployment cancelled. Enter exactly 'deploy' to confirm."
            exit 1
          fi
  deploy:
    name: Trigger Render staging deployment
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Verify staging deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::error::Configure the RENDER_STAGING_DEPLOY_HOOK secret."
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK" != https://* ]]; then
            echo "::error::The Render staging deploy hook must use HTTPS."
            exit 1
          fi
      - name: Trigger Render staging deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              "$RENDER_DEPLOY_HOOK"
          )"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "::error::Render returned HTTP $http_code."
            exit 1
          fi
          echo "Render accepted the staging deployment request."
          echo "Verify build completion and application health in the Render dashboard."