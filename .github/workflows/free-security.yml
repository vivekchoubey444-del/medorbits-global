
# ==============================================================================
# MedOrbits -- Free Security Checks
# File: .github/workflows/free-security-checks.yml
# Release: 3.0.0
#
# Purpose:
#   Perform free, read-only repository validation.
#
# Checks:
#   - JSON syntax and duplicate keys
#   - YAML syntax and duplicate keys
#   - TOML syntax
#   - Python syntax
#   - JavaScript syntax
#
# Security:
#   - Read-only repository permissions
#   - No repository modifications
#   - No application dependency installation
#   - No secrets required
# ==============================================================================

name: MedOrbits Free Security Checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.py"
      - "**/*.js"
      - "**/*.cjs"
      - "**/*.mjs"
      - ".github/workflows/free-security-checks.yml"

  pull_request:
    branches: [main]
    paths:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.py"
      - "**/*.js"
      - "**/*.cjs"
      - "**/*.mjs"
      - ".github/workflows/free-security-checks.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Validate Repository Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install YAML validator
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Validate tracked JSON files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next", "coverage",
              "__pycache__", "vendor"
          }

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          errors = []
          checked = 0

          def reject_duplicate_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"Duplicate JSON key: {key!r}")
                  result[key] = value

              return result

          def reject_constant(value):
              raise ValueError(
                  f"Non-standard JSON constant: {value}"
              )

          for path in paths:
              if path.suffix.lower() != ".json":
                  continue

              if any(part in excluded for part in path.parts):
                  continue

              if not path.is_file():
                  continue

              try:
                  with path.open("r", encoding="utf-8") as file:
                      json.load(
                          file,
                          object_pairs_hook=reject_duplicate_keys,
                          parse_constant=reject_constant,
                      )
                  checked += 1
              except (OSError, UnicodeError, ValueError) as exc:
                  errors.append(f"{path}: {exc}")
                  print(f"::error file={path.as_posix()}::Invalid JSON.")

          print(f"Validated {checked} JSON file(s).")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("JSON validation passed.")
          PY

      - name: Validate tracked YAML files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next", "coverage",
              "__pycache__", "vendor"
          }

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)

                  try:
                      duplicate = key in mapping
                  except TypeError as exc:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          "unhashable mapping key",
                          key_node.start_mark,
                      ) from exc

                  if duplicate:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"duplicate key {key!r}",
                          key_node.start_mark,
                      )

                  mapping[key] = loader.construct_object(
                      value_node, deep=deep
                  )

              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          errors = []
          checked = 0

          for path in paths:
              if path.suffix.lower() not in {".yaml", ".yml"}:
                  continue

              if any(part in excluded for part in path.parts):
                  continue

              if not path.is_file():
                  continue

              try:
                  with path.open("r", encoding="utf-8") as file:
                      list(yaml.load_all(file, Loader=UniqueKeyLoader))
                  checked += 1
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
                  print(f"::error file={path.as_posix()}::Invalid YAML.")

          print(f"Validated {checked} YAML file(s).")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("YAML validation passed.")
          PY

      - name: Validate tracked TOML files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next", "coverage",
              "__pycache__", "vendor"
          }

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          errors = []
          checked = 0

          for path in paths:
              if path.suffix.lower() != ".toml":
                  continue

              if any(part in excluded for part in path.parts):
                  continue

              if not path.is_file():
                  continue

              try:
                  with path.open("rb") as file:
                      tomllib.load(file)
                  checked += 1
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
                  print(f"::error file={path.as_posix()}::Invalid TOML.")

          print(f"Validated {checked} TOML file(s).")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("TOML validation passed.")
          PY

      - name: Check tracked Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import ast
          import os
          import subprocess
          import sys
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next", "coverage",
              "__pycache__", "vendor"
          }

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          errors = []
          checked = 0

          for path in paths:
              if path.suffix.lower() != ".py":
                  continue

              if any(part in excluded for part in path.parts):
                  continue

              if not path.is_file():
                  continue

              try:
                  source = path.read_text(encoding="utf-8")
                  ast.parse(source, filename=path.as_posix())
                  checked += 1
              except (OSError, UnicodeError, SyntaxError) as exc:
                  errors.append(f"{path}: {exc}")
                  print(f"::error file={path.as_posix()}::Python syntax error.")

          print(f"Checked {checked} Python file(s).")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print("Python syntax validation passed.")
          PY

      - name: Check tracked JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          node --version

          python <<'PY'
          import os
          import subprocess
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next", "coverage",
              "__pycache__", "vendor"
          }

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          paths = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          extensions = {".js", ".cjs", ".mjs"}
          selected = [
              path for path in paths
              if path.suffix.lower() in extensions
              and not any(part in excluded for part in path.parts)
              and path.is_file()
          ]

          with open(
              os.environ["RUNNER_TEMP"] + "/javascript-files.txt",
              "w",
              encoding="utf-8",
          ) as output:
              for path in selected:
                  output.write(path.as_posix() + "\n")

          print(f"JavaScript files found: {len(selected)}")
          PY

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            node --check "$file"
          done < "$RUNNER_TEMP/javascript-files.txt"

          echo "JavaScript syntax validation passed."

      - name: Write security check summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          {
            echo "## MedOrbits Free Security Checks"
            echo
            echo "- Result: ${JOB_STATUS:-unknown}"
            echo "- Event: ${EVENT_NAME:-unknown}"
            echo "- Commit: ${COMMIT_SHA:-unknown}"
            echo "- JSON syntax: checked"
            echo "- YAML syntax: checked"
            echo "- TOML syntax: checked"
            echo "- Python syntax: checked"
            echo "- JavaScript syntax: checked"
            echo "- Repository write permission: disabled"
            echo "- Automatic commits and pushes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
