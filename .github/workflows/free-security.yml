
name: MedOrbits Free Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Validate repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next"
          }
          errors = []
          count = 0

          for path in Path(".").rglob("*.json"):
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
                  count += 1
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          print(f"Validated {count} JSON files.")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY

      - name: Validate YAML and TOML files
        run: |
          python -m pip install --disable-pip-version-check PyYAML tomli
          python - <<'PY'
          import tomllib
          from pathlib import Path
          import yaml

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next"
          }
          errors = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(p in excluded for p in path.parts):
                  continue
              try:
                  if path.suffix.lower() in {".yaml", ".yml"}:
                      yaml.safe_load(path.read_text(encoding="utf-8"))
                  elif path.name == "pyproject.toml" or path.suffix == ".toml":
                      tomllib.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("YAML and TOML syntax checks passed.")
          PY

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "dist", "build", ".next"
          }
          errors = []

          for path in Path(".").rglob("*.py"):
              if any(p in excluded for p in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (SyntaxError, UnicodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("Python syntax checks passed.")
          PY
