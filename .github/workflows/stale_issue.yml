name: Stale Issue and Pull Request Management
on:
  schedule:
    # Run daily at 01:30 UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
  contents: read
concurrency:
  group: stale-issue-management
  cancel-in-progress: false
jobs:
  stale:
    name: Manage inactive issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark and close stale items
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Issues
          days-before-issue-stale: 45
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been marked stale because it has had no recent activity.
            If it is still relevant, please add an update or comment. It may be
            closed after 14 additional days of inactivity.
          close-issue-message: >
            This issue is being closed due to continued inactivity. If the problem
            persists, please reopen it or create a new issue with current details.
          # Pull requests
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been marked stale because it has had no recent
            activity. Please update it if work is continuing.
          close-pr-message: >
            This pull request is being closed due to continued inactivity. It can
            be reopened when the work resumes.
          # Exempt important work
          exempt-issue-labels: "security,keep-open,pinned,priority:high"
          exempt-pr-labels: "security,keep-open,pinned,work-in-progress"
          # Exempt items with assignees
          exempt-all-issue-assignees: true
          exempt-all-pr-assignees: true
          # Operational limits
          operations-per-run: 100
          ascending: true
          remove-stale-when-updated: true
          # Do not close locked conversations
          exempt-issue-milestones: true
          exempt-pr-milestones: true