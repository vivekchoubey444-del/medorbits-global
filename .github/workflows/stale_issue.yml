
# =============================================================================
# MedOrbits -- Stale Issues and Pull Requests
# File: .github/workflows/stale.yml
# Purpose: Label inactive issues and pull requests, then close them after
#          a further inactivity period.
# =============================================================================

name: Stale Issues and Pull Requests

on:
  schedule:
    # Daily at 02:30 UTC.
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: stale-issues-${{ github.repository }}
  cancel-in-progress: false

jobs:
  stale:
    name: Mark and Close Inactive Items
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Manage stale issues and pull requests
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Inactivity thresholds.
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 14
          days-before-pr-close: 14

          # Labels applied by this workflow.
          stale-issue-label: stale
          stale-pr-label: stale
          close-issue-label: stale-closed
          close-pr-label: stale-closed

          # Stale notifications.
          stale-issue-message: >-
            This issue has been marked stale because it has had no recent
            activity. If it is still relevant, please comment with an update.
            It may be closed after 14 additional days of inactivity.
          stale-pr-message: >-
            This pull request has been marked stale because it has had no
            recent activity. If it is still being worked on, please update
            it or leave a comment to keep it active.

          # Closure notifications.
          close-issue-message: >-
            Closing this issue because it remained inactive after the stale
            notice. If the issue is still relevant, please request reopening
            or submit a new update.
          close-pr-message: >-
            Closing this pull request because it remained inactive after the
            stale notice. If work should continue, please reopen it or submit
            an updated pull request.

          # Items exempt from automatic staling.
          exempt-issue-labels: >-
            pinned,security,bug-critical,keep-open,under-review
          exempt-pr-labels: >-
            pinned,security,keep-open,under-review,work-in-progress

          # Protect assigned, milestone-linked, and draft work.
          exempt-all-milestones: true
          exempt-all-assignees: true
          exempt-draft-pr: true

          # Processing limits.
          operations-per-run: 100

          # Restore active items when new activity occurs.
          remove-stale-when-updated: true

          # Never delete source branches.
          delete-branch: false

          # Apply real changes; do not use dry-run mode.
          debug-only: false
