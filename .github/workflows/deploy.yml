name: Deploy MedOrbits
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to confirm production deployment"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: medorbits-production-deploy
  cancel-in-progress: false
jobs:
  pre-deploy:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deployment configuration
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Manual deployment cancelled. Enter exactly 'deploy' to confirm."
            exit 1
          fi
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK repository secret."
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK" != https://* ]]; then
            echo "::error::RENDER_DEPLOY_HOOK must be an HTTPS URL."
            exit 1
          fi
          echo "Deployment configuration checks passed."
  deploy:
    name: Trigger Render deployment
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Trigger Render deploy hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              "$RENDER_DEPLOY_HOOK"
          )"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "::error::Render deploy hook returned HTTP $http_code."
            exit 1
          fi
          echo "Render accepted the deployment request."
          echo "Check the Render dashboard for build and deployment status."