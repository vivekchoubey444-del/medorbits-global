
name: Deploy MedOrbits

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: medorbits-production-deploy
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate application configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f package.json ]]; then
            node -e '
              const fs = require("node:fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

              if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
                throw new Error("package.json must contain a JSON object.");
              }

              console.log(`Package: ${pkg.name || "unnamed"}`);
              console.log(`Version: ${pkg.version || "unspecified"}`);
            '
          else
            echo "::notice::No root package.json found; skipping Node.js manifest validation."
          fi

          if [[ -f server.js ]]; then
            node --check server.js
          else
            echo "::notice::server.js not found; skipping entry-point syntax check."
          fi

      - name: Validate manual deployment confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Manual deployment cancelled. Enter exactly 'deploy' to confirm."
            exit 1
          fi

          echo "Manual deployment confirmation accepted."

  deploy:
    name: Trigger Render deployment
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Validate Render deployment hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK:-}" ]]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK secret in the production environment."
            exit 1
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK" =~ ^https:// ]]; then
            echo "::error::RENDER_DEPLOY_HOOK must be an HTTPS URL."
            exit 1
          fi

          echo "Render deployment configuration is valid."

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              "$RENDER_DEPLOY_HOOK"
          )"; then
            echo "::error::Unable to contact the Render deployment endpoint."
            exit 1
          fi

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Render returned HTTP $http_code."
            exit 1
          fi

          echo "Render accepted the deployment request."
          echo "Verify build completion and application health in the Render dashboard."

      - name: Write deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## MedOrbits Production Deployment"
            echo
            echo "- Job result: $JOB_STATUS"
            echo "- Trigger: $EVENT_NAME"
            echo "- Commit: $COMMIT_SHA"
            echo "- Deployment provider: Render"
            echo "- Automatic merge: disabled"
            echo "- Application health verification: required in Render"
          } >> "$GITHUB_STEP_SUMMARY"
