
# ==============================================================================
# MedOrbits -- Production Deployment
# File: .github/workflows/deploy.yml
# Release: 3.0.0
#
# Purpose:
#   Validate the production application and request a Render deployment.
#
# Security:
#   - Read-only GitHub repository permissions.
#   - Production environment protection.
#   - Manual deployment requires explicit confirmation.
#   - Deployment hook stored in production environment secrets.
#   - No deployments from pull requests.
#   - No automatic commits, merges, or repository modifications.
#   - No dependency or lockfile regeneration.
#
# Note:
#   An accepted deployment request does not prove deployment completion
#   or application health.
# ==============================================================================

name: Deploy MedOrbits

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type deploy to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: medorbits-production-deploy
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment source and confirmation
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirm_deployment }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Only manual deployment is permitted."
            exit 1
          fi

          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is allowed only from main."
            exit 1
          fi

          if [[ "$CONFIRMATION" != "deploy" ]]; then
            echo "::error::Enter exactly 'deploy' to confirm deployment."
            exit 1
          fi

          echo "Deployment source and confirmation validated."

      - name: Verify required files and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in package.json server.js; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done

          if [[ -f npm-shrinkwrap.json ]]; then
            echo "LOCKFILE=npm-shrinkwrap.json" >> "$GITHUB_ENV"
          elif [[ -f package-lock.json ]]; then
            echo "LOCKFILE=package-lock.json" >> "$GITHUB_ENV"
          else
            echo "::error::No root npm lockfile found."
            exit 1
          fi

      - name: Validate package and lockfile metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (
            pkg === null ||
            typeof pkg !== "object" ||
            Array.isArray(pkg)
          ) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (
            !pkg.scripts ||
            typeof pkg.scripts !== "object" ||
            Array.isArray(pkg.scripts)
          ) {
            throw new Error("package.json must define a scripts object.");
          }

          if (!pkg.scripts.test) {
            throw new Error(
              "A production test script is required in package.json."
            );
          }

          if (
            pkg.engines?.node &&
            !pkg.engines.node.includes("22")
          ) {
            console.log(
              `Notice: declared Node.js engine is ${pkg.engines.node}.`
            );
          }

          const lock = JSON.parse(
            fs.readFileSync(process.env.LOCKFILE, "utf8")
          );

          if (
            lock === null ||
            typeof lock !== "object" ||
            Array.isArray(lock)
          ) {
            throw new Error("Lockfile must contain a JSON object.");
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          const root = lock.packages?.[""];

          if (!root) {
            throw new Error("Lockfile is missing packages[''] metadata.");
          }

          if (
            pkg.name &&
            (root.name || lock.name) !== pkg.name
          ) {
            throw new Error("Manifest and lockfile package names differ.");
          }

          if (
            pkg.version &&
            (root.version || lock.version) !== pkg.version
          ) {
            throw new Error("Manifest and lockfile versions differ.");
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Version: ${pkg.version || "unspecified"}`);
          console.log(`Lockfile: ${process.env.LOCKFILE}`);
          console.log("Manifest and lockfile metadata validated.");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Check server JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server.js

      - name: Install locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci --no-audit --no-fund

      - name: Check installed dependency tree
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ls --depth=0

      - name: Run production tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test

      - name: Run production build
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e '
            const pkg = require("./package.json");
            process.exit(pkg.scripts?.build ? 0 : 1);
          '; then
            npm run build
          else
            echo "::notice::No build script is configured; build skipped."
          fi

      - name: Summarize pre-deployment validation
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## Production Pre-deployment Validation"
            echo
            echo "- Result: passed"
            echo "- Source branch: main"
            echo "- Commit: $COMMIT_SHA"
            echo "- Manifest and lockfile: validated"
            echo "- Dependency installation: passed"
            echo "- Tests: passed"
            echo "- Repository writes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Request Render Production Deployment
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Validate Render deployment hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK:-}" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK is missing from production secrets."
            exit 1
          fi

          if [[ ! "$RENDER_DEPLOY_HOOK" =~ ^https://api\.render\.com/deploy/[^[:space:]]+$ ]]; then
            echo "::error::Render deployment hook URL is invalid."
            exit 1
          fi

          echo "Render deployment hook format validated."

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -Eeuo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              --max-redirs 0 \
              "$RENDER_DEPLOY_HOOK"
          )"; then
            echo "::error::Could not contact the Render deployment endpoint."
            exit 1
          fi

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Render returned HTTP $http_code."
            echo "Response body withheld from workflow logs."
            exit 1
          fi

          {
            echo "## Render Production Deployment"
            echo
            echo "- Request: accepted"
            echo "- HTTP status: $http_code"
            echo "- Environment: production"
            echo "- Provider: Render"
            echo
            echo "Acceptance does not confirm deployment completion or application health."
            echo "Verify the deployment in the Render dashboard and check the live health endpoint."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment workflow result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          {
            echo
            echo "### Deployment Request Result"
            echo
            echo "- Job result: $JOB_STATUS"
            echo "- Source ref: $REF"
            echo "- Commit: $COMMIT_SHA"
            echo "- Automatic merge: disabled"
            echo "- Automatic repository writes: disabled"
            echo "- Application health: must be verified separately"
          } >> "$GITHUB_STEP_SUMMARY"
