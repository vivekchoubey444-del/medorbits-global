
name: MedOrbits Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - MedOrbits CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: medorbits-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Deployment Eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    outputs:
      deployment_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Resolve deployment commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$SOURCE_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
              echo "::error::Source workflow is from another repository."
              exit 1
            fi

            if [[ "$SOURCE_BRANCH" != "main" ]]; then
              echo "::error::Only main-branch CI runs can deploy."
              exit 1
            fi

            if [[ "$SOURCE_CONCLUSION" != "success" ]]; then
              echo "::error::Source CI workflow did not succeed."
              exit 1
            fi

            SHA="$WORKFLOW_RUN_SHA"
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual deployment must run from main."
              exit 1
            fi

            SHA="$MANUAL_SHA"
          fi

          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid deployment commit SHA."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Verified deployment target: $SHA"

      - name: Confirm deployment eligibility
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment eligibility checks passed."

  deploy:
    name: Deploy Verified Commit to Render
    needs:
      - verify

    if: needs.verify.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.deployment_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json server.js; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          if (
            typeof pkg.name !== "string" ||
            !pkg.name.trim() ||
            typeof pkg.version !== "string" ||
            !pkg.version.trim()
          ) {
            throw new Error(
              "package.json must declare name and version."
            );
          }

          if (!Number.isInteger(lock.lockfileVersion)) {
            throw new Error(
              "package-lock.json has an invalid lockfileVersion."
            );
          }

          if (
            (lock.name && lock.name !== pkg.name) ||
            (lock.version && lock.version !== pkg.version)
          ) {
            throw new Error(
              "package-lock.json metadata does not match package.json."
            );
          }

          if (
            !lock.packages ||
            typeof lock.packages !== "object"
          ) {
            throw new Error(
              "package-lock.json is missing its packages object."
            );
          }

          if (
            pkg.engines?.node &&
            !pkg.engines.node.trim()
          ) {
            throw new Error("Invalid Node.js engine requirement.");
          }

          console.log(`Validated ${pkg.name}@${pkg.version}`);
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          console.log(
            `Node.js requirement: ${pkg.engines?.node || "not specified"}`
          );
          NODE

      - name: Verify production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund

      - name: Check server syntax
        run: node --check server.js

      - name: Validate Render configuration
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::Missing RENDER_API_KEY in production environment."
            exit 1
          fi

          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[A-Za-z0-9]+$ ]]; then
            echo "::error::RENDER_SERVICE_ID is missing or invalid."
            exit 1
          fi

          command -v curl >/dev/null || {
            echo "::error::curl is unavailable."
            exit 1
          }

          command -v jq >/dev/null || {
            echo "::error::jq is unavailable."
            exit 1
          }

      - name: Trigger Render deployment
        id: render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOYMENT_SHA: ${{ needs.verify.outputs.deployment_sha }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          PAYLOAD="$(
            jq -n \
              --arg commitId "$DEPLOYMENT_SHA" \
              '{
                commitId: $commitId,
                clearCache: "do_not_clear",
                deployMode: "build_and_deploy"
              }'
          )"

          HTTP_STATUS="$(
            curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$PAYLOAD"
          )"

          if [[ "$HTTP_STATUS" != "201" ]]; then
            echo "::error::Render API rejected deployment (HTTP $HTTP_STATUS)."
            jq -c '{message, error, errors}' "$RESPONSE_FILE" 2>/dev/null || true
            exit 1
          fi

          DEPLOY_ID="$(jq -r '.id // empty' "$RESPONSE_FILE")"
          RETURNED_SHA="$(jq -r '.commit.id // empty' "$RESPONSE_FILE")"

          if [[ -z "$DEPLOY_ID" ]]; then
            echo "::error::Render did not return a deployment ID."
            exit 1
          fi

          if [[ "${RETURNED_SHA,,}" != "${DEPLOYMENT_SHA,,}" ]]; then
            echo "::error::Render returned a different deployment commit."
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Render accepted deployment $DEPLOY_ID."

      - name: Wait for Render deployment
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          DEPLOYMENT_SHA: ${{ needs.verify.outputs.deployment_sha }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=15

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            RESPONSE="$(
              curl --fail --silent --show-error \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "Accept: application/json"
            )" || {
              echo "::error::Could not retrieve Render deployment status."
              exit 1
            }

            STATUS="$(jq -r '.status // "unknown"' <<< "$RESPONSE")"
            RETURNED_SHA="$(jq -r '.commit.id // empty' <<< "$RESPONSE")"

            if [[ "${RETURNED_SHA,,}" != "${DEPLOYMENT_SHA,,}" ]]; then
              echo "::error::Render reports a different deployment commit."
              exit 1
            fi

            echo "Render status: $STATUS ($attempt/$MAX_ATTEMPTS)"

            case "$STATUS" in
              live)
                echo "Render reports the deployment is live."
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "::error::Deployment failed with status: $STATUS"
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep "$SLEEP_SECONDS"
                ;;
              *)
                echo "::warning::Unrecognized Render status: $STATUS"
                sleep "$SLEEP_SECONDS"
                ;;
            esac
          done

          echo "::error::Deployment did not reach live status within 15 minutes."
          exit 1
