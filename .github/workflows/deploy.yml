
name: MedOrbits Deployment

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - MedOrbits CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: medorbits-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployment eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'MedOrbits CI' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    permissions:
      contents: read

    outputs:
      deployment_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Resolve deployment commit
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$SOURCE_WORKFLOW_NAME" != "MedOrbits CI" ]]; then
              echo "::error::Unexpected source workflow."
              exit 1
            fi

            if [[ "$SOURCE_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
              echo "::error::Source workflow is not from this repository."
              exit 1
            fi

            if [[ "$SOURCE_BRANCH" != "main" ]]; then
              echo "::error::Only main-branch CI runs may deploy."
              exit 1
            fi

            if [[ "$SOURCE_CONCLUSION" != "success" ]]; then
              echo "::error::The source CI run did not succeed."
              exit 1
            fi

            SHA="$WORKFLOW_RUN_SHA"
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual deployments must run from main."
              exit 1
            fi

            SHA="$MANUAL_SHA"
          fi

          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid deployment commit SHA."
            exit 1
          fi

          # Reject stale CI completions and stale manual targets.
          API_URL="https://api.github.com/repos/${CURRENT_REPOSITORY}/commits/main"

          RESPONSE="$(
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --url "$API_URL" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28"
          )"

          MAIN_SHA="$(jq -r '.sha // empty' <<< "$RESPONSE")"

          if [[ ! "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not determine the current main commit."
            exit 1
          fi

          if [[ "${SHA,,}" != "${MAIN_SHA,,}" ]]; then
            echo "::error::Deployment rejected: the verified commit is no longer the tip of main."
            echo "Verified commit: $SHA"
            echo "Current main:    $MAIN_SHA"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Verified deployment target: $SHA"

      - name: Confirm deployment eligibility
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment eligibility checks passed."
          echo "Only the verified current main commit may be deployed."

  deploy:
    name: Deploy verified commit to Render
    needs:
      - verify

    if: ${{ needs.verify.result == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 35

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.deployment_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json server.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );

          if (
            typeof pkg.name !== 'string' ||
            !pkg.name.trim() ||
            typeof pkg.version !== 'string' ||
            !pkg.version.trim()
          ) {
            throw new Error(
              'package.json must declare a non-empty name and version.'
            );
          }

          if (!lock.packages || !lock.packages['']) {
            throw new Error(
              'package-lock.json must contain its root package entry.'
            );
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          const root = lock.packages[''];

          if (pkg.name !== root.name || pkg.version !== root.version) {
            throw new Error(
              'package.json and package-lock.json root metadata do not match.'
            );
          }

          console.log(`Validated ${pkg.name}@${pkg.version}`);
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          console.log(
            `Node.js requirement: ${pkg.engines?.node || 'not specified'}`
          );
          NODE

      - name: Verify production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        env:
          CI: "true"

      - name: Check server syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js

      - name: Validate Render configuration
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::Missing RENDER_API_KEY in the production environment."
            exit 1
          fi

          if [[ ! "${RENDER_SERVICE_ID:-}" =~ ^srv-[A-Za-z0-9]+$ ]]; then
            echo "::error::RENDER_SERVICE_ID is missing or invalid."
            exit 1
          fi

      - name: Trigger Render deployment for verified commit
        id: render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOYMENT_SHA: ${{ needs.verify.outputs.deployment_sha }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          REQUEST_BODY="$(
            jq -n \
              --arg commitId "$DEPLOYMENT_SHA" \
              '{
                commitId: $commitId,
                clearCache: "do_not_clear",
                deployMode: "build_and_deploy"
              }'
          )"

          HTTP_STATUS="$(
            curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --request POST \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$REQUEST_BODY"
          )"

          if [[ "$HTTP_STATUS" != "201" ]]; then
            echo "::error::Render rejected the deployment request (HTTP $HTTP_STATUS)."
            jq -c '{message, error, errors}' "$RESPONSE_FILE" 2>/dev/null || true
            exit 1
          fi

          DEPLOY_ID="$(jq -r '.id // empty' "$RESPONSE_FILE")"
          RETURNED_SHA="$(jq -r '.commit.id // empty' "$RESPONSE_FILE")"

          if [[ -z "$DEPLOY_ID" ]]; then
            echo "::error::Render did not return a deployment ID."
            exit 1
          fi

          if [[ "${RETURNED_SHA,,}" != "${DEPLOYMENT_SHA,,}" ]]; then
            echo "::error::Render returned a different deployment commit."
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Render accepted deployment $DEPLOY_ID for $DEPLOYMENT_SHA"

      - name: Wait for Render deployment
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          DEPLOYMENT_SHA: ${{ needs.verify.outputs.deployment_sha }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=15

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            RESPONSE="$(
              curl --fail --silent --show-error \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "Accept: application/json"
            )" || {
              echo "::error::Could not retrieve Render deployment status."
              exit 1
            }

            STATUS="$(jq -r '.status // "unknown"' <<< "$RESPONSE")"
            RETURNED_SHA="$(jq -r '.commit.id // empty' <<< "$RESPONSE")"

            if [[ "${RETURNED_SHA,,}" != "${DEPLOYMENT_SHA,,}" ]]; then
              echo "::error::Render reports a different deployment commit."
              exit 1
            fi

            echo "Render status: $STATUS (attempt $attempt/$MAX_ATTEMPTS)"

            case "$STATUS" in
              live)
                echo "Render reports the deployment is live."
                exit 0
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "::error::Render deployment ended with status: $STATUS"
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep "$SLEEP_SECONDS"
                ;;
              *)
                echo "::error::Unexpected Render deployment status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment did not reach live status within the polling window."
          exit 1

      - name: Check production health endpoint
        if: ${{ success() }}
        shell: bash
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${PRODUCTION_HEALTH_URL:-}" ]]; then
            echo "::notice::PRODUCTION_HEALTH_URL is not configured; HTTP health check skipped."
            exit 0
          fi

          # Only permit HTTPS health endpoints.
          if [[ ! "$PRODUCTION_HEALTH_URL" =~ ^https:// ]]; then
            echo "::error::PRODUCTION_HEALTH_URL must use HTTPS."
            exit 1
          fi

          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            HTTP_STATUS="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                --connect-timeout 10 \
                --max-time 20 \
                "$PRODUCTION_HEALTH_URL" || true
            )"

            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              echo "Production health endpoint returned HTTP $HTTP_STATUS."
              exit 0
            fi

            echo "Health check attempt $attempt/$MAX_ATTEMPTS returned HTTP ${HTTP_STATUS:-000}."

            if (( attempt < MAX_ATTEMPTS )); then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::Production health endpoint did not return a successful HTTP status."
          exit 1

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_SHA: ${{ needs.verify.outputs.deployment_sha }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          {
            echo "## MedOrbits Production Deployment"
            echo
            echo "- **Job status:** \`${JOB_STATUS}\`"
            echo "- **Commit:** \`${DEPLOYMENT_SHA:-unresolved}\`"
            echo "- **Render deployment ID:** \`${DEPLOY_ID:-not-created}\`"
          } >> "$GITHUB_STEP_SUMMARY"
