
# ==============================================================================
# MedOrbits -- Dependabot Review
# File: .github/workflows/dependabot-review.yml
# Release: 2.1.2
#
# Read-only metadata review.
# Never checks out or executes pull-request code.
# Never approves, merges, comments on, or modifies pull requests.
# ==============================================================================

name: Dependabot Review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]

  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open Dependabot pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review Dependabot Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      base_branch: ${{ steps.metadata.outputs.base_branch }}
      draft: ${{ steps.metadata.outputs.draft }}
      file_count: ${{ steps.files.outputs.file_count }}
      dependency_count: ${{ steps.files.outputs.dependency_count }}

    steps:
      - name: Resolve pull request number
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$EVENT_AUTHOR" != "dependabot[bot]" ]]; then
              echo "::error::Only Dependabot pull requests are accepted."
              exit 1
            fi
            number="$EVENT_PR_NUMBER"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            number="$INPUT_PR_NUMBER"
            if [[ ! "$number" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::A valid positive pull request number is required."
              exit 1
            fi
          else
            echo "::error::Unsupported workflow event."
            exit 1
          fi

          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

      - name: Verify pull request metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -Eeuo pipefail

          response="$RUNNER_TEMP/dependabot-pr.json"
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$response"

          author="$(jq -r '.user.login // ""' "$response")"
          state="$(jq -r '.state // ""' "$response")"
          merged="$(jq -r '.merged // false' "$response")"
          draft="$(jq -r '.draft // false' "$response")"
          base_branch="$(jq -r '.base.ref // ""' "$response")"
          base_repo="$(jq -r '.base.repo.full_name // ""' "$response")"
          head_sha="$(jq -r '.head.sha // ""' "$response")"

          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "::error::Pull request is not authored by Dependabot."
            exit 1
          fi

          if [[ "$state" != "open" || "$merged" == "true" ]]; then
            echo "::error::Pull request must be open and unmerged."
            exit 1
          fi

          if [[ "$base_branch" != "main" && "$base_branch" != "develop" ]]; then
            echo "::error::Unexpected target branch: $base_branch"
            exit 1
          fi

          if [[ "$base_repo" != "$REPOSITORY" ]]; then
            echo "::error::Pull request base repository does not match this repository."
            exit 1
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::Pull request head SHA is missing or invalid."
            exit 1
          fi

          {
            echo "base_branch=$base_branch"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Dependabot Pull Request Metadata"
            echo
            echo "- Pull request: #$PR_NUMBER"
            echo "- Author: $author"
            echo "- State: $state"
            echo "- Target branch: $base_branch"
            echo "- Draft: $draft"
            echo "- Head SHA: \`$head_sha\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retrieve changed-file metadata
        id: retrieve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -Eeuo pipefail

          response="$RUNNER_TEMP/dependabot-changed-files.json"

          gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$response"

          if [[ ! -s "$response" ]]; then
            echo "::error::GitHub returned an empty changed-file response."
            exit 1
          fi

          echo "response=$response" >> "$GITHUB_OUTPUT"

      - name: Validate and summarize changed files
        id: files
        shell: bash
        env:
          RESPONSE_FILE: ${{ steps.retrieve.outputs.response }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          source = pathlib.Path(os.environ["RESPONSE_FILE"])

          dependency_names = {
              "package.json", "package-lock.json", "npm-shrinkwrap.json",
              "yarn.lock", "pnpm-lock.yaml", "requirements.txt",
              "requirements-dev.txt", "pyproject.toml", "poetry.lock",
              "uv.lock", "pipfile", "pipfile.lock", "cargo.toml",
              "cargo.lock", "go.mod", "go.sum", "gemfile",
              "gemfile.lock", "composer.json", "composer.lock",
          }

          try:
              pages = json.loads(source.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid GitHub API JSON: {exc}")

          if not isinstance(pages, list):
              raise SystemExit("Unexpected GitHub API response.")

          records = []
          for page in pages:
              if not isinstance(page, list):
                  raise SystemExit("Unexpected changed-file page.")
              records.extend(page)

          if not records:
              raise SystemExit("No changed-file metadata was returned.")

          additions = 0
          deletions = 0
          dependency_count = 0
          rows = []

          for record in records:
              if not isinstance(record, dict):
                  raise SystemExit("Invalid changed-file record.")

              path = record.get("filename")
              status = record.get("status", "unknown")
              added = record.get("additions", 0)
              removed = record.get("deletions", 0)

              if not isinstance(path, str) or not path:
                  raise SystemExit("Changed-file record has no filename.")

              if not isinstance(status, str):
                  raise SystemExit(f"Invalid status for {path}")

              if (
                  not isinstance(added, int) or isinstance(added, bool)
                  or not isinstance(removed, int) or isinstance(removed, bool)
                  or added < 0 or removed < 0
              ):
                  raise SystemExit(f"Invalid line counts for {path}")

              category = (
                  "Dependency"
                  if path.rsplit("/", 1)[-1].lower() in dependency_names
                  else "Other"
              )

              if category == "Dependency":
                  dependency_count += 1

              additions += added
              deletions += removed

              # Prevent filenames from injecting Markdown table rows.
              safe_path = (
                  path.replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .replace("`", "\\`")
              )

              rows.append(
                  f"| {category} | `{safe_path}` | {status} "
                  f"| {added} | {removed} |"
              )

          summary = [
              "## Dependabot Change Review",
              "",
              "| Category | File | Status | Added | Deleted |",
              "|---|---|---|---:|---:|",
              *rows,
              "",
              "### Statistics",
              "",
              f"- Changed files: {len(records)}",
              f"- Dependency-related files: {dependency_count}",
              f"- Lines added: {additions}",
              f"- Lines deleted: {deletions}",
              "",
              "> This report classifies filenames and summarizes GitHub metadata. "
              "It does not establish that changes are safe or dependencies are "
              "free from vulnerabilities.",
              "",
          ]

          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as file:
              file.write("\n".join(summary))

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as file:
              file.write(f"file_count={len(records)}\n")
              file.write(f"dependency_count={dependency_count}\n")
              file.write(f"additions={additions}\n")
              file.write(f"deletions={deletions}\n")
          PY

      - name: Publish review outcome
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          JOB_RESULT: ${{ job.status }}
          BASE_BRANCH: ${{ steps.metadata.outputs.base_branch }}
          DRAFT_STATUS: ${{ steps.metadata.outputs.draft }}
          FILE_COUNT: ${{ steps.files.outputs.file_count }}
          DEPENDENCY_COUNT: ${{ steps.files.outputs.dependency_count }}
        run: |
          set -Eeuo pipefail

          {
            echo
            echo "### Review Outcome"
            echo
            echo "- Pull request: #${PR_NUMBER:-unavailable}"
            echo "- Target branch: ${BASE_BRANCH:-not verified}"
            echo "- Draft: ${DRAFT_STATUS:-unknown}"
            echo "- Workflow result: $JOB_RESULT"
            echo "- Changed files: ${FILE_COUNT:-not available}"
            echo "- Dependency-related files: ${DEPENDENCY_COUNT:-not available}"
            echo "- Pull request code executed: No"
            echo "- Repository checkout performed: No"
            echo "- Automated approval or merge: No"
            echo "- PR comments or repository modifications: No"
            echo
            echo "Review advisories, release notes, lockfile changes, and required CI checks before merging."
          } >> "$GITHUB_STEP_SUMMARY"
