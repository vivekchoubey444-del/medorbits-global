
name: MedOrbits - Validate Configuration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Validate YAML syntax and duplicate keys
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)

                  try:
                      duplicate = key in mapping
                  except TypeError as exc:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          "unhashable mapping key",
                          key_node.start_mark,
                      ) from exc

                  if duplicate:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"duplicate key {key!r}",
                          key_node.start_mark,
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=deep,
                  )

              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          try:
              result = subprocess.run(
                  ["git", "ls-files", "-z", "--", "*.yml", "*.yaml"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
          except (OSError, subprocess.CalledProcessError) as exc:
              print(f"ERROR: Cannot list tracked YAML files: {exc}", file=sys.stderr)
              sys.exit(2)

          files = sorted(
              Path(path.decode("utf-8"))
              for path in result.stdout.split(b"\0")
              if path
          )

          if not files:
              print("ERROR: No tracked YAML files found.", file=sys.stderr)
              sys.exit(1)

          failures = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as stream:
                      list(yaml.load_all(stream, Loader=UniqueKeyLoader))
                  print(f"PASS {path}")

              except (
                  OSError,
                  UnicodeError,
                  yaml.YAMLError,
                  ValueError,
              ) as exc:
                  failures.append((path, exc))
                  print(f"FAIL {path}: {exc}", file=sys.stderr)

          print()
          print(f"YAML files checked: {len(files)}")
          print(f"Failures: {len(failures)}")

          if failures:
              print("Correct the specific files listed above.", file=sys.stderr)
              sys.exit(1)

          print("All tracked YAML files passed syntax validation.")
          PY

      - name: Write validation summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "# MedOrbits YAML Validation"
            echo
            echo "- Result: ${RESULT}"
            echo "- Scope: YAML syntax and duplicate mapping keys"
            echo "- Files: tracked .yml and .yaml files"
            echo "- npm installation: not required"
          } >> "$GITHUB_STEP_SUMMARY"
