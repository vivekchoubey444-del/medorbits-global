
name: Validate Configuration

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "pyproject.toml"
      - "renovate.json"
      - ".github/workflows/validate-config.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "pyproject.toml"
      - "renovate.json"
      - ".github/workflows/validate-config.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-config-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    name: Validate JSON and JSONC
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate JSON and JSONC files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"Duplicate object key: {key!r}")
                  result[key] = value
              return result

          def remove_jsonc_comments(source):
              """Remove comments while preserving strings and line positions."""
              result = []
              i = 0
              in_string = False
              escaped = False

              while i < len(source):
                  char = source[i]

                  if in_string:
                      result.append(char)

                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False

                      i += 1
                      continue

                  if char == '"':
                      in_string = True
                      result.append(char)
                      i += 1
                      continue

                  if source.startswith("//", i):
                      result.extend("  ")
                      i += 2

                      while i < len(source) and source[i] not in "\r\n":
                          result.append(" ")
                          i += 1

                      continue

                  if source.startswith("/*", i):
                      result.extend("  ")
                      i += 2
                      closed = False

                      while i < len(source):
                          if source.startswith("*/", i):
                              result.extend("  ")
                              i += 2
                              closed = True
                              break

                          char = source[i]
                          result.append(char if char in "\r\n" else " ")
                          i += 1

                      if not closed:
                          raise ValueError("Unterminated block comment.")

                      continue

                  result.append(char)
                  i += 1

              return "".join(result)

          def remove_trailing_commas(source):
              """Remove commas before closing braces/brackets outside strings."""
              result = []
              i = 0
              in_string = False
              escaped = False

              while i < len(source):
                  char = source[i]

                  if in_string:
                      result.append(char)

                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False

                      i += 1
                      continue

                  if char == '"':
                      in_string = True
                      result.append(char)
                      i += 1
                      continue

                  if char == ",":
                      lookahead = i + 1

                      while (
                          lookahead < len(source)
                          and source[lookahead].isspace()
                      ):
                          lookahead += 1

                      if (
                          lookahead < len(source)
                          and source[lookahead] in "}]"
                      ):
                          i += 1
                          continue

                  result.append(char)
                  i += 1

              return "".join(result)

          files = sorted(
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".json", ".jsonc"}
              and not any(part in EXCLUDED for part in path.parts)
          )

          errors = []

          for path in files:
              try:
                  source = path.read_text(encoding="utf-8-sig")

                  if path.suffix.lower() == ".jsonc":
                      source = remove_jsonc_comments(source)
                      source = remove_trailing_commas(source)

                  json.loads(
                      source,
                      object_pairs_hook=reject_duplicate_keys,
                      parse_constant=lambda value: (
                          (_ for _ in ()).throw(
                              ValueError(f"Invalid JSON constant: {value}")
                          )
                      ),
                  )

                  print(f"PASS {path}")

              except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as exc:
                  errors.append(path)
                  print(f"FAIL {path}: {exc}", file=sys.stderr)

          if errors:
              print(
                  f"JSON/JSONC validation failed for {len(errors)} file(s).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Validated {len(files)} JSON/JSONC file(s).")
          PY

  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install YAML validator
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Validate YAML files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import sys
          from pathlib import Path

          import yaml

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)

                  try:
                      duplicate = key in mapping
                  except TypeError as exc:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          "unhashable mapping key",
                          key_node.start_mark,
                      ) from exc

                  if duplicate:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"duplicate key {key!r}",
                          key_node.start_mark,
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=deep,
                  )

              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          files = sorted(
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".yaml", ".yml"}
              and not any(part in EXCLUDED for part in path.parts)
          )

          errors = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8-sig") as handle:
                      documents = list(
                          yaml.load_all(handle, Loader=UniqueKeyLoader)
                      )

                  print(f"PASS {path} ({len(documents)} document(s))")

              except (OSError, UnicodeError, yaml.YAMLError) as exc:
                  errors.append(path)
                  print(f"FAIL {path}: {exc}", file=sys.stderr)

          if errors:
              print(
                  f"YAML validation failed for {len(errors)} file(s).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Validated {len(files)} YAML file(s).")
          PY

  validate-toml:
    name: Validate TOML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate TOML files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          EXCLUDED = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted(
              path
              for path in Path(".").rglob("*.toml")
              if path.is_file()
              and not any(part in EXCLUDED for part in path.parts)
          )

          errors = []

          for path in files:
              try:
                  with path.open("rb") as handle:
                      tomllib.load(handle)

                  print(f"PASS {path}")

              except (OSError, tomllib.TOMLDecodeError) as exc:
                  errors.append(path)
                  print(f"FAIL {path}: {exc}", file=sys.stderr)

          if errors:
              print(
                  f"TOML validation failed for {len(errors)} file(s).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Validated {len(files)} TOML file(s).")
          PY

  validate-repository-config:
    name: Validate Repository Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate configuration files
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import sys
          from pathlib import Path

          errors = []

          def report_error(path, message):
              errors.append(f"{path}: {message}")
              print(f"FAIL {path}: {message}", file=sys.stderr)

          def validate_text_file(path):
              try:
                  data = path.read_bytes()
                  data.decode("utf-8-sig")
                  if b"\0" in data:
                      report_error(path, "NUL byte detected.")
                      return None
                  return data.decode("utf-8-sig")
              except (OSError, UnicodeError) as exc:
                  report_error(path, str(exc))
                  return None

          editorconfig = Path(".editorconfig")

          if editorconfig.exists():
              content = validate_text_file(editorconfig)

              if content is not None and not re.search(
                  r"(?m)^\s*root\s*=\s*(true|false)\s*$",
                  content,
              ):
                  report_error(
                      editorconfig,
                      "Expected an explicit root = true or root = false setting.",
                  )
              elif content is not None:
                  print("PASS .editorconfig encoding and root setting")

          nvmrc = Path(".nvmrc")

          if nvmrc.exists():
              content = validate_text_file(nvmrc)

              if content is not None:
                  version = content.strip()

                  if not version or "\n" in version or "\r" in version:
                      report_error(nvmrc, "Expected one Node.js version selector.")
                  elif not re.fullmatch(
                      r"(?:v?\d+(?:\.\d+(?:\.\d+)?)?|lts/[A-Za-z0-9._-]+|node|stable|"
                      r">=?\s*\d+(?:\.\d+)?(?:\s*<\s*\d+(?:\.\d+)?)?)",
                      version,
                  ):
                      report_error(nvmrc, "Unrecognized Node.js version selector.")
                  else:
                      print("PASS .nvmrc format")

          npmrc = Path(".npmrc")

          if npmrc.exists():
              content = validate_text_file(npmrc)

              if content is not None:
                  for number, line in enumerate(content.splitlines(), 1):
                      stripped = line.strip()

                      if not stripped or stripped.startswith(("#", ";")):
                          continue

                      if "=" not in stripped:
                          report_error(
                              npmrc,
                              f"Line {number}: expected a key=value setting.",
                          )
                          continue

                      key, value = stripped.split("=", 1)

                      if not key.strip():
                          report_error(
                              npmrc,
                              f"Line {number}: setting key cannot be empty.",
                          )

                      if "${" in value and not re.search(
                          r"\$\{(?:[A-Za-z_][A-Za-z0-9_]*|[A-Za-z_][A-Za-z0-9_]*\?)\}",
                          value,
                      ):
                          report_error(
                              npmrc,
                              f"Line {number}: review environment-variable syntax.",
                          )

                  print("Checked .npmrc basic syntax.")

          for filename in (".gitignore", ".gitattributes"):
              path = Path(filename)

              if path.exists():
                  content = validate_text_file(path)

                  if content is not None:
                      print(f"PASS {filename} UTF-8 text encoding")

          if errors:
              print(
                  f"\nRepository configuration errors: {len(errors)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Repository configuration checks completed.")
          PY

  validation-summary:
    name: Configuration Validation Summary
    if: always()
    needs:
      - validate-json
      - validate-yaml
      - validate-toml
      - validate-repository-config
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      contents: read

    steps:
      - name: Report validation result
        env:
          JSON_RESULT: ${{ needs.validate-json.result }}
          YAML_RESULT: ${{ needs.validate-yaml.result }}
          TOML_RESULT: ${{ needs.validate-toml.result }}
          REPO_RESULT: ${{ needs.validate-repository-config.result }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Configuration Validation"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| JSON / JSONC | $JSON_RESULT |"
            echo "| YAML | $YAML_RESULT |"
            echo "| TOML | $TOML_RESULT |"
            echo "| Repository configuration | $REPO_RESULT |"
            echo
            echo "- Repository write access: disabled"
            echo "- Automatic file modifications: disabled"
            echo "- Automatic commits: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$JSON_RESULT" \
            "$YAML_RESULT" \
            "$TOML_RESULT" \
            "$REPO_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::One or more configuration validation jobs did not succeed."
              exit 1
            fi
          done

          echo "All configuration validation jobs passed."
