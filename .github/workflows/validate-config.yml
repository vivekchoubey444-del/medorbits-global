name: Validate Configuration
on:
  push:
    branches:
      - main
    paths:
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "package.json"
      - ".github/workflows/validate-config.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "package.json"
      - ".github/workflows/validate-config.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate configuration files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML validator
        run: python -m pip install yamllint
      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if node -e '
              const fs = require("node:fs");
              JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            ' "$file"; then
              echo "PASS: $file"
            else
              echo "::error file=$file::Invalid JSON syntax."
              failed=1
            fi
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f -name '*.json' -print0
          )
          echo "Validated $count JSON file(s)."
          exit "$failed"
      - name: Validate YAML syntax and style
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' yaml_files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f \( -name '*.yml' -o -name '*.yaml' \) -print0
          )
          if [[ "${#yaml_files[@]}" -eq 0 ]]; then
            echo "No YAML files found."
            exit 0
          fi
          yamllint \
            --no-warnings \
            --strict \
            -d "{extends: relaxed, rules: {line-length: disable, truthy: {allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']}}}" \
            "${yaml_files[@]}"
      - name: Validate package.json metadata
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (typeof pkg !== "object" || pkg === null || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }
          if (pkg.name !== undefined && typeof pkg.name !== "string") {
            throw new Error("package.json name must be a string.");
          }
          if (pkg.version !== undefined && typeof pkg.version !== "string") {
            throw new Error("package.json version must be a string.");
          }
          if (pkg.scripts !== undefined &&
              (typeof pkg.scripts !== "object" ||
               pkg.scripts === null ||
               Array.isArray(pkg.scripts))) {
            throw new Error("package.json scripts must be an object.");
          }
          console.log("package.json metadata checks passed.");
          NODE