
name: Validate Configuration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Validate YAML syntax and duplicate keys
        shell: bash
        run: |
          set -uo pipefail

          python <<'PY'
          import sys
          from pathlib import Path
          import yaml

          EXCLUDED = {
              ".git",
              "node_modules",
              ".venv",
              "venv",
              "vendor",
              "__pycache__",
              ".next",
              ".nuxt",
              "dist",
              "build",
              "coverage"
          }

          class UniqueKeyLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)

                  try:
                      duplicate = key in mapping
                  except TypeError:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          "unhashable mapping key",
                          key_node.start_mark
                      )

                  if duplicate:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"duplicate key {key!r}",
                          key_node.start_mark
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=deep
                  )

              return mapping

          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping
          )

          files = sorted(
              path for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".yml", ".yaml"}
              and not any(part in EXCLUDED for part in path.parts)
          )

          if not files:
              print("No YAML files found.", file=sys.stderr)
              sys.exit(1)

          failures = []

          for path in files:
              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as stream:
                      list(yaml.load_all(
                          stream,
                          Loader=UniqueKeyLoader
                      ))

                  print(f"PASS {path}")

              except (
                  OSError,
                  UnicodeError,
                  yaml.YAMLError,
                  ValueError
              ) as exc:
                  failures.append((path, exc))
                  print(f"FAIL {path}: {exc}", file=sys.stderr)

          print()
          print(f"YAML files checked: {len(files)}")
          print(f"Failures: {len(failures)}")

          if failures:
              print(
                  "\nCorrect the specific files listed above.",
                  file=sys.stderr
              )
              sys.exit(1)

          print("All YAML files passed validation.")
          PY

      - name: Write validation summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "# YAML Validation"
            echo
            echo "- Result: ${RESULT}"
            echo "- Scope: YAML syntax and duplicate mapping keys"
            echo "- npm installation is not required for this job"
          } >> "$GITHUB_STEP_SUMMARY"
