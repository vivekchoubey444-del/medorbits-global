
# ==============================================================================
# MedOrbits -- Documentation Validation
# File: .github/workflows/validate-documents.yml
# Release: 3.0.0
#
# Purpose:
#   Validate tracked Markdown, TXT, and RST documentation.
#
# Checks:
#   - UTF-8 readability and non-empty content
#   - Relative Markdown links and reference links
#   - Missing local link targets
#   - Trailing whitespace warnings
#
# Security:
#   - Read-only repository permissions
#   - No document modifications
#   - No third-party dependencies
# ==============================================================================

name: Validate Documents

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - ".github/workflows/validate-documents.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - ".github/workflows/validate-documents.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-documents-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Validate tracked documents
        id: document-validation
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          EXCLUDED = {
              ".git",
              "node_modules",
              "vendor",
              "dist",
              "build",
              "coverage",
              ".venv",
              "venv",
              "__pycache__",
          }

          EXTENSIONS = {".md", ".txt", ".rst"}

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          )

          tracked = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          documents = [
              path for path in tracked
              if path.suffix.lower() in EXTENSIONS
              and not any(part in EXCLUDED for part in path.parts)
          ]

          failures = []
          warnings = []
          checked = 0
          links_checked = 0

          markdown_link = re.compile(
              r"!?\[[^\]]*\]\("
              r"(?:<([^>\n]+)>|([^\s)]+))"
              r"(?:\s+(?:\"[^\"]*\"|'[^']*'|\([^)]*\)))?"
              r"\)"
          )

          reference_definition = re.compile(
              r"^\s{0,3}\[[^\]]+\]:\s*"
              r"(?:<([^>\n]+)>|(\S+))",
              re.MULTILINE,
          )

          inline_code = re.compile(r"(`+).*?\1")
          html_comment = re.compile(r"<!--.*?-->", re.DOTALL)
          fenced_code = re.compile(
              r"^[ \t]{0,3}(`{3,}|~{3,}).*?"
              r"^[ \t]{0,3}\1[ \t]*$",
              re.MULTILINE | re.DOTALL,
          )

          def annotation_path(path):
              return (
                  path.as_posix()
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          def is_external_url(url):
              parsed = urlsplit(url)
              return parsed.scheme.lower() in {
                  "http", "https", "mailto", "tel", "ftp", "data"
              } or bool(parsed.netloc)

          def check_local_target(source, url):
              parsed = urlsplit(url)

              if parsed.scheme or parsed.netloc:
                  return None

              target_text = unquote(parsed.path)

              if not target_text:
                  # A fragment-only link points within the current document.
                  return None

              # Root-relative links are repository-root-relative here.
              if target_text.startswith("/"):
                  destination = Path(target_text.lstrip("/"))
              else:
                  destination = source.parent / target_text

              # Resolve filesystem paths without requiring the target to exist.
              destination = Path(os.path.normpath(str(destination)))

              if not destination.exists():
                  return f"Local link target does not exist: {url}"

              return None

          for path in documents:
              filename = path.as_posix()

              if not path.is_file():
                  # Deleted files can remain in Git's index during a PR.
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError) as error:
                  failures.append((filename, f"Cannot read as UTF-8: {error}"))
                  continue

              checked += 1

              if not content.strip():
                  failures.append((filename, "Document is empty."))
                  continue

              # Check trailing whitespace without flagging lines inside code
              # fences or HTML comments.
              lines = content.splitlines()
              in_fence = False
              fence_char = None
              fence_length = 0

              for number, line in enumerate(lines, start=1):
                  fence_match = re.match(
                      r"^[ \t]{0,3}(`{3,}|~{3,})",
                      line,
                  )

                  if fence_match:
                      marker = fence_match.group(1)

                      if not in_fence:
                          in_fence = True
                          fence_char = marker[0]
                          fence_length = len(marker)
                          continue

                      if (
                          marker[0] == fence_char
                          and len(marker) >= fence_length
                      ):
                          in_fence = False
                          fence_char = None
                          fence_length = 0
                          continue

                  if in_fence:
                      continue

                  if line.rstrip() != line:
                      warnings.append(
                          (filename, number, "Trailing whitespace detected.")
                      )

              # Markdown link checks apply to Markdown files only.
              # TXT and RST use different link conventions.
              if path.suffix.lower() != ".md":
                  continue

              # Remove comments, fenced code blocks, and inline code before
              # scanning to reduce false positives.
              scan_content = html_comment.sub("", content)
              scan_content = fenced_code.sub("", scan_content)
              scan_content = inline_code.sub("", scan_content)

              links = []

              for match in markdown_link.finditer(scan_content):
                  links.append(match.group(1) or match.group(2))

              for match in reference_definition.finditer(scan_content):
                  links.append(match.group(1) or match.group(2))

              for link in links:
                  if not link:
                      continue

                  link = link.strip()

                  if is_external_url(link) or link.startswith("#"):
                      continue

                  # Ignore template expressions and other non-file targets
                  # rather than incorrectly treating them as filesystem paths.
                  if "{{" in link or "}}" in link:
                      continue

                  links_checked += 1

                  error = check_local_target(path, link)

                  if error:
                      failures.append((filename, error))

              # Also validate local image paths found in Markdown.
              # Images are already included in the inline link pattern.

          for filename, number, message in warnings:
              print(
                  f"::warning file={annotation_path(Path(filename))},"
                  f"line={number}::{message}"
              )

          for filename, message in failures:
              print(
                  f"::error file={annotation_path(Path(filename))}::"
                  f"{message.replace(chr(10), ' ')}"
              )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Documentation Validation Results\n\n")
                  summary.write(f"- Documents checked: {checked}\n")
                  summary.write(f"- Local Markdown links checked: {links_checked}\n")
                  summary.write(f"- Warnings: {len(warnings)}\n")
                  summary.write(f"- Errors: {len(failures)}\n\n")

                  if failures:
                      summary.write("### Errors\n\n")
                      for filename, message in failures:
                          summary.write(f"- `{filename}`: {message}\n")

                  if warnings:
                      summary.write("### Warnings\n\n")
                      for filename, number, message in warnings:
                          summary.write(
                              f"- `{filename}:{number}`: {message}\n"
                          )

          print(f"Documents checked: {checked}")
          print(f"Markdown links checked: {links_checked}")
          print(f"Warnings: {len(warnings)}")
          print(f"Errors: {len(failures)}")

          if failures:
              sys.exit(1)

          print("Documentation validation passed.")
          PY

      - name: Write final validation summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo
            echo "### Workflow Status"
            echo
            echo "- Result: ${STATUS:-unknown}"
            echo "- Document types: Markdown, TXT, RST"
            echo "- Repository writes: disabled"
            echo "- Automatic formatting: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
