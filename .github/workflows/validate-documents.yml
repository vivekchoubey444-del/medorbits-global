
# ==============================================================================
# MedOrbits -- Documentation Validation
# File: .github/workflows/validate-documents.yml
# Release target: 2.0.0
#
# Purpose:
#   Validate Markdown documentation and detect common documentation issues.
#
# Policy:
#   - Read-only repository access.
#   - No automatic merging or deployment.
#   - Skip gracefully when no Markdown files exist.
#   - Fail on detected broken local links or invalid document formatting.
# ==============================================================================

name: Validate Documents

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".github/workflows/validate-documents.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".github/workflows/validate-documents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-documents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-documents:
    name: Validate Markdown documents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Discover Markdown files
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.venv' -prune -o \
              -path './vendor' -prune -o \
              -type f \( -iname '*.md' -o -iname '*.markdown' \) \
              -print0
          )

          printf 'count=%s\n' "${#files[@]}" >> "$GITHUB_OUTPUT"

          if ((${#files[@]} == 0)); then
            echo "No Markdown documents found. Validation will be skipped."
          else
            printf 'Discovered %s Markdown document(s).\n' "${#files[@]}"
          fi

      - name: Check trailing whitespace
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.venv' -prune -o \
              -path './vendor' -prune -o \
              -type f \( -iname '*.md' -o -iname '*.markdown' \) \
              -print0
          )

          failed=0

          for file in "${files[@]}"; do
            if LC_ALL=C grep -nE '[[:blank:]]+$' "$file"; then
              printf '::error file=%s::Trailing whitespace detected.\n' "$file"
              failed=1
            else
              status=$?
              if ((status > 1)); then
                printf '::error file=%s::Could not read document.\n' "$file"
                failed=1
              else
                printf '[PASS] Whitespace: %s\n' "$file"
              fi
            fi
          done

          if ((failed != 0)); then
            echo "::error::Whitespace validation failed."
            exit 1
          fi

      - name: Check local Markdown links
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()
          excluded = {".git", "node_modules", ".venv", "vendor"}
          documents = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if excluded.intersection(path.relative_to(root).parts):
                  continue
              if path.suffix.lower() in {".md", ".markdown"}:
                  documents.append(path)

          if not documents:
              print("No Markdown documents found; link check skipped.")
              sys.exit(0)

          # Check ordinary Markdown links and inline HTML href attributes.
          markdown_link = re.compile(r'(?<!!)\[[^\]]*\]\((?:<([^>]+)>|([^\s)]+))(?:\s+[^)]*)?\)')
          html_link = re.compile(r'''href\s*=\s*["']([^"']+)["']''', re.IGNORECASE)

          errors = []

          for document in documents:
              try:
                  content = document.read_text(encoding="utf-8")
              except (OSError, UnicodeError) as exc:
                  errors.append(f"{document.relative_to(root)}: cannot read document: {exc}")
                  continue

              # Remove fenced code blocks to reduce false positives.
              content = re.sub(
                  r"(?ms)^[ \t]*(```+|~~~+).*?^[ \t]*\1[ \t]*$",
                  "",
                  content,
              )

              links = []
              for match in markdown_link.finditer(content):
                  links.append(match.group(1) or match.group(2))
              links.extend(html_link.findall(content))

              for link in links:
                  link = link.strip()
                  if not link or link.startswith("#"):
                      continue

                  parsed = urlsplit(link)

                  # External URLs, mail links, and other URI schemes are not
                  # checked by this local filesystem validator.
                  if parsed.scheme or parsed.netloc:
                      continue

                  target_text = unquote(parsed.path)
                  if not target_text:
                      continue

                  target = (document.parent / target_text).resolve()

                  # Do not allow a link to escape the checked repository.
                  try:
                      target.relative_to(root)
                  except ValueError:
                      errors.append(
                          f"{document.relative_to(root)}: local link escapes repository: {link}"
                      )
                      continue

                  if not target.exists():
                      errors.append(
                          f"{document.relative_to(root)}: broken local link: {link}"
                      )

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print(f"Checked local links in {len(documents)} Markdown document(s).")
          print("No broken local file links found.")
          PY

      - name: Report validation result
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          DOCUMENT_COUNT: ${{ steps.discover.outputs.count }}
        run: |
          set -Eeuo pipefail

          printf 'Validation status: %s\n' "${VALIDATION_STATUS:-unknown}"
          printf 'Markdown documents discovered: %s\n' "${DOCUMENT_COUNT:-unknown}"
