name: Validate Documents
on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".github/workflows/validate-documents.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - ".github/workflows/validate-documents.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-documents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-documents:
    name: Validate repository documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover documentation files
        shell: bash
        run: |
          set -euo pipefail
          count="$(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f \( -name '*.md' -o -name '*.mdx' \) -print \
              | wc -l
          )"
          echo "Found $count Markdown documentation file(s)."
      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            ".github/README.md"
            ".github/scripts/README.md"
            ".github/workflows/README.md"
          )
          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "PASS: $file"
            else
              echo "::warning file=$file::Recommended documentation file is missing."
            fi
          done
      - name: Check for merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if grep -nE '^(<<<<<<< |=======|>>>>>>> )' "$file"; then
              echo "::error file=$file::Possible merge-conflict markers found."
              failed=1
            fi
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f \( -name '*.md' -o -name '*.mdx' \) -print0
          )
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "No standard merge-conflict markers found."
      - name: Validate relative Markdown links
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");
          const files = execFileSync("git", ["ls-files", "-z"], {
            encoding: "utf8"
          }).split("\0").filter(Boolean);
          const docs = files.filter(file => /\.(md|mdx)$/i.test(file));
          const errors = [];
          function removeCode(text) {
            return text
              .replace(/```[\s\S]*?```/g, "")
              .replace(/~~~[\s\S]*?~~~/g, "")
              .replace(/`[^`\n]*`/g, "");
          }
          function extractLinks(text) {
            const links = [];
            const pattern = /!?\[[^\]]*\]\(\s*(?:<([^>]+)>|([^\s)]+))(?:\s+["'][^)]*["'])?\s*\)/g;
            for (const match of text.matchAll(pattern)) {
              const target = match[1] || match[2];
              if (target) links.push(target);
            }
            const anglePattern = /<((?:\.{1,2}\/)[^ >]+)>/g;
            for (const match of text.matchAll(anglePattern)) {
              links.push(match[1]);
            }
            return links;
          }
          function targetExists(sourceFile, target) {
            if (
              !target ||
              target.startsWith("#") ||
              /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(target)
            ) {
              return true;
            }
            const clean = target.split("#")[0].split("?")[0];
            if (!clean) return true;
            let decoded;
            try {
              decoded = decodeURIComponent(clean);
            } catch {
              return false;
            }
            const absolute = path.resolve(path.dirname(sourceFile), decoded);
            return fs.existsSync(absolute);
          }
          for (const file of docs) {
            const content = removeCode(fs.readFileSync(file, "utf8"));
            for (const target of extractLinks(content)) {
              if (!targetExists(file, target)) {
                errors.push(
                  `${file}: missing relative link target "${target}"`
                );
              }
            }
          }
          if (errors.length) {
            for (const error of errors) {
              console.error(`::error::${error}`);
            }
            process.exit(1);
          }
          console.log(
            `Checked relative links in ${docs.length} tracked documentation file(s).`
          );
          NODE
      - name: Check for empty documentation files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Documentation file is empty."
              failed=1
            fi
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.agent-backup' -prune -o \
              -type f \( -name '*.md' -o -name '*.mdx' \) -print0
          )
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "No empty documentation files found."