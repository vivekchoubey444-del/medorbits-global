
# ==============================================================================
# MedOrbits -- Documentation Validation
# File: .github/workflows/validate-documents.yml
# Release target: 2.0.0
#
# Purpose:
#   Validate Markdown documentation and detect common documentation issues.
#
# Policy:
#   - Read-only repository access.
#   - No automatic merging or deployment.
#   - Skip gracefully when no Markdown files exist.
#   - Fail on detected broken local links or invalid document formatting.
# ==============================================================================

name: Validate Documents

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".github/workflows/validate-documents.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - ".github/workflows/validate-documents.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-documents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-documents:
    name: Validate Markdown documents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Discover Markdown files
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import os
          from pathlib import Path

          root = Path(".")
          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted(
              path for path in root.rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".md", ".markdown"}
              and not any(part in excluded for part in path.parts)
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={len(files)}\n")

          print(f"Discovered {len(files)} Markdown document(s).")

          for path in files:
              print(f" - {path.as_posix()}")
          PY

      - name: Check Markdown encoding and trailing whitespace
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import os
          import sys
          from pathlib import Path

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          files = sorted(
              path for path in Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in {".md", ".markdown"}
              and not any(part in excluded for part in path.parts)
          )

          errors = []

          for path in files:
              try:
                  content = path.read_bytes()

                  if b"\0" in content:
                      errors.append(f"{path}: NUL byte detected.")
                      continue

                  text = content.decode("utf-8-sig")

                  for line_number, line in enumerate(
                      text.splitlines(), start=1
                  ):
                      if line.rstrip(" \t") != line:
                          errors.append(
                              f"{path}:{line_number}: trailing whitespace."
                          )

                  print(f"PASS {path}")

              except (OSError, UnicodeError) as exc:
                  errors.append(f"{path}: cannot read UTF-8 document: {exc}")

          if errors:
              for error in errors:
                  print(f"::error::{error}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated encoding and whitespace in {len(files)} document(s).")
          PY

      - name: Check local Markdown links and anchors
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()

          excluded = {
              ".git", "node_modules", ".venv", "venv",
              "vendor", "dist", "build", "coverage",
          }

          markdown_extensions = {".md", ".markdown"}

          documents = sorted(
              path for path in root.rglob("*")
              if path.is_file()
              and path.suffix.lower() in markdown_extensions
              and not excluded.intersection(path.relative_to(root).parts)
          )

          if not documents:
              print("No Markdown documents found; link validation skipped.")
              sys.exit(0)

          errors = []

          # CommonMark-style inline links and images.
          inline_link = re.compile(
              r'(?<!!)\[[^\]]*\]\(\s*(?:<([^>]+)>|([^\s)]+))'
          )

          image_link = re.compile(
              r'!\[[^\]]*\]\(\s*(?:<([^>]+)>|([^\s)]+))'
          )

          html_link = re.compile(
              r'''(?is)\b(?:href|src)\s*=\s*["']([^"']+)["']'''
          )

          reference_definition = re.compile(
              r'(?m)^[ \t]{0,3}\[([^\]]+)\]:[ \t]*<?(\S+?)>?(?:[ \t]+.*)?$'
          )

          reference_use = re.compile(
              r'(?<!!)\[([^\]]+)\](?:\[([^\]]*)\])?'
          )

          heading_pattern = re.compile(
              r"(?m)^[ \t]{0,3}(#{1,6})[ \t]+(.+?)"
              r"[ \t]*#*[ \t]*$"
          )

          def strip_code(content):
              # Remove fenced code blocks before inspecting Markdown syntax.
              content = re.sub(
                  r"(?ms)^[ \t]{0,3}(`{3,}|~{3,})[^\n]*\n.*?"
                  r"^[ \t]{0,3}\1[ \t]*$",
                  "",
                  content,
              )

              # Remove inline code spans.
              content = re.sub(r"(`+).*?\1", "", content)

              return content

          def normalize_label(label):
              return " ".join(label.strip().casefold().split())

          def slugify_heading(text):
              text = re.sub(r"<[^>]*>", "", text)
              text = re.sub(r"`([^`]*)`", r"\1", text)
              text = re.sub(r"\*\*(.*?)\*\*|__(.*?)__", r"\1\2", text)
              text = re.sub(r"\*(.*?)\*|_(.*?)_", r"\1\2", text)
              text = re.sub(r"~~(.*?)~~", r"\1", text)
              text = re.sub(r"!\[([^\]]*)\]\([^)]*\)", r"\1", text)
              text = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", text)
              text = text.casefold()
              text = re.sub(r"[^\w\- ]", "", text, flags=re.UNICODE)
              text = re.sub(r"\s+", "-", text.strip())
              return text

          contents = {}
          headings = {}
          reference_definitions = {}
          all_anchors = {}

          for document in documents:
              try:
                  raw = document.read_text(encoding="utf-8-sig")
              except (OSError, UnicodeError) as exc:
                  errors.append(
                      f"{document.relative_to(root)}: cannot read document: {exc}"
                  )
                  continue

              cleaned = strip_code(raw)
              contents[document] = cleaned

              slug_counts = {}
              anchors = set()

              for match in heading_pattern.finditer(cleaned):
                  slug = slugify_heading(match.group(2))
                  count = slug_counts.get(slug, 0)
                  slug_counts[slug] = count + 1

                  anchors.add(slug if count == 0 else f"{slug}-{count}")

              # Explicit HTML anchors and IDs.
              for match in re.finditer(
                  r'''(?is)\bid\s*=\s*["']([^"']+)["']''',
                  cleaned,
              ):
                  anchors.add(match.group(1))

              for match in re.finditer(
                  r'''(?is)<a\b[^>]*\bname\s*=\s*["']([^"']+)["']''',
                  cleaned,
              ):
                  anchors.add(match.group(1))

              headings[document] = anchors
              all_anchors[document] = anchors

              definitions = {}

              for match in reference_definition.finditer(cleaned):
                  label = normalize_label(match.group(1))
                  target = match.group(2)

                  if label in definitions:
                      errors.append(
                          f"{document.relative_to(root)}: duplicate reference "
                          f"definition [{label}]."
                      )
                  else:
                      definitions[label] = target

              reference_definitions[document] = definitions

          def check_link(document, link, line_number):
              link = link.strip()

              if not link or link.startswith("#"):
                  if link.startswith("#"):
                      fragment = unquote(link[1:])

                      if fragment and fragment not in all_anchors.get(
                          document, set()
                      ):
                          errors.append(
                              f"{document.relative_to(root)}:{line_number}: "
                              f"missing local anchor: {link}"
                          )
                  return

              parsed = urlsplit(link)

              # External links and non-file URI schemes are not checked here.
              if parsed.scheme or parsed.netloc:
                  return

              target_path = unquote(parsed.path)
              fragment = unquote(parsed.fragment)

              if target_path:
                  target = (document.parent / target_path).resolve()

                  try:
                      target.relative_to(root)
                  except ValueError:
                      errors.append(
                          f"{document.relative_to(root)}:{line_number}: "
                          f"local link escapes repository: {link}"
                      )
                      return

                  if not target.exists():
                      errors.append(
                          f"{document.relative_to(root)}:{line_number}: "
                          f"broken local link: {link}"
                      )
                      return
              else:
                  target = document

              if fragment and target.is_file() and target.suffix.lower() in markdown_extensions:
                  anchors = all_anchors.get(target)

                  if anchors is None:
                      try:
                          text = target.read_text(encoding="utf-8-sig")
                      except (OSError, UnicodeError):
                          return

                      cleaned = strip_code(text)
                      anchors = set()

                      for match in heading_pattern.finditer(cleaned):
                          anchors.add(slugify_heading(match.group(2)))

                      for match in re.finditer(
                          r'''(?is)\bid\s*=\s*["']([^"']+)["']''',
                          cleaned,
                      ):
                          anchors.add(match.group(1))

                  if fragment not in anchors:
                      errors.append(
                          f"{document.relative_to(root)}:{line_number}: "
                          f"missing anchor #{fragment} in {target.relative_to(root)}"
                      )

          for document, content in contents.items():
              definitions = reference_definitions[document]

              # Mask reference definition lines so they are not treated
              # as ordinary inline links.
              inline_content = reference_definition.sub("", content)

              links = []

              for match in inline_link.finditer(inline_content):
                  links.append(
                      (match.group(1) or match.group(2), match.start())
                  )

              for match in image_link.finditer(inline_content):
                  links.append(
                      (match.group(1) or match.group(2), match.start())
                  )

              for match in html_link.finditer(inline_content):
                  links.append((match.group(1), match.start()))

              for label, match in [
                  (match.group(1), match)
                  for match in reference_use.finditer(inline_content)
              ]:
                  normalized = normalize_label(
                      match.group(2) or label
                  )

                  if normalized in definitions:
                      links.append(
                          (definitions[normalized], match.start())
                      )
                  elif normalize_label(label) not in definitions:
                      # Avoid treating ordinary bracketed prose as a link.
                      continue

              for link, position in links:
                  line_number = inline_content.count("\n", 0, position) + 1
                  check_link(document, link, line_number)

          if errors:
              for error in errors:
                  safe_error = (
                      error.replace("%", "%25")
                      .replace("\r", "%0D")
                      .replace("\n", "%0A")
                  )
                  print(f"::error::{safe_error}")

              print(
                  f"Documentation validation failed with {len(errors)} issue(s).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Checked local links in {len(documents)} Markdown document(s).")
          print("No broken local file links or detected anchor references.")
          PY

      - name: Report validation result
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          DOCUMENT_COUNT: ${{ steps.discover.outputs.count }}
        run: |
          set -Eeuo pipefail

          {
            echo "## Documentation Validation"
            echo
            echo "- Result: ${VALIDATION_STATUS:-unknown}"
            echo "- Markdown documents: ${DOCUMENT_COUNT:-unknown}"
            echo "- Repository write access: disabled"
            echo "- Automatic file modifications: disabled"
            echo "- Automatic merging and deployment: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Validation status: %s\n' "${VALIDATION_STATUS:-unknown}"
          printf 'Markdown documents discovered: %s\n' "${DOCUMENT_COUNT:-unknown}"
