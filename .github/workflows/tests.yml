
name: MedOrbits Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-integration-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json server.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          for directory in scripts tests src; do
            if [[ ! -d "$directory" ]]; then
              echo "::notice::Optional directory not found: $directory"
            fi
          done

          node --version
          npm --version

      - name: Validate package metadata and required scripts
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          if (!pkg.name) {
            throw new Error("package.json must define a package name.");
          }

          if (!lock.packages || !lock.packages[""]) {
            throw new Error(
              "package-lock.json is missing its root package entry."
            );
          }

          const root = lock.packages[""];

          if (pkg.name !== root.name) {
            throw new Error(
              "package.json and package-lock.json names do not match."
            );
          }

          if (
            pkg.version &&
            root.version &&
            pkg.version !== root.version
          ) {
            throw new Error(
              "package.json and package-lock.json versions do not match."
            );
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          const requiredScripts = [
            "start",
            "test",
            "check:json",
            "check:data",
            "lint",
            "format:check",
            "test:ci"
          ];

          const missing = requiredScripts.filter(
            (name) => typeof pkg.scripts?.[name] !== "string"
          );

          if (missing.length) {
            throw new Error(
              `Missing npm scripts: ${missing.join(", ")}`
            );
          }

          console.log(
            `Validated ${pkg.name}@${pkg.version || "unversioned"}`
          );
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          CI: "true"

      - name: Validate JSON files
        run: npm run check:json

      - name: Validate application data
        run: npm run check:data

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check server.js

          count=0

          for directory in src scripts tests; do
            [[ -d "$directory" ]] || continue

            while IFS= read -r -d '' file; do
              echo "Checking syntax: $file"
              node --check "$file"
              count=$((count + 1))
            done < <(
              find "$directory" \
                -type f \
                \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
                -not -path '*/node_modules/*' \
                -print0
            )
          done

          echo "Checked $count additional JavaScript file(s)."

      - name: Check code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run unit and integration tests
        env:
          CI: "true"
          NODE_ENV: test
        run: npm run test:ci

      - name: Upload test coverage and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: medorbits-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/
            test-results/
            junit.xml
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
