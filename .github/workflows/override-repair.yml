
# ==============================================================================
# MedOrbits -- Repository Override and Repair
# File: .github/workflows/override-repair.yml
# Purpose: Repair known configuration issues and validate the repository.
# ==============================================================================

name: MedOrbits Override Repair

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to repair"
        required: true
        default: main
        type: string
      create_repair_branch:
        description: "Create and push a separate repair branch"
        required: true
        default: true
        type: boolean
      regenerate_lockfile:
        description: "Regenerate package-lock.json when package.json exists"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: medorbits-override-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Validate target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$TARGET_BRANCH" == *".."* ]] ||
             [[ "$TARGET_BRANCH" == -* ]] ||
             [[ "$TARGET_BRANCH" == */ ]] ||
             [[ "$TARGET_BRANCH" == *"//"* ]]; then
            echo "::error::Invalid target branch name."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Repair npm configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f .npmrc ]]; then
            python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".npmrc")
          original = path.read_text(encoding="utf-8")
          updated = re.sub(
              r"(?m)^[ \t]*omit[ \t]*=[ \t]*(?:\r?\n|$)",
              "",
              original,
          )

          if updated != original:
              path.write_text(updated, encoding="utf-8")
              print("Removed invalid empty omit setting from .npmrc.")
          else:
              print("No invalid empty omit setting found.")
          PY
          else
            echo ".npmrc not present; no file created."
          fi

          npm --version
          node --version

          if [[ -f .npmrc ]]; then
            if npm config get omit 2>&1 | grep -qi 'invalid config'; then
              echo "::error::npm still reports invalid configuration."
              exit 1
            fi
          fi

      - name: Repair known Python file
        shell: bash
        run: |
          set -Eeuo pipefail

          target="local-agent/tools/compatible_share.py"

          if [[ ! -f "$target" ]]; then
            echo "Known Python file not present; skipping targeted repair."
            exit 0
          fi

          python - "$target" <<'PY'
          import ast
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          try:
              ast.parse(source, filename=str(path))
              print(f"{path}: syntax already valid.")
          except SyntaxError as exc:
              print(
                  f"::error file={path},line={exc.lineno},"
                  f"col={exc.offset}::Python syntax error: {exc.msg}"
              )
              print(
                  "Replace this file with the valid Python implementation "
                  "provided for compatible_share.py, then rerun this workflow."
              )
              raise SystemExit(1)
          PY

      - name: Generate or repair root npm lockfile
        if: ${{ inputs.regenerate_lockfile }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "No root package.json; root npm lockfile generation skipped."
            exit 0
          fi

          node - <<'NODE'
          const fs = require("node:fs");
          try {
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
              throw new Error("package.json must contain a JSON object");
            }
          } catch (error) {
            console.error(`Invalid package.json: ${error.message}`);
            process.exit(1);
          }
          NODE

          if [[ -f package-lock.json ]] && [[ ! -s package-lock.json ]]; then
            rm package-lock.json
            echo "Removed empty package-lock.json so npm can regenerate it."
          fi

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));

          if (!lock || typeof lock !== "object" || Array.isArray(lock)) {
            throw new Error("Lockfile root must be a JSON object.");
          }
          if (!Number.isInteger(lock.lockfileVersion) || lock.lockfileVersion < 1) {
            throw new Error("Invalid lockfileVersion.");
          }
          if (!lock.packages || typeof lock.packages !== "object") {
            throw new Error("Lockfile is missing the packages object.");
          }
          if (!lock.packages[""]) {
            throw new Error('Lockfile is missing the root package entry.');
          }
          if (pkg.name && lock.packages[""].name &&
              pkg.name !== lock.packages[""].name) {
            throw new Error("Root package name does not match lockfile.");
          }

          console.log("package-lock.json: valid JSON and root metadata.");
          NODE

      - name: Validate JSON, YAML and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

          python - <<'PY'
          import ast
          import json
          import sys
          from pathlib import Path

          import yaml

          ignored = {
              ".git", "node_modules", ".venv", "venv",
              "__pycache__", "dist", "build", ".next",
          }

          failures = []
          counts = {"python": 0, "json": 0, "yaml": 0}

          def duplicate_key_loader():
              class UniqueKeyLoader(yaml.SafeLoader):
                  pass

              def construct_mapping(loader, node, deep=False):
                  mapping = {}
                  for key_node, value_node in node.value:
                      key = loader.construct_object(key_node, deep=deep)
                      try:
                          duplicate = key in mapping
                      except TypeError:
                          raise yaml.constructor.ConstructorError(
                              None, None, "unhashable YAML mapping key",
                              key_node.start_mark,
                          )
                      if duplicate:
                          raise yaml.constructor.ConstructorError(
                              None, None,
                              f"duplicate YAML key: {key!r}",
                              key_node.start_mark,
                          )
                      mapping[key] = loader.construct_object(
                          value_node, deep=deep
                      )
                  return mapping

              UniqueKeyLoader.add_constructor(
                  yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
                  construct_mapping,
              )
              return UniqueKeyLoader

          loader = duplicate_key_loader()

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue

              suffix = path.suffix.lower()

              try:
                  if suffix == ".py":
                      counts["python"] += 1
                      ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

                  elif suffix == ".json":
                      counts["json"] += 1

                      def no_duplicate_pairs(pairs):
                          result = {}
                          for key, value in pairs:
                              if key in result:
                                  raise ValueError(f"duplicate JSON key: {key}")
                              result[key] = value
                          return result

                      json.loads(
                          path.read_text(encoding="utf-8"),
                          object_pairs_hook=no_duplicate_pairs,
                          parse_constant=lambda value: (
                              (_ for _ in ()).throw(
                                  ValueError(f"invalid JSON constant: {value}")
                              )
                          ),
                      )

                  elif suffix in {".yaml", ".yml"}:
                      counts["yaml"] += 1
                      list(yaml.load_all(
                          path.read_text(encoding="utf-8"),
                          Loader=loader,
                      ))

              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          print("Validation totals:", counts)
          if failures:
              for failure in failures:
                  print(f"FAIL: {failure}")
              sys.exit(1)

          print("JSON, YAML and Python syntax validation passed.")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find . -type f \
              \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -not -path './*/node_modules/*' \
              -not -path './.venv/*' \
              -print0
          )

          echo "JavaScript syntax validation passed."

      - name: Review changes
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git status --short
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create repair branch and push
        if: ${{ inputs.create_repair_branch && steps.changes.outputs.changed == 'true' }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -Eeuo pipefail

          branch="repair/automated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add -- .npmrc package-lock.json

          # Add only the explicitly targeted Python file if it was modified.
          if [[ -f local-agent/tools/compatible_share.py ]]; then
            git add -- local-agent/tools/compatible_share.py
          fi

          if git diff --cached --quiet; then
            echo "::error::No supported repair changes are staged."
            exit 1
          fi

          git commit -m "fix: repair npm configuration and lockfile"
          git push origin "HEAD:refs/heads/$branch"

          echo "Repair branch pushed: $branch"

      - name: Final report
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## MedOrbits Override Repair"
            echo
            echo "- Job status: $JOB_STATUS"
            echo "- Targeted npm configuration repair: attempted"
            echo "- Lockfile generation: controlled by workflow input"
            echo "- JSON/YAML/Python syntax validation: executed if earlier steps passed"
            echo "- JavaScript syntax validation: executed if earlier steps passed"
            echo "- Direct force-push to main: never performed"
            echo "- Automatic merge: never performed"
            echo
            echo "Review the step logs and the repair branch before merging."
          } >> "$GITHUB_STEP_SUMMARY"
