
# ==============================================================================
# MedOrbits -- JSON Validation
# File: .github/workflows/validate-json.yml
# Release: 3.0.0
#
# Purpose:
#   Validate tracked JSON files for syntax and strict JSON compliance.
#
# Security:
#   - Read-only repository permissions.
#   - No repository modifications.
#   - No dependency installation required.
#   - Duplicate keys and non-standard constants are rejected.
# ==============================================================================

name: Validate JSON Files

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.json"
      - ".github/workflows/validate-json.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.json"
      - ".github/workflows/validate-json.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-json-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Validate tracked JSON files
        id: json-validation
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          ignored = {
              ".git",
              "node_modules",
              "vendor",
              "dist",
              "build",
              "coverage",
              ".venv",
              "venv",
              "__pycache__",
          }

          result = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.json"],
              check=True,
              capture_output=True,
          )

          # NUL-delimited paths safely support spaces and special characters.
          paths = [
              Path(os.fsdecode(item))
              for item in result.stdout.split(b"\0")
              if item
          ]

          checked = 0
          skipped = 0
          failures = []

          def reject_duplicate_keys(pairs):
              result = {}

              for key, value in pairs:
                  if key in result:
                      raise ValueError(
                          f"Duplicate JSON key: {key!r}"
                      )
                  result[key] = value

              return result

          def reject_nonstandard_constant(value):
              raise ValueError(
                  f"Non-standard JSON constant is not allowed: {value}"
              )

          def annotation_path(path):
              # GitHub workflow command paths must not contain newlines.
              return path.as_posix().replace("%", "%25") \
                  .replace("\r", "%0D").replace("\n", "%0A")

          for path in paths:
              if any(part in ignored for part in path.parts):
                  skipped += 1
                  continue

              if not path.is_file():
                  # A tracked file may be deleted in the current checkout.
                  skipped += 1
                  continue

              try:
                  with path.open("r", encoding="utf-8") as file:
                      json.load(
                          file,
                          object_pairs_hook=reject_duplicate_keys,
                          parse_constant=reject_nonstandard_constant,
                      )

                  checked += 1
                  print(f"PASS: {path.as_posix()}")

              except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as error:
                  filename = path.as_posix()
                  message = str(error).replace("\r", " ").replace("\n", " ")

                  failures.append((filename, message))

                  print(
                      f"::error file={annotation_path(path)}::"
                      f"JSON validation failed: {message}"
                  )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## JSON Validation Results\n\n")
                  summary.write(f"- Valid files: {checked}\n")
                  summary.write(f"- Skipped files: {skipped}\n")
                  summary.write(f"- Failed files: {len(failures)}\n")
                  summary.write("- Duplicate-key detection: enabled\n")
                  summary.write("- Non-standard constants: rejected\n\n")

                  if failures:
                      summary.write("### Validation errors\n\n")
                      for filename, message in failures:
                          summary.write(
                              f"- `{filename}`: {message}\n"
                          )

          print()
          print(f"Valid JSON files: {checked}")
          print(f"Skipped files: {skipped}")
          print(f"Failed files: {len(failures)}")

          if failures:
              sys.exit(1)

          print("All checked tracked JSON files passed validation.")
          PY

      - name: Final validation summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo
            echo "### Workflow Status"
            echo
            echo "- Result: ${STATUS:-unknown}"
            echo "- Repository writes: disabled"
            echo "- Dependency installation: not required"
          } >> "$GITHUB_STEP_SUMMARY"
