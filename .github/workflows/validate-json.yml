
name: MedOrbits Security - Validate JSON Configuration

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-json-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    name: Validate tracked JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check tools/compatible-share.js

      - name: Validate tracked JSON files
        run: node tools/compatible-share.js
