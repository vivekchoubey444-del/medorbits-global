
# ==============================================================================
# MedOrbits -- JSON Validation
# File: .github/workflows/validate-json.yml
# Release target: 2.0.0
#
# Purpose:
#   Validate JSON syntax for repository JSON files.
#
# Policy:
#   - Read-only repository access.
#   - No automatic merging or deployment.
#   - Skip gracefully when no JSON files are present.
#   - Fail when a JSON file is malformed.
# ==============================================================================

name: Validate JSON

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.json"
      - ".github/workflows/validate-json.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.json"
      - ".github/workflows/validate-json.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-json-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover JSON files
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.venv' -prune -o \
              -path './vendor' -prune -o \
              -type f -name '*.json' -print0
          )

          printf 'count=%s\n' "${#files[@]}" >> "$GITHUB_OUTPUT"

          if ((${#files[@]} == 0)); then
            echo "No JSON files found. Validation will be skipped."
          else
            printf 'Discovered %s JSON file(s).\n' "${#files[@]}"
          fi

      - name: Validate JSON syntax
        if: steps.discover.outputs.count != '0'
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' files < <(
            find . \
              -path './.git' -prune -o \
              -path './node_modules' -prune -o \
              -path './.venv' -prune -o \
              -path './vendor' -prune -o \
              -type f -name '*.json' -print0
          )

          failed=0

          for file in "${files[@]}"; do
            if python -m json.tool "$file" >/dev/null 2>&1; then
              printf '[PASS] %s\n' "$file"
            else
              printf '::error file=%s::Invalid JSON syntax.\n' "$file"
              failed=1
            fi
          done

          if ((failed != 0)); then
            echo "::error::One or more JSON files failed validation."
            exit 1
          fi

          echo "All discovered JSON files are valid."

      - name: Report validation result
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          JSON_COUNT: ${{ steps.discover.outputs.count }}
        run: |
          set -Eeuo pipefail

          printf 'Validation status: %s\n' "${VALIDATION_STATUS:-unknown}"
          printf 'JSON files discovered: %s\n' "${JSON_COUNT:-unknown}"
