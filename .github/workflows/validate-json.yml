
name: MedOrbits Security - Validate JSON Configuration

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-json-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-json:
    name: Validate tracked JSON files
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify project files
        run: |
          test -f package.json
          test -f tools/compatible-share.js
          test -f scripts/check-json.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check tools/compatible-share.js
          node --check scripts/check-json.mjs

      - name: Validate tracked JSON syntax
        run: node tools/compatible-share.js

      - name: Validate project JSON configuration
        run: npm run check:json
