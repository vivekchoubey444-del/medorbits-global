
# File: .github/workflows/sync-official-releases.yml

name: Sync Official Release Candidates

on:
  schedule:
    # Run every 6 hours at minute 17 (UTC).
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-releases-main
  cancel-in-progress: false

jobs:
  sync:
    name: Discover and sync release candidates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json assets/data/news.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Verify sync script exists
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.scripts || !pkg.scripts['releases:sync']) {
              console.error('Missing npm script: releases:sync');
              process.exit(1);
            }
          "

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Discover official release candidates
        run: npm run releases:sync

      - name: Validate generated news JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('assets/data/news.json', 'utf8'))"

      - name: Commit review candidates
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/data/news.json; then
            echo "No new release candidates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- assets/data/news.json

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "chore: sync official release candidates"

          # Checkout credentials are disabled, so configure an authenticated
          # push only if a suitable repository secret is available.
          if [[ -z "${GH_PUSH_TOKEN:-}" ]]; then
            echo "::error::GH_PUSH_TOKEN is required to push changes."
            echo "Create a repository secret with permission to push to main."
            exit 1
          fi

          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w 0)" \
            push origin HEAD:main
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
