
name: Sync Official Releases

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/sync-official-releases.yml"
      - "assets/data/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: sync-official-releases-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-validate:
    name: Discover and Validate Release Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Verify and repair news data
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p assets/data

          if [[ ! -f assets/data/news.json ]]; then
            printf '[]\n' > assets/data/news.json
            echo "::warning::Created assets/data/news.json with an empty array."
          fi

          if [[ ! -s assets/data/news.json ]]; then
            printf '[]\n' > assets/data/news.json
            echo "::warning::Initialized empty assets/data/news.json."
          fi

          node <<'JS'
          const fs = require("node:fs");

          const file = "assets/data/news.json";

          try {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));

            if (!Array.isArray(data) &&
                (data === null || typeof data !== "object")) {
              throw new Error("News data must be a JSON array or object.");
            }

            console.log(`[PASS] ${file}`);
          } catch (error) {
            console.error(`[FAIL] ${file}: ${error.message}`);
            process.exit(1);
          }
          JS

      - name: Validate root npm manifest and lockfile when present
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::notice::Root package.json not found; root npm checks skipped."
            exit 0
          fi

          node <<'JS'
          const fs = require("node:fs");

          function readJson(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              throw new Error(`${file}: ${error.message}`);
            }
          }

          const manifest = readJson("package.json");

          if (!manifest || typeof manifest !== "object" ||
              Array.isArray(manifest)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (typeof manifest.name !== "string" ||
              !manifest.name.trim()) {
            throw new Error('package.json requires a non-empty "name".');
          }

          console.log("[PASS] package.json");

          const lockPath = fs.existsSync("npm-shrinkwrap.json")
            ? "npm-shrinkwrap.json"
            : "package-lock.json";

          if (!fs.existsSync(lockPath)) {
            console.log(
              "[NOTICE] No root npm lockfile found; lockfile validation skipped."
            );
            process.exit(0);
          }

          const lock = readJson(lockPath);

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `${lockPath} must use npm lockfile version 2 or 3.`
            );
          }

          if (!lock.packages ||
              typeof lock.packages !== "object" ||
              Array.isArray(lock.packages) ||
              !lock.packages[""]) {
            throw new Error(
              `${lockPath} is missing a valid packages[""] entry.`
            );
          }

          const root = lock.packages[""];

          for (const key of ["name", "version"]) {
            if (
              manifest[key] !== undefined &&
              root[key] !== undefined &&
              manifest[key] !== root[key]
            ) {
              throw new Error(
                `${key} in package.json does not match ${lockPath}.`
              );
            }
          }

          console.log(`[PASS] ${lockPath}`);
          JS

      - name: Validate all repository JSON files
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const excluded = new Set([
            ".git",
            "node_modules",
            ".venv",
            "venv",
            "vendor",
            "__pycache__",
            ".next",
            "dist",
            "build",
            "coverage"
          ]);

          const files = [];
          const errors = [];

          function walk(directory) {
            let entries;

            try {
              entries = fs.readdirSync(directory, {
                withFileTypes: true
              });
            } catch (error) {
              errors.push(`${directory}: ${error.message}`);
              return;
            }

            for (const entry of entries) {
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory() && excluded.has(entry.name)) continue;

              const fullPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith(".json")
              ) {
                files.push(fullPath);
              }
            }
          }

          function rejectDuplicateKeys(pairs) {
            const result = Object.create(null);

            for (const [key, value] of pairs) {
              if (Object.prototype.hasOwnProperty.call(result, key)) {
                throw new Error(`Duplicate JSON key: ${key}`);
              }
              result[key] = value;
            }

            return result;
          }

          // Native JSON.parse does not expose object pairs for duplicate-key
          // detection. Validate JSON syntax here; duplicate-key checks can
          // be added with a dedicated parser if required.
          walk(".");

          for (const file of files.sort()) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`[PASS] ${file}`);
            } catch (error) {
              errors.push(`${file}: ${error.message}`);
              console.error(`[FAIL] ${file}: ${error.message}`);
            }
          }

          console.log(`JSON files checked: ${files.length}`);

          if (errors.length > 0) {
            console.error(`JSON validation failed: ${errors.length} error(s).`);
            process.exit(1);
          }

          console.log("JSON syntax validation passed.");
          JS

      - name: Report release source configuration
        shell: bash
        env:
          OFFICIAL_RELEASES_URL: ${{ vars.OFFICIAL_RELEASES_URL }}
        run: |
          set -Eeuo pipefail

          if [[ -n "${OFFICIAL_RELEASES_URL:-}" ]]; then
            echo "Official release source URL is configured."
          else
            echo "::notice::OFFICIAL_RELEASES_URL is not configured. This workflow validates local data only."
          fi

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail

          {
            echo "# Official Releases Validation"
            echo
            echo "- Job status: ${JOB_STATUS}"
            echo "- News data: assets/data/news.json"
            echo "- Root npm manifest: checked when present"
            echo "- Root npm lockfile: checked when present"
            echo
            echo "Missing news data is initialized as an empty array. Official release content is not fabricated."
          } >> "$GITHUB_STEP_SUMMARY"
