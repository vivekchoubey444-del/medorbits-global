
name: Sync Official Releases

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/sync-official-releases.yml"
      - "assets/data/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: sync-official-releases-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-validate:
    name: Discover and Validate Release Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false

      - name: Verify required files and repair missing news data
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p assets/data

          if [[ ! -f assets/data/news.json ]]; then
            printf '[]\n' > assets/data/news.json
            echo "::warning::Created assets/data/news.json with an empty array. Add verified official news data when available."
          fi

          for file in package.json package-lock.json assets/data/news.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Required files are present."

      - name: Validate package manifest and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");

          function readJson(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              console.error(`[FAIL] ${file}: ${error.message}`);
              process.exit(1);
            }
          }

          const manifest = readJson("package.json");
          const lock = readJson("package-lock.json");

          if (!manifest || typeof manifest !== "object" ||
              Array.isArray(manifest)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (!manifest.name || typeof manifest.name !== "string") {
            throw new Error('package.json must contain a non-empty "name".');
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              "package-lock.json must use npm lockfile version 2 or 3."
            );
          }

          if (!lock.packages || typeof lock.packages !== "object" ||
              Array.isArray(lock.packages) || !lock.packages[""]) {
            throw new Error(
              'package-lock.json must contain a valid packages[""] entry.'
            );
          }

          const root = lock.packages[""];

          for (const key of ["name", "version"]) {
            if (
              manifest[key] !== undefined &&
              root[key] !== undefined &&
              manifest[key] !== root[key]
            ) {
              throw new Error(
                `package.json ${key} does not match package-lock.json.`
              );
            }
          }

          console.log("[PASS] package.json");
          console.log("[PASS] package-lock.json");
          JS

      - name: Validate news JSON
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");

          const file = "assets/data/news.json";
          let data;

          try {
            data = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch (error) {
            console.error(`[FAIL] ${file}: ${error.message}`);
            process.exit(1);
          }

          if (!Array.isArray(data) &&
              (!data || typeof data !== "object")) {
            throw new Error(
              "News data must be a JSON array or object."
            );
          }

          console.log(`[PASS] ${file}`);
          console.log(
            `News entries: ${Array.isArray(data) ? data.length : "object"}`
          );
          JS

      - name: Validate all repository JSON files
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const excluded = new Set([
            ".git",
            "node_modules",
            ".venv",
            "venv",
            "vendor",
            "__pycache__",
            ".next",
            "dist",
            "build",
            "coverage"
          ]);

          const files = [];

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, {
              withFileTypes: true
            })) {
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory() && excluded.has(entry.name)) continue;

              const fullPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (
                entry.isFile() &&
                entry.name.toLowerCase().endsWith(".json")
              ) {
                files.push(fullPath);
              }
            }
          }

          walk(".");
          let failed = false;

          for (const file of files.sort()) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`[PASS] ${file}`);
            } catch (error) {
              failed = true;
              console.error(`[FAIL] ${file}: ${error.message}`);
            }
          }

          console.log(`JSON files checked: ${files.length}`);

          if (failed) process.exit(1);
          JS

      - name: Check official release source configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${OFFICIAL_RELEASES_URL:-}" ]]; then
            echo "An official release source URL is configured."
          else
            echo "::notice::OFFICIAL_RELEASES_URL is not configured. Source discovery is skipped; local validation will continue."
          fi

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail

          {
            echo "# Official Releases Sync"
            echo
            echo "- Status: ${JOB_STATUS}"
            echo "- News data: assets/data/news.json"
            echo "- Package manifest: package.json"
            echo "- Lockfile: package-lock.json"
            echo
            echo "This workflow validates local files. It does not invent release announcements or automatically publish unverified data."
          } >> "$GITHUB_STEP_SUMMARY"
