
# =============================================================================
# MedOrbits -- Sync Official Releases
# File: .github/workflows/sync-official-releases.yml
# Purpose: Retrieve official GitHub release metadata and archive it as an artifact.
# Security: Read-only; does not modify repository files or push commits.
# =============================================================================

name: Sync Official Releases

on:
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "Official GitHub repository in owner/repo format"
        required: true
        type: string
        default: "vitejs/vite"

  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sync-official-releases
  cancel-in-progress: false

jobs:
  sync-release-metadata:
    name: Fetch Official Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select and validate upstream repository
        id: upstream
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPOSITORY: ${{ inputs.upstream_repository }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            repository="$INPUT_REPOSITORY"
          else
            repository="vitejs/vite"
          fi

          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must use owner/repo format."
            exit 1
          fi

          owner="${repository%%/*}"
          repo="${repository#*/}"

          if [[ "$owner" == "." || "$owner" == ".." ||
                "$repo" == "." || "$repo" == ".." ]]; then
            echo "::error::Invalid repository owner or name."
            exit 1
          fi

          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"

      - name: Fetch latest official release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.upstream.outputs.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          output="$RUNNER_TEMP/official-release.json"
          response="$RUNNER_TEMP/github-release-response.json"

          if ! gh api \
            --method GET \
            "repos/$UPSTREAM_REPOSITORY/releases/latest" \
            > "$response"; then
            echo "::error::Could not retrieve the latest published release."
            echo "::error::Check repository visibility, API access, rate limits, and release availability."
            exit 1
          fi

          if ! jq -e '
            type == "object" and
            (.tag_name | type == "string" and length > 0) and
            (.html_url | type == "string" and startswith("https://")) and
            (.draft | type == "boolean") and
            (.prerelease | type == "boolean")
          ' "$response" >/dev/null; then
            echo "::error::The GitHub API response is missing required release metadata."
            exit 1
          fi

          jq '{
            repository: .html_url,
            tag: .tag_name,
            name: .name,
            published_at: .published_at,
            draft: .draft,
            prerelease: .prerelease,
            release_url: .html_url,
            target_commitish: .target_commitish
          }' "$response" > "$output"

          jq -e '
            (.tag | type == "string" and length > 0) and
            (.release_url | type == "string" and startswith("https://"))
          ' "$output" >/dev/null

          echo "Latest official release:"
          jq '{
            repository,
            tag,
            name,
            published_at,
            prerelease,
            release_url
          }' "$output"

      - name: Save release metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: official-release-${{ github.run_number }}
          path: ${{ runner.temp }}/official-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        shell: bash
        run: |
          set -Eeuo pipefail

          file="$RUNNER_TEMP/official-release.json"

          {
            echo "## Official Release Sync"
            echo
            echo "- Repository: $(jq -r '.repository' "$file")"
            echo "- Latest tag: $(jq -r '.tag' "$file")"
            echo "- Release name: $(jq -r '.name // "Unnamed release"' "$file")"
            echo "- Published: $(jq -r '.published_at // "Unknown"' "$file")"
            echo "- Prerelease: $(jq -r '.prerelease' "$file")"
            echo "- Release URL: $(jq -r '.release_url' "$file")"
            echo
            echo "Release metadata was saved as a workflow artifact."
            echo "No repository files were changed."
          } >> "$GITHUB_STEP_SUMMARY"
