
name: Sync Official Releases

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-releases
  cancel-in-progress: true

jobs:
  check-releases:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configured upstream releases
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repositories = [
              "nodejs/node",
              "npm/cli",
              "actions/checkout",
              "actions/setup-node",
          ]

          token = os.environ.get("GITHUB_TOKEN", "")
          results = []

          for repository in repositories:
              url = f"https://api.github.com/repos/{repository}/releases/latest"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "MedOrbits-Release-Monitor",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              request = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      release = json.load(response)

                  results.append({
                      "repository": repository,
                      "status": "success",
                      "tag": release.get("tag_name"),
                      "name": release.get("name"),
                      "published_at": release.get("published_at"),
                      "html_url": release.get("html_url"),
                      "checked_at": datetime.now(timezone.utc).isoformat(),
                  })

                  print(f"OK: {repository} -> {release.get('tag_name', 'unknown')}")

              except urllib.error.HTTPError as error:
                  results.append({
                      "repository": repository,
                      "status": "error",
                      "http_status": error.code,
                      "message": "GitHub API request failed",
                      "checked_at": datetime.now(timezone.utc).isoformat(),
                  })
                  print(f"::warning::{repository}: GitHub API returned HTTP {error.code}")

              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
                  results.append({
                      "repository": repository,
                      "status": "error",
                      "message": str(error),
                      "checked_at": datetime.now(timezone.utc).isoformat(),
                  })
                  print(f"::warning::{repository}: {error}")

          report = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "repositories_checked": len(repositories),
              "successful_checks": sum(r["status"] == "success" for r in results),
              "failed_checks": sum(r["status"] != "success" for r in results),
              "results": results,
          }

          Path("release-monitor-report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Official Release Monitor\n\n")
              summary.write(f"- Generated: {report['generated_at']}\n")
              summary.write(f"- Repositories checked: {report['repositories_checked']}\n")
              summary.write(f"- Successful checks: {report['successful_checks']}\n")
              summary.write(f"- Failed checks: {report['failed_checks']}\n\n")
              summary.write("| Repository | Status | Latest release | Published |\n")
              summary.write("|---|---|---|---|\n")

              for result in results:
                  repository = result["repository"]
                  status = result["status"]
                  tag = result.get("tag", "Unavailable")
                  published = result.get("published_at", "Unavailable")
                  url = result.get("html_url")

                  if url and tag != "Unavailable":
                      tag = f"[{tag}]({url})"

                  summary.write(
                      f"| `{repository}` | {status} | {tag} | {published} |\n"
                  )

          print(json.dumps(report, indent=2))
          PY

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-release-report-${{ github.run_number }}
          path: release-monitor-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write workflow policy summary
        if: always()
        run: |
          {
            echo
            echo "### Workflow Policy"
            echo
            echo "- Schedule: Mondays at 06:00 UTC"
            echo "- Automatic dependency updates: disabled"
            echo "- Automatic commits and pushes: disabled"
            echo "- Report retention: 30 days"
          } >> "$GITHUB_STEP_SUMMARY"
