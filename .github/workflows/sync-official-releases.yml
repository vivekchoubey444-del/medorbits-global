
name: Sync Official Releases

on:
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-releases
  cancel-in-progress: true

jobs:
  check-releases:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configured upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          # Replace these examples with the official repositories
          # that MedOrbits intentionally depends on.
          repositories = [
              "nodejs/node",
              "npm/cli",
              "actions/checkout",
              "actions/setup-node",
          ]

          token = os.environ.get("GITHUB_TOKEN", "")
          results = []

          for repository in repositories:
              url = (
                  "https://api.github.com/repos/"
                  f"{repository}/releases/latest"
              )

              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "MedOrbits-Release-Monitor",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

              if token:
                  headers["Authorization"] = f"Bearer {token}"

              request = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=20,
                  ) as response:
                      release = json.load(response)

                  results.append({
                      "repository": repository,
                      "status": "success",
                      "tag": release.get("tag_name"),
                      "name": release.get("name"),
                      "published_at": release.get("published_at"),
                      "html_url": release.get("html_url"),
                      "checked_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  })

                  print(
                      f"{repository}: "
                      f"{release.get('tag_name', 'unknown')}"
                  )

              except urllib.error.HTTPError as error:
                  results.append({
                      "repository": repository,
                      "status": "error",
                      "http_status": error.code,
                      "checked_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  })

                  print(
                      f"Warning: {repository} returned HTTP "
                      f"{error.code}."
                  )

              except (urllib.error.URLError, TimeoutError) as error:
                  results.append({
                      "repository": repository,
                      "status": "error",
                      "message": str(error),
                      "checked_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                  })

                  print(
                      f"Warning: unable to check {repository}: {error}"
                  )

          output = Path("release-monitor-report.json")
          output.write_text(
              json.dumps(
                  {
                      "generated_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                      "repositories_checked": len(repositories),
                      "results": results,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          failed = [
              item for item in results
              if item["status"] != "success"
          ]

          if failed:
              print(
                  f"::warning::{len(failed)} upstream release check(s) failed."
              )
          PY

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-release-report-${{ github.run_number }}
          path: release-monitor-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Official Release Monitor"
            echo
            echo "- Report artifact: official-release-report-${{ github.run_number }}"
            echo "- Schedule: Mondays at 06:00 UTC"
            echo "- Automatic dependency updates: disabled"
            echo "- Automatic commits and pushes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
