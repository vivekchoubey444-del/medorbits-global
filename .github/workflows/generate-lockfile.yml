      - name: Check lockfile consistency
        shell: bash
        run: |
          set -Eeuo pipefail

          # npm ci checks that package.json and the lockfile agree.
          # Lifecycle scripts are disabled for this validation.
          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Commit generated lockfile
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::This workflow must be run manually."
            exit 1
          fi

          if [ "$TARGET_BRANCH" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Unexpected target branch."
            echo "::error::Manual workflow dispatch is required."
            exit 1
          fi

          if [ -z "$TARGET_BRANCH" ]; then
            echo "::error::Target branch is missing."
            exit 1
          fi

          git add -- package-lock.json

          if git diff --cached --quiet; then
            echo "The lockfile is already committed and unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "fix: generate valid root npm lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Confirm committed lockfile
            echo "Lockfile is already committed and unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "fix: generate valid root npm lockfile"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          git show "HEAD:package-lock.json" > /tmp/package-lock.json

          test -s /tmp/package-lock.json
          git show HEAD:package-lock.json \
            > "${RUNNER_TEMP}/package-lock.json"

          test -s "${RUNNER_TEMP}/package-lock.json"

          node -e '
            const fs = require("node:fs");
            const lock = JSON.parse(
              fs.readFileSync("/tmp/package-lock.json", "utf8")
            );
            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Committed lockfile is incomplete");
            }
            console.log("Committed root package-lock.json is valid.");
          '

          echo "Commit: $(git rev-parse --short HEAD)"
              fs.readFileSync(
                process.env.LOCKFILE_PATH,
                "utf8"
              )
            );

            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Committed lockfile is incomplete");
            }

            console.log("Committed package-lock.json verified.");
          ' 
        env:
          LOCKFILE_PATH: ${{ runner.temp }}/package-lock.json
