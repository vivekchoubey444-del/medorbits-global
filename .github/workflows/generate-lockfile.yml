
name: Generate and Repair Root NPM Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-root-npm-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Validate root package.json
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f package.json || {
            echo "::error::Root package.json is missing."
            exit 1
          }

          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!p || Array.isArray(p) || typeof p !== "object") {
              throw new Error("package.json must contain a JSON object");
            }
            if (p.name !== undefined && typeof p.name !== "string") {
              throw new Error("package name must be a string");
            }
            if (p.version !== undefined && typeof p.version !== "string") {
              throw new Error("package version must be a string");
            }
            console.log("package.json is valid.");
          '

      - name: Generate real lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --registry=https://registry.npmjs.org/

          test -s package-lock.json || {
            echo "::error::npm did not generate a non-empty lockfile."
            exit 1
          }

      - name: Validate lockfile and manifest consistency
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));

          if (!lock || typeof lock !== "object" || Array.isArray(lock)) {
            throw new Error("Lockfile must be a JSON object.");
          }

          if (lock.lockfileVersion < 1) {
            throw new Error("Unsupported lockfileVersion.");
          }

          if (!lock.packages || !lock.packages[""]) {
            throw new Error('Lockfile is missing packages[""].');
          }

          const root = lock.packages[""];

          if (pkg.name && root.name !== pkg.name) {
            throw new Error("Root package name does not match package.json.");
          }

          if (pkg.version && root.version !== pkg.version) {
            throw new Error("Root package version does not match package.json.");
          }

          for (const section of [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ]) {
            const expected = pkg[section] || {};
            const actual = root[section] || {};

            for (const [name, version] of Object.entries(expected)) {
              if (actual[name] !== version) {
                throw new Error(
                  `${section}.${name} does not match package.json`
                );
              }
            }
          }

          console.log("Lockfile JSON and root manifest metadata are valid.");
          NODE

      - name: Check whether lockfile changed
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet -- package-lock.json &&
             git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated lockfile
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -- package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "fix: generate valid root npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report result
        if: always()
        shell: bash
        run: |
          {
            echo "## Root NPM Lockfile Repair"
            echo
            echo "- Node.js: 22"
            echo "- Lifecycle scripts during generation: disabled"
            echo "- Repository history rewritten: no"
            echo "- Lockfile generation: see preceding step"
          } >> "$GITHUB_STEP_SUMMARY"
