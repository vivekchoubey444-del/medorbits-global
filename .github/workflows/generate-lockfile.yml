
name: Generate Root NPM Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: root-lockfile-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair and Commit Root Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Verify repository root
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

          test -s package.json || {
            echo "::error::Root package.json is missing or empty."
            exit 1
          }

          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );
            if (!p.name || !p.version) {
              throw new Error("Package name or version is missing");
            }
            console.log("Package:", p.name);
            console.log("Version:", p.version);
          '

      - name: Remove invalid npm omit setting
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f .npmrc ]; then
            if grep -Eq '^[[:space:]]*omit[[:space:]]*=[[:space:]]*$' .npmrc; then
              echo "::warning::Empty omit setting found in .npmrc."
              sed -i -E \
                '/^[[:space:]]*omit[[:space:]]*=[[:space:]]*$/d' \
                .npmrc
            fi
          fi

      - name: Generate lockfile from package manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=true

          test -s package-lock.json || {
            echo "::error::Root package-lock.json was not generated."
            exit 1
          }

      - name: Validate generated lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );
            const lock = JSON.parse(
              fs.readFileSync("package-lock.json", "utf8")
            );

            if (![2, 3].includes(lock.lockfileVersion)) {
              throw new Error("Invalid npm lockfile version");
            }

            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Missing lockfile root metadata");
            }

            if (lock.name && lock.name !== pkg.name) {
              throw new Error("Package name mismatch");
            }

            if (lock.version && lock.version !== pkg.version) {
              throw new Error("Package version mismatch");
            }

            console.log("Lockfile JSON and metadata are valid.");
            console.log(
              "Dependency entries:",
              Object.keys(lock.packages).length
            );
          '

      - name: Verify npm clean install
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Commit lockfile to main
        shell: bash
        run: |
          set -Eeuo pipefail

          git add -f -- package-lock.json

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "fix: regenerate root npm lockfile"
            git push origin HEAD:main
          else
            echo "No lockfile changes detected."
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          git show HEAD:package-lock.json \
            > "$RUNNER_TEMP/package-lock.json"

          test -s "$RUNNER_TEMP/package-lock.json"

          node -e '
            const fs = require("node:fs");
            const lock = JSON.parse(
              fs.readFileSync(process.env.LOCKFILE, "utf8")
            );
            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Committed lockfile is invalid");
            }
            console.log("Committed lockfile verified.");
          ' 
        env:
          LOCKFILE: ${{ runner.temp }}/package-lock.json
