
name: Generate Root NPM Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medorbits-lockfile-generation
  group: medorbits-generate-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate, Validate and Commit Lockfile
    name: Generate and Validate npm Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Validate root package.json
      - name: Validate package.json
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s package.json || {
          if [ ! -s package.json ]; then
            echo "::error::Root package.json is missing or empty."
            exit 1
          }

          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));

            if (!p || Array.isArray(p) || typeof p !== "object") {
              throw new Error("package.json must be a JSON object");
            }

            if (typeof p.name !== "string" || !p.name.trim()) {
              throw new Error("package.json must define a package name");
            }

            if (typeof p.version !== "string" || !p.version.trim()) {
              throw new Error("package.json must define a version");
            }

            console.log("Package:", p.name);
            console.log("Version:", p.version);
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );

            if (!pkg || Array.isArray(pkg) ||
                typeof pkg !== "object") {
              throw new Error("package.json must be a JSON object");
            }

            if (typeof pkg.name !== "string" || !pkg.name.trim()) {
              throw new Error("package.json name is missing");
            }

            if (typeof pkg.version !== "string" ||
                !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
              throw new Error("package.json version must be valid SemVer");
            }

            for (const key of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              if (pkg[key] !== undefined &&
                  (!pkg[key] || typeof pkg[key] !== "object" ||
                   Array.isArray(pkg[key]))) {
                throw new Error(key + " must be a JSON object");
              }
            }

            console.log("Package:", pkg.name);
            console.log("Version:", pkg.version);
          '

      - name: Check npm configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          npm --version
          node --version

          npm config get registry
          npm config get package-lock

          if [ "$(npm config get package-lock)" != "true" ]; then
            echo "::error::npm package-lock configuration must be true."
            exit 1
          fi

      - name: Generate real package-lock.json
        shell: bash
        run: |
          set -Eeuo pipefail

          # Remove only an empty or malformed lockfile.
          # Preserve a valid existing lockfile for npm to reconcile.
        run: |
          set -Eeuo pipefail

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

          if [ "$(npm config get package-lock)" != "true" ]; then
            echo "::error::npm package-lock must be enabled."
            exit 1
          fi

          REGISTRY="$(npm config get registry)"
          echo "Registry: $REGISTRY"

          if [ "$REGISTRY" != "https://registry.npmjs.org/" ]; then
            echo "::warning::A custom npm registry is configured."
          fi

      - name: Back up invalid lockfile if necessary
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f package-lock.json ]; then
            if [ ! -s package-lock.json ] ||
               ! node -e '
                 const fs = require("node:fs");
                 const x = JSON.parse(
                   fs.readFileSync("package-lock.json", "utf8")
                 );
                 if (!x || typeof x !== "object" || Array.isArray(x)) {
                   process.exit(1);
                 }
               ' 2>/dev/null; then
              cp package-lock.json package-lock.json.invalid-backup
              rm package-lock.json
              echo "Removed invalid lockfile; backup retained."
            fi
          fi

                 const value = JSON.parse(
                   fs.readFileSync("package-lock.json", "utf8")
                 );
                 if (!value || typeof value !== "object" ||
                     Array.isArray(value)) {
                   process.exit(1);
                 }
               ' 2>/dev/null; then

              cp package-lock.json \
                "${RUNNER_TEMP}/package-lock.invalid-backup"

              rm package-lock.json
              echo "Invalid lockfile backed up in runner temporary storage."
            fi
          fi

      - name: Generate package-lock.json
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=true

          test -s package-lock.json || {
            echo "::error::npm did not generate a non-empty lockfile."
            exit 1
          }

      - name: Validate lockfile from files
          if [ ! -s package-lock.json ]; then
            echo "::error::npm did not create a non-empty package-lock.json."
            exit 1
          fi

      - name: Validate lockfile JSON and metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          # Read both files directly. Do not pipe JSON into node -,
