
name: Generate Root NPM Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medorbits-generate-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate and Validate npm Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Validate package.json
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -s package.json ]; then
            echo "::error::Root package.json is missing or empty."
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );

            if (!pkg || Array.isArray(pkg) ||
                typeof pkg !== "object") {
              throw new Error("package.json must be a JSON object");
            }

            if (typeof pkg.name !== "string" || !pkg.name.trim()) {
              throw new Error("package.json name is missing");
            }

            if (typeof pkg.version !== "string" ||
                !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
              throw new Error("package.json version must be valid SemVer");
            }

            for (const key of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]) {
              if (pkg[key] !== undefined &&
                  (!pkg[key] || typeof pkg[key] !== "object" ||
                   Array.isArray(pkg[key]))) {
                throw new Error(key + " must be a JSON object");
              }
            }

            console.log("Package:", pkg.name);
            console.log("Version:", pkg.version);
          '

      - name: Check npm configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

          if [ "$(npm config get package-lock)" != "true" ]; then
            echo "::error::npm package-lock must be enabled."
            exit 1
          fi

          REGISTRY="$(npm config get registry)"
          echo "Registry: $REGISTRY"

          if [ "$REGISTRY" != "https://registry.npmjs.org/" ]; then
            echo "::warning::A custom npm registry is configured."
          fi

      - name: Back up invalid lockfile if necessary
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f package-lock.json ]; then
            if [ ! -s package-lock.json ] ||
               ! node -e '
                 const fs = require("node:fs");
                 const value = JSON.parse(
                   fs.readFileSync("package-lock.json", "utf8")
                 );
                 if (!value || typeof value !== "object" ||
                     Array.isArray(value)) {
                   process.exit(1);
                 }
               ' 2>/dev/null; then

              cp package-lock.json \
                "${RUNNER_TEMP}/package-lock.invalid-backup"

              rm package-lock.json
              echo "Invalid lockfile backed up in runner temporary storage."
            fi
          fi

      - name: Generate package-lock.json
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=true

          if [ ! -s package-lock.json ]; then
            echo "::error::npm did not create a non-empty package-lock.json."
            exit 1
          fi

      - name: Validate lockfile JSON and metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s package.json
          test -s package-lock.json

          # Read files directly. Do not pipe JSON into "node -".
          node -e '
            const fs = require("node:fs");

            const pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );

            const lock = JSON.parse(
              fs.readFileSync("package-lock.json", "utf8")
            );

            if (!lock || typeof lock !== "object" ||
                Array.isArray(lock)) {
              throw new Error("Lockfile must be a JSON object");
            }

            if (![2, 3].includes(lock.lockfileVersion)) {
              throw new Error(
                "Expected lockfileVersion 2 or 3; got " +
                lock.lockfileVersion
              );
            }

            if (!lock.packages ||
                typeof lock.packages !== "object" ||
                !lock.packages[""]) {
              throw new Error(
                "Lockfile root package metadata is missing"
              );
            }

            const root = lock.packages[""];

            if (lock.name && lock.name !== pkg.name) {
              throw new Error("Lockfile package name mismatch");
            }

            if (lock.version && lock.version !== pkg.version) {
              throw new Error("Lockfile package version mismatch");
            }

            if (root.name && root.name !== pkg.name) {
              throw new Error("Root package name mismatch");
            }

            if (root.version && root.version !== pkg.version) {
              throw new Error("Root package version mismatch");
            }

            console.log("Lockfile JSON is valid.");
            console.log("Lockfile version:", lock.lockfileVersion);
            console.log("Package:", pkg.name);
            console.log("Version:", pkg.version);
            console.log(
              "Entries:",
              Object.keys(lock.packages).length
            );
          '

      - name: Check lockfile consistency
        shell: bash
        run: |
          set -Eeuo pipefail

          # npm ci checks that package.json and the lockfile agree.
          # Lifecycle scripts are disabled for this validation.
          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Commit generated lockfile
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Manual workflow dispatch is required."
            exit 1
          fi

          if [ -z "$TARGET_BRANCH" ]; then
            echo "::error::Target branch is missing."
            exit 1
          fi

          git add -- package-lock.json

          if git diff --cached --quiet; then
            echo "Lockfile is already committed and unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "fix: generate valid root npm lockfile"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          git show HEAD:package-lock.json \
            > "${RUNNER_TEMP}/package-lock.json"

          test -s "${RUNNER_TEMP}/package-lock.json"

          node -e '
            const fs = require("node:fs");
            const lock = JSON.parse(
              fs.readFileSync(
                process.env.LOCKFILE_PATH,
                "utf8"
              )
            );

            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Committed lockfile is incomplete");
            }

            console.log("Committed package-lock.json verified.");
          ' 
        env:
          LOCKFILE_PATH: ${{ runner.temp }}/package-lock.json
