
name: Generate Root NPM Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-root-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify package.json
        run: |
          if [ ! -f package.json ]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi

          node -e "
            const p = require('./package.json');
            if (!p.name || !p.version) {
              throw new Error('package.json requires name and version');
            }
            console.log('Package:', p.name);
            console.log('Version:', p.version);
          "

      - name: Generate lockfile without running install scripts
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Validate generated lockfile
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const l = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

            if (l.lockfileVersion !== 2 && l.lockfileVersion !== 3) {
              throw new Error('Unexpected lockfile version');
            }

            if (!l.packages || !l.packages['']) {
              throw new Error('Root package metadata is missing');
            }

            if (l.name && l.name !== p.name) {
              throw new Error('Package name mismatch');
            }

            if (l.version && l.version !== p.version) {
              throw new Error('Package version mismatch');
            }

            console.log('Root npm lockfile validated.');
          "

      - name: Commit generated lockfile
        run: |
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate root npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
