name: Generate and Validate Lockfile
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-lockfile.yml"
permissions:
  contents: read
concurrency:
  group: generate-lockfile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  generate-lockfile:
    name: Generate and validate npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify package manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json was not found."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            console.log(`Package: ${pkg.name || "unnamed"}`);
            console.log(`Version: ${pkg.version || "unspecified"}`);
          '
      - name: Generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          if [[ ! -f package-lock.json ]]; then
            echo "::error::npm did not generate package-lock.json."
            exit 1
          fi
      - name: Validate lockfile JSON and manifest metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfile version: ${lock.lockfileVersion}`
            );
          }
          if (!lock.packages || !lock.packages[""]) {
            throw new Error("Lockfile is missing root package metadata.");
          }
          const root = lock.packages[""];
          if (root.name && pkg.name && root.name !== pkg.name) {
            throw new Error("Lockfile package name does not match package.json.");
          }
          if (root.version && pkg.version && root.version !== pkg.version) {
            throw new Error("Lockfile package version does not match package.json.");
          }
          console.log(`Lockfile JSON is valid (version ${lock.lockfileVersion}).`);
          console.log("Root package metadata is present.");
          NODE
      - name: Validate dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --dry-run
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14