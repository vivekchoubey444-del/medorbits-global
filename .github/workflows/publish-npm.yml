
name: Publish npm Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    outputs:
      is_private: ${{ steps.metadata.outputs.is_private }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate package manifest
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const manifest = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          if (!manifest.name || typeof manifest.name !== 'string') {
            throw new Error('package.json requires a valid name.');
          }

          if (!manifest.version || typeof manifest.version !== 'string') {
            throw new Error('package.json requires a valid version.');
          }

          if (manifest.private === true) {
            console.log('Package is private; publishing will be skipped.');
          } else {
            console.log('Package is not marked private.');
          }
          NODE

          PRIVATE="$(node -p "require('./package.json').private === true")"
          echo "is_private=$PRIVATE" >> "$GITHUB_OUTPUT"

      - name: Validate npm lockfile
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check tools/repair-package-lock.cjs

      - name: Run package tests
        if: steps.metadata.outputs.is_private == 'false'
        run: npm test --if-present

  publish:
    name: Publish public package
    needs: validate
    if: >-
      needs.validate.outputs.is_private == 'false' &&
      github.event_name == 'release' &&
      github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test --if-present

      - name: Publish package
        run: npm publish --provenance
