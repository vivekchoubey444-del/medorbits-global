
name: Update Lockfile

on:
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Select the lockfile operation"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - refresh

      target_branch:
        description: "Existing branch to check out"
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: update-lockfile-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: Validate or Refresh npm Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$TARGET_BRANCH" == -* ]] ||
             [[ "$TARGET_BRANCH" == *..* ]] ||
             [[ "$TARGET_BRANCH" == */ ]] ||
             [[ "$TARGET_BRANCH" == *//* ]]; then
            echo "::error::Invalid target branch name."
            exit 1
          fi

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify npm project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json was not found."
            exit 1
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::Root package-lock.json was not found."
            echo "This workflow requires package-lock.json."
            exit 1
          fi

          node --version
          npm --version

      - name: Validate existing lockfile
        if: inputs.update_mode == 'validate'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Refresh lockfile
        if: inputs.update_mode == 'refresh'
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Verify refreshed lockfile
        if: inputs.update_mode == 'refresh'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload lockfile artifact
        if: inputs.update_mode == 'refresh'
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.run_number }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Report result
        if: success()
        env:
          UPDATE_MODE: ${{ inputs.update_mode }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Lockfile operation completed successfully."
          echo "Mode: $UPDATE_MODE"
          echo "Branch: $TARGET_BRANCH"
          echo "No repository changes were committed or pushed."
