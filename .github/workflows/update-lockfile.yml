
name: MedOrbits - Update Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: Generate and Validate Lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package metadata
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            if (!pkg.name || !pkg.version || !pkg.scripts) {
              throw new Error('Invalid package.json metadata');
            }

            console.log('Valid package:', pkg.name, pkg.version);
          "

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate lockfile
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

            if (lock.name !== pkg.name || lock.version !== pkg.version) {
              throw new Error('Lockfile name/version does not match package.json');
            }

            if (!lock.packages || !lock.packages['']) {
              throw new Error('Lockfile root package metadata is missing');
            }

            console.log('Lockfile metadata is valid.');
          "

      - name: Create pull request if lockfile changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/update-lockfile
          delete-branch: true
          add-paths: package-lock.json
          commit-message: "chore: update package lockfile"
          title: "chore: update package lockfile"
          body: |
            Automated lockfile refresh.

            - Generated with npm.
            - Validated root package metadata.
            - Review the lockfile diff before merging.
