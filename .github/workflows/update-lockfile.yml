
# File: .github/workflows/update-lockfile.yml

name: Update package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: Generate and validate lockfile
    if: github.ref_type == 'branch' && github.ref_protected == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json

      - name: Generate and synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          if (lock.lockfileVersion !== 3) {
            throw new Error('Expected package-lock.json lockfileVersion 3.');
          }

          const root = lock.packages?.[''];

          if (!root) {
            throw new Error('package-lock.json is missing its root package entry.');
          }

          if (pkg.name !== root.name || pkg.version !== root.version) {
            throw new Error(
              'package.json and package-lock.json metadata differ.'
            );
          }

          const placeholders = Object.entries(lock.packages || {})
            .filter(([path, entry]) =>
              path !== '' &&
              typeof entry.integrity === 'string' &&
              entry.integrity.includes('PLACEHOLDER')
            );

          if (placeholders.length > 0) {
            throw new Error(
              'Placeholder integrity hashes remain in package-lock.json.'
            );
          }

          console.log(`Validated ${pkg.name}@${pkg.version}.`);
          NODE

      - name: Check for lockfile changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi

      - name: Commit lockfile update
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- package-lock.json

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "chore: update package-lock.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
