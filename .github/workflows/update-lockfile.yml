
# =============================================================================
# MedOrbits -- Update Lockfile
# File: .github/workflows/update-lockfile.yml
# Purpose: Validate or refresh the root npm package-lock.json.
# Node.js: 22
# Security: No automatic commits or pushes.
# =============================================================================

name: Update Lockfile

on:
  workflow_dispatch:
    inputs:
      update_mode:
        description: "Select the lockfile operation"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - refresh

      target_branch:
        description: "Existing branch to check out"
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: update-lockfile-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: Validate or Refresh npm Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$TARGET_BRANCH" ]] ||
             [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$TARGET_BRANCH" == -* ]] ||
             [[ "$TARGET_BRANCH" == *..* ]] ||
             [[ "$TARGET_BRANCH" == */ ]] ||
             [[ "$TARGET_BRANCH" == *//* ]] ||
             [[ "$TARGET_BRANCH" == *\\* ]]; then
            echo "::error::Invalid target branch name."
            exit 1
          fi

          if ! git check-ref-format "refs/heads/$TARGET_BRANCH"; then
            echo "::error::Target is not a valid Git branch name."
            exit 1
          fi

      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm project and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json was not found."
            exit 1
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::Root package-lock.json was not found."
            exit 1
          fi

          node -e '
            const fs = require("node:fs");

            const pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );

            const lock = JSON.parse(
              fs.readFileSync("package-lock.json", "utf8")
            );

            if (lock.lockfileVersion === undefined) {
              throw new Error("package-lock.json has no lockfileVersion.");
            }

            if (
              lock.name &&
              pkg.name &&
              lock.name !== pkg.name
            ) {
              throw new Error(
                "package.json and package-lock.json names differ."
              );
            }

            if (
              lock.version &&
              pkg.version &&
              lock.version !== pkg.version
            ) {
              throw new Error(
                "package.json and package-lock.json versions differ."
              );
            }

            console.log("Package manifest and lockfile are valid JSON.");
            console.log("Lockfile version:", lock.lockfileVersion);
          '

          node --version
          npm --version

      - name: Validate existing lockfile
        if: inputs.update_mode == 'validate'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Refresh lockfile
        if: inputs.update_mode == 'refresh'
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Verify refreshed lockfile
        if: inputs.update_mode == 'refresh'
        shell: bash
        run: |
          set -Eeuo pipefail

          node -e '
            JSON.parse(
              require("node:fs").readFileSync(
                "package-lock.json",
                "utf8"
              )
            );
          '

          npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload refreshed lockfile
        if: success() && inputs.update_mode == 'refresh'
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.run_number }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          UPDATE_MODE: ${{ inputs.update_mode }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail

          {
            echo "## npm Lockfile Operation"
            echo
            echo "- Status: **$JOB_STATUS**"
            echo "- Mode: \`$UPDATE_MODE\`"
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- Lockfile: \`package-lock.json\`"
            echo
            if [[ "$UPDATE_MODE" == "refresh" &&
                  "$JOB_STATUS" == "success" ]]; then
              echo "The refreshed lockfile is available as a workflow artifact."
            elif [[ "$UPDATE_MODE" == "validate" &&
                    "$JOB_STATUS" == "success" ]]; then
              echo "The existing lockfile passed npm ci validation."
            fi
            echo
            echo "No repository changes were committed or pushed."
          } >> "$GITHUB_STEP_SUMMARY"
