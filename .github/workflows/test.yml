
# =============================================================================
# MedOrbits -- Repository Test and Validation Workflow
# File: .github/workflows/test.yml
# Python: 3.10+
# Node.js: 20
# =============================================================================

name: Test and Validate

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository Structure and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Compile Python files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          excluded = {
              ".git", ".venv", "venv", "node_modules",
              "__pycache__", "dist", "build"
          }
          files = [
              path for path in pathlib.Path(".").rglob("*.py")
              if not any(part in excluded for part in path.parts)
          ]

          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)

          print(f"Successfully compiled {len(files)} Python files.")
          PY

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail

          if find . \
            -path ./.git -prune -o \
            -path ./node_modules -prune -o \
            -path ./.venv -prune -o \
            -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            -print -quit | grep -q .; then
            python -m pytest -ra
          else
            echo "No Python test files found; skipping pytest."
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import sys

          excluded = {
              ".git", ".venv", "venv", "node_modules",
              "__pycache__", "dist", "build"
          }
          files = [
              path for path in pathlib.Path(".").rglob("*.json")
              if not any(part in excluded for part in path.parts)
          ]

          failures = []
          for path in files:
              try:
                  with path.open(encoding="utf-8") as stream:
                      json.load(stream)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(files)} JSON files.")
          PY

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail

          if ! python -c "import yaml" >/dev/null 2>&1; then
            python -m pip install PyYAML
          fi

          python - <<'PY'
          import pathlib
          import sys
          import yaml

          excluded = {
              ".git", ".venv", "venv", "node_modules",
              "__pycache__", "dist", "build"
          }
          files = [
              path
              for pattern in ("*.yml", "*.yaml")
              for path in pathlib.Path(".").rglob(pattern)
              if not any(part in excluded for part in path.parts)
          ]

          failures = []
          for path in files:
              try:
                  with path.open(encoding="utf-8") as stream:
                      list(yaml.safe_load_all(stream))
              except (OSError, UnicodeError, yaml.YAMLError) as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(files)} YAML files.")
          PY

  node-checks:
    name: Node.js and JavaScript Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate package manifest
        if: hashFiles('package.json') != ''
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid JSON')"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json && ! -d assets/js && ! -d js && ! -d scripts ]]; then
            echo "No recognized JavaScript project paths found."
            exit 0
          fi

          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const excluded = new Set([
            ".git", ".venv", "venv", "node_modules",
            "dist", "build", "coverage"
          ]);

          const files = [];
          function walk(directory) {
            let entries;
            try {
              entries = fs.readdirSync(directory, { withFileTypes: true });
            } catch (error) {
              console.error(`Cannot read ${directory}: ${error.message}`);
              process.exitCode = 1;
              return;
            }

            for (const entry of entries) {
              if (excluded.has(entry.name)) continue;
              const fullPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (entry.isFile() && /\.(?:cjs|mjs|js)$/.test(entry.name)) {
                files.push(fullPath);
              }
            }
          }

          for (const directory of ["."]) walk(directory);

          const uniqueFiles = [...new Set(files)];
          let failed = false;

          for (const file of uniqueFiles) {
            const result = spawnSync(
              process.execPath,
              ["--check", file],
              { encoding: "utf8" }
            );

            if (result.status !== 0) {
              failed = true;
              console.error(`\nSyntax check failed: ${file}`);
              if (result.stdout) console.error(result.stdout);
              if (result.stderr) console.error(result.stderr);
            }
          }

          if (failed) process.exit(1);
          console.log(`Checked ${uniqueFiles.length} JavaScript files.`);
          NODE

      - name: Run configured npm tests
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --runInBand
          else
            echo "No npm test script configured; skipping."
          fi

  web-assets:
    name: Web Asset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HTML files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html.parser
          import pathlib
          import sys

          class HTMLChecker(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.errors = []

              def error(self, message):
                  self.errors.append(message)

          excluded = {
              ".git", ".venv", "venv", "node_modules",
              "dist", "build", "coverage"
          }
          files = [
              path for path in pathlib.Path(".").rglob("*.html")
              if not any(part in excluded for part in path.parts)
          ]

          failures = []
          for path in files:
              try:
                  source = path.read_text(encoding="utf-8")
                  checker = HTMLChecker()
                  checker.feed(source)
                  checker.close()
                  if checker.errors:
                      failures.append(f"{path}: {checker.errors}")
              except (OSError, UnicodeError, html.parser.HTMLParseError) as exc:
                  failures.append(f"{path}: {exc}")
              except Exception as exc:
                  failures.append(f"{path}: unexpected validation error: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)

          print(f"Parsed {len(files)} HTML files.")
          PY

      - name: Check for accidental empty web assets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pathlib
          import sys

          excluded = {
              ".git", ".venv", "venv", "node_modules",
              "dist", "build", "coverage"
          }
          extensions = {".html", ".css", ".js"}
          empty_files = [
              path for path in pathlib.Path(".").rglob("*")
              if path.is_file()
              and path.suffix.lower() in extensions
              and path.stat().st_size == 0
              and not any(part in excluded for part in path.parts)
          ]

          if empty_files:
              print(
                  "Empty web asset files found:\n" +
                  "\n".join(map(str, empty_files)),
                  file=sys.stderr
              )
              sys.exit(1)

          print("No empty HTML, CSS, or JavaScript files found.")
          PY

  security:
    name: Dependency and Secret Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked files for private-key headers
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            -- ':!*.lock' ':!*.min.js'; then
            echo "::error::Potential private-key material detected. Remove it and rotate the key if it was exposed."
            exit 1
          else
            echo "No private-key headers found in tracked text files."
          fi

      - name: Check for accidentally committed environment files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$|(^|/)\.env\.sample$|(^|/)\.env\.template$'; then
            echo "::warning::Tracked .env files detected. Verify they contain no credentials."
          else
            echo "No tracked .env files detected."
          fi

      - name: Audit npm dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs:
      - repository-checks
      - node-checks
      - web-assets
      - security
    if: always()

    steps:
      - name: Report job results
        shell: bash
        env:
          PYTHON_RESULT: ${{ needs.repository-checks.result }}
          NODE_RESULT: ${{ needs.node-checks.result }}
          WEB_RESULT: ${{ needs.web-assets.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          {
            echo "## MedOrbits Test Results"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Repository checks | ${PYTHON_RESULT} |"
            echo "| Node.js checks | ${NODE_RESULT} |"
            echo "| Web asset checks | ${WEB_RESULT} |"
            echo "| Security checks | ${SECURITY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PYTHON_RESULT" != "success" ||
                "$NODE_RESULT" != "success" ||
                "$WEB_RESULT" != "success" ]]; then
            echo "::error::One or more required validation jobs failed."
            exit 1
          fi
