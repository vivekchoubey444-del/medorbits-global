File: .github/workflows/release.yml

name: MedOrbits Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag (for example, v1.0.0)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: medorbits-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag points to checked-out commit
        id: commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_out_commit" ]]; then
            echo "::error::Tag and checked-out commit do not match."
            exit 1
          fi
          echo "sha=$checked_out_commit" >> "$GITHUB_OUTPUT"
          echo "Verified release commit: $checked_out_commit"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
      - name: Validate package metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const expectedVersion = process.env.RELEASE_TAG.slice(1);
          if (!pkg.name || !pkg.version) {
            throw new Error("package.json must declare name and version.");
          }
          if (pkg.version !== expectedVersion) {
            throw new Error(
              `Tag version ${expectedVersion} does not match package.json ${pkg.version}.`
            );
          }
          if (pkg.private === true) {
            console.warn("::notice::This package is marked private; this workflow creates a GitHub Release only.");
          }
          if (
            lock.name && lock.name !== pkg.name ||
            lock.version && lock.version !== pkg.version
          ) {
            throw new Error("package.json and package-lock.json metadata do not match.");
          }
          if (!Number.isInteger(lock.lockfileVersion)) {
            throw new Error("package-lock.json has an invalid lockfileVersion.");
          }
          if (!pkg.scripts?.test) {
            throw new Error("A test script is required before release.");
          }
          console.log(`Validated ${pkg.name}@${pkg.version}`);
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check server syntax when applicable
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f server.js ]]; then
            node --check server.js
          else
            echo "::notice::server.js is not present; skipping server syntax check."
          fi
      - name: Run release tests
        env:
          CI: "true"
          NODE_ENV: test
        run: npm test
      - name: Export validated release metadata
        id: release_metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
    outputs:
      release_tag: ${{ steps.release_metadata.outputs.tag }}
      release_sha: ${{ steps.release_metadata.outputs.sha }}
  publish:
    name: Create GitHub Release
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit and tag have not changed
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out commit differs from the validated release commit."
            exit 1
          fi
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release tag no longer points to the validated commit."
            exit 1
          fi
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $RELEASE_TAG."
            echo "No duplicate release will be created."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            --title "MedOrbits $RELEASE_TAG"
          echo "GitHub Release created: $RELEASE_TAG"

Before enabling releases

* Create the release environment in GitHub repository settings and configure required reviewers if approval is needed.
* Ensure the tag follows semantic versioning, such as v1.0.0, and matches package.json.
* Confirm npm test exists and succeeds.
* Protect release tags from unauthorized updates or deletion.
* Configure branch and tag policies appropriate to your release process.

Important: This workflow creates a GitHub Release; it does not publish to npm or deploy the website. Keep package publishing and production deployment in their own workflows so each can have its own credentials, approvals, and rollback strategy.