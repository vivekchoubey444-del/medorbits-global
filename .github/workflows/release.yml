
# File: .github/workflows/release.yml

name: MedOrbits Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve checked-out commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: $sha"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git rev-parse --verify "refs/tags/$RELEASE_TAG"

          package_version="$(node -p "require('./package.json').version")"
          expected_version="${RELEASE_TAG#v}"

          if [[ "$package_version" != "$expected_version" ]]; then
            echo "::error::Tag version does not match package.json."
            echo "Tag: $expected_version"
            echo "Package: $package_version"
            exit 1
          fi

          echo "Release version validated: $RELEASE_TAG"

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json server.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          if (lock.lockfileVersion !== 3) {
            throw new Error('Expected package-lock.json lockfileVersion 3.');
          }

          if (pkg.name !== lock.name || pkg.version !== lock.version) {
            throw new Error('package.json and package-lock.json metadata do not match.');
          }

          if (!pkg.scripts || !pkg.scripts.test) {
            throw new Error('A test script is required before release.');
          }

          console.log(`Validated ${pkg.name}@${pkg.version}`);
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Run release tests
        env:
          CI: "true"
          NODE_ENV: test
        run: npm test

      - name: Export verified release commit
        id: release_sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    environment:
      name: release

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out commit differs from the validated commit."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $RELEASE_TAG."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag \
            --title "MedOrbits $RELEASE_TAG"

          echo "GitHub Release created: $RELEASE_TAG"
