
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean
      target_branch:
        description: "Branch or commit to release from"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and target branch
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Use a valid semantic version such as 2.0.0 or 2.1.0-rc.1."
            exit 1
          fi

          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$TARGET_BRANCH" == -* ]] ||
             [[ "$TARGET_BRANCH" == *..* ]] ||
             [[ "$TARGET_BRANCH" == */ ]] ||
             [[ "$TARGET_BRANCH" == *//* ]]; then
            echo "::error::Invalid target branch or ref."
            exit 1
          fi

          tag="v$RELEASE_VERSION"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: $tag"

      - name: Validate package manifest when present
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "No root package.json found; skipping package validation."
            exit 0
          fi

          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Manifest version: ${pkg.version || "unspecified"}`);
          NODE

  publish:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag remains unused
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gh release create "$RELEASE_TAG" \
            --target "$TARGET_BRANCH" \
            --generate-notes \
            --draft

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --prerelease
          fi

          gh release edit "$RELEASE_TAG" --draft=false

      - name: Release summary
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "## Release Published"
            echo
            echo "- Repository: $REPOSITORY"
            echo "- Tag: $RELEASE_TAG"
            echo "- Prerelease: $PRERELEASE"
            echo "- Release: https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
