
name: MedOrbits Release Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: medorbits-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: false

      - name: Validate package.json
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::warning::package.json is missing; package validation skipped."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`Invalid package.json: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (pkg.name !== undefined && typeof pkg.name !== "string") {
            throw new Error("package.json name must be a string.");
          }

          if (pkg.scripts !== undefined &&
              (!pkg.scripts ||
               typeof pkg.scripts !== "object" ||
               Array.isArray(pkg.scripts))) {
            throw new Error("package.json scripts must be an object.");
          }

          console.log("package.json syntax and structure passed.");
          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Node.js: ${process.version}`);
          NODE

      - name: Check package-lock.json without installing dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package-lock.json ]]; then
            echo "::warning::package-lock.json is missing. Generate a real lockfile before running npm ci."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");

          let lock;

          try {
            lock = JSON.parse(
              fs.readFileSync("package-lock.json", "utf8")
            );
          } catch (error) {
            console.error(`Invalid package-lock.json: ${error.message}`);
            process.exit(1);
          }

          if (!lock || typeof lock !== "object" || Array.isArray(lock)) {
            throw new Error("package-lock.json must contain a JSON object.");
          }

          if (![1, 2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          if (lock.lockfileVersion >= 2 &&
              (!lock.packages ||
               typeof lock.packages !== "object" ||
               Array.isArray(lock.packages))) {
            throw new Error(
              "The lockfile is missing a valid packages object."
            );
          }

          console.log("package-lock.json is valid JSON.");
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          NODE

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const excluded = new Set([
            ".git",
            "node_modules",
            ".venv",
            "venv",
            "vendor",
            "__pycache__",
            ".next",
            "dist",
            "build",
            "coverage"
          ]);

          const extensions = new Set([".js", ".mjs", ".cjs"]);
          const files = [];

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, {
              withFileTypes: true
            })) {
              if (entry.isSymbolicLink()) continue;
              if (entry.isDirectory() && excluded.has(entry.name)) continue;

              const file = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                walk(file);
              } else if (
                entry.isFile() &&
                extensions.has(path.extname(entry.name).toLowerCase())
              ) {
                files.push(file);
              }
            }
          }

          walk(".");
          let failed = false;

          for (const file of files.sort()) {
            const result = spawnSync(
              process.execPath,
              ["--check", file],
              { encoding: "utf8" }
            );

            if (result.error || result.status !== 0) {
              failed = true;
              console.error(`[FAIL] ${file}`);

              if (result.stderr) {
                console.error(result.stderr.trim());
              }

              if (result.error) {
                console.error(result.error.message);
              }
            } else {
              console.log(`[PASS] ${file}`);
            }
          }

          console.log(`JavaScript files checked: ${files.length}`);

          if (failed) process.exit(1);
          NODE

      - name: Write workflow summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "# MedOrbits Release Validation"
            echo
            echo "- Result: ${JOB_STATUS}"
            echo "- Release publishing: disabled"
            echo "- Dependency installation: skipped"
            echo
            echo "This workflow checks package metadata and JavaScript syntax."
          } >> "$GITHUB_STEP_SUMMARY"
