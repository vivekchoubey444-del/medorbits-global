name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 2.0.0)"
        required: true
        type: string
      release_type:
        description: "Release classification"
        required: true
        type: choice
        options:
          - stable
          - prerelease
      confirm_release:
        description: "Type release to confirm"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: medorbits-release
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and confirmation
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CONFIRMATION: ${{ inputs.confirm_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "release" ]]; then
            echo "::error::Release cancelled. Enter exactly 'release' to confirm."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version. Example: 2.0.0"
            exit 1
          fi
          if [[ "$RELEASE_TYPE" != "stable" && "$RELEASE_TYPE" != "prerelease" ]]; then
            echo "::error::Unsupported release type."
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "stable" && "$RELEASE_VERSION" == *-* ]]; then
            echo "::error::Stable releases cannot use a prerelease version."
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "prerelease" && "$RELEASE_VERSION" != *-* ]]; then
            echo "::error::Prereleases must include a prerelease suffix, such as 2.1.0-rc.1."
            exit 1
          fi
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TYPE" == "prerelease" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Confirm release source branch
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi
      - name: Check repository metadata
        run: |
          set -euo pipefail
          if [[ ! -f README.md ]]; then
            echo "::warning::README.md was not found at the repository root."
          fi
          echo "Release source validation completed."
  release:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify tag does not exist remotely
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_TAG} already exists on the remote."
            exit 1
          fi
      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "$RELEASE_TAG"
            --repo "$REPOSITORY"
            --title "MedOrbits ${RELEASE_VERSION}"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          ]
          fi
          gh "${args[@]}"