
name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, e.g. 1.2.0"
        required: true
        type: string

      target_branch:
        description: "Branch to release"
        required: true
        type: string
        default: main

      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Validate target branch input
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$TARGET_BRANCH" ]] ||
             [[ "$TARGET_BRANCH" == -* ]] ||
             [[ "$TARGET_BRANCH" == *..* ]] ||
             ! git check-ref-format "refs/heads/$TARGET_BRANCH"; then
            echo "::error::Invalid target branch name."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and resolve commit
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.RELEASE_VERSION;
          const prerelease = process.env.PRERELEASE === "true";

          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;

          if (typeof version !== "string" || !semver.test(version)) {
            throw new Error(
              "Version must follow SemVer, for example 1.2.0 or 1.2.0-rc.1."
            );
          }

          if (version.includes("-") && !prerelease) {
            throw new Error(
              "A version with a prerelease identifier must be marked as a prerelease."
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `version=${version}\n` +
            `tag=v${version}\n` +
            `prerelease=${prerelease}\n`
          );
          NODE

          sha="$(git rev-parse --verify 'HEAD^{commit}')"

          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the target commit."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "::error::The tag v${RELEASE_VERSION} already exists locally."
            exit 1
          fi

      - name: Validate package version if applicable
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "No root package.json; package version check skipped."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (
            pkg.version &&
            pkg.version !== process.env.RELEASE_VERSION
          ) {
            throw new Error(
              `Release version ${process.env.RELEASE_VERSION} does not match package.json version ${pkg.version}.`
            );
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Version: ${pkg.version || "not specified"}`);
          NODE

  publish:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_sha="$(git rev-parse --verify 'HEAD^{commit}')"

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out commit differs from the validated commit."
            exit 1
          fi

      - name: Check remote tag availability
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/$RELEASE_TAG^{}" >/dev/null 2>&1; then
            echo "::error::Remote tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $RELEASE_TAG already exists."
            exit 1
          fi

          args=(
            "$RELEASE_TAG"
            --repo "$REPOSITORY"
            --target "$RELEASE_SHA"
            --generate-notes
            --draft
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gh release edit "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json tagName,isDraft,isPrerelease

      - name: Release summary
        if: success()
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo "## Release Published"
            echo
            echo "- Repository: $REPOSITORY"
            echo "- Tag: $RELEASE_TAG"
            echo "- Commit: $RELEASE_SHA"
            echo "- Prerelease: $PRERELEASE"
            echo "- URL: https://github.com/$REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "- Automatic source edits: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
