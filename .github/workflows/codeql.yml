
name: MedOrbits CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  schedule:
    # Every Monday at 03:23 UTC.
    - cron: "23 3 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json package-lock.json; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          echo "Required project files are present."

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );

          if (typeof pkg.name !== 'string' || !pkg.name.trim()) {
            throw new Error(
              'package.json must define a non-empty package name.'
            );
          }

          if (!lock.packages || !lock.packages['']) {
            throw new Error(
              'package-lock.json is missing its root package entry.'
            );
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error(
              `Unsupported lockfileVersion: ${lock.lockfileVersion}`
            );
          }

          const root = lock.packages[''];

          if (pkg.name !== root.name) {
            throw new Error(
              'package.json and package-lock.json names do not match.'
            );
          }

          if (pkg.version && root.version && pkg.version !== root.version) {
            throw new Error(
              'package.json and package-lock.json versions do not match.'
            );
          }

          if (pkg.engines?.node) {
            console.log(`Declared Node.js requirement: ${pkg.engines.node}`);
          } else {
            console.warn('No Node.js engine requirement is declared.');
          }

          console.log(`Project: ${pkg.name}`);
          console.log('Package metadata validated successfully.');
          NODE

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const excluded = new Set([
            '.git',
            'node_modules',
            'coverage',
            'dist',
            'build',
            '.next',
            '.wrangler',
            '.cache',
            '.turbo'
          ]);

          const files = [];
          const failures = [];

          function walk(directory) {
            let entries;

            try {
              entries = fs.readdirSync(directory, {
                withFileTypes: true
              });
            } catch (error) {
              failures.push(`${directory}: ${error.message}`);
              return;
            }

            for (const entry of entries) {
              const fullPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) {
                  walk(fullPath);
                }
              } else if (
                entry.isFile() &&
                entry.name.endsWith('.json')
              ) {
                files.push(fullPath);
              }
            }
          }

          walk('.');

          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log(`PASS ${file}`);
            } catch (error) {
              failures.push(`${file}: ${error.message}`);
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }

          console.log(`Validated ${files.length} JSON file(s).`);

          if (files.length === 0) {
            console.warn('No JSON files were found.');
          }

          if (failures.length > 0) {
            console.error(
              `${failures.length} JSON validation error(s) detected.`
            );
            process.exitCode = 1;
          }
          NODE

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          CI: "true"

      - name: Run automated tests when configured
        shell: bash
        env:
          CI: "true"
          NODE_ENV: test
        run: |
          set -euo pipefail

          if node -e "process.exit(typeof require('./package.json').scripts?.test === 'string' ? 0 : 1)"; then
            npm test
          else
            echo "::notice::No test script is configured; tests skipped."
          fi

      - name: Write validation summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## MedOrbits Repository Validation"
            echo
            echo "- **Status:** \`${JOB_STATUS}\`"
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Ref:** \`${GITHUB_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: CodeQL JavaScript and TypeScript Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Write CodeQL summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## MedOrbits CodeQL Analysis"
            echo
            echo "- **Status:** \`${JOB_STATUS}\`"
            echo "- **Languages:** JavaScript and TypeScript"
            echo "- **Query suite:** security-extended"
          } >> "$GITHUB_STEP_SUMMARY"
