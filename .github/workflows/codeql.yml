Important notes

* CodeQL version: github/codeql-action@v4 is the supported major version in the official repository. <Cite refs={["turn244522search0","turn244522search1"]}/>
* Permissions: security-events: write is granted only to the analysis job, rather than the entire workflow.
* Analysis scope: This workflow analyzes JavaScript and TypeScript. It does not automatically analyze HTML, CSS, JSON, or every other language in your repository.
* Pull requests from forks: GitHub may restrict security-event uploads for fork-originated pull requests. Do not weaken repository security settings merely to force uploads.
* Dependency installation: npm ci --ignore-scripts prevents package lifecycle scripts from running in the validation job. If your tests require native modules or build steps, you may need a separate, carefully reviewed installation step.
* Code scanning setup: Do not enable GitHub’s default CodeQL setup alongside this advanced workflow without reviewing the configuration, because default setup can override or disable existing advanced workflows. <Cite refs={["turn244522search4"]}/>
* Action maintenance: @v4 follows the latest release within the major version. For stricter supply-chain control, pin actions to reviewed full commit SHAs and maintain those pins deliberately.

This workflow complements your ci.yml and dependency-review.yml; it does not replace either one.