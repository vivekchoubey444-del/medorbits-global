
name: Repository Security Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript and Node.js syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          count=0
          errors=0

          while IFS= read -r -d '' file; do
            case "$file" in
              *.js|*.cjs|*.mjs)
                ;;
              *)
                continue
                ;;
            esac

            # Skip generated and vendored directories.
            case "/$file/" in
              */node_modules/*|*/vendor/*|*/dist/*|*/build/*)
                continue
                ;;
            esac

            count=$((count + 1))

            if ! output="$(node --check "$file" 2>&1)"; then
              printf '\nFAIL: %s\n%s\n' "$file" "$output"
              errors=$((errors + 1))
            fi
          done < <(git ls-files -z)

          echo "JavaScript files checked: $count"

          if (( errors > 0 )); then
            echo "JavaScript syntax errors: $errors"
            exit 1
          fi

          echo "JavaScript syntax validation passed."

      - name: Validate Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          import ast
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )

          files = result.stdout.decode("utf-8", errors="surrogateescape")
          paths = files.split("\0")
          checked = 0
          errors = []

          excluded = (
              "node_modules/",
              ".venv/",
              "venv/",
              "site-packages/",
              "vendor/",
              "dist/",
              "build/",
          )

          for name in paths:
              if not name.endswith(".py"):
                  continue

              if any(part in name for part in excluded):
                  continue

              try:
                  with open(name, "r", encoding="utf-8-sig") as source:
                      ast.parse(source.read(), filename=name)
                  checked += 1
              except (OSError, SyntaxError, UnicodeError) as exc:
                  errors.append(f"{name}: {exc}")

          print(f"Python files checked: {checked}")

          if errors:
              print("\nPython syntax errors:")
              for error in errors:
                  print(f" - {error}")
              sys.exit(1)

          print("Python syntax validation passed.")
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          set -Eeuo pipefail

          count=0
          errors=0

          while IFS= read -r -d '' file; do
            case "$file" in
              *.json)
                ;;
              *)
                continue
                ;;
            esac

            case "/$file/" in
              */node_modules/*|*/vendor/*|*/dist/*|*/build/*)
                continue
                ;;
            esac

            count=$((count + 1))

            if ! output="$(node -e '
              const fs = require("node:fs");
              JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            ' "$file" 2>&1)"; then
              printf '\nFAIL: %s\n%s\n' "$file" "$output"
              errors=$((errors + 1))
            fi
          done < <(git ls-files -z)

          echo "JSON files checked: $count"

          if (( errors > 0 )); then
            echo "JSON validation errors: $errors"
            exit 1
          fi

          echo "JSON validation passed."

      - name: Validate shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail

          count=0
          errors=0

          while IFS= read -r -d '' file; do
            case "$file" in
              *.sh)
                ;;
              *)
                continue
                ;;
            esac

            case "/$file/" in
              */vendor/*|*/node_modules/*)
                continue
                ;;
            esac

            count=$((count + 1))

            if ! output="$(bash -n "$file" 2>&1)"; then
              printf '\nFAIL: %s\n%s\n' "$file" "$output"
              errors=$((errors + 1))
            fi
          done < <(git ls-files -z)

          echo "Shell scripts checked: $count"

          if (( errors > 0 )); then
            echo "Shell syntax errors: $errors"
            exit 1
          fi

          echo "Shell syntax validation passed."

      - name: Validate root package manifest and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "No root package.json; skipping root npm validation."
            exit 0
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!manifest || typeof manifest !== "object" ||
              Array.isArray(manifest)) {
            throw new Error("Root package.json must be a JSON object.");
          }

          if (typeof manifest.name !== "string" ||
              !manifest.name.trim()) {
            throw new Error('Root package.json needs a valid "name".');
          }

          if (fs.existsSync("package-lock.json")) {
            const lock = JSON.parse(
              fs.readFileSync("package-lock.json", "utf8")
            );

            if (lock.name && lock.name !== manifest.name) {
              throw new Error(
                "Root package-lock.json name does not match package.json."
              );
            }

            if (lock.lockfileVersion !== 3) {
              throw new Error(
                "Expected npm lockfile version 3; regenerate it with npm."
              );
            }

            if (!lock.packages || !lock.packages[""]) {
              throw new Error(
                'Lockfile is missing its root packages[""] entry.'
              );
            }

            console.log("Root npm manifest and lockfile are valid.");
          } else {
            console.log(
              "WARNING: package-lock.json is missing; lockfile generation is required."
            );
          }
          NODE

      - name: Write validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository Security Validation"
            echo
            echo "- JavaScript syntax validation"
            echo "- Python syntax validation"
            echo "- JSON validation"
            echo "- Shell syntax validation"
            echo "- Root npm manifest and lockfile validation"
            echo
            echo "See the job steps above for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"
