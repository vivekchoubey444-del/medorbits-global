File: .github/workflows/codeql.yml

name: MedOrbits CodeQL Security Analysis
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Every Monday at 03:23 UTC.
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Repository and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "::error::package.json was not found in the repository root."
            exit 1
          fi
          if [[ ! -f package-lock.json ]]; then
            echo "::error::package-lock.json is required for reproducible npm ci installations."
            exit 1
          fi
          echo "Required project files are present."
      - name: Validate package.json and Node.js requirement
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          let pkg;
          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package.json: ${error.message}`);
            process.exit(1);
          }
          if (pkg.engines?.node) {
            console.log(`Declared Node.js requirement: ${pkg.engines.node}`);
          } else {
            console.warn("::notice::No Node.js engine requirement is declared.");
          }
          console.log(`Project: ${pkg.name || "Unnamed project"}`);
          console.log("package.json is valid.");
          NODE
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const excluded = new Set([
            ".git",
            "node_modules",
            "coverage",
            "dist",
            "build",
            ".next",
            ".wrangler",
            ".cache",
            ".turbo"
          ]);
          const files = [];
          const failures = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) {
                  walk(full);
                }
              } else if (
                entry.isFile() &&
                entry.name.endsWith(".json")
              ) {
                files.push(full);
              }
            }
          }
          walk(".");
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`PASS ${file}`);
            } catch (error) {
              failures.push(file);
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }
          console.log(`Validated ${files.length} JSON file(s).`);
          if (failures.length > 0) {
            console.error(
              `${failures.length} JSON file(s) failed validation.`
            );
            process.exit(1);
          }
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          CI: "true"
      - name: Run automated tests when configured
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::notice::No test script is configured; tests skipped."
          fi
  analyze:
    name: CodeQL JavaScript and TypeScript Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

