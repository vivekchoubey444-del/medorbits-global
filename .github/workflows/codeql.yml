
# ============================================================
# MEDORBITS -- CODEQL SECURITY ANALYSIS
# File: /.github/workflows/codeql.yml
#
# Purpose:
#   - Static Application Security Testing (SAST)
#   - JavaScript and TypeScript vulnerability detection
#   - Repository and JSON validation
#   - Dependency installation and test execution
#   - GitHub Security Dashboard integration
#
# Runtime: Node.js 26
# ============================================================

name: MedOrbits CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  schedule:
    - cron: "23 3 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # 1. REPOSITORY VALIDATION
  # ==========================================================

  validate:
    name: Repository and Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json is missing."
            exit 1
          }

          node <<'NODE'
          const fs = require("node:fs");

          let pkg;

          try {
            pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );
          } catch (error) {
            console.error(
              `::error::Invalid package.json: ${error.message}`
            );
            process.exit(1);
          }

          console.log(`Project: ${pkg.name || "MedOrbits"}`);
          console.log(`Version: ${pkg.version || "Not specified"}`);
          console.log(`Node.js: ${process.version}`);

          if (pkg.engines?.node) {
            console.log(
              `Required Node.js: ${pkg.engines.node}`
            );
          }
          NODE

      # ------------------------------------------------------
      # JAVASCRIPT SYNTAX
      # ------------------------------------------------------

      - name: Validate tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count + 1))
          done < <(
            git ls-files -z -- '*.js' '*.mjs' '*.cjs'
          )

          echo "Checked $count JavaScript file(s)."

      # ------------------------------------------------------
      # JSON VALIDATION
      # ------------------------------------------------------

      - name: Validate tracked JSON files
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const files = execFileSync(
            "git",
            ["ls-files", "-z", "--", "*.json"],
            { encoding: "utf8" }
          ).split("\0").filter(Boolean);

          let failures = 0;

          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`PASS ${file}`);
            } catch (error) {
              failures++;
              console.error(
                `FAIL ${file}: ${error.message}`
              );
            }
          }

          console.log(
            `Checked ${files.length} JSON file(s).`
          );

          if (failures > 0) {
            process.exitCode = 1;
          }
          NODE

      # ------------------------------------------------------
      # DEPENDENCY INSTALLATION
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CI: "true"

      # ------------------------------------------------------
      # AUTOMATED TESTING
      # ------------------------------------------------------

      - name: Run automated tests when configured
        shell: bash
        run: |
          set -euo pipefail

          if node -e "
            process.exit(
              require('./package.json').scripts?.test ? 0 : 1
            )
          "; then
            npm test
          else
            echo "::notice::No test script configured."
          fi

  # ==========================================================
  # 2. CODEQL STATIC SECURITY ANALYSIS
  # ==========================================================

  analyze:
    name: CodeQL JavaScript and TypeScript Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - validate

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ------------------------------------------------------
      # INITIALIZE CODEQL
      # ------------------------------------------------------

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      # ------------------------------------------------------
      # ANALYZE SOURCE CODE
      # ------------------------------------------------------

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      # ------------------------------------------------------
      # COMPLETION
      # ------------------------------------------------------

      - name: Security analysis summary
        if: success()
        run: |
          echo "MedOrbits CodeQL analysis completed."
          echo "Review findings in GitHub Security."

# ============================================================
# END OF MEDORBITS CODEQL WORKFLOW
# ============================================================
