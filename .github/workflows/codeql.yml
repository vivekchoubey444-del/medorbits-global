
# ==============================================================================
# MedOrbits -- CodeQL Security Analysis
# File: .github/workflows/codeql.yml
# Release: 2.2.0
#
# Purpose:
#   Detect security vulnerabilities in JavaScript, TypeScript, and Python.
#
# Security:
#   - Least-privilege GitHub Actions permissions.
#   - Independent analysis jobs for each language.
#   - Security-extended query suite.
#   - No automatic merging, deployment, or source modification.
# ==============================================================================

name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  schedule:
    # Every Monday at 03:23 UTC.
    - cron: "23 3 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} for vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: true
