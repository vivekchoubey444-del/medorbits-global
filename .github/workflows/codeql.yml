
name: MedOrbits CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          echo "package.json exists"

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid')"

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const excluded = new Set([
            ".git",
            "node_modules",
            "coverage",
            "dist",
            "build",
            ".next",
            ".wrangler"
          ]);

          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (!excluded.has(entry.name)) walk(full);
              } else if (entry.isFile() && entry.name.endsWith(".json")) {
                files.push(full);
              }
            }
          }

          walk(".");

          let failed = false;

          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log(`PASS ${file}`);
            } catch (error) {
              failed = true;
              console.error(`FAIL ${file}: ${error.message}`);
            }
          }

          if (failed) process.exit(1);
          console.log(`Validated ${files.length} JSON files.`);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        if: ${{ hashFiles('package-lock.json') != '' }}

      - name: Run available tests
        run: npm test --if-present
        if: ${{ hashFiles('package-lock.json') != '' }}

  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
