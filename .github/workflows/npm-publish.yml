
name: Publish npm Package

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and simulate publishing without releasing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, Test and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Validate package metadata and lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f package.json || {
            echo "::error::Root package.json is missing."
            exit 1
          }

          if [[ ! -f npm-shrinkwrap.json && ! -f package-lock.json ]]; then
            echo "::error::Commit package-lock.json or npm-shrinkwrap.json."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          let pkg;
          let lock;

          try {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

            const lockPath = fs.existsSync("npm-shrinkwrap.json")
              ? "npm-shrinkwrap.json"
              : "package-lock.json";

            lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          } catch (error) {
            console.error(`::error::Invalid package metadata: ${error.message}`);
            process.exit(1);
          }

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (typeof pkg.name !== "string" || !pkg.name.trim()) {
            throw new Error("A valid package name is required.");
          }

          if (
            typeof pkg.version !== "string" ||
            !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(pkg.version)
          ) {
            throw new Error("package.json must contain a valid semantic version.");
          }

          if (pkg.private === true) {
            throw new Error("Cannot publish a package marked private.");
          }

          const configuredRegistry = pkg.publishConfig?.registry;
          if (
            configuredRegistry &&
            configuredRegistry.replace(/\/+$/, "") !==
              "https://registry.npmjs.org"
          ) {
            throw new Error("Unexpected publishConfig.registry.");
          }

          if (![2, 3].includes(lock.lockfileVersion)) {
            throw new Error("Unsupported npm lockfile version.");
          }

          if (!lock.packages || typeof lock.packages !== "object") {
            throw new Error("Lockfile is missing its packages object.");
          }

          const root = lock.packages[""];
          if (!root || typeof root !== "object") {
            throw new Error('Lockfile is missing packages[""].');
          }

          for (const key of ["name", "version"]) {
            if (
              pkg[key] !== undefined &&
              root[key] !== undefined &&
              pkg[key] !== root[key]
            ) {
              throw new Error(`package.json ${key} does not match the lockfile.`);
            }
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          console.log(`Lockfile version: ${lock.lockfileVersion}`);
          NODE

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NORMALIZED_TAG="${RELEASE_TAG#v}"

          if [[ "$NORMALIZED_TAG" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

          echo "Release tag matches package version."

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Validate package configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          npm pkg get name version private
          npm --version
          node --version

      - name: Run package tests
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::error::No test script is defined. Configure tests before publishing."
            exit 1
          fi

      - name: Run package build
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm run build
          else
            echo "No build script defined; skipping build."
          fi

      - name: Inspect package contents
        shell: bash
        run: |
          set -Eeuo pipefail
          npm pack --dry-run --ignore-scripts

      - name: Simulate publishing on manual dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        shell: bash
        run: |
          set -Eeuo pipefail
          npm publish --dry-run --ignore-scripts

      - name: Publish tagged release
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is missing."
            exit 1
          fi

          npm publish --ignore-scripts

      - name: Publish manually
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is missing."
            exit 1
          fi

          npm publish --ignore-scripts

      - name: Write publishing summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          {
            echo "## npm Package Publishing"
            echo
            echo "- Status: ${STATUS}"
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Manual dry run: ${DRY_RUN:-not applicable}"
            echo "- Node.js: 22"
            echo "- Repository write permissions: disabled"
            echo "- npm publish lifecycle scripts: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
