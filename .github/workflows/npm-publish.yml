
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type publish to authorize npm publication"
        required: true
        type: string
      access:
        description: "npm package access level"
        required: true
        type: choice
        default: public
        options:
          - public
          - restricted
      tag:
        description: "npm distribution tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and Pack npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      package_access: ${{ steps.package.outputs.access }}
      package_tarball: ${{ steps.pack.outputs.filename }}
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Verify publication confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_publish }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$CONFIRMATION" != "publish" ]]; then
            echo "::error::Publication cancelled. Enter exactly 'publish' to continue."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record validated commit
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Validate package manifest and lockfile
        id: package
        env:
          REQUESTED_ACCESS: ${{ inputs.access }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json was not found."
            exit 1
          fi

          if [[ -f npm-shrinkwrap.json ]]; then
            lockfile="npm-shrinkwrap.json"
          elif [[ -f package-lock.json ]]; then
            lockfile="package-lock.json"
          else
            echo "::error::Neither package-lock.json nor npm-shrinkwrap.json was found."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (
            pkg === null ||
            typeof pkg !== "object" ||
            Array.isArray(pkg)
          ) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (typeof pkg.name !== "string" || !pkg.name.trim()) {
            throw new Error("A valid package name is required.");
          }

          if (
            typeof pkg.version !== "string" ||
            !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.test(pkg.version)
          ) {
            throw new Error("A valid semantic version is required.");
          }

          if (pkg.private === true) {
            throw new Error("Private packages cannot be published.");
          }

          if (pkg.workspaces !== undefined) {
            throw new Error(
              "This workflow publishes a single root package. Configure a dedicated workspace publishing workflow."
            );
          }

          const registry = pkg.publishConfig?.registry;
          if (
            registry !== undefined &&
            registry !== "https://registry.npmjs.org/"
          ) {
            throw new Error(
              "publishConfig.registry must be https://registry.npmjs.org/."
            );
          }

          if (
            pkg.publishConfig?.access !== undefined &&
            !["public", "restricted"].includes(pkg.publishConfig.access)
          ) {
            throw new Error("Unsupported publishConfig.access value.");
          }

          const requestedAccess = process.env.REQUESTED_ACCESS;

          if (
            requestedAccess === "restricted" &&
            !pkg.name.startsWith("@")
          ) {
            throw new Error(
              "Restricted access requires a scoped npm package name such as @scope/package."
            );
          }

          if (
            pkg.name.startsWith("@") &&
            !/^@[^/]+\/[^/]+$/.test(pkg.name)
          ) {
            throw new Error("Invalid scoped npm package name.");
          }

          if (!["public", "restricted"].includes(requestedAccess)) {
            throw new Error("Invalid requested package access.");
          }

          if (
            pkg.publishConfig?.access &&
            pkg.publishConfig.access !== requestedAccess
          ) {
            throw new Error(
              "Requested access conflicts with package.json publishConfig.access."
            );
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(
            output,
            `name=${pkg.name}\n` +
            `version=${pkg.version}\n` +
            `access=${requestedAccess}\n`
          );

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          console.log(`Access: ${requestedAccess}`);
          NODE

          echo "Authoritative lockfile: $lockfile"

      - name: Validate lockfile consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run package tests when available
        shell: bash
        run: |
          set -Eeuo pipefail

          if node -e \
            "process.exit(require('./package.json').scripts?.test ? 0 : 1)"
          then
            npm test
          else
            echo "::notice::No test script is configured; package tests were skipped."
          fi

      - name: Check npm version availability
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version \
            --json \
            --registry=https://registry.npmjs.org/ \
            >"$stdout_file" 2>"$stderr_file"; then

            echo "::error::Version $PACKAGE_VERSION is already published."
            exit 1
          fi

          if grep -Eq 'E404|404 Not Found|404 \(Not Found\)' "$stderr_file"; then
            echo "Version is not listed in the npm registry."
          else
            echo "::error::Could not reliably check npm version availability."
            cat "$stderr_file"
            exit 1
          fi

      - name: Create publication tarball
        id: pack
        shell: bash
        run: |
          set -Eeuo pipefail

          npm pack --ignore-scripts --json > pack-result.json

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const result = JSON.parse(
            fs.readFileSync("pack-result.json", "utf8")
          );

          if (!Array.isArray(result) || result.length !== 1) {
            throw new Error("Unexpected npm pack output.");
          }

          const filename = result[0].filename;

          if (
            typeof filename !== "string" ||
            !filename.endsWith(".tgz") ||
            path.basename(filename) !== filename ||
            !fs.existsSync(filename)
          ) {
            throw new Error("The generated package tarball is invalid.");
          }

          if (fs.statSync(filename).size === 0) {
            throw new Error("The generated package tarball is empty.");
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `filename=${filename}\n`
          );

          console.log(`Created package artifact: ${filename}`);
          NODE

      - name: Upload validated package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-tarball
          path: ${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## npm Package Validation"
            echo
            echo "- Result: $JOB_STATUS"
            echo "- Package: ${PACKAGE_NAME:-not validated}"
            echo "- Version: ${PACKAGE_VERSION:-not validated}"
            echo "- Commit: ${COMMIT_SHA:-not recorded}"
            echo "- Automatic version changes: disabled"
            echo "- Automatic commits and merges: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Validated Artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: npm-production

    permissions:
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download validated package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package-tarball
          path: dist

      - name: Verify downloaded artifact
        env:
          EXPECTED_TARBALL: ${{ needs.validate.outputs.package_tarball }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$EXPECTED_TARBALL" ||
                "$EXPECTED_TARBALL" == */* ||
                "$EXPECTED_TARBALL" != *.tgz ]]; then
            echo "::error::Invalid expected tarball filename."
            exit 1
          fi

          tarball="dist/$EXPECTED_TARBALL"

          if [[ ! -f "$tarball" || ! -s "$tarball" ]]; then
            echo "::error::Validated package artifact is missing or empty."
            exit 1
          fi

          tar -tzf "$tarball" >/dev/null

          echo "Validated package artifact is present and readable."

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          PACKAGE_ACCESS: ${{ needs.validate.outputs.package_access }}
          PACKAGE_TARBALL: ${{ needs.validate.outputs.package_tarball }}
          DISTRIBUTION_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Configure NPM_TOKEN in the npm-production environment secrets."
            exit 1
          fi

          if [[ "$PACKAGE_ACCESS" == "restricted" &&
                "$PACKAGE_NAME" != @*/* ]]; then
            echo "::error::Restricted access requires a scoped package."
            exit 1
          fi

          case "$DISTRIBUTION_TAG" in
            latest|next|beta) ;;
            *)
              echo "::error::Unsupported distribution tag."
              exit 1
              ;;
          esac

          if [[ "$PACKAGE_TARBALL" == */* ||
                "$PACKAGE_TARBALL" != *.tgz ]]; then
            echo "::error::Invalid package tarball filename."
            exit 1
          fi

          tarball="dist/$PACKAGE_TARBALL"

          if [[ ! -s "$tarball" ]]; then
            echo "::error::Package tarball not found."
            exit 1
          fi

          access_args=(--access "$PACKAGE_ACCESS")

          npm publish "$tarball" \
            --ignore-scripts \
            "${access_args[@]}" \
            --tag "$DISTRIBUTION_TAG" \
            --registry=https://registry.npmjs.org/

          echo "Publication command completed for $PACKAGE_NAME@$PACKAGE_VERSION."

      - name: Publication summary
        if: success()
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          DISTRIBUTION_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        shell: bash
        run: |
          {
            echo "## npm Publication"
            echo
            echo "- Package: $PACKAGE_NAME"
            echo "- Version: $PACKAGE_VERSION"
            echo "- Distribution tag: $DISTRIBUTION_TAG"
            echo "- Validated commit: $COMMIT_SHA"
            echo "- Registry: https://registry.npmjs.org/"
            echo "- Published artifact: validated tarball"
            echo "- Automatic version changes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
