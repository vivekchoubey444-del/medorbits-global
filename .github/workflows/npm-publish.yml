name: Node.js Package
on:
  release:
    types:
      - published
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Validate and test package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }
          test -f package-lock.json || {
            echo "::error::package-lock.json is missing."
            exit 1
          }
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (!pkg.name || !pkg.version) {
            throw new Error('Package name and version are required.');
          }
          if (!Number.isInteger(lock.lockfileVersion)) {
            throw new Error('Invalid package-lock.json.');
          }
          if (lock.name && lock.name !== pkg.name) {
            throw new Error('Package name mismatch.');
          }
          if (
            lock.version &&
            lock.version !== pkg.version
          ) {
            throw new Error('Package version mismatch.');
          }
          if (pkg.private === true) {
            throw new Error('Private packages must not be published.');
          }
          if (
            !pkg.publishConfig ||
            pkg.publishConfig.registry !== 'https://registry.npmjs.org/'
          ) {
            throw new Error(
              'Set publishConfig.registry to https://registry.npmjs.org/ before publishing.'
            );
          }
          console.log(`Package: ${pkg.name}@${pkg.version}`);
          NODE
      - name: Verify release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" &&
                "$RELEASE_TAG" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag does not match package.json version."
            echo "Release tag: $RELEASE_TAG"
            echo "Package version: $PACKAGE_VERSION"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Validate npm publishing configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          if (pkg.private === true) {
            throw new Error('Refusing to publish a private package.');
          }
          if (
            pkg.publishConfig?.registry !==
            'https://registry.npmjs.org/'
          ) {
            throw new Error(
              'Package registry is not explicitly configured for npm.'
            );
          }
          console.log('npm publishing configuration is valid.');
          NODE
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish package
        run: npm publish --provenance