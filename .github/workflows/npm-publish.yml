name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version to publish (for example, 2.0.0)"
        required: true
        type: string
      confirm_publish:
        description: "Type publish to confirm npm publication"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Verify release confirmation and package metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirm_publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "publish" ]]; then
            echo "::error::Publication cancelled. Enter exactly 'publish' to confirm."
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Enter a valid semantic version."
            exit 1
          fi
          if [[ ! -f package.json || ! -f package-lock.json ]]; then
            echo "::error::Both package.json and package-lock.json are required."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const expected = process.env.EXPECTED_VERSION;
          if (!pkg.name) throw new Error("package.json must define a package name.");
          if (pkg.private === true) throw new Error("Private packages cannot be published.");
          if (pkg.version !== expected) {
            throw new Error(`Expected version ${expected}, found ${pkg.version}.`);
          }
          if (lock.version !== pkg.version) {
            throw new Error("package-lock.json version does not match package.json.");
          }
          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run package tests
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::error::No test script is configured. Add and run package tests before publishing."
            exit 1
          fi
      - name: Validate publish package contents
        run: npm pack --dry-run
  publish:
    name: Publish package to npm
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            if (pkg.version !== process.env.EXPECTED_VERSION) {
              throw new Error("Package version changed after validation.");
            }
          '
      - name: Publish using npm trusted publishing
        run: npm publish --provenance