name: Lockfile Validation
on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/lockfile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/lockfile.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lockfile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-lockfile:
    name: Validate npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check package manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi
          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "::error::No npm lockfile found. Generate and commit one before running this workflow."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const file = fs.existsSync("npm-shrinkwrap.json")
              ? "npm-shrinkwrap.json"
              : "package-lock.json";
            const lock = JSON.parse(fs.readFileSync(file, "utf8"));
            if (![2, 3].includes(lock.lockfileVersion)) {
              throw new Error(`Unsupported lockfile version: ${lock.lockfileVersion}`);
            }
            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Lockfile root package metadata is missing.");
            }
            const root = lock.packages[""];
            if (root.name && pkg.name && root.name !== pkg.name) {
              throw new Error("Lockfile package name does not match package.json.");
            }
            if (root.version && pkg.version && root.version !== pkg.version) {
              throw new Error("Lockfile package version does not match package.json.");
            }
            console.log(`Manifest valid: ${pkg.name || "unnamed"}`);
            console.log(`Lockfile valid: ${file}`);
            console.log(`Lockfile version: ${lock.lockfileVersion}`);
          '
      - name: Verify lockfile synchronization
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --dry-run
      - name: Verify reproducible dependency installation
        shell: bash
        run: |
          set -euo pipefail
          npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --dry-run
      - name: Upload existing lockfile
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-lockfile-${{ github.run_id }}
          path: |
            package-lock.json
            npm-shrinkwrap.json
          if-no-files-found: warn
          retention-days: 14