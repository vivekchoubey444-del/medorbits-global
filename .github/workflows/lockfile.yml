
name: Lockfile Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - ".github/workflows/lockfile.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - ".github/workflows/lockfile.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-lockfile:
    name: Validate npm Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect npm projects
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f package.json ]]; then
            echo "root_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "root_project=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f package-lock.json ]]; then
            echo "root_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "root_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate root package manifest
        if: steps.detect.outputs.root_project == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          node - <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!pkg || typeof pkg !== "object" || Array.isArray(pkg)) {
            throw new Error("package.json must contain a JSON object.");
          }

          if (pkg.workspaces !== undefined &&
              !Array.isArray(pkg.workspaces) &&
              (typeof pkg.workspaces !== "object" ||
               pkg.workspaces === null)) {
            throw new Error("Invalid npm workspaces configuration.");
          }

          console.log(`Package: ${pkg.name || "unnamed"}`);
          console.log(`Version: ${pkg.version || "unspecified"}`);
          NODE

      - name: Validate root lockfile consistency
        if: steps.detect.outputs.root_project == 'true' && steps.detect.outputs.root_lockfile == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ci --ignore-scripts --no-audit --no-fund

      - name: Report missing root lockfile
        if: steps.detect.outputs.root_project == 'true' && steps.detect.outputs.root_lockfile == 'false'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::error::package.json exists but package-lock.json is missing."
          echo "Generate and commit the lockfile before relying on reproducible npm installs."
          exit 1

      - name: Report skipped validation
        if: steps.detect.outputs.root_project == 'false'
        run: echo "No root package.json found; root npm lockfile validation was skipped."

      - name: Validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Lockfile Validation"
            echo
            echo "- Result: $JOB_STATUS"
            echo "- Lockfile modifications: disabled"
            echo "- Automatic commits: disabled"
            echo "- Automatic merges: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
