
# ==============================================================================
# MedOrbits -- Lockfile Validation
# File: .github/workflows/lockfile.yml
# Release: 3.0.0
#
# Purpose:
#   Validate npm manifests, lockfiles, and install consistency.
#
# Security:
#   - Read-only repository permissions.
#   - No automatic lockfile generation or modification.
#   - npm lifecycle scripts disabled during installation.
#   - No automatic commits, pushes, or merges.
# ==============================================================================

name: Lockfile Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - ".github/workflows/lockfile.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - ".github/workflows/lockfile.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-lockfiles:
    name: Validate npm Manifests and Lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover npm projects and validate manifests
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const ignored = new Set([
            ".git", "node_modules", ".next", "dist", "build",
            "coverage", ".venv", "venv", "__pycache__",
            ".repair-backups"
          ]);

          const projects = [];
          const errors = [];

          function walk(directory) {
            let entries;

            try {
              entries = fs.readdirSync(directory, {
                withFileTypes: true
              });
            } catch (error) {
              errors.push(`${directory}: ${error.message}`);
              return;
            }

            for (const entry of entries) {
              if (entry.isDirectory()) {
                if (!ignored.has(entry.name)) {
                  walk(path.join(directory, entry.name));
                }
                continue;
              }

              if (!entry.isFile() || entry.name !== "package.json") {
                continue;
              }

              const manifestPath = path.join(directory, entry.name);
              const projectDirectory = path.dirname(manifestPath);

              try {
                const pkg = JSON.parse(
                  fs.readFileSync(manifestPath, "utf8")
                );

                if (
                  pkg === null ||
                  typeof pkg !== "object" ||
                  Array.isArray(pkg)
                ) {
                  throw new Error("Expected a JSON object.");
                }

                if (
                  pkg.name !== undefined &&
                  typeof pkg.name !== "string"
                ) {
                  throw new Error("Package name must be a string.");
                }

                if (
                  pkg.version !== undefined &&
                  typeof pkg.version !== "string"
                ) {
                  throw new Error("Package version must be a string.");
                }

                const shrinkwrap = path.join(
                  projectDirectory, "npm-shrinkwrap.json"
                );
                const packageLock = path.join(
                  projectDirectory, "package-lock.json"
                );

                projects.push({
                  directory: projectDirectory === "."
                    ? "."
                    : projectDirectory.split(path.sep).join("/"),
                  manifest: manifestPath.split(path.sep).join("/"),
                  name: pkg.name || "",
                  workspaces: Boolean(pkg.workspaces),
                  lockfile: fs.existsSync(shrinkwrap)
                    ? "npm-shrinkwrap.json"
                    : fs.existsSync(packageLock)
                      ? "package-lock.json"
                      : null
                });
              } catch (error) {
                errors.push(`${manifestPath}: ${error.message}`);
              }
            }
          }

          walk(".");

          const root = projects.find((project) => project.directory === ".");
          const independent = projects.filter(
            (project) => project.directory !== "."
          );

          if (root && !root.lockfile) {
            errors.push(
              "Root package.json exists, but no root npm lockfile exists."
            );
          }

          // A root npm workspace uses the root lockfile for its members.
          // Do not require separate lockfiles for workspace packages.
          const workspaceRoots = projects.filter(
            (project) => project.workspaces
          );

          for (const project of independent) {
            const coveredByWorkspace = workspaceRoots.some((workspace) => {
              if (workspace.directory === ".") {
                return true;
              }

              return project.directory.startsWith(
                `${workspace.directory}/`
              );
            });

            if (!coveredByWorkspace && !project.lockfile) {
              errors.push(
                `${project.directory}: independent npm project has no lockfile.`
              );
            }
          }

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          const independentProjects = independent.filter((project) => {
            const coveredByWorkspace = workspaceRoots.some((workspace) => {
              if (workspace.directory === ".") {
                return true;
              }

              return project.directory.startsWith(
                `${workspace.directory}/`
              );
            });

            return !coveredByWorkspace && Boolean(project.lockfile);
          });

          const result = {
            rootExists: Boolean(root),
            rootLockfile: root?.lockfile || "",
            rootHasWorkspaces: Boolean(root?.workspaces),
            projectCount: projects.length,
            independentProjects
          };

          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/npm-projects.json",
            JSON.stringify(result, null, 2)
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `root_exists=${result.rootExists}\n` +
            `root_lockfile=${result.rootLockfile}\n` +
            `root_workspaces=${result.rootHasWorkspaces}\n` +
            `project_count=${result.projectCount}\n`
          );

          console.log(`npm manifests discovered: ${result.projectCount}`);
          console.log(`root project present: ${result.rootExists}`);
          console.log(`root lockfile: ${result.rootLockfile || "none"}`);
          console.log(
            `root workspaces: ${result.rootHasWorkspaces}`
          );
          console.log(
            `independent lockfile projects: ${independentProjects.length}`
          );
          NODE

      - name: Validate root lockfile with npm ci
        if: steps.discover.outputs.root_exists == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::Root package.json is missing."
            exit 1
          fi

          if [[ ! -f package-lock.json && ! -f npm-shrinkwrap.json ]]; then
            echo "::error::Root npm lockfile is missing."
            exit 1
          fi

          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate independent nested npm projects
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const source =
            process.env.RUNNER_TEMP + "/npm-projects.json";
          const data = JSON.parse(fs.readFileSync(source, "utf8"));

          const projects = data.independentProjects || [];

          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/npm-independent-projects.txt",
            projects.map((project) => project.directory).join("\n") +
              (projects.length ? "\n" : "")
          );

          console.log(
            `Independent nested npm projects: ${projects.length}`
          );
          NODE

          while IFS= read -r directory; do
            [[ -z "$directory" ]] && continue

            echo "::group::Validate $directory"

            if [[ ! -f "$directory/package.json" ]]; then
              echo "::error::Missing package.json in $directory"
              exit 1
            fi

            if [[ ! -f "$directory/package-lock.json" &&
                  ! -f "$directory/npm-shrinkwrap.json" ]]; then
              echo "::error::Missing lockfile in $directory"
              exit 1
            fi

            npm --prefix "$directory" ci \
              --ignore-scripts \
              --no-audit \
              --no-fund

            echo "::endgroup::"
          done < "$RUNNER_TEMP/npm-independent-projects.txt"

      - name: Verify lockfile metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const ignored = new Set([
            ".git", "node_modules", ".next", "dist", "build",
            "coverage", ".venv", "venv", "__pycache__",
            ".repair-backups"
          ]);

          const failures = [];
          let checked = 0;

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, {
              withFileTypes: true
            })) {
              if (entry.isDirectory()) {
                if (!ignored.has(entry.name)) {
                  walk(path.join(directory, entry.name));
                }
                continue;
              }

              if (!entry.isFile() || entry.name !== "package.json") {
                continue;
              }

              const dir = path.dirname(path.join(directory, entry.name));
              const manifestPath = path.join(dir, "package.json");
              const shrinkwrapPath = path.join(dir, "npm-shrinkwrap.json");
              const lockPath = path.join(dir, "package-lock.json");

              const selectedLock = fs.existsSync(shrinkwrapPath)
                ? shrinkwrapPath
                : lockPath;

              if (!fs.existsSync(selectedLock)) {
                continue;
              }

              try {
                const pkg = JSON.parse(
                  fs.readFileSync(manifestPath, "utf8")
                );
                const lock = JSON.parse(
                  fs.readFileSync(selectedLock, "utf8")
                );

                if (![2, 3].includes(lock.lockfileVersion)) {
                  throw new Error(
                    `Unsupported lockfileVersion: ${lock.lockfileVersion}`
                  );
                }

                const rootPackage = lock.packages?.[""];

                if (!rootPackage) {
                  throw new Error("Missing packages[''] lockfile entry.");
                }

                if (pkg.name && rootPackage.name !== pkg.name) {
                  throw new Error("Package name mismatch.");
                }

                if (pkg.version && rootPackage.version !== pkg.version) {
                  throw new Error("Package version mismatch.");
                }

                checked++;
                console.log(`Metadata valid: ${selectedLock}`);
              } catch (error) {
                failures.push(`${selectedLock}: ${error.message}`);
              }
            }
          }

          walk(".");

          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }

          console.log(`Lockfile metadata checks passed: ${checked}`);
          NODE

      - name: Validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PROJECT_COUNT: ${{ steps.discover.outputs.project_count }}
          ROOT_LOCKFILE: ${{ steps.discover.outputs.root_lockfile }}
        shell: bash
        run: |
          {
            echo "## Lockfile Validation"
            echo
            echo "- Result: ${JOB_STATUS:-unknown}"
            echo "- npm manifests discovered: ${PROJECT_COUNT:-unknown}"
            echo "- Root lockfile: ${ROOT_LOCKFILE:-not detected}"
            echo "- Automatic lockfile changes: disabled"
            echo "- Automatic commits: disabled"
            echo "- Automatic merges: disabled"
            echo "- Lifecycle scripts: disabled during npm ci"
          } >> "$GITHUB_STEP_SUMMARY"
