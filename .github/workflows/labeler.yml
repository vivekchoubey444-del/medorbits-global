
# ============================================================
# MEDORBITS -- AUTOMATIC PULL REQUEST LABELER
# File: .github/workflows/labeler.yml
# Purpose: Automatically categorize pull requests
# ============================================================

name: MedOrbits PR Labeler

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: medorbits-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply Pull Request Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Apply labels based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
