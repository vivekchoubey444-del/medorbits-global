
# ============================================================
# MedOrbits -- Dependency Review
# File: .github/workflows/dependency-review.yml
#
# Purpose:
# - Review dependency changes before merging pull requests.
# - Detect newly introduced vulnerable dependencies.
# - Check runtime, development, and unknown dependency scopes.
# - Support npm manifests, lockfiles, Dockerfiles, and Dependabot.
# - Use least-privilege GitHub Actions permissions.
#
# Requirements:
# - GitHub dependency graph enabled.
# - actions/dependency-review-action available to the repository.
# ============================================================

name: MedOrbits Dependency Review

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/npm-shrinkwrap.json"
      - "Dockerfile"
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - "**/docker-compose.yml"
      - "**/docker-compose.yaml"
      - "compose.yml"
      - "compose.yaml"
      - "**/compose.yml"
      - "**/compose.yaml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency security and license review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------
      # 1. REVIEW DEPENDENCY CHANGES
      # ------------------------------------------------------
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # Fail on high and critical vulnerabilities.
          fail-on-severity: high

          # Review all dependency scopes.
          fail-on-scopes: runtime,development,unknown

          # Do not require pull-request comment write permissions.
          comment-summary-in-pr: never

          # Fail if license metadata is missing or unrecognized.
          # Review this setting against the repository's actual policy.
          allow-dependencies-licenses: ""

          # Do not activate an unreviewed license allowlist.
          # Add allow-licenses only after legal/policy approval.
          #
          # Example:
          # allow-licenses: >-
          #   MIT,
          #   Apache-2.0,
          #   BSD-2-Clause,
          #   BSD-3-Clause,
          #   ISC

      # ------------------------------------------------------
      # 2. REPORT COMPLETION
      # ------------------------------------------------------
      - name: Report dependency review status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          {
            echo "## MedOrbits Dependency Review"
            echo
            echo "- **Status:** ${JOB_STATUS}"
            echo "- **Event:** ${EVENT_NAME}"
            echo "- **Ref:** \`${TARGET_REF}\`"

            if [[ -n "${PR_NUMBER:-}" ]]; then
              echo "- **Pull request:** #${PR_NUMBER}"
            fi

            echo
            echo "The dependency review checks changes reported by GitHub's dependency review service."
            echo
            echo "A successful result does not guarantee that every dependency or license risk has been identified."
          } >> "$GITHUB_STEP_SUMMARY"
