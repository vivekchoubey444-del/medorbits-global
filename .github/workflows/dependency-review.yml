
name: MedOrbits Dependency Review

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/npm-shrinkwrap.json"
      - "Dockerfile"
      - "**/Dockerfile"
      - "**/docker-compose.yml"
      - "**/docker-compose.yaml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Security and License Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
