name: MedOrbits Dependency Review
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - "npm-shrinkwrap.json"
      - "**/npm-shrinkwrap.json"
      - "Dockerfile"
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - "**/docker-compose.yml"
      - "**/docker-compose.yaml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"
permissions:
  contents: read
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          fail-on-scopes: runtime
          warn-only: false
          deny-licenses: >-
            GPL-3.0,
            GPL-3.0-only,
            GPL-3.0-or-later,
            AGPL-3.0,
            AGPL-3.0-only,
            AGPL-3.0-or-later