
# ============================================================
# MEDORBITS -- DEPENDENCY REVIEW
# File: .github/workflows/dependabot-review.yml
# Purpose: Review dependency changes in pull requests
# ============================================================

name: MedOrbits Dependency Review

on:
  pull_request:
    branches:
      - main
      - master
      - develop

    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: medorbits-dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  dependency-review:
    name: Review Dependency Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          warn-only: false
