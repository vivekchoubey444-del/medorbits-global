
# ==============================================================================
# MedOrbits -- Install Dependencies & Validate Environment
# File: /.github/workflows/install-dependencies.yml
# Version: 2.0.0
#
# Purpose:
# - Install reproducible npm dependencies.
# - Validate Node.js and npm versions.
# - Verify package.json and package-lock.json.
# - Detect dependency vulnerabilities.
# - Run available validation and test scripts.
# - Cache npm dependencies.
#
# Security:
# - No automatic deployment.
# - No automatic dependency upgrades.
# - No destructive Git operations.
# - No exposed secrets.
# ==============================================================================

name: MedOrbits - Install Dependencies

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: install-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================================
  # 1. INSTALL AND VALIDATE DEPENDENCIES
  # ============================================================================

  install:
    name: Install & Validate Dependencies

    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        node-version:
          - "20"
          - "22"

    steps:

      # ------------------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # NODE.JS
      # ------------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node.js
        run: |
          node --version
          npm --version

          node -e "
          const major = Number(process.versions.node.split('.')[0]);
          if (major < 20) {
            throw new Error('Node.js >= 20 required');
          }
          console.log('Node.js runtime validated');
          "

      # ------------------------------------------------------------------------
      # PACKAGE VALIDATION
      # ------------------------------------------------------------------------

      - name: Validate package.json
        run: |
          node -e "
          const fs = require('fs');

          if (!fs.existsSync('package.json')) {
            throw new Error('package.json missing');
          }

          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          if (!pkg.name) {
            throw new Error('Package name missing');
          }

          if (!pkg.scripts) {
            console.log('No npm scripts configured');
          }

          console.log('package.json validated');
          "

      # ------------------------------------------------------------------------
      # LOCKFILE VALIDATION
      # ------------------------------------------------------------------------

      - name: Validate package-lock.json
        run: |
          node -e "
          const fs = require('fs');

          if (!fs.existsSync('package-lock.json')) {
            throw new Error(
              'package-lock.json missing. Generate and commit it.'
            );
          }

          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );

          if (!lock.lockfileVersion) {
            throw new Error('Invalid lockfile version');
          }

          console.log(
            'Lockfile version:',
            lock.lockfileVersion
          );
          "

      # ------------------------------------------------------------------------
      # INSTALL
      # ------------------------------------------------------------------------

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ------------------------------------------------------------------------
      # VERIFY INSTALLATION
      # ------------------------------------------------------------------------

      - name: Verify installed dependencies
        run: npm ls --depth=0

      # ------------------------------------------------------------------------
      # DEPENDENCY SECURITY
      # ------------------------------------------------------------------------

      - name: Run npm security audit
        continue-on-error: true
        run: npm audit --audit-level=high

      # ------------------------------------------------------------------------
      # OPTIONAL VALIDATION
      # ------------------------------------------------------------------------

      - name: Run validation script
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if npm run | grep -qE '^[[:space:]]+validate$'; then
            npm run validate
          else
            echo "Validation script not configured; skipped."
          fi

      # ------------------------------------------------------------------------
      # OPTIONAL LINT
      # ------------------------------------------------------------------------

      - name: Run lint
        run: |
          if npm run | grep -qE '^[[:space:]]+lint$'; then
            npm run lint
          else
            echo "Lint script not configured; skipped."
          fi

      # ------------------------------------------------------------------------
      # OPTIONAL TESTS
      # ------------------------------------------------------------------------

      - name: Run tests
        run: |
          if npm run | grep -qE '^[[:space:]]+test$'; then
            npm test -- --passWithNoTests
          else
            echo "Test script not configured; skipped."
          fi

      # ------------------------------------------------------------------------
      # FINAL VERIFICATION
      # ------------------------------------------------------------------------

      - name: Final dependency verification
        run: |
          node --check server.js || {
            if [ -f server.js ]; then
              exit 1
            else
              echo "No root server.js; skipped."
            fi
          }

          npm ls --depth=0

          echo "MedOrbits dependency installation completed."

      # ------------------------------------------------------------------------
      # ARTIFACTS
      # ------------------------------------------------------------------------

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-diagnostics-node-${{ matrix.node-version }}
          path: |
            npm-debug.log
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================================
  # 2. WORKFLOW COMPLETION
  # ============================================================================

  summary:
    name: Dependency Installation Summary

    runs-on: ubuntu-latest

    needs:
      - install

    if: always()

    steps:

      - name: Report workflow status
        env:
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          echo "=================================="
          echo "MedOrbits Dependency Report"
          echo "=================================="
          echo "Installation: $INSTALL_RESULT"

          if [ "$INSTALL_RESULT" != "success" ]; then
            echo "Dependency installation requires attention."
            exit 1
          fi

          echo "Dependency installation successful."
