
name: MedOrbits Node.js Package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: medorbits-npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and Test Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          test -s package.json || {
            echo "::error::package.json is missing or empty."
            exit 1
          }

          test -s package-lock.json || {
            echo "::error::package-lock.json is missing or empty."
            exit 1
          }

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          const tag = process.env.RELEASE_TAG;

          if (
            typeof pkg.name !== "string" ||
            !pkg.name.trim() ||
            typeof pkg.version !== "string" ||
            !pkg.version.trim()
          ) {
            throw new Error(
              "package.json must declare a non-empty name and version."
            );
          }

          if (
            tag !== `v${pkg.version}` &&
            tag !== pkg.version
          ) {
            throw new Error(
              `Release tag "${tag}" does not match package version "${pkg.version}".`
            );
          }

          if (pkg.private === true) {
            throw new Error(
              "Cannot publish a package marked private."
            );
          }

          if (
            !Number.isInteger(lock.lockfileVersion) ||
            (
              lock.name &&
              lock.name !== pkg.name
            ) ||
            (
              lock.version &&
              lock.version !== pkg.version
            )
          ) {
            throw new Error(
              "package.json and package-lock.json metadata are inconsistent."
            );
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          console.log(`Release tag: ${tag}`);
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          CI: "true"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::error::No test script is configured."
            echo "Configure and commit a test script before publishing."
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm Registry
    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: npm-production

    permissions:
      contents: read

    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Verify package metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const tag = process.env.RELEASE_TAG;

          if (
            tag !== `v${pkg.version}` &&
            tag !== pkg.version
          ) {
            throw new Error(
              "Release tag and package version do not match."
            );
          }

          if (pkg.private === true) {
            throw new Error(
              "Private packages cannot be published."
            );
          }

          console.log(
            `Publishing ${pkg.name}@${pkg.version}`
          );
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          CI: "true"

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
