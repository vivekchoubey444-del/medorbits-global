
name: OpenAPI Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "openapi.yaml"
      - "openapi.yml"
      - "openapi.json"
      - "openapi/**"
      - "api/**"
      - ".spectral.yaml"
      - ".spectral.yml"
      - ".spectral.json"
      - ".github/workflows/openapi-lint.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "openapi.yaml"
      - "openapi.yml"
      - "openapi.json"
      - "openapi/**"
      - "api/**"
      - ".spectral.yaml"
      - ".spectral.yml"
      - ".spectral.json"
      - ".github/workflows/openapi-lint.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate OpenAPI Specifications
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check \
            "openapi-spec-validator>=0.7,<0.9" \
            "PyYAML>=6,<7"

          npm install --global --ignore-scripts \
            "@stoplight/spectral-cli@6"

      - name: Discover specification files
        id: discover
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import os
          from pathlib import Path

          excluded = {
              ".git", "node_modules", "vendor",
              "dist", "build", "coverage", ".venv", "venv"
          }

          found = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in excluded for part in path.parts):
                  continue

              name = path.name.lower()
              if (
                  name.startswith("openapi.")
                  or name.startswith("swagger.")
                  or (
                      path.parts[0] == "api"
                      and path.suffix.lower() in {".yaml", ".yml", ".json"}
                      and ("openapi" in name or "swagger" in name)
                  )
              ):
                  found.append(path.as_posix())

          found = sorted(set(found))

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as file:
              file.write(f"found={'true' if found else 'false'}\n")

          Path(os.environ["RUNNER_TEMP"], "openapi-files.txt").write_text(
              "\n".join(found) + ("\n" if found else ""),
              encoding="utf-8"
          )

          print(f"Found {len(found)} OpenAPI/Swagger candidate(s).")
          for item in found:
              print(f" - {item}")
          PY

      - name: Validate specifications
        if: steps.discover.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          python <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          import yaml
          from openapi_spec_validator import validate

          list_file = Path(
              __import__("os").environ["RUNNER_TEMP"],
              "openapi-files.txt"
          )
          files = [
              Path(line.strip())
              for line in list_file.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          failures = []

          for path in files:
              print(f"\nValidating {path}")

              try:
                  content = path.read_text(encoding="utf-8")

                  if path.suffix.lower() == ".json":
                      document = json.loads(content)
                  else:
                      document = yaml.safe_load(content)

                  if not isinstance(document, dict):
                      raise ValueError("Specification root must be an object.")

                  version = document.get("openapi")
                  swagger = document.get("swagger")

                  if version is None:
                      if swagger != "2.0":
                          raise ValueError(
                              "Missing supported OpenAPI version or Swagger 2.0."
                          )
                  elif not str(version).startswith(("3.0.", "3.1.", "3.2.")):
                      raise ValueError(f"Unsupported OpenAPI version: {version}")

                  validate(document)
                  print("PASS: structural validation")

                  result = subprocess.run(
                      [
                          "spectral", "lint",
                          "--fail-severity", "error",
                          str(path)
                      ],
                      text=True,
                      capture_output=True
                  )

                  if result.stdout:
                      print(result.stdout, end="")
                  if result.stderr:
                      print(result.stderr, file=sys.stderr, end="")

                  if result.returncode != 0:
                      raise ValueError(
                          f"Spectral lint failed with exit code {result.returncode}."
                      )

                  print("PASS: Spectral lint")

              except Exception as error:
                  failures.append(f"{path}: {error}")
                  print(f"FAIL: {path}: {error}", file=sys.stderr)

          if failures:
              print("\nValidation failures:", file=sys.stderr)
              for failure in failures:
                  print(f" - {failure}", file=sys.stderr)
              sys.exit(1)

          print(f"\nAll {len(files)} specification(s) passed.")
          PY

      - name: Report when no specifications exist
        if: steps.discover.outputs.found == 'false'
        shell: bash
        run: |
          echo "No OpenAPI or Swagger specification was discovered."
          echo "Add an openapi.yaml, openapi.yml, openapi.json, or matching file under api/."
          echo "No specification was available to validate."
