
name: Stakeholder Issue Management

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
      - edited

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to classify; leave empty for a configuration check"
        required: false
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  group: stakeholder-issue-${{ github.event.issue.number || inputs.issue_number || github.ref }}
  cancel-in-progress: true

jobs:
  manage-issue:
    name: Classify Stakeholder Issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write
      contents: read

    steps:
      - name: Classify issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            if (!issue || issue.pull_request) {
              core.info("Event does not represent a regular issue.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            const title = issue.title || "";
            const body = issue.body || "";
            const text = `${title}\n${body}`.toLowerCase();

            const currentLabels = new Set(
              (issue.labels || []).map(label =>
                typeof label === "string" ? label : label.name
              )
            );

            const addLabels = new Set(["stakeholder-review"]);

            const rules = [
              {
                label: "security",
                pattern: /\b(security vulnerability|vulnerability|credential leak|data breach|exposed secret|unauthorized access)\b/,
              },
              {
                label: "priority-high",
                pattern: /\b(security vulnerability|vulnerability|credential leak|data breach|exposed secret|unauthorized access|production outage|critical failure|data loss)\b/,
              },
              {
                label: "bug",
                pattern: /\b(bug|error|broken|not working|regression|malfunction)\b/,
              },
              {
                label: "enhancement",
                pattern: /\b(feature request|enhancement|new feature|improvement)\b/,
              },
              {
                label: "documentation",
                pattern: /\b(documentation|readme|typo|docs)\b/,
              },
              {
                label: "education",
                pattern: /\b(admission|college|university|student|education|mbbs|neet|bds|bams)\b/,
              },
              {
                label: "accessibility",
                pattern: /\b(accessibility|screen reader|keyboard navigation|wcag|aria)\b/,
              },
            ];

            for (const rule of rules) {
              if (rule.pattern.test(text)) {
                addLabels.add(rule.label);
              }
            }

            const missingLabels = [...addLabels].filter(
              label => !currentLabels.has(label)
            );

            if (missingLabels.length === 0) {
              core.info("No additional classification labels required.");
              return;
            }

            // Do not create labels automatically. Missing repository labels
            // should be configured by a maintainer to avoid unexpected
            // changes to the repository's label taxonomy.
            const existingLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );

            const existingNames = new Set(
              existingLabels.map(label => label.name)
            );

            const labelsToAdd = missingLabels.filter(
              label => existingNames.has(label)
            );

            const missingDefinitions = missingLabels.filter(
              label => !existingNames.has(label)
            );

            if (missingDefinitions.length > 0) {
              core.warning(
                `Configure these repository labels to enable classification: ${missingDefinitions.join(", ")}`
              );
            }

            if (labelsToAdd.length === 0) {
              core.info("No configured classification labels need to be added.");
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: labelsToAdd
            });

            core.info(
              `Added ${labelsToAdd.length} classification label(s) to issue #${issueNumber}.`
            );

  manual-check:
    name: Manual Issue Classification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write
      contents: read

    steps:
      - name: Validate manual input
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "Configuration check requested; no issue will be modified."
            exit 0
          fi

          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Issue number must be a positive integer."
            exit 1
          fi

      - name: Classify selected issue
        if: inputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const rawNumber = process.env.ISSUE_NUMBER;

            if (!/^[1-9]\d*$/.test(rawNumber || "")) {
              throw new Error("Invalid issue number.");
            }

            const issueNumber = Number(rawNumber);

            if (!Number.isSafeInteger(issueNumber)) {
              throw new Error("Issue number is outside the safe integer range.");
            }

            const { owner, repo } = context.repo;

            let issue;

            try {
              const response = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              issue = response.data;
            } catch (error) {
              if (error.status === 404) {
                throw new Error(
                  `Issue #${issueNumber} was not found or is inaccessible.`
                );
              }
              throw error;
            }

            if (issue.pull_request) {
              throw new Error(
                `#${issueNumber} is a pull request, not a regular issue.`
              );
            }

            const text =
              `${issue.title || ""}\n${issue.body || ""}`.toLowerCase();

            const currentLabels = new Set(
              (issue.labels || []).map(label =>
                typeof label === "string" ? label : label.name
              )
            );

            const desired = new Set(["stakeholder-review"]);

            const rules = [
              [
                "security",
                /\b(security vulnerability|vulnerability|credential leak|data breach|exposed secret|unauthorized access)\b/
              ],
              [
                "priority-high",
                /\b(security vulnerability|vulnerability|credential leak|data breach|exposed secret|unauthorized access|production outage|critical failure|data loss)\b/
              ],
              [
                "bug",
                /\b(bug|error|broken|not working|regression|malfunction)\b/
              ],
              [
                "enhancement",
                /\b(feature request|enhancement|new feature|improvement)\b/
              ],
              [
                "documentation",
                /\b(documentation|readme|typo|docs)\b/
              ],
              [
                "education",
                /\b(admission|college|university|student|education|mbbs|neet|bds|bams)\b/
              ],
              [
                "accessibility",
                /\b(accessibility|screen reader|keyboard navigation|wcag|aria)\b/
              ]
            ];

            for (const [label, pattern] of rules) {
              if (pattern.test(text)) {
                desired.add(label);
              }
            }

            const missing = [...desired].filter(
              label => !currentLabels.has(label)
            );

            if (missing.length === 0) {
              core.info(`Issue #${issueNumber} is already classified.`);
              return;
            }

            const repositoryLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );

            const available = new Set(
              repositoryLabels.map(label => label.name)
            );

            const toAdd = missing.filter(label => available.has(label));
            const undefinedLabels = missing.filter(
              label => !available.has(label)
            );

            if (undefinedLabels.length > 0) {
              core.warning(
                `Repository labels not configured: ${undefinedLabels.join(", ")}`
              );
            }

            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: toAdd
              });
            }

            core.info(
              `Classification complete for issue #${issueNumber}. Added ${toAdd.length} label(s).`
            );

      - name: Manual run summary
        if: always()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Stakeholder Issue Management"
            echo
            echo "- Result: $JOB_STATUS"
            if [[ -n "$ISSUE_NUMBER" ]]; then
              echo "- Issue: #$ISSUE_NUMBER"
            else
              echo "- Mode: Configuration check"
            fi
            echo "- Automatic issue closure: disabled"
            echo "- Automatic issue editing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
