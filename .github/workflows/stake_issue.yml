
name: Stakeholder Issue Management

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
      - edited

  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: stakeholder-issue-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  manage-issue:
    name: Classify Stakeholder Issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Classify issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            if (!issue || issue.pull_request) {
              core.info("Event does not represent a regular issue.");
              return;
            }

            const title = (issue.title || "").toLowerCase();
            const body = (issue.body || "").toLowerCase();
            const text = `${title}\n${body}`;

            const labels = new Set(
              (issue.labels || []).map(label =>
                typeof label === "string" ? label : label.name
              )
            );

            const addLabels = new Set(["stakeholder-review"]);

            if (
              /\b(security|vulnerability|credential leak|data breach)\b/.test(text)
            ) {
              addLabels.add("security");
              addLabels.add("priority-high");
            } else if (
              /\b(crash|production outage|critical failure|data loss)\b/.test(text)
            ) {
              addLabels.add("priority-high");
            } else if (
              /\b(bug|error|broken|not working|regression)\b/.test(text)
            ) {
              addLabels.add("bug");
            } else if (
              /\b(feature request|enhancement|new feature|improvement)\b/.test(text)
            ) {
              addLabels.add("enhancement");
            } else if (
              /\b(documentation|readme|typo|docs)\b/.test(text)
            ) {
              addLabels.add("documentation");
            }

            if (
              /\b(admission|college|university|student|education)\b/.test(text)
            ) {
              addLabels.add("education");
            }

            if (
              /\b(accessibility|screen reader|keyboard navigation)\b/.test(text)
            ) {
              addLabels.add("accessibility");
            }

            const missingLabels = [...addLabels].filter(
              label => !labels.has(label)
            );

            if (missingLabels.length === 0) {
              core.info("No additional labels required.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: missingLabels
            });

            core.info(
              `Added ${missingLabels.length} classification label(s).`
            );

  manual-check:
    name: Manual Workflow Check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Confirm workflow availability
        run: echo "Stakeholder issue management workflow is available."
