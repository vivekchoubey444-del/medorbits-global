
name: Issue Classification

on:
  issues:
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-classification-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Classify issue and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            if (!issue || issue.pull_request) {
              core.info("Event is not a standard issue. Skipping.");
              return;
            }

            const text = `${issue.title || ""}\n${issue.body || ""}`
              .toLowerCase();

            const rules = [
              {
                label: "bug",
                patterns: [
                  /\bbug\b/,
                  /\berror\b/,
                  /\bcrash(?:es|ed|ing)?\b/,
                  /\bnot working\b/,
                  /\bbroken\b/,
                  /\bregression\b/
                ]
              },
              {
                label: "enhancement",
                patterns: [
                  /\bfeature request\b/,
                  /\bnew feature\b/,
                  /\benhancement\b/,
                  /\badd support\b/,
                  /\bimprovement\b/
                ]
              },
              {
                label: "documentation",
                patterns: [
                  /\bdocumentation\b/,
                  /\breadme\b/,
                  /\btypo\b/,
                  /\bdocs?\b/,
                  /\bguide\b/
                ]
              },
              {
                label: "security",
                patterns: [
                  /\bvulnerability\b/,
                  /\bsecurity issue\b/,
                  /\bsecurity concern\b/,
                  /\bunauthorized access\b/,
                  /\bprivilege escalation\b/,
                  /\bdata exposure\b/
                ]
              },
              {
                label: "question",
                patterns: [
                  /\bhow do i\b/,
                  /\bhow can i\b/,
                  /\bquestion\b/,
                  /\bhelp needed\b/,
                  /\bclarification\b/
                ]
              }
            ];

            const selected = rules
              .filter(rule =>
                rule.patterns.some(pattern => pattern.test(text))
              )
              .map(rule => rule.label);

            if (selected.length === 0) {
              core.info(
                "No classification keywords matched; existing labels remain unchanged."
              );
              return;
            }

            // Read current labels from the API rather than relying on
            // the issue payload's potentially stale label list.
            const { data: currentIssue } =
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });

            const existing = new Set(
              currentIssue.labels.map(label =>
                typeof label === "string" ? label : label.name
              )
            );

            const missing = selected.filter(
              label => !existing.has(label)
            );

            if (missing.length === 0) {
              core.info("All applicable labels are already present.");
              return;
            }

            // Verify that each target label exists. Avoid creating labels
            // automatically, which could hide repository configuration errors.
            const { data: repositoryLabels } =
              await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

            const available = new Set(
              repositoryLabels.map(label => label.name)
            );

            const undefinedLabels = missing.filter(
              label => !available.has(label)
            );

            if (undefinedLabels.length > 0) {
              core.warning(
                `Create these repository labels before using this workflow: ${
                  undefinedLabels.join(", ")
                }`
              );
            }

            const validLabels = missing.filter(
              label => available.has(label)
            );

            if (validLabels.length === 0) {
              core.info("No applicable pre-existing labels are available.");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: validLabels
            });

            core.info(`Added labels: ${validLabels.join(", ")}`);
