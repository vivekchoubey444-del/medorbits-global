File: .github/workflows/update-lockfile.yml

name: Update package-lock.json
on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit and push the validated lockfile update"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-lockfile:
    name: Generate and validate lockfile
    if: github.ref_type == 'branch' && github.ref_protected == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify package files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }
          node -e "
            const pkg = require('./package.json');
            if (!pkg.name || !pkg.version) {
              throw new Error('package.json must define name and version.');
            }
          "
      - name: Generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
      - name: Validate lockfile metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (lock.lockfileVersion !== 3) {
            throw new Error(
              `Expected lockfileVersion 3; found ${lock.lockfileVersion}.`
            );
          }
          const root = lock.packages?.[''];
          if (!root) {
            throw new Error(
              'package-lock.json is missing its root package entry.'
            );
          }
          if (pkg.name !== root.name || pkg.version !== root.version) {
            throw new Error(
              'package.json and package-lock.json metadata do not match.'
            );
          }
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (path === '') continue;
            if (
              typeof entry.integrity === 'string' &&
              entry.integrity.includes('PLACEHOLDER')
            ) {
              throw new Error(
                `Placeholder integrity value found in dependency: ${path}`
              );
            }
          }
          console.log(
            `Validated ${pkg.name}@${pkg.version}; lockfile version ${lock.lockfileVersion}.`
          );
          NODE
      - name: Validate dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          CI: "true"
      - name: Verify only the lockfile changed
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git status --porcelain --untracked-files=all |
            awk '{
              path = substr($0, 4)
              if (path != "package-lock.json") print path
            }'
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected files changed during lockfile generation:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --check
      - name: Report lockfile status
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi
      - name: Upload generated lockfile
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: medorbits-lockfile-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
  commit-lockfile:
    name: Commit validated lockfile
    needs: generate-lockfile
    if: >-
      needs.generate-lockfile.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.commit_changes == 'true' &&
      github.ref_type == 'branch' &&
      github.ref_protected == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download validated lockfile
        uses: actions/download-artifact@v7
        with:
          name: medorbits-lockfile-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated
      - name: Verify and install generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f generated/package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('generated/package-lock.json', 'utf8')
          );
          const root = lock.packages?.[''];
          if (
            lock.lockfileVersion !== 3 ||
            !root ||
            root.name !== pkg.name ||
            root.version !== pkg.version
          ) {
            throw new Error(
              'Downloaded lockfile failed metadata validation.'
            );
          }
          NODE
          cp generated/package-lock.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --check
      - name: Commit and push lockfile update
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          unexpected="$(
            git diff --cached --name-only |
            grep -vx 'package-lock.json' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected staged files detected."
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git commit -m "chore: update package-lock.json"
          git push origin "HEAD:${TARGET_BRANCH}"