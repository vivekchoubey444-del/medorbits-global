File: .github/workflows/secret-scan.yml

name: MedOrbits Secret Scan
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  schedule:
    # Every Monday at 03:30 UTC.
    - cron: "30 3 * * 1"
permissions:
  contents: read
concurrency:
  group: medorbits-secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Scan Git History for Exposed Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

Recommended repository configuration

* Enable GitHub Actions for the repository and verify the scheduled workflow runs successfully.
* Review Gitleaks findings promptly. If a credential is exposed, revoke or rotate it first; deleting the text from the latest commit alone is insufficient.
* Keep persist-credentials: false so checkout does not leave the GitHub token in Git configuration.
* This configuration disables PR comments to avoid unnecessary write permissions. If you need comments, configure a separate, carefully scoped workflow with the required permissions.
* For organization-owned repositories, check whether your Gitleaks subscription requires a GITLEAKS_LICENSE secret.
* For stricter supply-chain security, pin third-party actions to reviewed full commit SHAs and update those pins through a controlled process.

GitHub restricts secrets and token permissions for fork-originated pull requests, so the workflow should not rely on private secrets or write access in that context. <Cite refs={["turn103556search0","turn103556search1","turn103556search3"]}/>

Important: This workflow scans Git history fetched by the checkout action. It does not automatically revoke exposed credentials or guarantee that every secret in external systems is detected.