File: .github/workflows/validate-json.yml

name: MedOrbits -- Validate JSON
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "**/*.json"
      - "**/*.JSON"
      - ".github/workflows/validate-json.yml"
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "**/*.json"
      - "**/*.JSON"
      - ".github/workflows/validate-json.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-json-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 2. SET UP NODE.JS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # 3. DISCOVER AND VALIDATE JSON FILES
      - name: Validate JSON syntax
        id: json
        shell: bash
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/json-validation-report.txt"
          errors="${RUNNER_TEMP}/json-validation-errors.txt"
          : > "$report"
          : > "$errors"
          count=0
          passed=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if node - "$file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          try {
            JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE
            then
              passed=$((passed + 1))
              printf 'PASS %s\n' "$file" | tee -a "$report"
            else
              failed=$((failed + 1))
              printf 'FAIL %s\n' "$file" | tee -a "$report"
            fi
          done < <(
            find . \
              -type d \( \
                -name .git -o \
                -name node_modules -o \
                -name .next -o \
                -name .nuxt -o \
                -name dist -o \
                -name build -o \
                -name coverage -o \
                -name .wrangler -o \
                -name .vercel \
              \) -prune \
              -o -type f \
              \( -iname '*.json' \) \
              -print0
          )
          {
            echo "## MedOrbits JSON Validation"
            echo
            echo "| Result | Count |"
            echo "|---|---:|"
            echo "| Files checked | ${count} |"
            echo "| Passed | ${passed} |"
            echo "| Failed | ${failed} |"
            echo
            echo "### File results"
            echo
            if [[ -s "$report" ]]; then
              echo '```text'
              cat "$report"
              echo '```'
            else
              echo "No JSON files were found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "files_checked=${count}" >> "$GITHUB_OUTPUT"
          echo "files_passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "files_failed=${failed}" >> "$GITHUB_OUTPUT"
          echo
          echo "JSON files checked: $count"
          echo "Passed: $passed"
          echo "Failed: $failed"
          if (( count == 0 )); then
            echo "::error::No JSON files were found to validate."
            exit 1
          fi
          if (( failed > 0 )); then
            echo "::error::${failed} JSON file(s) failed validation."
            exit 1
          fi
          echo "All JSON files passed syntax validation."
      # 4. VALIDATE THE PACKAGE MANIFEST AND LOCKFILE JSON
      - name: Validate package JSON files
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [[ -f "$file" ]]; then
              node -e '
                const fs = require("node:fs");
                JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                console.log(`PASS ${process.argv[1]}`);
              ' "$file"
            fi
          done
      # 5. REPORT COMPLETION
      - name: Report validation status
        if: ${{ success() }}
        run: |
          echo "MedOrbits JSON validation completed successfully."