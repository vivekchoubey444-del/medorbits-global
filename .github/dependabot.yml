
# ==============================================================================
# MedOrbits -- Dependabot Configuration
#
# Purpose:
# Automate npm, GitHub Actions, and Docker dependency updates.
#
# Policy:
# - Group compatible minor and patch updates.
# - Keep major updates separate for compatibility review.
# - Apply cooldowns to version updates.
# - Review security updates promptly.
# - Require CI and appropriate review before merging.
# ==============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # 1. NPM DEPENDENCIES
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 10
    versioning-strategy: increase

    labels:
      - dependencies
      - npm
      - automated-update

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

    # Major updates remain separate for focused compatibility testing.

  # ---------------------------------------------------------------------------
  # 2. GITHUB ACTIONS
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions
      - ci

    commit-message:
      prefix: "ci"
      include: scope

    cooldown:
      default-days: 7

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Major action updates remain separate for compatibility and security review.

  # ---------------------------------------------------------------------------
  # 3. DOCKER BASE IMAGES
  # ---------------------------------------------------------------------------
  # Keep this entry only when a root-level Dockerfile exists.
  # Add separate entries for Dockerfiles in other directories as needed.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - docker
      - infrastructure

    commit-message:
      prefix: "docker"
      include: scope

    cooldown:
      default-days: 7

    # Review image provenance, security, compatibility, and deployment impact.
