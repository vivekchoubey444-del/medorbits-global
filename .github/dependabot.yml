
# ==============================================================================
# MedOrbits -- Dependabot Configuration
# File: /.github/dependabot.yml
# Version: 2.0.0
# ==============================================================================

version: 2

updates:

  # ============================================================================
  # 1. NPM DEPENDENCIES
  # ============================================================================

  - package-ecosystem: npm
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 10
    versioning-strategy: increase

    labels:
      - dependencies
      - npm
      - automated-update

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: scope

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:

      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

    # Major updates remain separate.

  # ============================================================================
  # 2. GITHUB ACTIONS
  # ============================================================================

  - package-ecosystem: github-actions
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - github-actions
      - ci

    commit-message:
      prefix: "ci"
      include: scope

    cooldown:
      default-days: 7

    groups:

      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # Major GitHub Actions updates remain separate.

  # ============================================================================
  # 3. DOCKER
  # ============================================================================

  # Enable only when a Dockerfile exists in the repository root.

  - package-ecosystem: docker
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Kolkata

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - docker
      - infrastructure

    commit-message:
      prefix: "docker"
      include: scope

    cooldown:
      default-days: 7

    # Review image provenance, compatibility and vulnerabilities.

  # ============================================================================
  # END OF CONFIGURATION
  # ============================================================================
