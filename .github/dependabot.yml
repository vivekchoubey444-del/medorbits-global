
# ==============================================================================
# MedOrbits -- Dependabot Configuration
# File: .github/dependabot.yml
# Release: 2.1.1
#
# Purpose:
#   Schedule controlled dependency updates for review.
#
# Policy:
#   - No automatic merging or deployment.
#   - Updates must pass required repository checks.
#   - Security updates and dependency changes require human review.
# ==============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # npm / Node.js
  # Keep this entry only when package.json and the npm lockfile are maintained.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build"
      include: scope
    groups:
      npm-development-minor-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-production-minor-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Python / pip
  # Uncomment when requirements.txt or another supported pip manifest is used.
  # ---------------------------------------------------------------------------
  # - package-ecosystem: pip
