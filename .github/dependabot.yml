# MedOrbits -- Dependabot Configuration
# Purpose: Controlled dependency updates with review required.
# Safety: No automatic merging or automatic deployment.
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # npm / Node.js
  # Keep this entry only if the repository uses npm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build(deps)"
      include: scope
    groups:
      npm-development-minor-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-production-minor-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # Python / pip
  # Enable only if the repository manages Python dependencies
  # through requirements.txt, pyproject.toml, or another supported manifest.
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
