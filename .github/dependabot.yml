
# MedOrbits -- Dependabot Configuration
version: 2

updates:
  # Keep GitHub Actions versions updated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Root Node.js project.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # Local agent Node.js project.
  - package-ecosystem: npm
    directory: /local-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - local-agent

  # Local agent Python project.
  - package-ecosystem: pip
    directory: /local-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
