
# ==============================================================================
# MedOrbits -- Dependabot Configuration
# File: .github/dependabot.yml
# ==============================================================================

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Kolkata"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Asia/Kolkata"
    labels:
      - dependencies
    open-pull-requests-limit: 10
