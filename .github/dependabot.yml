MedOrbits -- Dependabot Configuration

Purpose: Automate dependency updates for npm, GitHub Actions, and Docker.

Policy:

- Group compatible minor and patch updates.

- Keep major updates separate for focused compatibility review.

- Apply cooldowns to version updates where supported.

- Require CI and appropriate review before merging dependency changes.

- Keep security updates separate from routine version updates.

version: 2

updates:

Root Node.js application dependencies

* package-ecosystem: npm
    directory: "/"
    schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
    default-days: 3
    groups:
    npm-development-minor-patch:
    dependency-type: development
    update-types:
    - minor
    - patch
    npm-production-minor-patch:
    dependency-type: production
    update-types:
    - minor
    - patch
    labels:
    * dependencies
    * npm
        commit-message:
        prefix: "deps"
        include: scope

GitHub Actions workflow dependencies

* package-ecosystem: github-actions
    directory: "/"
    schedule:
    interval: weekly
    day: monday
    time: "06:30"
    timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
    default-days: 3
    groups:
    github-actions-minor-patch:
    update-types:
    - minor
    - patch
    labels:
    * dependencies
    * github-actions
        commit-message:
        prefix: "ci"
        include: scope

Docker dependencies, if the repository contains Dockerfiles

* package-ecosystem: docker
    directory: "/"
    schedule:
    interval: weekly
    day: monday
    time: "07:00"
    timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
    default-days: 3
    groups:
    docker-minor-patch:
    update-types:
    - minor
    - patch
    labels:
    * dependencies
    * docker
        commit-message:
        prefix: "docker"
        include: scope