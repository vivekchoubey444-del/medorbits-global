
# ============================================================
# MEDORBITS -- PULL REQUEST LABEL RULES
# File: .github/labeler.yml
# Purpose: Automatically categorize changed repository areas
# ============================================================

# ------------------------------------------------------------
# FRONTEND
# ------------------------------------------------------------

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "public/**"
          - "assets/css/**"
          - "assets/js/**"
          - "assets/images/**"
          - "pages/**/*.html"
          - "components/**"
          - "views/**"
          - "*.html"
          - "*.css"
          - "*.scss"
          - "*.sass"
          - "*.tsx"
          - "*.jsx"

# ------------------------------------------------------------
# BACKEND
# ------------------------------------------------------------

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "server.js"
          - "server/**"
          - "node/**"
          - "api/**"
          - "controllers/**"
          - "routes/**"
          - "services/**"
          - "middleware/**"
          - "models/**"
          - "config/**"
          - "*.cjs"
          - "*.mjs"

# ------------------------------------------------------------
# DATABASE
# ------------------------------------------------------------

database:
  - changed-files:
      - any-glob-to-any-file:
          - "database/**"
          - "db/**"
          - "migrations/**"
          - "seeds/**"
          - "schema/**"
          - "**/*.sql"
          - "**/prisma/**"

# ------------------------------------------------------------
# DOCUMENTATION
# ------------------------------------------------------------

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "README*"
          - "CHANGELOG*"
          - "CONTRIBUTING*"
          - "CODE_OF_CONDUCT*"
          - "SECURITY*"
          - "LICENSE*"
          - "docs/**"
          - "documentation/**"
          - "**/*.md"
          - "**/*.mdx"
          - "**/*.rst"

# ------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------

security:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/codeql.yml"
          - ".github/workflows/security.yml"
          - ".github/scripts/check-secrets.py"
          - "security/**"
          - "policies/**"
          - "middleware/security/**"
          - "**/*security*"
          - "**/*auth*"
          - "**/*permission*"

# ------------------------------------------------------------
# DEPENDENCIES
# ------------------------------------------------------------

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "npm-shrinkwrap.json"
          - "pnpm-lock.yaml"
          - "yarn.lock"
          - "bun.lock"
          - "bun.lockb"
          - "requirements.txt"
          - "pyproject.toml"
          - "Pipfile"
          - "Pipfile.lock"

# ------------------------------------------------------------
# GITHUB ACTIONS AND CI/CD
# ------------------------------------------------------------

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - ".github/scripts/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/CODEOWNERS"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/PULL_REQUEST_TEMPLATE*"

# ------------------------------------------------------------
# TESTING
# ------------------------------------------------------------

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "test/**"
          - "tests/**"
          - "__tests__/**"
          - "spec/**"
          - "**/*.test.js"
          - "**/*.spec.js"
          - "**/*.test.ts"
          - "**/*.spec.ts"
          - "**/*.test.py"
          - "**/*.spec.py"

# ------------------------------------------------------------
# CONFIGURATION
# ------------------------------------------------------------

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - ".env.example"
          - ".gitignore"
          - ".npmrc"
          - ".nvmrc"
          - ".editorconfig"
          - ".prettierrc*"
          - ".eslintrc*"
          - "eslint.config.*"
          - "prettier.config.*"
          - "tsconfig.json"
          - "jsconfig.json"
          - "render.yaml"
          - "Dockerfile"
          - "docker-compose*"
          - "*.config.js"
          - "*.config.cjs"
          - "*.config.mjs"
          - "*.config.ts"

# ------------------------------------------------------------
# ASSETS AND MEDIA
# ------------------------------------------------------------

assets:
  - changed-files:
      - any-glob-to-any-file:
          - "assets/**"
          - "public/images/**"
          - "public/fonts/**"
          - "uploads/**"
          - "**/*.{png,jpg,jpeg,webp,avif,svg,ico}"
          - "**/*.{woff,woff2,ttf,otf}"

# ------------------------------------------------------------
# EDUCATION AND ADMISSIONS DATA
# ------------------------------------------------------------

education:
  - changed-files:
      - any-glob-to-any-file:
          - "data/**"
          - "assets/data/**"
          - "datasets/**"
          - "colleges/**"
          - "universities/**"
          - "**/colleges.json"
          - "**/universities.json"
          - "**/courses.json"
          - "**/admission-process.json"
          - "**/entrance-exams.json"
          - "**/scholarships.json"

# ------------------------------------------------------------
# JOBS AND CAREER SERVICES
# ------------------------------------------------------------

careers:
  - changed-files:
      - any-glob-to-any-file:
          - "jobs/**"
          - "careers/**"
          - "recruitment/**"
          - "employment/**"
          - "**/jobs.json"
          - "**/career-options.json"
          - "**/services.json"

# ------------------------------------------------------------
# PERFORMANCE
# ------------------------------------------------------------

performance:
  - changed-files:
      - any-glob-to-any-file:
          - "performance/**"
          - "benchmarks/**"
          - "lighthouse/**"
          - "**/*performance*"
          - "**/*cache*"
          - "**/*optimization*"
