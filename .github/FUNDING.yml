# MedOrbits -- GitHub Sponsors and Funding Configuration
# File: /.github/FUNDING.yml
# Purpose: Display supported funding options on the GitHub repository.

# GitHub Sponsors username (remove this entry until the account is configured).
# github: YOUR_GITHUB_SPONSOR_USERNAME

# Patreon creator username.
# patreon: YOUR_PATREON_USERNAME

# Open Collective project slug.
# open_collective: YOUR_OPEN_COLLECTIVE_SLUG

# Ko-fi username.
# ko_fi: YOUR_KOFI_USERNAME

# Tidelift package/platform identifier.
# tidelift: npm/YOUR_PACKAGE_NAME

# Community funding platforms.
# community_bridge: YOUR_PROJECT_NAME
# liberapay: YOUR_LIBERAPAY_USERNAME
# issuehunt: YOUR_ISSUEHUNT_USERNAME
# lfx_crowdfunding: YOUR_PROJECT_NAME

# Custom funding URLs (maximum 4).
# Replace with verified, official MedOrbits funding or sponsorship links.
custom:
  # - "https://example.com/sponsor"
  # - "https://example.com/donate"