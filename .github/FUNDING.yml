
# ==============================================================================
# MedOrbits -- GitHub Sponsors and Funding Configuration
# File: .github/FUNDING.yml
# Release: 2.1.1
#
# Purpose:
#   Display verified funding and sponsorship options on GitHub.
#
# Policy:
#   - Never publish placeholder or unverified funding accounts.
#   - Enable only funding platforms controlled by MedOrbits.
#   - Custom funding URLs must be official and verified.
# ==============================================================================

# GitHub Sponsors username or organization.
# Uncomment only after the account is configured.
# github: YOUR_VERIFIED_GITHUB_SPONSORS_USERNAME

# Patreon creator username.
# patreon: YOUR_VERIFIED_PATREON_USERNAME

# Open Collective project slug.
# open_collective: YOUR_VERIFIED_OPEN_COLLECTIVE_SLUG

# Ko-fi username.
# ko_fi: YOUR_VERIFIED_KOFI_USERNAME

# Tidelift platform identifier, for example: npm/package-name.
# tidelift: npm/YOUR_VERIFIED_PACKAGE_NAME

# Community funding platforms.
# community_bridge: YOUR_VERIFIED_PROJECT_NAME
# liberapay: YOUR_VERIFIED_LIBERAPAY_USERNAME
# issuehunt: YOUR_VERIFIED_ISSUEHUNT_USERNAME
# lfx_crowdfunding: YOUR_VERIFIED_PROJECT_NAME

# Official MedOrbits funding URLs (maximum 4).
# Uncomment and replace only with verified URLs you control.
# custom:
#   - "https://your-official-domain.example/sponsor"
#   - "https://your-official-domain.example/donate"
