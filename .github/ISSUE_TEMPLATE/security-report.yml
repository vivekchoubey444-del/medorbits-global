
# =============================================================================
# MedOrbits | Security Report Issue Form
#
# File: .github/ISSUE_TEMPLATE/security_report.yml
# Release: 2.1.1
#
# Purpose:
#   Collect minimal, non-sensitive security observations.
#
# Policy:
#   Confidential vulnerabilities must use the verified private reporting channel.
#
# IMPORTANT:
#   - Public GitHub issues are not confidential.
#   - Do not request exploit code, credentials, or private user records.
#   - Verify SECURITY.md before directing reporters to a private channel.
#   - This form does not replace the project's vulnerability disclosure policy.
# =============================================================================

name: "🔐 Security Report"
description: "Report a potential security concern affecting MedOrbits without disclosing sensitive technical details."
title: "[Security]: "
labels:
  - security
  - triage
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🔐 MedOrbits Security Reporting

        Thank you for helping protect MedOrbits and its users.

        **Important: Public GitHub issue forms are not confidential.**

        Do not submit exploit details, working exploit code, passwords,
        API keys, access tokens, session cookies, private user records,
        or sensitive production data in this form or in public comments.

        Review the repository's `SECURITY.md` and use its designated
        private reporting method for confidential vulnerability reports.

        If you cannot verify a private reporting method, do not publish
        sensitive technical details. Submit only a minimal, non-sensitive
        summary or contact the repository maintainer through an independently
        verified channel.

        Do not test systems, accounts, or data without explicit authorization.
        Do not access, modify, download, or retain data beyond what your
        authorization permits.

  - type: checkboxes
    id: safety
    attributes:
      label: "🛡️ Responsible Disclosure Checklist"
      description: Confirm these safeguards before submitting.
      options:
        - label: "I have not included passwords, credentials, access tokens, session cookies, or private user data."
          required: true
        - label: "I will avoid publicly disclosing exploitable details before coordinated resolution."
          required: true
        - label: "I have reviewed the repository security policy or will do so before sharing sensitive details."
          required: true

  - type: dropdown
    id: category
    attributes:
      label: "🧭 Security Concern Category"
      description: Select the closest category without sharing exploit details.
      options:
        - Authentication or session management
        - Authorization or access control
        - Sensitive data exposure
        - Injection or input validation
        - Cross-site scripting (XSS)
        - Cross-site request forgery (CSRF)
        - Server-side request forgery (SSRF)
        - File upload or document handling
        - API security
        - Dependency or supply-chain risk
        - Security configuration or deployment
        - Cryptography or secrets management
        - Denial of service or resource exhaustion
        - Suspected account compromise
        - Other
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: exposure
    attributes:
      label: "🌐 Where Was the Issue Observed?"
      options:
        - Production
        - Preview or staging
        - Local development
        - CI or automated workflow
        - Dependency or third-party integration
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "⚠️ Potential Impact"
      description: This is an initial assessment, not a formal severity rating.
      options:
        - Potential unauthorized access
        - Potential exposure of sensitive information
        - Potential modification or deletion of data
        - Potential service disruption
        - Potential privilege escalation
        - Potential account compromise
        - Potential supply-chain compromise
        - Other or uncertain
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "📝 High-Level Summary"
      description: |
        Describe the concern briefly without including payloads, exploit steps,
        confidential data, or instructions that would enable abuse.
      placeholder: "A concise, non-sensitive description of the suspected issue."
    validations:
      required: true

  - type: textarea
    id: affected-component
    attributes:
      label: "🧩 Affected Component"
      description: |
        Identify the general component, page, API route, package, or configuration.
        Do not include secret values, private identifiers, or sensitive endpoints.
      placeholder: "e.g. authentication middleware or document upload functionality"
    validations:
      required: true

  - type: input
    id: affected-version
    attributes:
      label: "🏷️ Affected Version or Commit"
      description: "Provide a public release version or commit SHA if known. Do not include private repository details."
      placeholder: "e.g. 2.0.0 or a commit SHA"

  - type: dropdown
    id: evidence-status
    attributes:
      label: "📋 Evidence Available"
      description: Do not attach exploit payloads or sensitive evidence to this public form.
      options:
        - General observations only
        - Sanitized logs or screenshots
        - Reproduction available for private disclosure
        - Not yet confirmed
    validations:
      required: true

  - type: textarea
    id: safe-evidence
    attributes:
      label: "🔎 Sanitized Evidence (Optional)"
      description: |
        Include only non-sensitive observations. Remove credentials, cookies,
        authorization headers, personal information, private records, internal
        identifiers, and production secrets. Do not include exploit code,
        weaponized payloads, or evidence obtained outside your authorization.
      render: text

  - type: checkboxes
    id: testing
    attributes:
      label: "✅ Testing and Authorization"
      options:
        - label: "Any testing I performed was limited to systems and accounts I was authorized to assess."
          required: true
        - label: "I did not intentionally access, alter, or retain another person's private data beyond my authorization."
          required: true

  - type: dropdown
    id: contact-preference
    attributes:
      label: "📨 Safe Follow-Up Preference (Optional)"
      description: |
        Select a preference without publishing contact details. This selection
        does not create a private communication channel or guarantee a response.
      options:
        - I prefer the verified private reporting channel
        - I can provide further non-sensitive information publicly
        - No follow-up preference
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### 🔒 Maintainer Guidance

        - Do not request exploit details or sensitive evidence in public comments.
        - Direct technical discussion to the verified private reporting channel.
        - Restrict access to sensitive evidence and follow the project's
          coordinated disclosure policy.
        - Do not promise response times unless the security policy defines them.
        - Do not assume a public issue can be made confidential after submission.
        - If sensitive information is accidentally disclosed, follow GitHub's
          applicable incident-handling and content-removal procedures.

        **MedOrbits Security:** Protect users, preserve evidence, and handle
        security reports responsibly.
