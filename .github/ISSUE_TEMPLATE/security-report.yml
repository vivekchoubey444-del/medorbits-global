
name: Security vulnerability report
description: Instructions for reporting suspected MedOrbits security vulnerabilities safely
title: "[Security]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Important: This issue is public

        **Submitting this form creates a publicly visible GitHub issue. It is not a private vulnerability reporting channel.**

        Do not include exploit instructions, proof-of-concept code, credentials, access tokens, private user data, payment information, exposed secrets, or other confidential technical details.

        Read the repository's root `SECURITY.md` file and follow its private reporting instructions before submitting a report.

        If no private reporting channel is documented, contact a repository maintainer through a non-public channel and request secure reporting instructions before sharing sensitive details.

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Required acknowledgment
      description: Confirm both statements before submitting.
      options:
        - label: I understand that this issue will be publicly visible.
          required: true
        - label: I will not disclose exploit details, credentials, secrets, or confidential personal information.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Non-sensitive summary (optional)
      description: |
        Provide a general description only if public disclosure is safe.
        Leave this field blank if even a general description could expose sensitive information.
      placeholder: "Example: Suspected authentication security concern."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Next steps

        1. Read the root `SECURITY.md` file.
        2. Use a private reporting channel explicitly documented by the project, if available.
        3. If no private channel is documented, request secure reporting instructions privately before sharing vulnerability details.
        4. Do not post additional sensitive details in this public issue.

        Do not assume that a security contact, email address, or private reporting feature exists unless the repository or GitHub settings explicitly provide it.
        
