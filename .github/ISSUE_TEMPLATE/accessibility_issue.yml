name: Accessibility Issue
description: Report accessibility barriers or WCAG-related problems.
title: "[A11Y]: "
labels:
  - accessibility
  - needs-triage

body:
  - type: dropdown
    id: category
    attributes:
      label: Accessibility category
      options:
        - Keyboard Navigation
        - Screen Reader
        - Colour Contrast
        - Text Scaling
        - Forms and Labels
        - Images and Alternative Text
        - Focus Management
        - Captions and Media
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected page
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Accessibility barrier
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected accessible behaviour

  - type: input
    id: assistive
    attributes:
      label: Browser or assistive technology
      placeholder: "NVDA / VoiceOver / TalkBack"