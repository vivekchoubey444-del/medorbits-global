
# ============================================================
# MEDORBITS -- QUESTION AND SUPPORT FORM
# File: .github/ISSUE_TEMPLATE/question.yml
# Purpose: Technical and general repository questions
# ============================================================

name: "Question / Technical Support"
description: "Ask a technical, configuration or repository-related question."
title: "[QUESTION]: "
labels:
  - question
  - needs-triage

assignees: []

body:

  # ----------------------------------------------------------
  # INTRODUCTION
  # ----------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## MedOrbits -- Question and Technical Support

        Use this form for questions about the MedOrbits repository,
        application architecture, development and configuration.

        Before submitting:
        - Search existing issues and documentation.
        - Provide enough technical context.
        - Never share passwords, API keys, tokens or private data.

        For security vulnerabilities, use the private security
        reporting channel instead of a public issue.

  # ----------------------------------------------------------
  # QUESTION TYPE
  # ----------------------------------------------------------

  - type: dropdown
    id: question-category
    attributes:
      label: Question Category
      description: Select the most relevant category.
      options:
        - Installation and Setup
        - Repository Structure
        - Local Development
        - Node.js and npm
        - Python
        - Frontend Development
        - Backend Development
        - API Integration
        - Database Configuration
        - Authentication and Authorization
        - Environment Variables
        - Hosting and Deployment
        - Render Configuration
        - GitHub Actions and CI/CD
        - PWA and Offline Functionality
        - Education and Admissions Data
        - Jobs and Recruitment
        - Documentation
        - General Question
        - Other
    validations:
      required: true

  # ----------------------------------------------------------
  # QUESTION TITLE
  # ----------------------------------------------------------

  - type: input
    id: question-title
    attributes:
      label: Question Title
      description: Summarize your question.
      placeholder: "How do I configure the application locally?"
    validations:
      required: true

  # ----------------------------------------------------------
  # QUESTION DETAILS
  # ----------------------------------------------------------

  - type: textarea
    id: question-details
    attributes:
      label: Detailed Question
      description: Explain what you need help understanding.
      placeholder: |
        Describe your question and provide relevant context.
    validations:
      required: true

  # ----------------------------------------------------------
  # REPOSITORY CONTEXT
  # ----------------------------------------------------------

  - type: textarea
    id: context
    attributes:
      label: Repository or Application Context
      description: Mention relevant files, folders or components.
      placeholder: |
        Example:
        - File: server.js
        - Directory: node/config/
        - Component: Authentication
    validations:
      required: false

  # ----------------------------------------------------------
  # EXPECTED OUTCOME
  # ----------------------------------------------------------

  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected Outcome
      description: What are you trying to achieve?
      placeholder: Explain the expected result.
    validations:
      required: false

  # ----------------------------------------------------------
  # CURRENT ISSUE
  # ----------------------------------------------------------

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: Explain what happens currently.
      placeholder: Describe the current behavior.
    validations:
      required: false

  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------

  - type: dropdown
    id: environment
    attributes:
      label: Development Environment
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - GitHub Actions
        - Render
        - Other
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      placeholder: "e.g. v20.x or v26.x"
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g. Python 3.12"
    validations:
      required: false

  # ----------------------------------------------------------
  # ERROR DETAILS
  # ----------------------------------------------------------

  - type: textarea
    id: error-details
    attributes:
      label: Error Messages
      description: Include sanitized error messages if applicable.
      render: text
      placeholder: Paste error messages without secrets or personal data.
    validations:
      required: false

  # ----------------------------------------------------------
  # REFERENCES
  # ----------------------------------------------------------

  - type: textarea
    id: references
    attributes:
      label: Relevant Documentation or References
      description: Include links to relevant documentation or examples.
      placeholder: Add relevant URLs.
    validations:
      required: false

  # ----------------------------------------------------------
  # ADDITIONAL INFORMATION
  # ----------------------------------------------------------

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add anything else that may help answer your question.
    validations:
      required: false

  # ----------------------------------------------------------
  # CONFIRMATION
  # ----------------------------------------------------------

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission Checklist
      options:
        - label: I checked the available documentation.
          required: true
        - label: I provided sufficient context.
          required: true
        - label: I removed credentials and sensitive information.
          required: true
        - label: I understand this is a public GitHub issue.
          required: true
