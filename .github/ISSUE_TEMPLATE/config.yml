
# =============================================================================
# MedOrbits | GitHub Issue Template Configuration
#
# File: .github/ISSUE_TEMPLATE/config.yml
# Release: 2.1.1
#
# Purpose:
#   Direct contributors to the correct reporting channels and resources.
#
# Policy:
#   Public issues are not suitable for confidential vulnerability reports.
#
# Security:
#   - Verify that SECURITY.md contains a working private reporting method.
#   - Never publish credentials, private records, or exploitable details.
#   - Contact links do not enforce repository permissions or contribution approval.
# =============================================================================

blank_issues_enabled: false

contact_links:
  # ---------------------------------------------------------------------------
  # Documentation and Project Information
  # ---------------------------------------------------------------------------

  - name: "📚 MedOrbits Documentation"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits"
    about: >-
      Read the project README, setup instructions, architecture information,
      supported features, and repository documentation before opening an issue.

  - name: "🛠️ Installation and Setup Guide"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits"
    about: >-
      Review installation instructions, configuration requirements,
      environment variables, local development guidance, and troubleshooting
      information in the repository documentation.

  # ---------------------------------------------------------------------------
  # Bug Reports and Feature Requests
  # ---------------------------------------------------------------------------

  - name: "🐛 Report a Bug"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/issues/new?template=bug_report.yml"
    about: >-
      Report reproducible errors, broken pages, unexpected behavior,
      API failures, accessibility problems, or other software defects.
      Remove confidential information from all evidence.

  - name: "💡 Request a Feature"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/issues/new?template=feature_request.yml"
    about: >-
      Propose a new capability or improvement. Explain the problem,
      affected users, expected outcome, and potential benefits.

  # ---------------------------------------------------------------------------
  # Security and Responsible Disclosure
  # ---------------------------------------------------------------------------

  - name: "🔐 Security Reporting Policy"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/blob/main/SECURITY.md"
    about: >-
      Review the security policy for the approved vulnerability-reporting
      process. Never publish exploitable details, credentials, access tokens,
      private records, or sensitive production information in public issues.

  # ---------------------------------------------------------------------------
  # Support and Troubleshooting
  # ---------------------------------------------------------------------------

  - name: "🧭 MedOrbits Support Guide"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/blob/main/SUPPORT.md"
    about: >-
      Find guidance for troubleshooting, account issues, admissions information,
      careers, document uploads, payments, and support escalation where available.

  # ---------------------------------------------------------------------------
  # Contribution and Community Standards
  # ---------------------------------------------------------------------------

  - name: "🤝 Contribution Guidelines"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/blob/main/CONTRIBUTING.md"
    about: >-
      Review contribution requirements, branch and commit conventions,
      testing expectations, and pull request procedures before submitting
      an authorized contribution.

  - name: "🛡️ Code of Conduct"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/blob/main/CODE_OF_CONDUCT.md"
    about: >-
      Read the community participation standards and expectations for
      respectful, responsible, and constructive collaboration.

  # ---------------------------------------------------------------------------
  # Releases and Project History
  # ---------------------------------------------------------------------------

  - name: "📦 Release Notes and Changelog"
    url: "https://github.com/vivekchoubey366-dot/MedOrbits/blob/main/CHANGELOG.md"
    about: >-
      Review documented changes, fixes, improvements, and release notes
      before reporting behavior that may already have been addressed.
