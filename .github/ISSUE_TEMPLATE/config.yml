==============================================================================

MedOrbits -- GitHub Issue Template Configuration

File: .github/ISSUE_TEMPLATE/config.yml

Purpose:

Direct contributors to the correct reporting channels and project resources.

Security:

Public GitHub issues are not suitable for confidential vulnerability reports.

Verify that SECURITY.md provides a working private reporting method.

==============================================================================

blank_issues_enabled: false

contact_links:

