Bug reports and feature requests

--------------------------------------------------

* name: Report a Bug
    url: https://github.com/vivekchoubey366-dot/MedOrbits/issues/new?template=bug_report.yml
    about: >
    Report reproducible errors, broken pages, unexpected behavior,
    API failures, accessibility problems, or other software defects.
* name: Request a Feature
    url: https://github.com/vivekchoubey366-dot/MedOrbits/issues/new?template=feature_request.yml
    about: >
    Propose a new capability or improvement. Explain the problem,
    affected users, expected outcome, and potential benefits.

