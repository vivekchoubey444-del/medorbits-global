name: General Support Request
description: Ask a non-sensitive question about using or configuring MedOrbits.
title: "[SUPPORT]: "
labels:
  - support
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        Do not use public issues to submit private student records,
        identity documents, payment information, passwords, or credentials.

  - type: dropdown
    id: topic
    attributes:
      label: Support topic
      options:
        - Website Usage
        - Education
        - Admissions
        - Courses
        - College Information
        - Careers
        - Consultancy
        - Technical Configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: How can we help?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included passwords, financial details, or private records.
          required: true