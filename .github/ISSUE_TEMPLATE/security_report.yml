name: Security Vulnerability Report
description: Report a potential security vulnerability.
title: "[SECURITY]: "
labels:
  - security
  - needs-private-review

body:
  - type: markdown
    attributes:
      value: |
        IMPORTANT:
        Do not disclose exploitable vulnerabilities, credentials,
        personal data, access tokens, or attack instructions publicly.

        Use the repository's private vulnerability reporting channel
        or the security contact documented in SECURITY.md.

        This public form is for non-sensitive coordination only.

  - type: dropdown
    id: category
    attributes:
      label: Security category
      options:
        - Authentication
        - Authorization
        - Session Management
        - Input Validation
        - Data Exposure
        - Dependency Vulnerability
        - Configuration
        - Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Non-sensitive summary
      description: Do not include exploit steps or sensitive evidence.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Potential impact
      options:
        - Critical
        - High
        - Medium
        - Low
        - Unknown
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included secrets or personal information.
          required: true
        - label: I understand that sensitive details must be reported privately.
          required: true