
# ============================================================
# MEDORBITS -- DOCUMENTATION ISSUE FORM
# File: .github/ISSUE_TEMPLATE/documentation.yml
# Purpose: Documentation corrections and improvements
# ============================================================

name: "Documentation Improvement"
description: "Report documentation errors or suggest improvements."
title: "[DOCS]: "
labels:
  - documentation
  - needs-triage

assignees: []

body:

  # ----------------------------------------------------------
  # INTRODUCTION
  # ----------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## MedOrbits Documentation Improvement

        Help us maintain accurate, complete and understandable
        MedOrbits documentation.

        Before submitting:
        - Search existing documentation issues.
        - Identify the affected document or section.
        - Never include passwords, API keys or confidential information.

  # ----------------------------------------------------------
  # DOCUMENTATION TYPE
  # ----------------------------------------------------------

  - type: dropdown
    id: documentation-type
    attributes:
      label: Documentation Type
      description: Select the documentation area.
      options:
        - Main README
        - Installation Guide
        - Configuration Guide
        - API Documentation
        - Backend Documentation
        - Frontend Documentation
        - Database Documentation
        - Security Documentation
        - Deployment Guide
        - PWA Documentation
        - Education and Admissions
        - Jobs and Recruitment
        - Contribution Guidelines
        - GitHub Actions and CI/CD
        - Architecture Documentation
        - Other
    validations:
      required: true

  # ----------------------------------------------------------
  # ISSUE TYPE
  # ----------------------------------------------------------

  - type: dropdown
    id: issue-type
    attributes:
      label: Documentation Issue
      options:
        - Incorrect information
        - Outdated information
        - Missing documentation
        - Broken link
        - Typographical or grammatical error
        - Unclear instructions
        - Incorrect code example
        - Missing screenshots or diagrams
        - Accessibility improvement
        - Suggested restructuring
        - Other
    validations:
      required: true

  # ----------------------------------------------------------
  # AFFECTED DOCUMENT
  # ----------------------------------------------------------

  - type: input
    id: document-path
    attributes:
      label: Affected File or URL
      description: Provide the file path or public documentation URL.
      placeholder: "README.md or docs/installation.md"
    validations:
      required: true

  # ----------------------------------------------------------
  # PROBLEM DESCRIPTION
  # ----------------------------------------------------------

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Explain what is incorrect or missing.
      placeholder: Describe the documentation problem.
    validations:
      required: true

  # ----------------------------------------------------------
  # CURRENT CONTENT
  # ----------------------------------------------------------

  - type: textarea
    id: current-content
    attributes:
      label: Current Documentation
      description: Quote the relevant existing content if applicable.
      placeholder: Paste the relevant documentation excerpt.
    validations:
      required: false

  # ----------------------------------------------------------
  # PROPOSED CORRECTION
  # ----------------------------------------------------------

  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed Correction
      description: Suggest corrected or improved wording.
      placeholder: Provide your suggested replacement.
    validations:
      required: false

  # ----------------------------------------------------------
  # REASON FOR CHANGE
  # ----------------------------------------------------------

  - type: textarea
    id: reason
    attributes:
      label: Reason for Improvement
      description: Explain why this change is necessary.
      placeholder: Explain how this improves documentation quality.
    validations:
      required: true

  # ----------------------------------------------------------
  # AFFECTED AUDIENCE
  # ----------------------------------------------------------

  - type: checkboxes
    id: audience
    attributes:
      label: Affected Audience
      description: Select all relevant audiences.
      options:
        - label: Students
        - label: Parents and Guardians
        - label: Educational Institutions
        - label: Developers
        - label: Contributors
        - label: Administrators
        - label: Job Seekers
        - label: Employers and Recruiters
        - label: General Users

  # ----------------------------------------------------------
  # PRIORITY
  # ----------------------------------------------------------

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      options:
        - Critical -- Documentation creates a serious security or operational risk
        - High -- Important instructions are incorrect
        - Medium -- Information needs improvement
        - Low -- Minor editorial correction
    validations:
      required: true

  # ----------------------------------------------------------
  # REFERENCES
  # ----------------------------------------------------------

  - type: textarea
    id: references
    attributes:
      label: References
      description: Provide reliable sources or supporting links.
      placeholder: Add relevant references.
    validations:
      required: false

  # ----------------------------------------------------------
  # CONTRIBUTION
  # ----------------------------------------------------------

  - type: dropdown
    id: contribution
    attributes:
      label: Would You Like to Submit a Documentation Fix?
      options:
        - Yes, I can submit a pull request.
        - I can help review the correction.
        - No, I am only reporting the issue.
    validations:
      required: true

  # ----------------------------------------------------------
  # ADDITIONAL INFORMATION
  # ----------------------------------------------------------

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Include any other relevant details.
    validations:
      required: false

  # ----------------------------------------------------------
  # CONFIRMATION
  # ----------------------------------------------------------

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission Checklist
      options:
        - label: I checked for duplicate documentation issues.
          required: true
        - label: I identified the affected document.
          required: true
        - label: I provided accurate information.
          required: true
        - label: I removed confidential information.
          required: true
