
name: "Feature request"
description: "Suggest an improvement or new capability for MedOrbits."
title: "[Feature]: "
labels:
  - enhancement
  - triage
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MedOrbits.

        Describe the problem, the users affected, and the outcome you want to achieve.
        Search existing issues before submitting to reduce duplicate requests.

        Do not include passwords, API keys, personal records, private documents,
        or other confidential information.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Pre-submission checklist"
      options:
        - label: "I searched existing issues for similar feature requests."
          required: true
        - label: "I have described the problem and the intended outcome."
          required: true
        - label: "This request does not contain confidential or sensitive information."
          required: true

  - type: dropdown
    id: area
    attributes:
      label: "Feature area"
      description: "Which part of MedOrbits would this feature improve?"
      options:
        - Website and user interface
        - Education and admissions
        - Colleges and universities
        - International education
        - Careers and job opportunities
        - Recruitment and job assistance
        - User accounts and profiles
        - Search and filtering
        - Forms and document management
        - API and backend
        - Administration and moderation
        - Accessibility and localization
        - Security and privacy
        - Performance and reliability
        - Deployment and developer tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem statement"
      description: "What problem are you trying to solve, and why does it matter?"
      placeholder: |
        Describe the current limitation.
        Explain who is affected and how the issue impacts their experience.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "Proposed solution"
      description: "Explain the feature or improvement you would like."
      placeholder: "Describe the expected behavior and how the feature could work."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Have you considered a workaround or another solution?"
      placeholder: "Describe alternatives and why they are insufficient."

  - type: dropdown
    id: audience
    attributes:
      label: "Primary users affected"
      options:
        - Students and applicants
        - Parents and guardians
        - Educational institutions
        - Job seekers
        - Employers and recruiters
        - Consultants and advisors
        - Administrators and maintainers
        - Multiple user groups
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Suggested priority"
      description: "This is a suggestion for maintainers, not a delivery commitment."
      options:
        - "Critical -- essential workflow is blocked"
        - "High -- substantial user benefit or impact"
        - "Medium -- useful improvement"
        - "Low -- minor enhancement"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: "Example use cases"
      description: "Provide realistic examples of how users would use this feature."
      placeholder: |
        A user opens the relevant page.
        The user performs an action.
        MedOrbits responds with the expected result.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "How can maintainers determine whether the feature is complete?"
      placeholder: |
        - [ ] Expected behavior is implemented.
        - [ ] Validation and error handling are covered.
        - [ ] Relevant tests pass.
        - [ ] Responsive and accessible behavior is verified.

  - type: dropdown
    id: platform
    attributes:
      label: "Target platform"
      options:
        - Desktop web
        - Mobile web
        - Tablet
        - API or backend
        - Developer tooling or CI
        - All supported platforms
        - Other
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies or constraints"
      description: "Mention relevant integrations, compatibility needs, or technical limitations."
      placeholder: "Optional"

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Add non-sensitive mockups, examples, or supporting details."
      placeholder: "Optional"

  - type: markdown
    attributes:
      value: |
        ---

        ### Review process

        Submitting a feature request does not guarantee implementation or a delivery date.

        Maintainers may ask for clarification, assess feasibility, consider security and
        accessibility, or close requests that fall outside the project's scope.
