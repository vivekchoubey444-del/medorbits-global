name: Bug Report
description: Report a reproducible bug or unexpected behaviour in MedOrbits.
title: "[BUG]: "
labels:
  - bug
  - needs-triage
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
        Please provide accurate details and avoid sharing passwords,
        API keys, personal student information, or confidential records.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Website / Frontend
        - Backend / API
        - Authentication
        - Student Portal
        - College Directory
        - Course Catalogue
        - Admissions
        - Scholarships
        - Jobs / Careers
        - Recruitment
        - Consultancy
        - Database
        - PWA / Offline
        - Admin Dashboard
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page, route, or API endpoint
      placeholder: "/admissions/ or /api/v1/courses"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug description
      description: Explain what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page.
        2. Perform the action.
        3. Observe the error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Production / Staging / Local"

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 130 / Safari 18"

  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: Remove secrets and personal information before sharing.
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have removed confidential information.
          required: true