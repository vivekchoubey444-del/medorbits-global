
# ============================================================
# MEDORBITS -- BUG REPORT FORM
# File: .github/ISSUE_TEMPLATE/bug_report.yml
# Purpose: Structured software bug reporting
# ============================================================

name: "Bug Report"
description: "Report a bug, unexpected behavior or application failure."
title: "[BUG]: "
labels:
  - bug
  - needs-triage

assignees: []

body:

  # ----------------------------------------------------------
  # INTRODUCTION
  # ----------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## MedOrbits Bug Report

        Thank you for helping improve MedOrbits.

        Before submitting:
        - Search existing issues for duplicates.
        - Never include passwords, API keys or personal information.
        - Provide clear reproduction steps.
        - Remove sensitive information from screenshots and logs.

  # ----------------------------------------------------------
  # BUG SUMMARY
  # ----------------------------------------------------------

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clearly explain the problem.
      placeholder: Describe what is not working.
    validations:
      required: true

  # ----------------------------------------------------------
  # AFFECTED MODULE
  # ----------------------------------------------------------

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Select the area where the issue occurs.
      options:
        - Homepage
        - Education and Courses
        - MBBS and Medical Admissions
        - BDS and Dental Admissions
        - BAMS / BUMS / AYUSH
        - Colleges and Universities
        - Entrance Examinations
        - Scholarships
        - Jobs and Recruitment
        - Career Support
        - User Registration and Login
        - User Dashboard
        - API and Backend
        - Database
        - Search
        - Payments
        - Documents and Uploads
        - PWA and Offline Mode
        - Mobile Responsiveness
        - Performance
        - Security
        - GitHub Actions / CI
        - Other
    validations:
      required: true

  # ----------------------------------------------------------
  # SEVERITY
  # ----------------------------------------------------------

  - type: dropdown
    id: severity
    attributes:
      label: Bug Severity
      description: Select the impact of this bug.
      options:
        - Critical -- Application unavailable or major data/security impact
        - High -- Important functionality is broken
        - Medium -- Functionality is partially affected
        - Low -- Minor issue or visual defect
    validations:
      required: true

  # ----------------------------------------------------------
  # EXPECTED BEHAVIOR
  # ----------------------------------------------------------

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Explain the expected result.
    validations:
      required: true

  # ----------------------------------------------------------
  # ACTUAL BEHAVIOR
  # ----------------------------------------------------------

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead?
      placeholder: Explain the actual result.
    validations:
      required: true

  # ----------------------------------------------------------
  # REPRODUCTION STEPS
  # ----------------------------------------------------------

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps to reproduce the issue.
      placeholder: |
        1. Open the affected page.
        2. Perform the action.
        3. Observe the error.
    validations:
      required: true

  # ----------------------------------------------------------
  # FREQUENCY
  # ----------------------------------------------------------

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction Frequency
      options:
        - Always
        - Frequently
        - Sometimes
        - Rarely
        - Only once
        - Unable to determine
    validations:
      required: true

  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local Development
        - Preview Deployment
        - GitHub Actions
        - Other
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected Page or API Endpoint
      description: Provide the URL or endpoint without credentials or private tokens.
      placeholder: "https://example.com/page"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome, Safari, Firefox, Edge"
    validations:
      required: false

  - type: input
    id: operating-system
    attributes:
      label: Operating System
      placeholder: "Windows, macOS, Linux, Android, iOS"
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Desktop, iPhone, Android phone, tablet"
    validations:
      required: false

  - type: input
    id: application-version
    attributes:
      label: Application Version
      placeholder: "e.g. 2.1.3"
    validations:
      required: false

  # ----------------------------------------------------------
  # ERROR DETAILS
  # ----------------------------------------------------------

  - type: textarea
    id: logs
    attributes:
      label: Error Messages and Logs
      description: |
        Paste relevant error messages or sanitized logs.
        Remove credentials, tokens, personal data and private URLs.
      render: text
      placeholder: Paste sanitized logs here.
    validations:
      required: false

  # ----------------------------------------------------------
  # SCREENSHOTS
  # ----------------------------------------------------------

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Recordings
      description: |
        Attach screenshots or recordings directly after creating the issue.
        Hide personal information and confidential data.
      placeholder: Describe the attached evidence.
    validations:
      required: false

  # ----------------------------------------------------------
  # WORKAROUND
  # ----------------------------------------------------------

  - type: textarea
    id: workaround
    attributes:
      label: Temporary Workaround
      description: Is there another way to complete the affected task?
      placeholder: Describe any workaround.
    validations:
      required: false

  # ----------------------------------------------------------
  # ADDITIONAL INFORMATION
  # ----------------------------------------------------------

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Include any other information useful for investigation.
    validations:
      required: false

  # ----------------------------------------------------------
  # CONFIRMATION
  # ----------------------------------------------------------

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I provided accurate reproduction steps.
          required: true
        - label: I removed passwords, API keys and sensitive information.
          required: true
        - label: I understand that this issue will be publicly visible unless handled through a private security advisory.
          required: true
