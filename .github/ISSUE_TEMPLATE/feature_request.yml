name: Feature Request
description: Suggest a new feature or improvement for MedOrbits.
title: "[FEATURE]: "
labels:
  - enhancement
  - needs-triage
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Suggest a feature that improves education, admissions,
        career services, recruitment, or the MedOrbits platform.

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - Education
        - Admissions
        - College / University Directory
        - Student Dashboard
        - Scholarships
        - Study Abroad
        - Jobs / Careers
        - Recruitment
        - Consultancy
        - AI Integration
        - Search
        - Accessibility
        - Security
        - Performance
        - Administration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user problem should this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I have checked for similar feature requests.
          required: true