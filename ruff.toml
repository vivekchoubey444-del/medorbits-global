
line-length = 100
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # Import sorting
    "UP",   # Python modernization
    "B",    # Bugbear: common bug patterns
    "S",    # Security-oriented checks
]
