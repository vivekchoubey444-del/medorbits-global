# ============================================================
# MedOrbits -- Python Quality & Security Configuration
# File: ruff.toml
# Python target: 3.12+
# Scope: Linting, import sorting, security checks and formatting
# ============================================================
# ------------------------------------------------------------
# CORE CONFIGURATION
# ------------------------------------------------------------
line-length = 100
indent-width = 4
target-version = "py312"
respect-gitignore = true
force-exclude = true
output-format = "concise"
show-fixes = true
show-source = true
# MedOrbits Python source and test locations.
# Keep these aligned with the actual repository structure.
src = [
    "python",
    "src",
    "tests",
]
# ------------------------------------------------------------
# EXCLUSIONS
# ------------------------------------------------------------
#
# Patterns cover root-level and nested generated/dependency paths.
# Git-ignored paths are also respected when respect-gitignore is enabled.
#
# Do not exclude application source, tests, configuration, or migrations
# merely because they are generated by a development workflow.
exclude = [
    # Version control
    ".git",
    "**/.git/**",
    ".github",
    "**/.github/**",
    ".hg",
    "**/.hg/**",
    ".svn",
    "**/.svn/**",
    # Python environments
    ".venv",
    "**/.venv/**",
    "venv",
    "**/venv/**",
    "env",
    "**/env/**",
    ".virtualenv",
    "**/.virtualenv/**",
    "site-packages",
    "**/site-packages/**",
    # Python caches and tooling
    "__pycache__",
    "**/__pycache__/**",
    ".mypy_cache",
    "**/.mypy_cache/**",
    ".pytest_cache",
    "**/.pytest_cache/**",
    ".ruff_cache",
    "**/.ruff_cache/**",
    ".tox",
    "**/.tox/**",
    ".nox",
    "**/.nox/**",
    ".hypothesis",
    "**/.hypothesis/**",
    # Build and distribution artifacts
    "build",
    "**/build/**",
    "dist",
    "**/dist/**",
    "wheelhouse",
    "**/wheelhouse/**",
    "*.egg-info",
    "**/*.egg-info/**",
    # JavaScript dependencies and generated output
    "node_modules",
    "**/node_modules/**",
    "vendor",
    "**/vendor/**",
    # Generated code and documentation output
    "generated",
    "**/generated/**",
    "reports/generated",
    "**/reports/generated/**",
    "htmlcov",
    "**/htmlcov/**",
    "coverage",
    "**/coverage/**",
    "site",
    "**/site/**",
    # Temporary directories
    "tmp",
    "**/tmp/**",
    "temp",
    "**/temp/**",
]
# ============================================================
# LINT RULES
# ============================================================
[lint]
# Core correctness, security and maintainability rules.
select = [
    "E",       # pycodestyle errors
    "F",       # Pyflakes
    "W",       # pycodestyle warnings
    "I",       # Import sorting
    "UP",      # Python modernization
    "B",       # Bugbear
    "S",       # Security-oriented checks
    "A",       # Built-in name shadowing
    "ANN",     # Type annotation checks
    "ARG",     # Unused arguments
    "ASYNC",   # Async programming checks
    "BLE",     # Blind exception handling
    "C4",      # Comprehension improvements
    "COM",     # Trailing comma consistency
    "DTZ",     # Timezone-aware datetime checks
    "EM",      # Exception message practices
    "ERA",     # Commented-out code
    "EXE",     # Executable file checks
    "FBT",     # Boolean argument checks
    "FLY",     # String formatting modernization
    "FURB",    # Modern Python idioms
    "G",       # Logging format checks
    "ICN",     # Import conventions
    "INP",     # Package structure checks
    "ISC",     # Implicit string concatenation
    "LOG",     # Logging practices
    "N",       # Naming conventions
    "PERF",    # Performance checks
    "PGH",     # Pygrep hygiene
    "PIE",     # Miscellaneous improvements
    "PLC",     # Pylint conventions
    "PLE",     # Pylint errors
    "PLR",     # Pylint refactoring checks
    "PLW",     # Pylint warnings
    "PT",      # Pytest best practices
    "PTH",     # pathlib recommendations
    "PYI",     # Type stub checks
    "RET",     # Return statement checks
    "RSE",     # Raise statement checks
    "RUF",     # Ruff-specific checks
    "SLOT",    # __slots__ checks
    "SIM",     # Code simplification
    "T10",     # Debugger detection
    "T20",     # Accidental print statements
    "TC",      # Type-checking import checks
    "TID",     # Tidy imports
    "TRY",     # Exception-handling practices
    "YTT",     # sys.version checks
]
# Formatter handles line wrapping.
# Do not automatically change source files during a normal lint run.
ignore = [
    "E501",
]
fix = false
unsafe-fixes = false
# Keep the rules Ruff should automatically apply separate from normal
# checking. Run `python -m ruff check --fix .` explicitly when desired.
# Unsafe fixes remain disabled.
# ------------------------------------------------------------
# OPTIONAL LINT RULE EXTENSIONS
# ------------------------------------------------------------
#
# Enable these after reviewing their impact on the existing codebase.
#
# C90: McCabe complexity checks
# D:   Docstring conventions
# TCH: Type-checking import recommendations are covered by TC.
#
# Example:
# extend-select = ["C90"]
#
# Avoid enabling additional rule families without running the checks
# against the current repository and reviewing the resulting findings.
# ============================================================
# IMPORT SORTING
# ============================================================
[lint.isort]
known-first-party = [
    "medorbits",
]
combine-as-imports = true
force-sort-within-sections = true
force-single-line = false
order-by-type = true
split-on-trailing-comma = true
# ------------------------------------------------------------
# IMPORT SORTING POLICY
# ------------------------------------------------------------
#
# Standard-library imports should precede third-party imports.
# Third-party imports should precede MedOrbits first-party imports.
# Keep import aliases explicit and consistent.
#
# If the repository uses additional first-party package names,
# add them to known-first-party after confirming the package layout.
# ============================================================
# BUGBEAR -- FRAMEWORK-AWARE IMMUTABLE CALLS
# ============================================================
[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]
# ============================================================
# PYLINT -- COMPLEXITY LIMITS
# ============================================================
[lint.pylint]
max-args = 7
max-branches = 15
max-returns = 8
max-statements = 60
# ============================================================
# FILE-SPECIFIC EXCEPTIONS
# ============================================================
#
# Keep test-specific exceptions limited to test files.
# Do not globally disable security checks for application source.
#
# S101: Assertions are allowed in tests.
# S105/S106: May be appropriate for clearly fake test credentials.
#            Do not use real secrets in tests or fixtures.
# PLR2004: Numeric constants may be legitimate in assertions.
# ANN:     Annotation requirements can be relaxed in test scaffolding.
[lint.per-file-ignores]
"python/tests/**/*.py" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "PLR2004",
]
"tests/**/*.py" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "PLR2004",
]
"**/test_*.py" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "PLR2004",
]
"**/tests/**/*.py" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "PLR2004",
]
"**/conftest.py" = [
    "S101",
]
"python/scripts/**/*.py" = [
    "T201",
]
"scripts/**/*.py" = [
    "T201",
]
# ============================================================
# FORMATTER
# ============================================================
[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88
skip-magic-trailing-comma = false
preview = false
# Keep formatting deterministic across development machines and CI.
# Ruff formatting does not replace linting or security review.
# ============================================================
# DEVELOPMENT WORKFLOW
# ============================================================
#
# Check Python lint rules:
#   python -m ruff check .
#
# Check formatting without modifying files:
#   python -m ruff format --check .
#
# Apply supported safe lint fixes:
#   python -m ruff check --fix .
#
# Format Python files:
#   python -m ruff format .
#
# Run both non-mutating checks:
#   python -m ruff check . && python -m ruff format --check .
#
# Inspect the effective configuration:
#   python -m ruff check --show-settings python/
#
# Validate configuration compatibility with the installed Ruff:
#   python -m ruff check .
#
# ============================================================
# CI & SECURITY POLICY
# ============================================================
#
# 1. Run Ruff checks in CI before merging changes.
#
# 2. Keep unsafe automatic fixes disabled unless a reviewed workflow
#    explicitly requires them.
#
# 3. Review all automatically proposed code changes.
#
# 4. Do not suppress security findings solely to obtain a clean build.
#
# 5. Keep exceptions specific to the smallest appropriate file scope.
#
# 6. Use a reviewed dependency lock file for reproducible CI installations.
#
# 7. Review Ruff release notes before upgrading the pinned CI version.
#
# 8. Keep this file aligned with pyproject.toml and the supported Python
#    runtime. Avoid maintaining contradictory Ruff settings in multiple
#    configuration files.
#
# 9. Remember that Ruff security rules are static-analysis checks, not a
#    substitute for dependency auditing, runtime testing, or threat modeling.
#
# 10. Validate the configuration against the Ruff version installed in CI.
#
# ============================================================
# END OF MEDORBITS RUFF CONFIGURATION
# ============================================================