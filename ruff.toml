
# ============================================================
# MedOrbits -- Python Quality & Security Configuration
# File: ruff.toml
# Python target: 3.12+
# Scope: Linting, import sorting, security checks and formatting
# ============================================================

# ------------------------------------------------------------
# CORE CONFIGURATION
# ------------------------------------------------------------

line-length = 100
indent-width = 4
target-version = "py312"

respect-gitignore = true
force-exclude = true

output-format = "concise"
show-fixes = true
show-source = true

# MedOrbits Python source and test locations.
# Keep these aligned with the actual repository structure.
src = [
    "python",
    "src",
    "tests",
]

# ------------------------------------------------------------
# EXCLUSIONS
# ------------------------------------------------------------

exclude = [
    ".git",
    ".github",
    ".hg",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".nox",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "site-packages",
    "node_modules",
    "vendor",
    "generated",
    "__pycache__",
]

# ============================================================
# LINT RULES
# ============================================================

[lint]

select = [
    "E",       # pycodestyle errors
    "F",       # Pyflakes
    "W",       # pycodestyle warnings
    "I",       # Import sorting
    "UP",      # Python modernization
    "B",       # Bugbear
    "S",       # Security-oriented checks
    "A",       # Built-in name shadowing
    "ANN",     # Type annotation checks
    "ARG",     # Unused arguments
    "ASYNC",   # Async programming checks
    "BLE",     # Blind exception handling
    "C4",      # Comprehension improvements
    "COM",     # Trailing comma consistency
    "DTZ",     # Timezone-aware datetime checks
    "EM",      # Exception message practices
    "ERA",     # Commented-out code
    "EXE",     # Executable file checks
    "FBT",     # Boolean argument checks
    "FLY",     # String formatting modernization
    "FURB",    # Modern Python idioms
    "G",       # Logging format checks
    "ICN",     # Import conventions
    "INP",     # Package structure checks
    "ISC",     # Implicit string concatenation
    "LOG",     # Logging practices
    "N",       # Naming conventions
    "PERF",    # Performance checks
    "PGH",     # Pygrep hygiene
    "PIE",     # Miscellaneous improvements
    "PLC",     # Pylint conventions
    "PLE",     # Pylint errors
    "PLR",     # Pylint refactoring checks
    "PLW",     # Pylint warnings
    "PT",      # Pytest best practices
    "PTH",     # pathlib recommendations
    "PYI",     # Type stub checks
    "RET",     # Return statement checks
    "RSE",     # Raise statement checks
    "RUF",     # Ruff-specific checks
    "SLOT",    # __slots__ checks
    "SIM",     # Code simplification
    "T10",     # Debugger detection
    "T20",     # Accidental print statements
    "TC",      # Type-checking import checks
    "TID",     # Tidy imports
    "TRY",     # Exception-handling practices
    "YTT",     # sys.version checks
]

# Line wrapping is enforced by the formatter.
# Security rules remain enabled globally.
ignore = [
    "E501",
]

# Safe fixes must be explicitly requested with --fix.
fix = false
unsafe-fixes = false

# ============================================================
# IMPORT SORTING
# ============================================================

[lint.isort]

known-first-party = [
    "medorbits",
]

combine-as-imports = true
force-sort-within-sections = true
force-single-line = false
order-by-type = true
split-on-trailing-comma = true

# ============================================================
# BUGBEAR -- FRAMEWORK-AWARE IMMUTABLE CALLS
# ============================================================

[lint.flake8-bugbear]

extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

# ============================================================
# PYLINT -- COMPLEXITY LIMITS
# ============================================================

[lint.pylint]

max-args = 7
max-branches = 15
max-returns = 8
max-statements = 60

# ============================================================
# FILE-SPECIFIC EXCEPTIONS
# ============================================================

[lint.per-file-ignores]

"python/tests/**/*.py" = [
    "ANN",      # Test fixtures may not need full annotations.
    "S101",     # Assertions are expected in tests.
    "S105",     # Placeholder password literals in tests.
    "S106",     # Placeholder credentials in tests.
    "PLR2004",  # Numeric constants in assertions.
]

"tests/**/*.py" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "PLR2004",
]

"**/test_*.py" = [
    "ANN",
    "S101",
    "S105",
    "S106",
    "PLR2004",
]

"**/conftest.py" = [
    "S101",
]

"python/scripts/**/*.py" = [
    "T201",     # Allow deliberate CLI output.
]

"scripts/**/*.py" = [
    "T201",
]

# ============================================================
# FORMATTER
# ============================================================

[format]

quote-style = "double"
indent-style = "space"
line-ending = "lf"

docstring-code-format = true
docstring-code-line-length = 88

skip-magic-trailing-comma = false
preview = false

# ============================================================
# END OF CONFIGURATION
# ============================================================
