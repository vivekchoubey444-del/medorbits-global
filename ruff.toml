
# =============================================================================
# MedOrbits -- Ruff Configuration
# File: /ruff.toml
# Release target: 2.0.1
# Python: 3.11+
#
# Purpose:
#   Python linting, import sorting, security checks,
#   modernization and code formatting.
#
# Policy:
#   Lint and format checks must not modify files unless
#   an explicit formatting or autofix command is executed.
# =============================================================================

# Python language version targeted by the project.
target-version = "py311"

# Project source directories.
src = [
    "src",
    "scripts",
    "tests",
    "test",
    "tools",
    "python",
]

# Maximum line length.
line-length = 100

# Indentation.
indent-width = 4

# Generated, external and environment directories.
extend-exclude = [
    ".git",
    ".agent-backup",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".nox",
    "node_modules",
    "coverage",
    "htmlcov",
    "dist",
    "build",
    ".next",
    ".nuxt",
    ".wrangler",
    ".cache",
    "vendor",
    "site-packages",
    "third_party",
]

# -----------------------------------------------------------------------------
# LINTER
# -----------------------------------------------------------------------------

[lint]

# E4/E7/E9: pycodestyle errors
# F: Pyflakes
# I: import sorting
# UP: Python modernization
# B: bug-prone patterns
# SIM: simplification
# S: Bandit-derived security checks
# RUF: Ruff-specific checks
# PTH: pathlib best practices
# PERF: performance-oriented checks
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "S",
    "RUF",
    "PTH",
    "PERF",
]

# Long lines are handled by formatting and code review.
ignore = [
    "E501",
]

# -----------------------------------------------------------------------------
# PER-FILE RULE EXCEPTIONS
# -----------------------------------------------------------------------------

[lint.per-file-ignores]

# Public package exports and initialization side effects.
"__init__.py" = [
    "F401",
]

# Assertions are appropriate in test code.
"tests/**/*.py" = [
    "S101",
]
"test/**/*.py" = [
    "S101",
]
"**/tests/**/*.py" = [
    "S101",
]
"**/test_*.py" = [
    "S101",
]

# Keep security checks enabled for test code except for explicitly
# permitted assertion usage. Add further exceptions only with justification.

# -----------------------------------------------------------------------------
# IMPORT SORTING
# -----------------------------------------------------------------------------

[lint.isort]

known-first-party = [
    "medorbits",
]

combine-as-imports = true
force-sort-within-sections = true
force-single-line = false
split-on-trailing-comma = true

# -----------------------------------------------------------------------------
# FORMATTER
# -----------------------------------------------------------------------------

[format]

quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

# Ruff format --check verifies formatting without rewriting files.
# Ruff format modifies files only when explicitly invoked without --check.

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
