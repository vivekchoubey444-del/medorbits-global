# ============================================================
# MedOrbits -- Ruff Configuration
# File: ruff.toml
# Release target: 2.0.0
#
# Purpose:
#   Python linting, import sorting, and code formatting.
# ============================================================
# Python language version targeted by the project.
target-version = "py311"
# Directories Ruff should search for Python source files.
src = [
    "src",
    "scripts",
    "tests",
    "tools"
]
# Exclude generated, vendor, and environment directories.
extend-exclude = [
    ".git",
    ".agent-backup",
    ".venv",
    "venv",
    "node_modules",
    "__pycache__",
    "coverage",
    "dist",
    "build",
    ".next",
    ".wrangler",
    "vendor"
]
# Maximum permitted line length.
line-length = 100
# Indentation and source encoding.
indent-width = 4
# ------------------------------------------------------------
# Linter
# ------------------------------------------------------------
[lint]
# Enable:
# E/F: pycodestyle errors and Pyflakes
# I: import sorting
# UP: modern Python syntax suggestions
# B: common bug-prone patterns
# SIM: simplification suggestions
# S: selected security-related patterns
# RUF: Ruff-specific checks
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "S",
    "RUF"
]
# Permit common development conventions where appropriate.
ignore = [
    "E501"
]
# Allow unused imports in package initialization modules.
[lint.per-file-ignores]
"__init__.py" = [
    "F401"
]
"tests/**/*.py" = [
    "S101"
]
"test/**/*.py" = [
    "S101"
]
# ------------------------------------------------------------
# Import sorting
# ------------------------------------------------------------
[lint.isort]
known-first-party = [
    "medorbits"
]
combine-as-imports = true
force-sort-within-sections = true
# ------------------------------------------------------------
# Formatter
# ------------------------------------------------------------
[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false
# Keep source files in their existing layout unless formatting
# is explicitly run by a developer or CI job.