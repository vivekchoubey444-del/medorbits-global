
# ==============================================================================
# MedOrbits -- Python Project Configuration
# File: python/pyproject.toml
# Release: 1.0.0
#
# Purpose:
#   Standardize Python packaging, testing, linting, formatting, and type checks.
# ==============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medorbits-python-tools"
version = "1.0.0"
description = "Python utilities for MedOrbits repository validation, automation, and maintenance."
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
    "bandit>=1.7"
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "node_modules",
    "dist",
    "build"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "S"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist"
]
skips = []
