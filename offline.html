<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041321">
<meta name="robots" content="noindex">
<title>Offline | MedOrbits</title>
<style>
:root{color-scheme:dark;--bg:#041321;--panel:#0c2132;--gold:#d4af5b;--text:#edf3f8;--muted:#afc0ce}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#17354a,var(--bg) 68%);font:16px/1.6 system-ui,sans-serif;color:var(--text)}
main{width:min(100%,560px);padding:clamp(24px,6vw,44px);border:1px solid #29475a;border-radius:22px;background:var(--panel);text-align:center;box-shadow:0 24px 80px #0005}
.mark{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 18px;border:1px solid var(--gold);border-radius:20px;color:var(--gold);font:700 40px Georgia,serif}
h1{line-height:1.15;margin:0 0 14px}p{color:var(--muted)}button,a{display:inline-block;margin:8px 4px 0;padding:12px 18px;border:1px solid var(--gold);border-radius:10px;background:var(--gold);color:#101725;font-weight:700;text-decoration:none;cursor:pointer}
</style>
</head>
<body><main><div class="mark" aria-hidden="true">M</div><h1>You're offline</h1><p>Some previously opened MedOrbits pages may be available offline. Reconnect for current admission dates, fees, notices, account features and application services.</p><button onclick="location.reload()" type="button">Try again</button><a href="/">Home</a></main></body>
</html>
