
openapi: 3.1.0

info:
  title: MedOrbits API
  version: 1.1.0
  summary: Education, admissions, careers, recruitment, and application management API
  description: |
    OpenAPI contract for the MedOrbits platform.

    Covers health checks, authentication, applications, notifications,
    and restricted audit-log access.

    Security requirements:
    - Authentication is required by default.
    - Application ownership must be enforced server-side.
    - Administrative operations require server-verified permissions.
    - Client-controlled fields must never override protected fields.
    - Document access requires ownership and authorization checks.
    - Validation, rate limiting, and business rules must be enforced
      by the actual API implementation.

    This specification is a contract, not proof that every endpoint
    has already been implemented. Reconcile routes, database fields,
    authentication middleware, and response formats before release.
  contact:
    name: MedOrbits API Support
  license:
    name: Proprietary

servers:
  - url: /api
    description: Same-origin API deployment
  - url: https://api.example.com/api
    description: Replace with the actual production API URL

tags:
  - name: Health
    description: Health and readiness checks
  - name: Authentication
    description: Authentication and current-user access
  - name: Applications
    description: Application lifecycle and workflow
  - name: Notifications
    description: User-specific notifications
  - name: Audit
    description: Restricted audit-event access

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getApiHealth
      summary: Check API health
      security: []
      responses:
        "200":
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /ready:
    get:
      tags: [Health]
      operationId: getApiReadiness
      summary: Check API readiness
      description: |
        Reports whether the service is ready to handle requests.
        The implementation should check required dependencies,
        such as the database, without exposing credentials or
        internal infrastructure details.
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a user
      description: |
        Proposed login contract. Credentials must be verified by
        the configured authentication service. Apply rate limiting,
        generic authentication errors, and appropriate token expiry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List accessible applications
      description: |
        Returns only applications the authenticated user is
        authorized to view. Ordinary applicants must not receive
        other users' applications.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: Filter by application status
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - name: applicationType
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: search
          in: query
          description: Optional search term
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Paginated applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create a draft application
      description: |
        Creates an application for the authenticated applicant.
        Applicant identity, ownership, initial status, and audit
        fields must be assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"

    get:
      tags: [Applications]
      operationId: getApplication
      summary: Get an application
      description: |
        Applicants can access their own applications. Authorized
        staff can access records permitted by their assigned roles.
        The server may return 404 to conceal inaccessible resources.
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Applications]
      operationId: updateDraftApplication
      summary: Update a draft application
      description: |
        Only editable fields are accepted. The server must verify
        ownership, draft status, and permitted field changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      tags: [Applications]
      operationId: deleteDraftApplication
      summary: Delete a draft application
      description: |
        Deletes an eligible draft belonging to the authenticated
        applicant. Enforce retention policies and related-record
        constraints before deleting persistent data.
      responses:
        "200":
          description: Draft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{applicationId}/submit:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [Applications]
      operationId: submitApplication
      summary: Submit an application
      description: |
        Submits an eligible draft after validating required data,
        consent requirements, document references, and applicable
        business rules. The operation should be transaction-safe
        and protect against unintended duplicate submissions.
      responses:
        "200":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{applicationId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    post:
      tags: [Applications]
      operationId: withdrawApplication
      summary: Withdraw an application
      description: |
        Withdraws an application only when its current state and
        applicable policy permit withdrawal.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Application withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{applicationId}/status:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    patch:
      tags: [Applications]
      operationId: transitionApplicationStatus
      summary: Change application status
      description: |
        Restricted workflow operation. Server-side permissions,
        allowed state transitions, and audit history are mandatory.
        Applicants must not approve or reject applications.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusTransitionRequest"
      responses:
        "200":
          description: Application status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /applications/{applicationId}/history:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      tags: [Applications]
      operationId: getApplicationHistory
      summary: Get application status history
      description: History access follows application ownership and staff permissions.
      responses:
        "200":
          description: Application history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the authenticated user's notifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/NotificationType"
      responses:
        "200":
          description: Paginated user-specific notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: Get unread notification count
      responses:
        "200":
          description: Unread notification count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    required: [unreadCount]
                    properties:
                      unreadCount:
                        type: integer
                        minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      description: Only notifications belonging to the authenticated user are updated.
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    required: [updatedCount]
                    properties:
                      updatedCount:
                        type: integer
                        minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    get:
      tags: [Notifications]
      operationId: getNotification
      summary: Get a notification
      responses:
        "200":
          description: Notification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Notifications]
      operationId: deleteNotification
      summary: Delete a notification
      description: Deletes or hides only the authenticated user's notification record.
      responses:
        "200":
          description: Notification deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notifications/{notificationId}/unread:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    post:
      tags: [Notifications]
      operationId: markNotificationUnread
      summary: Mark a notification as unread
      responses:
        "200":
          description: Notification marked as unread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Search audit logs
      description: |
        Restricted administrative operation. Enforce an explicit
        server-side permission check. Audit records should be
        append-only where appropriate, and sensitive values must
        be redacted from results.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: actorId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: action
          in: query
          schema:
            type: string
            maxLength: 150
        - name: resourceType
          in: query
          schema:
            type: string
            maxLength: 100
        - name: resourceId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/AuditOutcome"
        - name: requestId
          in: query
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          description: Inclusive ISO 8601 start timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive ISO 8601 end timestamp
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supply a valid access token in the Authorization header.

  parameters:
    Page:
      name: page
      in: query
      description: One-based page number
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1

    Limit:
      name: limit
      in: query
      description: Maximum results per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"

    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Notification identifier; use the actual identifier format implemented by the database.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"

  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is missing or invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: The authenticated user is not permitted to perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found or access intentionally concealed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Operation conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Suggested delay before retrying, in seconds
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PayloadTooLarge:
      description: Request body exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: Service or required dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [success, status]
      properties:
        success:
          type: boolean
          const: true
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 100
              pattern: "^[A-Z][A-Z0-9_]*$"
            message:
              type: string
              minLength: 1
              maxLength: 1000
            details:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/ValidationIssue"
            requestId:
              type: string
              maxLength: 128
        timestamp:
          type: string
          format: date-time

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, message, code]
      properties:
        field:
          type: string
          maxLength: 500
        message:
          type: string
          maxLength: 1000
        code:
          type: string
          maxLength: 100

    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    LoginResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: false
          required: [accessToken, user]
          properties:
            accessToken:
              type: string
              minLength: 1
              description: Short-lived access token. Never log this value.
            tokenType:
              type: string
              const: Bearer
              default: Bearer
            expiresIn:
              type: integer
              minimum: 1
              description: Token lifetime in seconds
            user:
              $ref: "#/components/schemas/User"

    User:
      type: object
      additionalProperties: false
      required: [id, role]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200

    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/User"

    ApplicationStatus:
      type: string
      enum:
        - draft
        - submitted
        - under_review
        - documents_required
        - approved
        - rejected
        - withdrawn

    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [application]
      properties:
        applicant:
          type: object
          description: |
            Optional applicant details when permitted by the application
            workflow. The server must derive account ownership from the
            authenticated identity, never from this object.
          additionalProperties: true
        application:
          $ref: "#/components/schemas/ApplicationSubmission"
        education:
          type: object
          additionalProperties: true
        preferences:
          type: object
          additionalProperties: true
        consents:
          type: object
          additionalProperties: true
        documents:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/DocumentReference"
        additionalInformation:
          type: string
          maxLength: 5000

    ApplicationSubmission:
      type: object
      additionalProperties: false
      required: [courseCategory, courseName, admissionYear]
      properties:
        applicationType:
          type: string
          enum:
            - admission
            - counselling
            - study-abroad
            - career-guidance
            - consultancy
            - document-assistance
            - other
        courseCategory:
          type: string
          enum:
            - MBBS
            - BDS
            - BAMS
            - BHMS
            - BUMS
            - BSc
            - BTech
            - BBA
            - MBA
            - MD
            - MS
            - PG
            - PARAMEDICAL
            - NURSING
            - PHARMACY
            - DIPLOMA
            - OTHER
        courseName:
          type: string
          minLength: 1
          maxLength: 200
        admissionYear:
          type: integer
          minimum: 2020
          maximum: 2100
        preferredCountry:
          type: string
          maxLength: 100
        preferredState:
          type: string
          maxLength: 100
        preferredCollege:
          type: string
          maxLength: 200
        entranceExam:
          type: string
          enum:
            - NEET-UG
            - NEET-PG
            - CUET
            - JEE
            - CAT
            - GMAT
            - GRE
            - IELTS
            - TOEFL
            - OTHER
            - NOT-APPLICABLE
        entranceExamScore:
          type: number
          minimum: 0
        entranceExamRank:
          type: integer
          minimum: 1
        budget:
          type: object
          additionalProperties: false
          properties:
            minimum:
              type: number
              minimum: 0
            maximum:
              type: number
              minimum: 0
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
        notes:
          type: string
          maxLength: 3000

    UpdateApplicationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        application:
          $ref: "#/components/schemas/ApplicationSubmission"
        education:
          type: object
          additionalProperties: true
        preferences:
          type: object
          additionalProperties: true
        documents:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/DocumentReference"
        additionalInformation:
          type: string
          maxLength: 5000

    DocumentReference:
      type: object
      additionalProperties: false
      required: [documentType, documentId]
      properties:
        documentType:
          type: string
          enum:
            - PHOTO
            - IDENTITY_PROOF
            - CLASS_10_MARKSHEET
            - CLASS_12_MARKSHEET
            - GRADUATION_CERTIFICATE
            - ENTRANCE_SCORECARD
            - TRANSFER_CERTIFICATE
