
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{subject}}</title>
</head>

<body style="margin:0;padding:0;background-color:#071426;color:#f4f7fc;font-family:Arial,'DM Sans',sans-serif;line-height:1.7;">

  <!-- Preheader -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">
    {{preheader}}
  </div>

  <!-- Email background -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#071426;">
    <tr>
      <td align="center" style="padding:28px 12px;">

        <!-- Main email container -->
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;border:1px solid #29496e;border-radius:16px;overflow:hidden;background-color:#0e2039;">

          <!-- Champagne accent -->
          <tr>
            <td style="height:5px;background-color:#c9a96e;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <!-- Brand header -->
          <tr>
            <td align="center" style="padding:29px 24px 23px;">

              <div style="font-family:Georgia,'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:4px;line-height:1.35;color:#f0d9a5;">
                MEDORBITS
              </div>

              <div style="padding-top:7px;font-size:10px;font-weight:500;letter-spacing:2px;color:#a9bfdc;">
                STUDY · CAREER · CONSULTANCY
              </div>

              <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin:19px auto 0;">
                <tr>
                  <td width="54" height="2" style="width:54px;height:2px;background-color:#c9a96e;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Dynamic email content -->
          <tr>
            <td style="padding:25px 28px 32px;border-top:1px solid #203957;color:#d5e1f1;font-size:14px;line-height:1.85;overflow-wrap:anywhere;">

              {{content}}

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 24px;border-top:1px solid #29496e;background-color:#09182c;text-align:center;">

              <p style="margin:0 0 8px;color:#f0d9a5;font-family:Georgia,'Playfair Display',serif;font-size:14px;font-weight:600;letter-spacing:1px;">
                MedOrbits
              </p>

              <p style="margin:0;color:#9db0c9;font-size:11px;line-height:1.8;">
                This is an automated message from MedOrbits.
                For assistance, visit the official website or use verified contact channels.
              </p>

              <p style="margin:12px 0 0;color:#8296b1;font-size:10px;letter-spacing:.4px;">
                Study · Work · Grow
              </p>

            </td>
          </tr>

        </table>

        <!-- Copyright -->
        <div style="padding:15px 8px 0;color:#8296b1;font-size:10px;line-height:1.7;text-align:center;">
          © {{year}} MedOrbits. All rights reserved.
        </div>

      </td>
    </tr>
  </table>

  <script defer src="/assets/js/site-search-bar.js"></script>
</body>
</html>
