
# =============================================================================
# MedOrbits -- Pre-commit Quality and Security Controls
# File: /.pre-commit-config.yaml
# Policy version: 3.2.1
# Minimum pre-commit version: 3.7.0
# =============================================================================

minimum_pre_commit_version: "3.7.0"

default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

fail_fast: false

repos:
  # Repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
        name: Ensure final newline

      - id: mixed-line-ending
        name: Check LF line endings
        args: [--fix=lf]

      - id: check-merge-conflict
        name: Detect merge conflict markers

      - id: check-case-conflict
        name: Detect filename case conflicts

      - id: check-added-large-files
        name: Reject large files
        args: [--maxkb=1024]

      - id: check-symlinks
        name: Validate symbolic links

      - id: destroyed-symlinks
        name: Detect destroyed symbolic links

      - id: check-executables-have-shebangs
        name: Validate executable script shebangs

      - id: check-shebang-scripts-are-executable
        name: Validate script executable permissions

      - id: check-xml
        name: Validate XML files

      - id: check-toml
        name: Validate TOML files

      - id: check-yaml
        name: Validate YAML files
        args: [--allow-multiple-documents]

      - id: check-json
        name: Validate JSON files

      - id: pretty-format-json
        name: Normalize JSON formatting
        args: [--autofix, --no-ensure-ascii]
        exclude: >-
          (?x)^(
            package-lock\.json|
            .*\.min\.json|
            .*fixtures/.*
          )$

      - id: check-ast
        name: Validate Python syntax

      - id: debug-statements
        name: Detect Python debug statements

      - id: check-docstring-first
        name: Check Python docstring placement

  # EditorConfig
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.2.1
    hooks:
      - id: editorconfig-checker
        name: Check EditorConfig compliance
        args: [-disable-indent-size]

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        name: Lint Python code
        args: [--fix]

      - id: ruff-format
        name: Format Python code

  # Python security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: Scan Python code for common security issues
        args: [-q, -r]
        files: \.py$
        exclude: >-
          (?x)^(
            tests/|
            .*_test\.py$
          )$

  # JavaScript, TypeScript, HTML, CSS, JSON, YAML and Markdown formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format supported source files
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - yaml
          - markdown
          - css
          - html
        exclude: >-
          (?x)^(
            package-lock\.json|
            .*\.min\.(js|css)$|
            .*vendor/.*
          )$

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: Scan staged changes for potential secrets
        args: [--redact]
        stages: [pre-commit]

  # Conventional commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        name: Validate Conventional Commit messages
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

# =============================================================================
# Setup:
#
#   python -m pip install "pre-commit>=3.7.0"
#   pre-commit validate-config
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Validate all tracked files:
#
#   pre-commit run --all-files
#
# Review hook modifications:
#
#   git status --short
#   git diff --check
#   git diff
#
# Security:
#   Hooks can modify files. Review every change before committing.
#   Hooks do not replace CI tests, dependency audits, or code review.
# =============================================================================
