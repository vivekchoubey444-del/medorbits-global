
# ============================================================
# MedOrbits -- Pytest Configuration
# File: /pytest.ini
# Purpose: Reliable, strict, maintainable Python test execution
# ============================================================

[pytest]

# ------------------------------------------------------------
# Test discovery
# ------------------------------------------------------------

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

# Do not search generated files, dependencies, or build output.
norecursedirs =
    .git
    .hg
    .svn
    .venv
    venv
    env
    node_modules
    vendor
    dist
    build
    coverage
    htmlcov
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .tox
    site-packages
    duplicate-quarantine
    tools/repository-reports

# ------------------------------------------------------------
# Default command-line behavior
# ------------------------------------------------------------

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --showlocals

# Minimum supported pytest version.
minversion = 7.0

# ------------------------------------------------------------
# Test markers
# Register every project-specific marker here.
# ------------------------------------------------------------

markers =
    unit: Fast tests for isolated functions or modules
    integration: Tests involving multiple components or services
    e2e: End-to-end application tests
    security: Security, authorization, and input-validation tests
    regression: Tests covering previously fixed defects
    slow: Tests that take longer than the normal test suite
    network: Tests that require network access
    database: Tests that require a database connection
    smoke: Basic checks that critical functionality works
    asyncio: Asynchronous tests, when supported by the installed async plugin
    serial: Tests that must not run concurrently
    destructive: Tests that modify or delete external or persistent data

# ------------------------------------------------------------
# Output and diagnostics
# ------------------------------------------------------------

console_output_style = progress
verbosity_assertions = plain

# Show warnings by default; do not hide them.
filterwarnings =
    default

# ------------------------------------------------------------
# Collection and failure behavior
# ------------------------------------------------------------

# Avoid silently ignoring test failures or collection errors.
# Do not add --ignore, --continue-on-collection-errors,
# --maxfail, or warning-suppression options here.
#
# Note: pytest's normal behavior already returns a non-zero
# exit code for failed tests and collection errors.
