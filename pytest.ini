
# ============================================================
# MedOrbits -- Professional Pytest Configuration
# File: pytest.ini
# Python target: 3.12+
# Scope: Test discovery, reliability, diagnostics and CI
# ============================================================

[pytest]

# ------------------------------------------------------------
# 1. TEST DISCOVERY
# ------------------------------------------------------------

testpaths =
    python/tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

# Make the repository root available for project imports.
pythonpath =
    .

# ------------------------------------------------------------
# 2. STRICTNESS AND COLLECTION
# ------------------------------------------------------------

strict_config = true
strict_markers = true
xfail_strict = true

# Empty parameter sets indicate a test-definition problem.
empty_parameter_set_mark = fail_at_collect

# Avoid collecting tests from generated and environment folders.
norecursedirs =
    .git
    .hg
    .tox
    .nox
    .venv
    venv
    env
    build
    dist
    node_modules
    .pytest_cache
    .ruff_cache
    .mypy_cache
    __pycache__
    generated
    vendor

# ------------------------------------------------------------
# 3. DEFAULT EXECUTION AND DIAGNOSTICS
# ------------------------------------------------------------

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --durations=10

console_output_style = progress
verbosity_assertions = plain

# Report tests that are skipped, expected to fail, or otherwise
# noteworthy, along with the slowest tests.
# Use --showlocals manually when local-variable diagnostics are needed.

# ------------------------------------------------------------
# 4. REGISTERED TEST MARKERS
# ------------------------------------------------------------

markers =
    unit: isolated tests that do not require external services
    integration: tests involving multiple application components
    security: authentication, authorization and input-validation tests
    regression: tests covering previously identified defects
    smoke: essential checks for basic application functionality
    api: API endpoint and request-response tests
    database: tests requiring database access
    external: tests requiring external services or network access
    slow: tests that take additional time
    performance: performance, resource-usage and load-related tests
    contract: external API contract and schema tests

# ------------------------------------------------------------
# 5. WARNING POLICY
# ------------------------------------------------------------

# Treat Python deprecations as failures so compatibility issues
# are discovered early. Add narrow, documented filters only when
# a reviewed third-party warning genuinely needs an exception.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning

# ------------------------------------------------------------
# 6. LOGGING
# ------------------------------------------------------------

# Capture logs during tests and show relevant output on failure.
# Avoid printing application logs continuously during normal runs.
log_cli = false
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# ------------------------------------------------------------
# 7. TEST REPORT COMPATIBILITY
# ------------------------------------------------------------

# Use the modern JUnit XML format when generating CI reports.
junit_family = xunit2

# ------------------------------------------------------------
# 8. EXPECTED FAILURE POLICY
# ------------------------------------------------------------

# xfail_strict=true ensures an unexpected pass fails the test suite.
# Tests continue after individual failures by default.
# Use pytest -x when immediate termination is required.

# ============================================================
# END OF CONFIGURATION
# ============================================================
