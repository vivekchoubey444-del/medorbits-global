# ============================================================
# MedOrbits -- Pytest Configuration
# File: pytest.ini
# Release target: 3.0.0
#
# Purpose:
#   Reliable, strict, maintainable Python test execution.
#
# Requirements:
#   pytest >= 7.0
#   Optional plugins must be installed for their features.
# ============================================================

[pytest]

# ------------------------------------------------------------
# 01. TEST DISCOVERY
# ------------------------------------------------------------

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

# Avoid collecting generated files, dependencies, caches,
# quarantined duplicates, and repository audit output.

norecursedirs =
    .git
    .hg
    .svn
    .venv
    venv
    env
    node_modules
    vendor
    dist
    build
    coverage
    htmlcov
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .tox
    site-packages
    duplicate-quarantine
    tools/repository-reports


# ------------------------------------------------------------
# 02. DEFAULT COMMAND-LINE BEHAVIOR
# ------------------------------------------------------------

minversion = 7.0

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --showlocals

# Do not globally enable parallel execution.
# Install pytest-xdist and opt in with -n when appropriate.


# ------------------------------------------------------------
# 03. PROJECT TEST MARKERS
# ------------------------------------------------------------

markers =
    unit: Fast tests for isolated functions or modules
    integration: Tests involving multiple components or services
    e2e: End-to-end application tests
    security: Security, authorization, and input-validation tests
    regression: Tests covering previously fixed defects
    slow: Tests that take longer than the normal test suite
    network: Tests requiring network access
    database: Tests requiring a database connection
    smoke: Basic checks that critical functionality works
    asyncio: Asynchronous tests when supported by an installed async plugin
    serial: Tests that must not run concurrently
    destructive: Tests that modify or delete external or persistent data


# ------------------------------------------------------------
# 04. OUTPUT AND DIAGNOSTICS
# ------------------------------------------------------------

console_output_style = progress
verbosity_assertions = plain

# Show warnings by default without globally suppressing them.
filterwarnings =
    default


# ------------------------------------------------------------
# 05. COLLECTION AND FAILURE POLICY
# ------------------------------------------------------------

# Preserve pytest's normal failure and collection-error behavior.
# Do not globally suppress collection errors or skip failures.
#
# Avoid adding these to default options:
#   --ignore
#   --continue-on-collection-errors
#   --maxfail
#   -x
#   warning-suppression flags
#
# CI and local commands may override options for narrowly
# scoped, explicitly justified test runs.


# ------------------------------------------------------------
# 06. ENVIRONMENT AND SAFETY POLICY
# ------------------------------------------------------------

# This configuration does not automatically enable network
# access, connect to databases, or authorize destructive tests.
#
# Tests marked network, database, or destructive must implement
# their own explicit prerequisites and safety checks.
#
# Use isolated test databases and disposable test resources.
# Never point destructive tests at production services.
#
# Marker registration does not enforce safety automatically.
# Tests and fixtures must implement the required safeguards.


# ------------------------------------------------------------
# END OF PYTEST CONFIGURATION
# ------------------------------------------------------------