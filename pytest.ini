============================================================

MedOrbits -- Pytest Configuration

File: /pytest.ini

Purpose: Reliable, strict, maintainable Python test execution

============================================================

[pytest]

----------------------------------------

Test discovery

----------------------------------------

testpaths =
tests

python_files =
test_*.py
*_test.py

python_classes =
Test*

python_functions =
test_*

Avoid collecting generated files, dependencies, caches,

quarantined duplicates, and repository audit output.

norecursedirs =
.git
.hg
.svn
.venv
venv
env
node_modules
vendor
dist
build
coverage
htmlcov
pycache
.pytest_cache
.mypy_cache
.ruff_cache
.tox
site-packages
duplicate-quarantine
tools/repository-reports

----------------------------------------

Default command-line behavior

----------------------------------------

addopts =
-ra
–strict-config
–strict-markers
–tb=short
–showlocals

Minimum pytest version supported by this configuration.

minversion = 7.0

----------------------------------------

Project test markers

Register every project-specific marker here.

Unknown markers should fail validation.

----------------------------------------

markers =
unit: Fast tests for isolated functions or modules
integration: Tests involving multiple components or services
e2e: End-to-end application tests
security: Security, authorization, and input-validation tests
regression: Tests covering previously fixed defects
slow: Tests that take longer than the normal test suite
network: Tests that require network access
database: Tests that require a database connection
smoke: Basic checks that critical functionality works
asyncio: Asynchronous tests when supported by an installed async plugin
serial: Tests that must not run concurrently
destructive: Tests that modify or delete external or persistent data

----------------------------------------

Output and diagnostics

----------------------------------------

console_output_style = progress
verbosity_assertions = plain

Show warnings by default without globally suppressing them.

filterwarnings =
default

----------------------------------------

Collection and failure behavior

----------------------------------------

Pytest returns a non-zero exit code for failed tests and

collection errors under normal execution.

Do not globally suppress collection errors, skip failures,

or impose a low max-fail limit.

Avoid putting –ignore, –continue-on-collection-errors,

–maxfail, or warning-suppression options in addopts.

CI and local commands may override options explicitly when

a narrowly scoped exception is justified.

----------------------------------------

Environment and safety policy

----------------------------------------

This configuration does not automatically enable network

access, connect to databases, or authorize destructive tests.

Tests marked network, database, or destructive must implement

their own explicit prerequisites and safety checks.

Use isolated test databases and disposable test resources.

Never point destructive tests at production services.