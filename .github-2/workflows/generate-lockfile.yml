
name: MedOrbits Lockfile Override

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - .github/workflows/lockfile-override.yml

permissions:
  contents: write

concurrency:
  group: medorbits-lockfile-override-${{ github.ref }}
  cancel-in-progress: false

jobs:
  override:
    name: Generate and repair npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js without caching
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package.json
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if (!p.name || !p.version) throw new Error('Missing package name or version'); console.log('package.json valid:', p.name, p.version)"

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (!l.lockfileVersion) throw new Error('Missing lockfileVersion'); if (l.name && p.name && l.name !== p.name) throw new Error('Package name mismatch'); console.log('Lockfile valid')"

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi

          git commit -m "chore: repair npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
