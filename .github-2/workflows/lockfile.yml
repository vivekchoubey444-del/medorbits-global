
# File: .github/workflows/generate-lockfile.yml

name: Generate Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only allow lockfile generation on main.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify package.json
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || {
            echo "::error::package.json is missing."
            exit 1
          }

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json"
          git push origin HEAD:main

