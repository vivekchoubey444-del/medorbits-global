
name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in MedOrbits.
title: "[BUG]: "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MedOrbits.

        Before submitting, check existing issues for duplicates.
        Do not include passwords, API keys, access tokens, personal
        documents, private user data, or other confidential information.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Select the part of MedOrbits where the problem occurred.
      options:
        - Website / User Interface
        - Authentication / Login
        - User Profile / Account
        - Education / College Information
        - Medical Admissions
        - Career / Jobs / Recruitment
        - Search / Filters
        - Application Forms
        - API / Backend
        - Database
        - Admin Dashboard
        - Deployment / Infrastructure
        - Performance
        - Accessibility
        - Security
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clearly describe the problem.
      placeholder: Describe what went wrong and where it happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide numbered, repeatable steps.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Select ...
        4. Observe the error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
      placeholder: Describe the actual result and any visible error.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or Error Logs
      description: Add relevant screenshots, sanitized logs, or error messages.
      placeholder: |
        Paste relevant error messages here.
        Remove credentials, tokens, and personal information first.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Impact
      description: Select the impact of this bug.
      options:
        - Critical - Core service unavailable or major data integrity issue
        - High - Important functionality unusable
        - Medium - Functionality impaired with a workaround
        - Low - Minor issue or visual defect
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      description: How often does the problem occur?
      options:
        - Every time
        - Frequently
        - Occasionally
        - Only once
        - Unable to determine
    validations:
      required: true

  - type: input
    id: page_url
    attributes:
      label: Affected Page or Endpoint
      description: Provide the relevant URL or API path, without private query parameters or tokens.
      placeholder: "/education/india/mbbs.html"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and Version
      description: Include the browser and version, if applicable.
      placeholder: "Safari 26.x, Chrome 140.x"
    validations:
      required: false

  - type: input
    id: operating_system
    attributes:
      label: Operating System
      description: Include the OS and version, if applicable.
      placeholder: "iOS, Android, Windows, macOS, or Linux"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Identify the affected deployment.
      placeholder: "Production, staging, local development, or preview"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include relevant configuration, recent changes, or workarounds.
      placeholder: Add any other information that could help reproduce or diagnose the issue.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked for existing reports of this bug.
          required: true
        - label: I provided steps to reproduce the issue.
          required: true
        - label: I removed secrets and sensitive information from the report.
          required: true
