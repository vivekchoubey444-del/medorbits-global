
name: "🔒 Security Vulnerability Report"
description: Report a potential security vulnerability affecting MedOrbits.
title: "[SECURITY]: "
labels:
  - security
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Responsible Security Disclosure

        Thank you for helping protect MedOrbits and its users.

        **IMPORTANT: This issue form may be publicly visible.**

        - Do not publish exploit code, weaponized payloads, credentials,
          access tokens, private keys, session cookies, or sensitive logs.
        - Do not include personal documents, medical information, or
          other private user data.
        - Do not access, modify, or download other users' data.
        - Do not perform destructive testing, denial-of-service attacks,
          or tests against systems you do not own or have permission to test.
        - Keep public reports high-level and omit details that would
          enable exploitation.

        For sensitive findings, use the repository's private
        vulnerability reporting feature, if available, or follow the
        security contact published by the MedOrbits maintainers.

  - type: dropdown
    id: vulnerability_type
    attributes:
      label: Vulnerability Category
      description: Select the category that best describes the finding.
      options:
        - Broken Access Control / IDOR
        - Authentication or Session Management
        - Authorization / Privilege Escalation
        - Injection Vulnerability
        - Cross-Site Scripting (XSS)
        - Cross-Site Request Forgery (CSRF)
        - Server-Side Request Forgery (SSRF)
        - SQL Injection / Database Security
        - API Security
        - File Upload / File Handling
        - Sensitive Data Exposure
        - Cryptographic Weakness
        - Security Misconfiguration
        - Dependency / Supply Chain Vulnerability
        - Rate Limiting / Abuse Prevention
        - Security Headers / Content Security Policy
        - Account Recovery / Password Reset
        - Other
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: affected_component
    attributes:
      label: Affected Component
      description: Identify the affected MedOrbits component.
      options:
        - Website / Frontend
        - Authentication / Authorization
        - User Accounts / Profiles
        - Education / Admissions
        - Career / Jobs / Recruitment
        - Application Forms / Documents
        - API / Backend
        - Database / Data Storage
        - Admin Dashboard
        - File Uploads / Downloads
        - CI/CD / GitHub Actions
        - Dependencies
        - Hosting / Deployment / Infrastructure
        - Configuration / Secrets Management
        - Other
        - Unknown
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Vulnerability Summary
      description: Describe the potential security issue at a high level.
      placeholder: |
        Explain the weakness, affected functionality, and security concern.
        Do not include exploit instructions or sensitive technical details.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Potential Security Impact
      description: Explain the potential impact without accessing other users' data.
      placeholder: |
        Describe the potential effect on confidentiality, integrity,
        availability, authentication, or authorization.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Estimated Severity
      description: Select your preliminary assessment; maintainers will verify it.
      options:
        - Critical
        - High
        - Medium
        - Low
        - Informational
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: exposure
    attributes:
      label: Affected Environment
      description: Where have you observed or reasonably identified the issue?
      options:
        - Production
        - Staging / Preview
        - Local Development
        - CI/CD Pipeline
        - Unknown
    validations:
      required: true

  - type: input
    id: affected_location
    attributes:
      label: Affected URL, Route, or Component
      description: Provide a non-sensitive URL, route, file path, or component identifier.
      placeholder: "/api/example or src/path/to/component"
    validations:
      required: false

  - type: textarea
    id: reproduction_summary
    attributes:
      label: Safe Reproduction Summary
      description: |
        Provide a high-level, non-destructive description of the conditions
        required to observe the issue. Do not include exploit payloads,
        weaponized proof of concept, credentials, or sensitive data.
      placeholder: |
        1. Identify the affected feature.
        2. Describe the non-destructive action.
        3. Describe the observed security-relevant behavior.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized Evidence
      description: |
        Provide minimal, redacted evidence only if safe to disclose.
        Never attach real user records, confidential documents, secrets,
        session tokens, or working exploit artifacts to a public issue.
      placeholder: |
        Describe the evidence available and whether sensitive details
        have been withheld.
    validations:
      required: false

  - type: dropdown
    id: exploitation
    attributes:
      label: Exploitation Status
      description: Select the status based on information already available to you.
      options:
        - Potential weakness; not verified
        - Reproduced in an authorized test environment
        - Evidence of exploitation, details withheld
        - Unknown
    validations:
      required: true

  - type: checkboxes
    id: disclosure
    attributes:
      label: Responsible Disclosure Checklist
      options:
        - label: I have not included credentials, secrets, or private user data.
          required: true
        - label: I have avoided destructive testing and unauthorized access.
          required: true
        - label: I understand that this issue may be publicly visible.
          required: true
        - label: I have withheld exploit details that could enable abuse.
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Maintainer guidance**

        Review reports promptly, verify findings in an authorized environment,
        restrict access to sensitive evidence, and coordinate remediation
        and disclosure with the reporter.

        Do not request passwords, access tokens, private keys, or real
        customer records as part of vulnerability verification.
