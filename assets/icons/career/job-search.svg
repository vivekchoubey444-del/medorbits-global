
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="search-title search-desc">
  <title id="search-title">Job Search</title>
  <desc id="search-desc">MedOrbits job search icon featuring a professional briefcase and a magnifying glass.</desc>

  <defs>
    <linearGradient id="search-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="search-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#search-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Job briefcase -->
  <rect x="22" y="51" width="68" height="46" rx="7" fill="#211D2B" stroke="url(#search-gold)" stroke-width="2.8"/>
  <path d="M40 51v-6a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v6" stroke="url(#search-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M22 67h68M47 67v7h18v-7" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M34 82h18M34 88h12" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Magnifying glass -->
  <circle cx="81" cy="43" r="19" fill="#292335" stroke="url(#search-gold)" stroke-width="3.5"/>
  <circle cx="81" cy="43" r="11" stroke="#C4B0DE" stroke-width="2.5"/>
  <path d="m95 57 12 12" stroke="url(#search-gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Search highlight -->
  <path d="m75 43 4 4 8-9" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative accent -->
  <path d="m29 28 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
