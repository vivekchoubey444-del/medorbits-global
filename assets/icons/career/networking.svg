
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="networking-title networking-desc">
  <title id="networking-title">Professional Networking</title>
  <desc id="networking-desc">MedOrbits networking icon featuring connected professional profiles and a gold collaboration symbol.</desc>

  <defs>
    <linearGradient id="networking-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="networking-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#networking-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Central professional -->
  <circle cx="64" cy="39" r="11" fill="#292335" stroke="url(#networking-gold)" stroke-width="2.8"/>
  <path d="M44 70v-5a20 20 0 0 1 40 0v5" stroke="url(#networking-gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Left professional -->
  <circle cx="31" cy="59" r="8" fill="#292335" stroke="#C4B0DE" stroke-width="2.5"/>
  <path d="M19 83v-3a12 12 0 0 1 24 0v3" stroke="#C4B0DE" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Right professional -->
  <circle cx="97" cy="59" r="8" fill="#292335" stroke="#C4B0DE" stroke-width="2.5"/>
  <path d="M85 83v-3a12 12 0 0 1 24 0v3" stroke="#C4B0DE" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Connection lines -->
  <path d="M39 60 51 49M77 49l12 11M43 78l13-7M85 78l-13-7" stroke="#D5A747" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>

  <!-- Collaboration hub -->
  <circle cx="64" cy="91" r="12" fill="#211D2B" stroke="url(#networking-gold)" stroke-width="2.5"/>
  <path d="m58 91 4 4 8-9" stroke="#F8D989" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative star -->
  <path d="m96 30 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
