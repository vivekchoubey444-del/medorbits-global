
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="resume-title resume-desc">
  <title id="resume-title">Resume</title>
  <desc id="resume-desc">MedOrbits resume icon featuring a professional CV document, profile details, and a gold verification checkmark.</desc>

  <defs>
    <linearGradient id="resume-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="resume-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#resume-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Resume document -->
  <path d="M32 20h40l15 15v53a7 7 0 0 1-7 7H32a7 7 0 0 1-7-7V27a7 7 0 0 1 7-7Z"
        fill="#211D2B" stroke="url(#resume-gold)" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M72 20v15h15" stroke="url(#resume-gold)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Profile section -->
  <circle cx="43" cy="44" r="7" stroke="#F8D989" stroke-width="2.5"/>
  <path d="M32 60a11 11 0 0 1 22 0" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M60 42h14M60 49h12M34 69h38M34 77h30" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Experience entries -->
  <circle cx="36" cy="85" r="2" fill="#C4B0DE"/>
  <path d="M42 85h17" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Resume verification badge -->
  <circle cx="87" cy="83" r="16" fill="#292335" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m79 83 5 5 10-11" stroke="#F8D989" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative star -->
  <path d="m96 38 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
