  <path d="M43 48v-7a6 6 0 0 1 6-6h28a6 6 0 0 1 6 6v7" stroke="url(#saved-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M22 66h84M54 66v8h20v-8" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M35 85h19M35 92h13" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

