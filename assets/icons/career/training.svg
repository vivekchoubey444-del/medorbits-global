
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="training-title training-desc">
  <title id="training-title">Career Training</title>
  <desc id="training-desc">MedOrbits career training icon featuring a learning board, graduation cap, and skill development indicator.</desc>

  <defs>
    <linearGradient id="training-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="training-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#training-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Training board -->
  <rect x="24" y="25" width="65" height="51" rx="6" fill="#211D2B" stroke="url(#training-gold)" stroke-width="2.8"/>
  <path d="M36 39h39M36 48h29M36 57h34" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M47 76v9M66 76v9M39 85h35" stroke="url(#training-gold)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Graduation cap -->
  <path d="m72 65 25 10-25 10-25-10 25-10Z" fill="#292335" stroke="url(#training-gold)" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M56 79v8c10 7 22 7 32 0v-8" stroke="#E8C36F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M97 75v15" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="97" cy="92" r="2.8" fill="#F8D989"/>

  <!-- Skill progress badge -->
  <circle cx="93" cy="40" r="12" fill="#211D2B" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m87 40 4 4 8-9" stroke="#F8D989" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative star -->
  <path d="m29 91 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
