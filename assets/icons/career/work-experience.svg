
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="experience-title experience-desc">
  <title id="experience-title">Work Experience</title>
  <desc id="experience-desc">MedOrbits work experience icon featuring a professional briefcase, career timeline, and achievement checkmark.</desc>

  <defs>
    <linearGradient id="experience-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="experience-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#experience-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Professional briefcase -->
  <rect x="23" y="45" width="78" height="55" rx="8" fill="#211D2B" stroke="url(#experience-gold)" stroke-width="2.8"/>
  <path d="M43 45v-7a6 6 0 0 1 6-6h26a6 6 0 0 1 6 6v7" stroke="url(#experience-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M23 63h78M53 63v8h18v-8" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Experience timeline -->
  <path d="M38 81h18M38 89h12" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="34" cy="81" r="3" fill="#F8D989"/>
  <circle cx="34" cy="89" r="3" fill="#C4B0DE"/>

  <!-- Achievement badge -->
  <circle cx="88" cy="43" r="17" fill="#292335" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m80 43 5 5 11-12" stroke="#F8D989" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Career milestone star -->
  <path d="m29 25 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
