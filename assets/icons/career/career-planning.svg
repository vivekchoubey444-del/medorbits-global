
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     fill="none"
     role="img"
     aria-labelledby="career-planning-title career-planning-desc">

  <title id="career-planning-title">Career Planning</title>
  <desc id="career-planning-desc">
    Premium career planning icon featuring a checklist,
    milestone targets, and an upward growth chart.
  </desc>

  <defs>
    <linearGradient id="planningGold"
                    x1="8" y1="5" x2="55" y2="59"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5DDA6"/>
      <stop offset="0.5" stop-color="#D1AD69"/>
      <stop offset="1" stop-color="#99713D"/>
    </linearGradient>

    <linearGradient id="planningBackground"
                    x1="8" y1="4" x2="57" y2="61"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50334F"/>
      <stop offset="1" stop-color="#241629"/>
    </linearGradient>
  </defs>

  <!-- Premium circular background -->
  <circle cx="32" cy="32" r="29"
          fill="url(#planningBackground)"
          stroke="url(#planningGold)"
          stroke-width="1.5"/>

  <circle cx="32" cy="32" r="24"
          stroke="url(#planningGold)"
          stroke-opacity="0.3"
          stroke-width="0.8"
          stroke-dasharray="2 3"/>

  <!-- Planning document -->
  <rect x="13" y="13" width="27" height="36"
        rx="3.5"
        fill="#352039"
        stroke="url(#planningGold)"
        stroke-width="1.5"/>

  <!-- Document header -->
  <rect x="20" y="10.5" width="13" height="5"
        rx="2"
        fill="url(#planningGold)"/>

  <!-- Checklist item 1 -->
  <rect x="17" y="21" width="5" height="5"
        rx="1"
        stroke="url(#planningGold)"
        stroke-width="1.3"/>

  <path d="M18.2 23.5L19.3 24.5L21 22.5"
        stroke="#F5DDA6"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M25 23.5H35"
        stroke="url(#planningGold)"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Checklist item 2 -->
  <rect x="17" y="30" width="5" height="5"
        rx="1"
        stroke="url(#planningGold)"
        stroke-width="1.3"/>

  <path d="M18.2 32.5L19.3 33.5L21 31.5"
        stroke="#F5DDA6"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M25 32.5H34"
        stroke="url(#planningGold)"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Checklist item 3 -->
  <rect x="17" y="39" width="5" height="5"
        rx="1"
        stroke="url(#planningGold)"
        stroke-width="1.3"/>

  <path d="M25 41.5H31"
        stroke="url(#planningGold)"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Career growth chart -->
  <path d="M34 46L39 40L44 42L52 31"
        stroke="url(#planningGold)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Growth arrow -->
  <path d="M46.5 31H52V36.5"
        stroke="url(#planningGold)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Career milestone -->
  <circle cx="44" cy="42" r="2"
          fill="#F5DDA6"
          stroke="#94703B"
          stroke-width="0.8"/>

  <!-- Base accent -->
  <path d="M12 52H52"
        stroke="url(#planningGold)"
        stroke-opacity="0.65"
        stroke-width="1.2"
        stroke-linecap="round"/>

</svg>
