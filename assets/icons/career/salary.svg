
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="salary-title salary-desc">
  <title id="salary-title">Salary</title>
  <desc id="salary-desc">MedOrbits salary icon featuring a gold currency symbol, salary document, and earnings growth chart.</desc>

  <defs>
    <linearGradient id="salary-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="salary-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#salary-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Salary statement -->
  <rect x="24" y="29" width="66" height="74" rx="7" fill="#211D2B" stroke="url(#salary-gold)" stroke-width="2.8"/>
  <path d="M37 43h24M37 51h17" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Currency symbol -->
  <circle cx="57" cy="73" r="16" fill="#292335" stroke="url(#salary-gold)" stroke-width="2.5"/>
  <path d="M64 65h-9a5 5 0 0 0 0 10h4a5 5 0 0 1 0 10h-9M57 61v28" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Earnings growth chart -->
  <rect x="69" y="65" width="37" height="38" rx="6" fill="#292335" stroke="#D5A747" stroke-width="2.5"/>
  <path d="M76 94V86M83 94V80M90 94V75" stroke="#C4B0DE" stroke-width="3" stroke-linecap="round"/>
  <path d="m76 80 7-6 5 2 10-11" stroke="#F8D989" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M91 65h7v7" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative accent -->
  <path d="m97 35 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
