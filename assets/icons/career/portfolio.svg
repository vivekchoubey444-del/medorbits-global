
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="portfolio-title portfolio-desc">
  <title id="portfolio-title">Career Portfolio</title>
  <desc id="portfolio-desc">MedOrbits career portfolio icon featuring a professional project folder, creative work samples, and a gold achievement badge.</desc>

  <defs>
    <linearGradient id="portfolio-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="portfolio-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#portfolio-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Portfolio folder -->
  <path d="M23 43a7 7 0 0 1 7-7h22l9 9h37a7 7 0 0 1 7 7v37a8 8 0 0 1-8 8H31a8 8 0 0 1-8-8V43Z"
        fill="#211D2B" stroke="url(#portfolio-gold)" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M23 54h82" stroke="url(#portfolio-gold)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Project preview cards -->
  <rect x="34" y="63" width="25" height="25" rx="4" fill="#30253A" stroke="#C4B0DE" stroke-width="2"/>
  <path d="M39 81V73l5-4 5 4v8" stroke="#C4B0DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 81v-5h4v5" stroke="#C4B0DE" stroke-width="2" stroke-linejoin="round"/>

  <rect x="65" y="63" width="25" height="25" rx="4" fill="#30253A" stroke="url(#portfolio-gold)" stroke-width="2"/>
  <path d="M70 80l5-6 4 3 5-7" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="84" cy="70" r="2" fill="#F8D989"/>

  <!-- Achievement badge -->
  <circle cx="92" cy="36" r="13" fill="#292335" stroke="url(#portfolio-gold)" stroke-width="2.5"/>
  <path d="m92 27 2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8 2.5-5Z" fill="#F8D989"/>

  <!-- Decorative accent -->
  <circle cx="32" cy="27" r="3" fill="#C4B0DE"/>
  <circle cx="43" cy="27" r="2" fill="#F8D989"/>
</svg>
