
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="employer-title employer-desc">
  <title id="employer-title">Employer</title>
  <desc id="employer-desc">MedOrbits employer icon featuring a professional briefcase and a business profile symbol.</desc>

  <defs>
    <linearGradient id="employer-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="employer-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#employer-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Business profile -->
  <circle cx="64" cy="37" r="12" fill="#292335" stroke="url(#employer-gold)" stroke-width="2.8"/>
  <path d="M43 67v-5a21 21 0 0 1 42 0v5" stroke="url(#employer-gold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M51 57h26" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Employer briefcase -->
  <rect x="25" y="70" width="78" height="34" rx="7" fill="#211D2B" stroke="url(#employer-gold)" stroke-width="2.8"/>
  <path d="M45 70v-5a5 5 0 0 1 5-5h28a5 5 0 0 1 5 5v5" stroke="url(#employer-gold)" stroke-width="2.8"/>
  <path d="M25 83h78M55 83v6h18v-6" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Professional accent -->
  <path d="m97 32 2 4.2 4.6.7-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.7 2-4.2Z" fill="#C4B0DE"/>
</svg>
