
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="career-title career-desc">
  <title id="career-title">Career</title>
  <desc id="career-desc">MedOrbits career icon featuring a professional briefcase, growth chart, and achievement indicator.</desc>

  <defs>
    <linearGradient id="career-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="career-gold" x1="29" y1="28" x2="98" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#career-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Professional briefcase -->
  <rect x="25" y="43" width="78" height="56" rx="9" fill="#211D2B" stroke="url(#career-gold)" stroke-width="3"/>
  <path d="M45 43V34a6 6 0 0 1 6-6h26a6 6 0 0 1 6 6v9" stroke="url(#career-gold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 62h78M55 62v8h18v-8" stroke="#E8C36F" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Career growth chart -->
  <path d="M38 87V78M49 87V72M60 87V65" stroke="#C9C2D1" stroke-width="4" stroke-linecap="round"/>
  <path d="m69 79 10-10 7 4 11-14" stroke="#F8D989" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 59h9v9" stroke="#F8D989" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Achievement accent -->
  <path d="m31 25 2.2 4.6 5.1.7-3.7 3.6.9 5.1-4.5-2.4-4.5 2.4.9-5.1-3.7-3.6 5.1-.7L31 25Z" fill="#F8D989"/>
  <circle cx="100" cy="36" r="3" fill="#C4B0DE"/>
</svg>
