
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="success-title success-desc">
  <title id="success-title">Career Success</title>
  <desc id="success-desc">A premium gold trophy with stars and a rising career growth arrow.</desc>

  <defs>
    <linearGradient id="success-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="success-gold" x1="35" y1="27" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE8A3"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#success-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Trophy handles -->
  <path d="M43 35H31a4 4 0 0 0-4 4v8a15 15 0 0 0 15 15h4M85 35h12a4 4 0 0 1 4 4v8a15 15 0 0 1-15 15h-4"
        stroke="url(#success-gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trophy cup -->
  <path d="M39 27h50v23a25 25 0 0 1-50 0V27Z" fill="#292335" stroke="url(#success-gold)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M51 39h26M53 47h22" stroke="#E9C56E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trophy stem and base -->
  <path d="M57 75v12h14V75" stroke="url(#success-gold)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M49 94h30M54 87h20" stroke="url(#success-gold)" stroke-width="4" stroke-linecap="round"/>

  <!-- Career growth arrow -->
  <circle cx="88" cy="83" r="19" fill="#211D2B" stroke="#D9B45D" stroke-width="2.5"/>
  <path d="m77 91 8-8 5 3 9-11" stroke="#F8D989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M91 75h8v8" stroke="#F8D989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Achievement stars -->
  <path d="m31 24 2.2 4.6 5.1.7-3.7 3.6.9 5.1-4.5-2.4-4.5 2.4.9-5.1-3.7-3.6 5.1-.7L31 24Z" fill="#F8D989"/>
  <path d="m98 53 1.5 3.1 3.4.5-2.5 2.4.6 3.4-3-1.6-3 1.6.6-3.4-2.5-2.4 3.4-.5 1.5-3.1Z" fill="#C4B0DE"/>
</svg>
