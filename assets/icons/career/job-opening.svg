
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="opening-title opening-desc">
  <title id="opening-title">Job Opening</title>
  <desc id="opening-desc">MedOrbits job opening icon featuring a professional briefcase, a vacancy sign, and a gold opportunity indicator.</desc>

  <defs>
    <linearGradient id="opening-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="opening-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#opening-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Job vacancy sign -->
  <rect x="27" y="23" width="58" height="35" rx="6" fill="#211D2B" stroke="url(#opening-gold)" stroke-width="2.8"/>
  <path d="M40 35h32M40 43h22" stroke="#F8D989" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M56 58v8M43 66h26" stroke="url(#opening-gold)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Briefcase -->
  <rect x="25" y="68" width="78" height="34" rx="7" fill="#292335" stroke="url(#opening-gold)" stroke-width="2.8"/>
  <path d="M45 68v-5a5 5 0 0 1 5-5h28a5 5 0 0 1 5 5v5" stroke="url(#opening-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M25 81h78M55 81v6h18v-6" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Opportunity badge -->
  <circle cx="91" cy="39" r="15" fill="#211D2B" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m91 29 2.8 6.2 6.7.9-4.9 4.7 1.2 6.7-5.8-3.2-5.8 3.2 1.2-6.7-4.9-4.7 6.7-.9L91 29Z" fill="#F8D989"/>

  <!-- Decorative accent -->
  <circle cx="35" cy="110" r="2.5" fill="#C4B0DE"/>
  <circle cx="95" cy="108" r="2" fill="#C4B0DE"/>
</svg>
