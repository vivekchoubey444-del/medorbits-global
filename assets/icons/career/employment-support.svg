
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="support-title support-desc">
  <title id="support-title">Employment Support</title>
  <desc id="support-desc">MedOrbits employment support icon featuring a professional profile, supportive hands, and a gold checkmark.</desc>

  <defs>
    <linearGradient id="support-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="support-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#support-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Professional profile -->
  <circle cx="57" cy="36" r="12" fill="#292335" stroke="url(#support-gold)" stroke-width="2.8"/>
  <path d="M35 67v-5a22 22 0 0 1 44 0v5" stroke="url(#support-gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Support hands -->
  <path d="M23 79h18l10 8h13a5 5 0 0 1 0 10H45l-13-7h-9" fill="#211D2B" stroke="url(#support-gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 79H88l-9 8h-8a5 5 0 0 0 0 10h13l12-7h9" fill="#211D2B" stroke="url(#support-gold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Success badge -->
  <circle cx="89" cy="51" r="17" fill="#211D2B" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m81 51 5 5 11-12" stroke="#F8D989" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative accent -->
  <path d="m30 29 2 4.2 4.6.7-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.7 2-4.2Z" fill="#C4B0DE"/>
</svg>
