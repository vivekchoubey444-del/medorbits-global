
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Cover Letter</title>
  <desc id="cover-desc">MedOrbits cover letter icon featuring a professional letter, writing lines, and a gold pen.</desc>

  <defs>
    <linearGradient id="cover-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="cover-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#cover-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Letter document -->
  <path d="M32 22h42l17 17v49a7 7 0 0 1-7 7H32a7 7 0 0 1-7-7V29a7 7 0 0 1 7-7Z" fill="#211D2B" stroke="url(#cover-gold)" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M74 22v17h17" stroke="url(#cover-gold)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Letter heading -->
  <path d="M38 43h29M38 50h22" stroke="#F8D989" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Letter content -->
  <path d="M38 62h39M38 70h34M38 78h24" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gold writing pen -->
  <g transform="rotate(42 82 77)">
    <rect x="75" y="56" width="11" height="33" rx="3" fill="#D5A747" stroke="#F8D989" stroke-width="1.8"/>
    <path d="M75 63h11M75 81h11" stroke="#6B1838" stroke-width="2"/>
    <path d="M75 89h11l-5.5 11L75 89Z" fill="#F8D989" stroke="#D5A747" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M78 59h5" stroke="#FFF0C4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Decorative accent -->
  <path d="m98 43 2 4.2 4.6.7-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.7 2-4.2Z" fill="#C4B0DE"/>
</svg>
