
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     fill="none"
     role="img"
     aria-labelledby="career-guidance-title career-guidance-desc">

  <title id="career-guidance-title">Career Guidance</title>
  <desc id="career-guidance-desc">
    Career guidance icon featuring a compass, a professional profile,
    and a rising career path.
  </desc>

  <defs>
    <linearGradient id="guidanceGold"
                    x1="9" y1="7" x2="55" y2="57"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5DDA6"/>
      <stop offset="0.5" stop-color="#D1AD69"/>
      <stop offset="1" stop-color="#99713D"/>
    </linearGradient>

    <linearGradient id="guidanceBackground"
                    x1="8" y1="4" x2="57" y2="61"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50334F"/>
      <stop offset="1" stop-color="#241629"/>
    </linearGradient>
  </defs>

  <!-- Premium background -->
  <circle cx="32" cy="32" r="29"
          fill="url(#guidanceBackground)"
          stroke="url(#guidanceGold)"
          stroke-width="1.5"/>

  <circle cx="32" cy="32" r="24"
          stroke="url(#guidanceGold)"
          stroke-opacity="0.3"
          stroke-width="0.8"
          stroke-dasharray="2 3"/>

  <!-- Guidance compass -->
  <circle cx="43" cy="22" r="11"
          fill="#342039"
          stroke="url(#guidanceGold)"
          stroke-width="1.5"/>

  <circle cx="43" cy="22" r="7"
          stroke="url(#guidanceGold)"
          stroke-opacity="0.6"
          stroke-width="1"/>

  <path d="M45.8 18.5L44 23.2L40.2 25.5L42 20.8Z"
        fill="url(#guidanceGold)"
        stroke="#F5DDA6"
        stroke-width="0.7"
        stroke-linejoin="round"/>

  <circle cx="43" cy="22" r="1.2" fill="#F5DDA6"/>

  <!-- Career path -->
  <path d="M12 48L20 40L27 43L36 32"
        stroke="url(#guidanceGold)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M30.5 32H36V37.5"
        stroke="url(#guidanceGold)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Professional profile -->
  <circle cx="20.5" cy="24" r="6"
          fill="#EBCBA7"
          stroke="url(#guidanceGold)"
          stroke-width="1.2"/>

  <!-- Hair -->
  <path d="M14.8 23.7C14.5 19.8 17 17.5 20.5 17.5
           C24 17.5 26.5 20 26.2 23.7
           L23.8 21.6L20.2 22.3L17.1 24.7Z"
        fill="#201823"/>

  <!-- Professional clothing -->
  <path d="M9.5 46.5L11.4 38.5
           C12.1 35.8 14.4 34 17.2 34H23.8
           C26.6 34 28.9 35.8 29.6 38.5
           L31.5 46.5"
        fill="#D4B477"
        stroke="url(#guidanceGold)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Collar -->
  <path d="M17 34.5L20.5 39L24 34.5"
        stroke="#6B4968"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Guidance destination marker -->
  <path d="M46 39.5L48 42L52.5 36.5"
        stroke="url(#guidanceGold)"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Base accent -->
  <path d="M12 51H52"
        stroke="url(#guidanceGold)"
        stroke-opacity="0.65"
        stroke-width="1.2"
        stroke-linecap="round"/>

</svg>
