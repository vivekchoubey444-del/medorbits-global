
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="professional-title professional-desc">
  <title id="professional-title">Professional Skills</title>
  <desc id="professional-desc">MedOrbits professional skills icon featuring a skill checklist, competency indicators, and a gold achievement badge.</desc>

  <defs>
    <linearGradient id="professional-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="professional-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#professional-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Professional skills document -->
  <rect x="25" y="22" width="67" height="82" rx="8" fill="#211D2B" stroke="url(#professional-gold)" stroke-width="2.8"/>
  <path d="M39 36h34" stroke="#F8D989" stroke-width="3" stroke-linecap="round"/>

  <!-- Competency checklist -->
  <rect x="36" y="47" width="12" height="12" rx="3" stroke="#E8C36F" stroke-width="2"/>
  <path d="m39 53 2.5 2.5 4-5" stroke="#F8D989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 50h24M55 56h16" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="36" y="67" width="12" height="12" rx="3" stroke="#E8C36F" stroke-width="2"/>
  <path d="m39 73 2.5 2.5 4-5" stroke="#F8D989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M55 70h24M55 76h13" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M36 89h29" stroke="#C4B0DE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Achievement badge -->
  <circle cx="88" cy="84" r="17" fill="#292335" stroke="url(#professional-gold)" stroke-width="2.5"/>
  <path d="m88 73 3.2 6.5 7.2 1-5.2 5.1 1.2 7.2-6.4-3.4-6.4 3.4 1.2-7.2-5.2-5.1 7.2-1 3.2-6.5Z" fill="#F8D989"/>

  <!-- Decorative accent -->
  <circle cx="99" cy="37" r="3" fill="#C4B0DE"/>
</svg>
