
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="cert-title cert-desc">
  <title id="cert-title">Certification</title>
  <desc id="cert-desc">MedOrbits certification icon featuring a professional certificate, verification seal, and gold ribbon.</desc>

  <defs>
    <linearGradient id="cert-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="cert-gold" x1="29" y1="23" x2="96" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#cert-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Certificate document -->
  <rect x="29" y="22" width="66" height="77" rx="7" fill="#211D2B" stroke="url(#cert-gold)" stroke-width="2.8"/>
  <path d="M42 38h40M42 47h32M42 56h26" stroke="#D9C5A0" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Verified achievement seal -->
  <circle cx="76" cy="72" r="15" fill="#30253A" stroke="url(#cert-gold)" stroke-width="2.8"/>
  <path d="m68 72 5 5 10-11" stroke="#F8D989" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Certificate ribbons -->
  <path d="m47 90 10 0-2 18-6-5-6 5 2-18Z" fill="#C9A66B" stroke="#D5A747" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="m58 90 10 0 2 18-6-5-6 5Z" fill="#A78BC5" stroke="#C4B0DE" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Decorative star -->
  <path d="m97 42 2 4.2 4.6.7-3.3 3.2.8 4.6-4.1-2.2-4.1 2.2.8-4.6-3.3-3.2 4.6-.7 2-4.2Z" fill="#F8D989"/>
</svg>
