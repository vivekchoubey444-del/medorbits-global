
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="recruitment-title recruitment-desc">
  <title id="recruitment-title">Recruitment</title>
  <desc id="recruitment-desc">MedOrbits recruitment icon featuring candidate profiles, a professional briefcase, and a gold selection checkmark.</desc>

  <defs>
    <linearGradient id="recruitment-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="recruitment-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#recruitment-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Candidate profiles -->
  <circle cx="43" cy="38" r="10" fill="#292335" stroke="url(#recruitment-gold)" stroke-width="2.8"/>
  <path d="M26 65v-4a17 17 0 0 1 34 0v4" stroke="url(#recruitment-gold)" stroke-width="2.8" stroke-linecap="round"/>

  <circle cx="77" cy="42" r="8" fill="#292335" stroke="#C4B0DE" stroke-width="2.5"/>
  <path d="M64 64v-3a13 13 0 0 1 26 0v3" stroke="#C4B0DE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Recruitment briefcase -->
  <rect x="24" y="70" width="80" height="33" rx="7" fill="#211D2B" stroke="url(#recruitment-gold)" stroke-width="2.8"/>
  <path d="M44 70v-5a5 5 0 0 1 5-5h25a5 5 0 0 1 5 5v5" stroke="url(#recruitment-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M24 82h80M54 82v6h20v-6" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Candidate selection badge -->
  <circle cx="91" cy="31" r="13" fill="#211D2B" stroke="url(#recruitment-gold)" stroke-width="2.5"/>
  <path d="m85 31 4 4 8-9" stroke="#F8D989" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative accent -->
  <path d="m30 22 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
