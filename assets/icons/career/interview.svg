
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="interview-title interview-desc">
  <title id="interview-title">Interview</title>
  <desc id="interview-desc">MedOrbits interview icon featuring two professionals in conversation with a speech bubble and a gold checkmark.</desc>

  <defs>
    <linearGradient id="interview-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="interview-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#interview-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Interviewer -->
  <circle cx="42" cy="44" r="11" fill="#292335" stroke="url(#interview-gold)" stroke-width="2.8"/>
  <path d="M23 76v-5a19 19 0 0 1 38 0v5" stroke="url(#interview-gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Candidate -->
  <circle cx="85" cy="57" r="9" fill="#292335" stroke="#C4B0DE" stroke-width="2.5"/>
  <path d="M69 83v-4a16 16 0 0 1 32 0v4" stroke="#C4B0DE" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Conversation bubble -->
  <path d="M55 23h34a7 7 0 0 1 7 7v11a7 7 0 0 1-7 7H76l-8 7v-7h-13a7 7 0 0 1-7-7V30a7 7 0 0 1 7-7Z" fill="#211D2B" stroke="url(#interview-gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M59 35h23M59 41h15" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Success checkmark -->
  <circle cx="91" cy="91" r="13" fill="#211D2B" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m85 91 4 4 8-9" stroke="#F8D989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative accent -->
  <path d="m29 25 1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6 1.8-3.7Z" fill="#C4B0DE"/>
</svg>
