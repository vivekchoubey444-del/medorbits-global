
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     fill="none"
     role="img"
     aria-labelledby="career-counselling-title career-counselling-desc">

  <title id="career-counselling-title">Career Counselling</title>
  <desc id="career-counselling-desc">
    Premium career guidance icon featuring a professional counsellor,
    conversation bubble, and career growth symbol.
  </desc>

  <defs>
    <linearGradient id="goldGradient"
                    x1="8" y1="4" x2="54" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5D99B"/>
      <stop offset="0.5" stop-color="#C8A15B"/>
      <stop offset="1" stop-color="#94703B"/>
    </linearGradient>

    <linearGradient id="aubergineGradient"
                    x1="10" y1="6" x2="56" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50304F"/>
      <stop offset="1" stop-color="#261729"/>
    </linearGradient>
  </defs>

  <!-- Premium circular background -->
  <circle cx="32" cy="32" r="29"
          fill="url(#aubergineGradient)"
          stroke="url(#goldGradient)"
          stroke-width="1.5"/>

  <!-- Outer decorative ring -->
  <circle cx="32" cy="32" r="24.5"
          stroke="url(#goldGradient)"
          stroke-opacity="0.35"
          stroke-width="0.8"
          stroke-dasharray="2 3"/>

  <!-- Counselling conversation bubble -->
  <path d="M35 11.5H48.5C51 11.5 53 13.5 53 16V24
           C53 26.5 51 28.5 48.5 28.5H43L38 33V28.5H35
           C32.5 28.5 30.5 26.5 30.5 24V16
           C30.5 13.5 32.5 11.5 35 11.5Z"
        fill="#352039"
        stroke="url(#goldGradient)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Conversation dots -->
  <circle cx="37" cy="20" r="1.5" fill="#F5D99B"/>
  <circle cx="42" cy="20" r="1.5" fill="#F5D99B"/>
  <circle cx="47" cy="20" r="1.5" fill="#F5D99B"/>

  <!-- Counsellor head -->
  <circle cx="23.5" cy="24" r="7"
          fill="#F1D2B2"
          stroke="url(#goldGradient)"
          stroke-width="1.2"/>

  <!-- Hair -->
  <path d="M16.7 23.5C16.2 18.9 19.1 15.8 23.4 15.8
           C27.5 15.8 30.3 18.8 30.2 23.2
           L28 21.5L25.7 20.8L21.3 22.1L18.2 25.1Z"
        fill="#1E1825"/>

  <!-- Professional jacket -->
  <path d="M11 46.5L13.5 37.5
           C14.3 34.8 16.5 33 19.3 33H27.7
           C30.5 33 32.7 34.8 33.5 37.5
           L36 46.5"
        fill="#F0D6AA"
        stroke="url(#goldGradient)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Shirt and tie -->
  <path d="M20 33.5L23.5 38L27 33.5"
        stroke="#6C4967"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M23.5 38L21.8 43L23.5 45L25.2 43Z"
        fill="url(#goldGradient)"/>

  <!-- Career growth arrow -->
  <path d="M37 44.5L42 39.5L46 42L51.5 35.5"
        stroke="url(#goldGradient)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M46.5 35.5H51.5V40.5"
        stroke="url(#goldGradient)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Base detail -->
  <path d="M13 50.5H51"
        stroke="url(#goldGradient)"
        stroke-opacity="0.65"
        stroke-width="1.2"
        stroke-linecap="round"/>

</svg>
