
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="promotion-title promotion-desc">
  <title id="promotion-title">Career Promotion</title>
  <desc id="promotion-desc">MedOrbits career promotion icon featuring an upward career arrow, professional briefcase, and gold achievement badge.</desc>

  <defs>
    <linearGradient id="promotion-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="promotion-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#promotion-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Career progression chart -->
  <path d="M25 88h15V74h15V60h15V46h15" stroke="#C4B0DE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <path d="m75 35 11 11-11 11M86 46H70" stroke="url(#promotion-gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Professional briefcase -->
  <rect x="25" y="75" width="57" height="29" rx="6" fill="#211D2B" stroke="url(#promotion-gold)" stroke-width="2.8"/>
  <path d="M41 75v-5a5 5 0 0 1 5-5h15a5 5 0 0 1 5 5v5" stroke="url(#promotion-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M25 86h57M47 86v6h13v-6" stroke="#E8C36F" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Promotion achievement badge -->
  <circle cx="89" cy="78" r="18" fill="#292335" stroke="url(#promotion-gold)" stroke-width="2.5"/>
  <path d="m89 65 3.5 7 7.7 1.1-5.6 5.5 1.3 7.7-6.9-3.6-6.9 3.6 1.3-7.7-5.6-5.5 7.7-1.1 3.5-7Z" fill="#F8D989"/>

  <!-- Decorative accent -->
  <circle cx="34" cy="34" r="3" fill="#C4B0DE"/>
  <circle cx="46" cy="27" r="2" fill="#F8D989"/>
</svg>
