
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="remote-title remote-desc">
  <title id="remote-title">Remote Work</title>
  <desc id="remote-desc">MedOrbits remote work icon featuring a laptop, a home symbol, and a gold connectivity indicator.</desc>

  <defs>
    <linearGradient id="remote-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="remote-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#remote-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Remote workspace laptop -->
  <rect x="20" y="49" width="70" height="43" rx="5" fill="#211D2B" stroke="url(#remote-gold)" stroke-width="2.8"/>
  <rect x="26" y="55" width="58" height="31" rx="2" fill="#292335" stroke="#C4B0DE" stroke-width="1.5"/>
  <path d="M14 95h82l-7 7H21l-7-7Z" fill="#292335" stroke="url(#remote-gold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Home symbol on screen -->
  <path d="m42 69 13-10 13 10M46 67v13h18V67M53 80v-8h5v8" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cloud connectivity -->
  <path d="M69 31a9 9 0 0 1 17 3 7 7 0 0 1 0 14H67a6 6 0 0 1 2-17Z" fill="#292335" stroke="url(#remote-gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M73 38h10M78 34v8" stroke="#F8D989" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Wireless signal -->
  <path d="M35 34a14 14 0 0 1 18 0M39 39a8 8 0 0 1 10 0M43 44a2 2 0 0 1 2 0" stroke="#C4B0DE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Decorative accent -->
  <circle cx="100" cy="63" r="3" fill="#F8D989"/>
  <circle cx="104" cy="73" r="2" fill="#C4B0DE"/>
</svg>
