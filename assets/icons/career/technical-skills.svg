
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="skills-title skills-desc">
  <title id="skills-title">Technical Skills</title>
  <desc id="skills-desc">MedOrbits technical skills icon featuring a coding window, programming symbols, and a gold gear.</desc>

  <defs>
    <linearGradient id="skills-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="skills-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#skills-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Technical workspace -->
  <rect x="22" y="28" width="73" height="58" rx="7" fill="#211D2B" stroke="url(#skills-gold)" stroke-width="2.8"/>
  <path d="M22 43h73" stroke="url(#skills-gold)" stroke-width="2.5"/>
  <circle cx="32" cy="36" r="2" fill="#F8D989"/>
  <circle cx="39" cy="36" r="2" fill="#C4B0DE"/>
  <circle cx="46" cy="36" r="2" fill="#D5A747"/>

  <!-- Code symbols -->
  <path d="m43 55-9 7 9 7M59 55l9 7-9 7M55 51l-5 22" stroke="#F8D989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 77h27" stroke="#C4B0DE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Technical gear -->
  <path d="M87 63v6l4 2 4-2 4 4-2 4 2 4-2 5-4-1-3 3v4h-6l-2-4-4-1-3 2-4-4 2-4-2-4 2-5 4 1 3-3v-4h7Z"
        fill="#292335" stroke="url(#skills-gold)" stroke-width="2.3" stroke-linejoin="round"/>
  <circle cx="85" cy="79" r="5" stroke="#F8D989" stroke-width="2.5"/>

  <!-- Skill growth indicator -->
  <path d="M33 98h22M33 104h15" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="27" cy="98" r="2.5" fill="#F8D989"/>
  <circle cx="27" cy="104" r="2.5" fill="#C4B0DE"/>
