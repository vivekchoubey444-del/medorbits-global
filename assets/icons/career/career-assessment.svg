
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="career-title career-desc">
  <title id="career-title">Career Assessment</title>
  <desc id="career-desc">A career assessment clipboard with a checklist, skill indicators, and a completed result.</desc>

  <defs>
    <linearGradient id="career-bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#352744"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="career-gold" x1="35" y1="30" x2="94" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D6A84B"/>
    </linearGradient>
  </defs>

  <!-- Premium background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#career-bg)"/>
  <circle cx="101" cy="26" r="13" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Assessment clipboard -->
  <rect x="31" y="28" width="66" height="78" rx="10" fill="#211D2B" stroke="url(#career-gold)" stroke-width="2.5"/>
  <path d="M48 28v-4a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v4" stroke="url(#career-gold)" stroke-width="3" stroke-linecap="round"/>
  <rect x="45" y="38" width="38" height="5" rx="2.5" fill="#F3D58B" opacity=".9"/>

  <!-- Checklist rows -->
  <rect x="42" y="53" width="12" height="12" rx="3" stroke="#E8C36F" stroke-width="2"/>
  <path d="m45 59 3 3 5-6" stroke="#E8C36F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M61 57h22M61 62h15" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="42" y="72" width="12" height="12" rx="3" stroke="#E8C36F" stroke-width="2"/>
  <path d="m45 78 3 3 5-6" stroke="#E8C36F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M61 76h22M61 81h13" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Assessment score badge -->
  <circle cx="89" cy="88" r="17" fill="#252031" stroke="#E8C36F" stroke-width="2.5"/>
  <path d="m80 88 6 6 12-13" stroke="#F5D783" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative career growth indicator -->
  <path d="M22 45v-8m0 0-4 4m4-4 4 4" stroke="#DCC18A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <path d="M103 51h7m-7 0 3-3m-3 3 3 3" stroke="#B5A0D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
