
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="soft-title soft-desc">
  <title id="soft-title">Soft Skills</title>
  <desc id="soft-desc">MedOrbits soft skills icon featuring two professionals communicating with speech bubbles and a gold connection symbol.</desc>

  <defs>
    <linearGradient id="soft-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="soft-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#soft-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- First professional -->
  <circle cx="39" cy="52" r="11" fill="#292335" stroke="url(#soft-gold)" stroke-width="2.8"/>
  <path d="M21 84v-5a18 18 0 0 1 36 0v5" stroke="url(#soft-gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Second professional -->
  <circle cx="87" cy="65" r="9" fill="#292335" stroke="#C4B0DE" stroke-width="2.5"/>
  <path d="M72 91v-4a15 15 0 0 1 30 0v4" stroke="#C4B0DE" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Communication bubble -->
  <path d="M48 23h34a7 7 0 0 1 7 7v10a7 7 0 0 1-7 7H68l-8 7v-7H48a7 7 0 0 1-7-7V30a7 7 0 0 1 7-7Z"
        fill="#211D2B" stroke="url(#soft-gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M52 33h25M52 39h17" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Collaboration connection -->
  <path d="M53 96c5 5 11 7 17 7" stroke="#D5A747" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
  <circle cx="66" cy="103" r="3" fill="#F8D989"/>

  <!-- Empathy accent -->
  <path d="M96 31c-3-4-9 0-5 5l5 5 5-5c4-5-2-9-5-5Z" fill="#C4B0DE"/>
</svg>
