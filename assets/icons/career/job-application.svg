
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-labelledby="job-title job-desc">
  <title id="job-title">Job Application</title>
  <desc id="job-desc">MedOrbits job application icon featuring a professional application document, a briefcase, and a gold verification checkmark.</desc>

  <defs>
    <linearGradient id="job-bg" x1="12" y1="10" x2="116" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#382846"/>
      <stop offset="1" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="job-gold" x1="29" y1="23" x2="98" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D989"/>
      <stop offset="1" stop-color="#D5A747"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#job-bg)"/>
  <circle cx="101" cy="26" r="14" fill="#D9B45D" opacity=".10"/>
  <circle cx="25" cy="101" r="18" fill="#A78BC5" opacity=".10"/>

  <!-- Application document -->
  <path d="M31 22h39l14 14v47a6 6 0 0 1-6 6H31a6 6 0 0 1-6-6V28a6 6 0 0 1 6-6Z"
        fill="#211D2B" stroke="url(#job-gold)" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M70 22v14h14" stroke="url(#job-gold)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Applicant details -->
  <circle cx="42" cy="45" r="6" stroke="#F8D989" stroke-width="2.5"/>
  <path d="M33 59a9 9 0 0 1 18 0" stroke="#F8D989" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M57 43h17M57 50h13M34 68h39M34 76h25" stroke="#C9C2D1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Job briefcase -->
  <rect x="47" y="76" width="43" height="28" rx="5" fill="#292335" stroke="url(#job-gold)" stroke-width="2.5"/>
  <path d="M58 76v-4a4 4 0 0 1 4-4h13a4 4 0 0 1 4 4v4"
        stroke="url(#job-gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M47 87h43M63 87v5h10v-5" stroke="#E8C36F" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Application success badge -->
  <circle cx="91" cy="48" r="15" fill="#211D2B" stroke="#D5A747" stroke-width="2.5"/>
  <path d="m84 48 5 5 9-11" stroke="#F8D989" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative star -->
  <path d="m28 94 1.7 3.5 3.9.6-2.8 2.7.7 3.9-3.5-1.8-3.5 1.8.7-3.9-2.8-2.7 3.9-.6 1.7-3.5Z" fill="#C4B0DE"/>
</svg>
