
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600"
     role="img"
     aria-labelledby="title desc">

  <title id="title">MedOrbits Editorial Blog Placeholder</title>
  <desc id="desc">
    Premium burgundy and champagne editorial illustration
    with an article card, writing lines, and gold accents.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="55%" stop-color="#F6EDDD"/>
      <stop offset="100%" stop-color="#E9D4B5"/>
    </linearGradient>

    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#842C4E"/>
      <stop offset="100%" stop-color="#4B1029"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2DCA8"/>
      <stop offset="50%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#A77D45"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8EEDC"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="15"
                    flood-color="#4B1029" flood-opacity=".18"/>
    </filter>

    <pattern id="dots" width="22" height="22"
             patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5"
              fill="#A77D45" opacity=".25"/>
    </pattern>

    <clipPath id="rounded">
      <rect width="800" height="600" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="800" height="600" fill="url(#background)"/>
    <rect width="800" height="600" fill="url(#dots)"/>

    <!-- Decorative color fields -->
    <circle cx="700" cy="95" r="175"
            fill="#C9A66B" opacity=".15"/>
    <circle cx="65" cy="535" r="190"
            fill="#6B1838" opacity=".07"/>

    <!-- Orbital decoration -->
    <g fill="none" stroke="#C9A66B" opacity=".42">
      <circle cx="650" cy="285" r="205" stroke-width="1.5"/>
      <circle cx="650" cy="285" r="230" stroke-width="1"/>
      <circle cx="650" cy="285" r="255" stroke-width="1"/>
      <path d="M460 60 Q690 200 780 420" stroke-width="1.5"/>
    </g>

    <!-- Floating accent points -->
    <g fill="url(#gold)">
      <circle cx="540" cy="105" r="5"/>
      <circle cx="735" cy="165" r="4"/>
      <circle cx="715" cy="435" r="5"/>
      <circle cx="470" cy="455" r="3"/>
    </g>

    <!-- Main article card -->
    <g filter="url(#shadow)">
      <rect x="155" y="92" width="490" height="410"
            rx="24" fill="#6B1838" opacity=".08"/>

      <rect x="145" y="78" width="490" height="410"
            rx="24" fill="url(#paper)"
            stroke="#D9BD89" stroke-width="1.5"/>

      <!-- Editorial header -->
      <path d="M169 78 H611 Q635 78 635 102 V165 H145 V102 Q145 78 169 78Z"
            fill="url(#wine)"/>

      <rect x="175" y="99" width="5" height="45"
            rx="2.5" fill="url(#gold)"/>

      <text x="195" y="118"
            font-family="Georgia, serif"
            font-size="13" letter-spacing="3"
            fill="#E8CC91">MEDORBITS JOURNAL</text>

      <text x="195" y="143"
            font-family="Arial, sans-serif"
            font-size="10" letter-spacing="2"
            fill="#F6EDDD" opacity=".85">EDUCATION • INSIGHTS • FUTURE</text>

      <!-- Article illustration -->
      <rect x="180" y="190" width="145" height="110"
            rx="14" fill="#EAD9BD"/>

      <circle cx="252" cy="245" r="35"
              fill="#C9A66B" opacity=".32"/>

      <!-- Open book icon -->
      <g transform="translate(252 245)">
        <path d="M-43 -21 Q-22 -28 0 -12 V28 Q-22 12 -43 19 Z"
              fill="url(#wine)"/>
        <path d="M43 -21 Q22 -28 0 -12 V28 Q22 12 43 19 Z"
              fill="url(#gold)"/>
        <path d="M0 -12 V28"
              stroke="#FFF8EC" stroke-width="2"/>
        <path d="M-34 -12 Q-19 -16 -8 -7 M-34 -3 Q-20 -7 -8 2"
              fill="none" stroke="#F6EDDD"
              stroke-width="2" stroke-linecap="round"/>
        <path d="M8 -7 Q20 -16 34 -12 M8 2 Q20 -7 34 -3"
              fill="none" stroke="#FFF8EC"
              stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Article title -->
      <rect x="350" y="195" width="175" height="8"
            rx="4" fill="url(#wine)"/>
      <rect x="350" y="216" width="235" height="6"
            rx="3" fill="#C9A66B" opacity=".85"/>
      <rect x="350" y="234" width="210" height="6"
            rx="3" fill="#C9A66B" opacity=".55"/>

      <!-- Article text lines -->
      <g fill="#6B1838" opacity=".55">
        <rect x="180" y="326" width="400" height="6" rx="3"/>
        <rect x="180" y="345" width="375" height="6" rx="3"/>
        <rect x="180" y="364" width="405" height="6" rx="3"/>
        <rect x="180" y="383" width="325" height="6" rx="3"/>
      </g>

      <!-- Highlighted insight panel -->
      <rect x="180" y="410" width="400" height="48"
            rx="10" fill="#F0E2C9"/>
      <rect x="180" y="410" width="5" height="48"
            rx="2.5" fill="url(#gold)"/>

      <text x="198" y="430"
            font-family="Arial, sans-serif"
            font-size="10" font-weight="700"
            letter-spacing="1.4" fill="#6B1838">
        KNOWLEDGE THAT MOVES YOU FORWARD
      </text>

      <text x="198" y="446"
            font-family="Arial, sans-serif"
            font-size="9" fill="#6B1838" opacity=".75">
        Explore education, admissions and career insights.
      </text>

      <!-- Card footer -->
      <path d="M180 470 H600"
            stroke="#C9A66B" stroke-width="1" opacity=".65"/>

      <text x="180" y="481"
            font-family="Arial, sans-serif"
            font-size="9" letter-spacing="1.5"
            fill="#6B1838">LEARN • GROW • ACHIEVE</text>
    </g>

    <!-- Small floating document symbol -->
    <g transform="translate(665 450) rotate(8)">
      <rect x="-30" y="-38" width="60" height="76"
            rx="8" fill="url(#wine)"/>
      <path d="M-16 -18 H16 M-16 -5 H16 M-16 8 H8"
            stroke="url(#gold)" stroke-width="3"
            stroke-linecap="round"/>
      <circle cx="13" cy="23" r="9"
              fill="url(#gold)"/>
      <path d="M9 23 L12 26 L18 19"
            fill="none" stroke="#4B1029"
            stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Outer border -->
    <rect x="14" y="14" width="772" height="572"
          rx="22" fill="none"
          stroke="#C9A66B" stroke-width="1.3"
          opacity=".75"/>
  </g>
</svg>
