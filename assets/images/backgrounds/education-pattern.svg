
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600"
     role="img"
     aria-labelledby="title desc">

  <title id="title">MedOrbits Premium Education Pattern</title>
  <desc id="desc">Elegant academic pattern with graduation caps,
    gold accents, orbital curves, and a warm cream background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="55%" stop-color="#F6EDDD"/>
      <stop offset="100%" stop-color="#E9D6B7"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CC91"/>
      <stop offset="50%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#98713D"/>
    </linearGradient>

    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81264A"/>
      <stop offset="100%" stop-color="#4B1029"/>
    </linearGradient>

    <pattern id="academicPattern"
             width="120" height="120"
             patternUnits="userSpaceOnUse">

      <g fill="none" stroke="#6B1838"
         stroke-width="1.5" opacity=".19">
        <path d="M18 32 L48 16 L78 32 L48 48 Z"/>
        <path d="M28 37 V53 Q48 68 68 53 V37"/>
        <path d="M48 48 V65"/>
        <path d="M88 82 H108 M98 72 V92"/>
        <circle cx="98" cy="82" r="15"
                stroke="#C9A66B"/>
      </g>

      <circle cx="18" cy="95" r="3" fill="#C9A66B"/>
      <circle cx="82" cy="18" r="2" fill="#C9A66B"/>
    </pattern>

    <pattern id="microDots"
             width="22" height="22"
             patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1"
              fill="#98713D" opacity=".18"/>
    </pattern>

    <g id="cap">
      <path d="M0 -25 L45 -3 L0 19 L-45 -3 Z"
            fill="url(#burgundy)"/>
      <path d="M-29 3 V19 Q0 39 29 19 V3"
            fill="#6B1838"/>
      <path d="M45 -3 V20"
            stroke="#C9A66B" stroke-width="3"
            stroke-linecap="round"/>
      <circle cx="45" cy="23" r="4" fill="url(#gold)"/>
      <path d="M-8 -2 L0 2 L8 -2"
            fill="none" stroke="#E8CC91"
            stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Premium background -->
  <rect width="800" height="600" rx="28" fill="url(#bg)"/>
  <rect width="800" height="600" rx="28"
        fill="url(#microDots)"/>

  <!-- Decorative color fields -->
  <circle cx="690" cy="85" r="175"
          fill="#C9A66B" opacity=".13"/>
  <circle cx="75" cy="545" r="190"
          fill="#6B1838" opacity=".07"/>
  <path d="M0 440 Q190 350 350 465 T800 400"
        fill="none" stroke="#C9A66B"
        stroke-width="2" opacity=".25"/>
  <path d="M0 470 Q190 380 350 495 T800 430"
        fill="none" stroke="#6B1838"
        stroke-width="1.5" opacity=".12"/>

  <!-- Orbital rings -->
  <g fill="none" stroke="#C9A66B"
     stroke-width="1.5" opacity=".3">
    <circle cx="640" cy="220" r="125"/>
    <circle cx="640" cy="220" r="155"/>
    <circle cx="640" cy="220" r="185"/>
    <path d="M480 60 Q690 180 735 385"/>
  </g>

  <!-- Academic emblem -->
  <g transform="translate(640 220)">
    <circle r="92" fill="#FFF8EC" opacity=".72"/>
    <circle r="82" fill="none"
            stroke="url(#gold)" stroke-width="2"/>
    <circle r="72" fill="none"
            stroke="#6B1838" stroke-width="1"
            opacity=".2"/>
    <use href="#cap" transform="translate(0 -12) scale(1.25)"/>
    <path d="M-35 28 Q0 48 35 28"
          fill="none" stroke="url(#gold)"
          stroke-width="3" stroke-linecap="round"/>
    <path d="M-25 42 H25"
          stroke="#6B1838" stroke-width="2"
          opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- Floating academic symbols -->
  <g fill="none" stroke="url(#gold)"
     stroke-width="2" opacity=".8">
    <circle cx="493" cy="145" r="13"/>
    <path d="M486 145 L493 138 L500 145 L493 152 Z"/>
    <circle cx="756" cy="315" r="17"/>
    <path d="M746 315 H766 M756 305 V325"/>
    <circle cx="530" cy="370" r="8"/>
    <circle cx="714" cy="90" r="6"/>
  </g>

  <!-- Subtle pattern overlay -->
  <rect width="800" height="600" rx="28"
        fill="url(#academicPattern)"/>

  <!-- Frame -->
  <rect x="16" y="16" width="768" height="568"
        rx="22" fill="none"
        stroke="#C9A66B" stroke-width="1.5"
        opacity=".6"/>

  <!-- Small corner details -->
  <g fill="url(#gold)">
    <circle cx="38" cy="38" r="3"/>
    <circle cx="762" cy="38" r="3"/>
    <circle cx="38" cy="562" r="3"/>
    <circle cx="762" cy="562" r="3"/>
  </g>
</svg>
