
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 440 100"
     role="img"
     aria-labelledby="medorbits-title medorbits-desc">

  <title id="medorbits-title">MedOrbits Royal Gold Wordmark</title>
  <desc id="medorbits-desc">An elegant champagne-gold MedOrbits wordmark with a refined orbital emblem.</desc>

  <defs>
    <linearGradient id="mo-word-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21122D"/>
      <stop offset=".55" stop-color="#100A19"/>
      <stop offset="1" stop-color="#08060D"/>
    </linearGradient>

    <linearGradient id="mo-word-gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF9DF"/>
      <stop offset=".16" stop-color="#F4D995"/>
      <stop offset=".32" stop-color="#B8873E"/>
      <stop offset=".48" stop-color="#FFF0B7"/>
      <stop offset=".63" stop-color="#D2AA61"/>
      <stop offset=".8" stop-color="#FFF4CC"/>
      <stop offset="1" stop-color="#A97532"/>
    </linearGradient>

    <linearGradient id="mo-word-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="mo-word-aura">
      <stop offset="0" stop-color="#D7B46D" stop-opacity=".17"/>
      <stop offset="1" stop-color="#D7B46D" stop-opacity="0"/>
    </radialGradient>

    <filter id="mo-word-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#E5BD70" flood-opacity=".42" result="goldGlow"/>
      <feComposite in="goldGlow" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Optional dark presentation background -->
  <rect width="440" height="100" rx="12" fill="url(#mo-word-bg)"/>
  <ellipse cx="220" cy="47" rx="205" ry="52" fill="url(#mo-word-aura)"/>

  <!-- Refined orbital emblem -->
  <g transform="translate(45 48)" fill="none">
    <circle r="26" stroke="url(#mo-word-gold)" stroke-width="1.1"/>
    <ellipse rx="30" ry="11" transform="rotate(-38)"
             stroke="url(#mo-word-gold)" stroke-width="1.1"/>
    <ellipse rx="30" ry="11" transform="rotate(38)"
             stroke="#D7B46D" stroke-opacity=".7" stroke-width=".7"/>

    <circle cx="20.8" cy="-19" r="2.6" fill="#FFF0B7" stroke="none"/>
    <circle cx="-23" cy="10" r="1.8" fill="#D7B46D" stroke="none"/>
    <circle cx="0" cy="0" r="2.2" fill="#FFF0B7" stroke="none"/>
  </g>

  <!-- Elegant wordmark -->
  <text x="88" y="57"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="39"
        font-weight="400"
        letter-spacing=".2"
        fill="url(#mo-word-gold)"
        filter="url(#mo-word-glow)">MedOrbits</text>

  <!-- Restrained signature rule -->
  <path d="M90 69 H365"
        stroke="url(#mo-word-gold)"
        stroke-width=".7"
        stroke-linecap="round"
        opacity=".85"/>

  <circle cx="90" cy="69" r="1.2" fill="#FFF0B7"/>
  <circle cx="365" cy="69" r="1.2" fill="#FFF0B7"/>

  <!-- Brand descriptor -->
  <text x="228" y="84"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="7"
        font-weight="400"
        letter-spacing="3.1"
        fill="#E7D1A0">EXCELLENCE • GUIDANCE • FUTURE</text>
</svg>
