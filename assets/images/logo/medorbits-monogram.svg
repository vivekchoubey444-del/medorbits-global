
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="mo-title mo-desc">
  <title id="mo-title">MedOrbits Imperial Gold Monogram</title>
  <desc id="mo-desc">A luminous metallic-gold M framed by polished gold borders on a luxurious deep aubergine background.</desc>

  <defs>
    <linearGradient id="mo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#382044"/>
      <stop offset=".35" stop-color="#1D1029"/>
      <stop offset=".72" stop-color="#100919"/>
      <stop offset="1" stop-color="#06040B"/>
    </linearGradient>

    <radialGradient id="mo-aura" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#F4D58A" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#C9A15B" stop-opacity=".08"/>
      <stop offset="1" stop-color="#C9A15B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mo-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9DC"/>
      <stop offset=".12" stop-color="#FFE9A3"/>
      <stop offset=".25" stop-color="#C99542"/>
      <stop offset=".39" stop-color="#FFF1B9"/>
      <stop offset=".52" stop-color="#D6AD5F"/>
      <stop offset=".66" stop-color="#FFF4C9"/>
      <stop offset=".82" stop-color="#A9782F"/>
      <stop offset="1" stop-color="#FDE8A0"/>
    </linearGradient>

    <linearGradient id="mo-letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".12" stop-color="#FFF1B9"/>
      <stop offset=".28" stop-color="#E4BD69"/>
      <stop offset=".43" stop-color="#FFF9D9"/>
      <stop offset=".55" stop-color="#D5A64F"/>
      <stop offset=".72" stop-color="#F8D98D"/>
      <stop offset=".88" stop-color="#A9752D"/>
      <stop offset="1" stop-color="#FFE9A0"/>
    </linearGradient>

    <linearGradient id="mo-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBE4"/>
      <stop offset=".45" stop-color="#C9A15B"/>
      <stop offset="1" stop-color="#785022"/>
    </linearGradient>

    <filter id="mo-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#F3CD78" flood-opacity=".65" result="gold-glow"/>
      <feComposite in="gold-glow" in2="blur" operator="in" result="colored-glow"/>
      <feMerge>
        <feMergeNode in="colored-glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mo-shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".8" result="shadow-blur"/>
      <feOffset dy="1" result="shadow-offset"/>
      <feFlood flood-color="#000000" flood-opacity=".75" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep imperial background -->
  <rect width="80" height="80" rx="17" fill="url(#mo-bg)"/>
  <rect width="80" height="80" rx="17" fill="url(#mo-aura)"/>

  <!-- Soft inset edge -->
  <rect x=".6" y=".6" width="78.8" height="78.8" rx="16.5"
        fill="none" stroke="#E7C57B" stroke-opacity=".18" stroke-width=".7"/>

  <!-- Outer polished frame -->
  <rect x="3.2" y="3.2" width="73.6" height="73.6" rx="13.5"
        fill="none" stroke="#000000" stroke-opacity=".55" stroke-width="2.1"/>
  <rect x="3.2" y="3.2" width="73.6" height="73.6" rx="13.5"
        fill="none" stroke="url(#mo-gold)" stroke-width="1.25"/>

  <!-- Inner champagne border -->
  <rect x="6.5" y="6.5" width="67" height="67" rx="10.5"
        fill="none" stroke="url(#mo-edge)" stroke-opacity=".68" stroke-width=".55"/>

  <!-- Fine corner highlights -->
  <path d="M12 19 V12 H19 M61 12 H68 V19
           M12 61 V68 H19 M61 68 H68 V61"
        fill="none" stroke="#FFE8A1" stroke-opacity=".65"
        stroke-width=".65" stroke-linecap="round"/>

  <!-- Royal top ornament -->
  <path d="M40 8.8 L42.1 11.1 L40 13.4 L37.9 11.1 Z"
        fill="url(#mo-gold)" stroke="#FFF0BC" stroke-width=".35"/>

  <!-- Letter shadow -->
  <text x="40" y="54"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="46"
        font-weight="400"
        letter-spacing="-2.2"
        fill="#000000"
        opacity=".65"
        transform="translate(0 1)"
        >M</text>

  <!-- Main metallic monogram -->
  <text x="40" y="53"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="46"
        font-weight="400"
        letter-spacing="-2.2"
        fill="url(#mo-letter)"
        stroke="#A87831"
        stroke-opacity=".8"
        stroke-width=".35"
        paint-order="stroke fill"
        filter="url(#mo-shadow)">M</text>

  <!-- Fine luminous letter highlight -->
  <path d="M25.5 27.5 L31.1 27.5 L40 39.2 L48.9 27.5 L54.5 27.5"
        fill="none" stroke="#FFFFFF" stroke-opacity=".12"
        stroke-width=".7" stroke-linecap="round"/>

  <!-- Signature line -->
  <path d="M27 61 H53"
        fill="none" stroke="url(#mo-gold)"
        stroke-width=".8" stroke-linecap="round"/>

  <circle cx="24.5" cy="61" r=".9" fill="#FFF0B5"/>
  <circle cx="55.5" cy="61" r=".9" fill="#FFF0B5"/>

  <!-- Subtle lower ornament -->
  <path d="M40 65.4 L42.1 67.6 L40 69.8 L37.9 67.6 Z"
        fill="url(#mo-gold)"/>

  <!-- Restrained specular accents -->
  <circle cx="11" cy="39" r=".8" fill="#FFFFFF" opacity=".9"/>
  <circle cx="69" cy="39" r=".8" fill="#FFE6A0" opacity=".9"/>
</svg>
