
# =============================================================================
# MedOrbits -- Security Deny Rules
# File: /__headers/nginx/security-deny.conf
#
# Purpose:
#   - Block sensitive file exposure
#   - Protect repository metadata
#   - Deny access to internal directories
#   - Block backup and temporary files
#   - Prevent directory listing
#
# Include context: http or server
# Recommended include location: HTTPS server block
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Hidden files and directories
# -----------------------------------------------------------------------------

# Allow ACME challenge paths and deny other hidden paths.
location ~ /\.(?!well-known(?:/|$)) {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 2. Git and version-control metadata
# -----------------------------------------------------------------------------

location ~* ^/(?:\.git|\.svn|\.hg|\.bzr)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 3. Environment and configuration files
# -----------------------------------------------------------------------------

location ~* \.(?:env|ini|conf|config|toml|ya?ml|properties)$ {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* ^/(?:\.env(?:\..*)?|composer\.(?:json|lock)|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 4. Backup and temporary files
# -----------------------------------------------------------------------------

location ~* \.(?:bak|backup|old|orig|save|swp|swo|tmp|temp|dump|dist)$ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 5. Database and dump files
# -----------------------------------------------------------------------------

location ~* \.(?:sql|sqlite|sqlite3|db|mdb|dump)$ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 6. Logs and debugging files
# -----------------------------------------------------------------------------

location ~* \.(?:log|trace|stackdump|pid)$ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 7. Internal project directories
# -----------------------------------------------------------------------------

location ~* ^/(?:__headers|database|migrations|scripts|tests|infrastructure|private|internal)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 8. Dependency and build metadata
# -----------------------------------------------------------------------------

location ~* ^/(?:node_modules|vendor|\.github|\.husky|\.vscode)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 9. Private document directory
# -----------------------------------------------------------------------------

# This denies direct static access. Serve private documents through an
# authenticated application endpoint or private object storage instead.

location ^~ /official-documents/private/ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 10. Directory listing
# -----------------------------------------------------------------------------

autoindex off;


# -----------------------------------------------------------------------------
# 11. Additional sensitive filenames
# -----------------------------------------------------------------------------

location ~* ^/(?:phpinfo|info|debug|server-status|actuator)(?:\.php)?(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
}


# =============================================================================
# SECURITY NOTES
# =============================================================================
#
# 1. Keep secrets outside the public document root.
# 2. Do not deploy private documents into publicly accessible static folders.
# 3. Protect API endpoints through authentication and server-side authorization.
# 4. Do not rely on Nginx deny rules as a replacement for filesystem permissions.
# 5. Review application routing before deploying these rules.
# 6. Keep ACME challenge paths accessible when using HTTP-01 certificate renewal.
#
# =============================================================================
