
# Deny access to hidden files and repository metadata.

location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(?:env|ini|log|sql|bak|old|orig|swp|dist)$ {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* ^/(?:\.git|\.github|node_modules|vendor|database|backups)(?:/|$) {
    deny all;
    access_log off;
    log_not_found off;
}
