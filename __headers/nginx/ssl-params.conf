
# MedOrbits -- TLS parameters
# Requires a valid certificate and private key.

ssl_protocols TLSv1.2 TLSv1.3;

ssl_session_timeout 1d;
ssl_session_cache shared:MedOrbitsTLS:10m;
ssl_session_tickets off;

ssl_prefer_server_ciphers off;

# Do not enable OCSP stapling without configuring
# and validating the appropriate certificate chain.
