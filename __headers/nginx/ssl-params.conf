
# =============================================================================
# MedOrbits -- TLS / SSL Security Parameters
# File: /__headers/nginx/ssl-params.conf
#
# Purpose:
#   - Enforce modern TLS protocols
#   - Configure secure cipher suites
#   - Enable TLS session reuse
#   - Disable legacy SSL protocols
#   - Configure OCSP stapling
#
# Compatibility: Nginx with OpenSSL
# =============================================================================


# -----------------------------------------------------------------------------
# 1. TLS protocol versions
# -----------------------------------------------------------------------------

ssl_protocols TLSv1.2 TLSv1.3;


# -----------------------------------------------------------------------------
# 2. TLS 1.2 cipher suites
# -----------------------------------------------------------------------------

ssl_ciphers
    'ECDHE-ECDSA-AES128-GCM-SHA256:
     ECDHE-RSA-AES128-GCM-SHA256:
     ECDHE-ECDSA-AES256-GCM-SHA384:
     ECDHE-RSA-AES256-GCM-SHA384:
     ECDHE-ECDSA-CHACHA20-POLY1305:
     ECDHE-RSA-CHACHA20-POLY1305';


ssl_prefer_server_ciphers off;


# -----------------------------------------------------------------------------
# 3. TLS session configuration
# -----------------------------------------------------------------------------

ssl_session_timeout 1d;

ssl_session_cache shared:MedOrbitsTLS:10m;

ssl_session_tickets off;


# -----------------------------------------------------------------------------
# 4. OCSP stapling
# -----------------------------------------------------------------------------

ssl_stapling on;
ssl_stapling_verify on;

# Configure a trusted CA bundle appropriate to your operating system.
# Common Debian/Ubuntu path:
ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Resolver required for OCSP responder DNS lookups.
# Replace with trusted DNS resolvers appropriate to your infrastructure.
resolver 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;


# -----------------------------------------------------------------------------
# 5. TLS certificate verification
# -----------------------------------------------------------------------------

# Do not enable client certificate verification globally.
# Configure ssl_client_certificate and ssl_verify_client only
# for endpoints that explicitly require mutual TLS.


# -----------------------------------------------------------------------------
# 6. Early data
# -----------------------------------------------------------------------------

# TLS 1.3 early data is disabled by default.
# Do not enable ssl_early_data for authenticated or state-changing requests.


# -----------------------------------------------------------------------------
# 7. DH parameters
# -----------------------------------------------------------------------------

# Optional for deployments that explicitly use DHE cipher suites.
# This configuration uses ECDHE cipher suites instead.
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;


# -----------------------------------------------------------------------------
# 8. Security notes
# -----------------------------------------------------------------------------

# - Do not enable SSLv3, TLSv1.0 or TLSv1.1.
# - Keep Nginx and OpenSSL updated.
# - Use valid certificates with complete intermediate chains.
# - Monitor certificate expiration.
# - Test TLS configuration after every significant change.
