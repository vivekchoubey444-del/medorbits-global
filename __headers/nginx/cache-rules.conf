
# =============================================================================
# MedOrbits -- Nginx Cache Rules
# File: /__headers/nginx/cache-rules.conf
#
# Purpose:
#   - Static asset caching
#   - HTML revalidation
#   - JSON data caching
#   - API cache protection
#   - Private document cache protection
#
# Important:
#   Include these location blocks inside the appropriate server context.
#   Review existing location blocks before deployment.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Static assets
# -----------------------------------------------------------------------------

location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf|eot)$ {
    expires 7d;

    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log off;
}


# -----------------------------------------------------------------------------
# 2. HTML pages
# -----------------------------------------------------------------------------

location ~* \.html$ {
    expires -1;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# -----------------------------------------------------------------------------
# 3. Public JSON data
# -----------------------------------------------------------------------------

location ~* ^/assets/data/.*\.json$ {
    expires 5m;

    add_header Cache-Control "public, max-age=300, stale-while-revalidate=60" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# -----------------------------------------------------------------------------
# 4. API responses
# -----------------------------------------------------------------------------

location ^~ /api/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# -----------------------------------------------------------------------------
# 5. Account pages
# -----------------------------------------------------------------------------

location ^~ /account/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# -----------------------------------------------------------------------------
# 6. Admin pages
# -----------------------------------------------------------------------------

location ^~ /admin/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# -----------------------------------------------------------------------------
# 7. Private documents
# -----------------------------------------------------------------------------

location ^~ /official-documents/private/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}


# -----------------------------------------------------------------------------
# 8. Backup and sensitive file protection
# -----------------------------------------------------------------------------

location ~* \.(?:bak|backup|old|orig|save|swp|tmp|env|log|sql)$ {
    deny all;
    access_log off;
    log_not_found off;
}


# -----------------------------------------------------------------------------
# 9. Hidden files
# -----------------------------------------------------------------------------

location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}
