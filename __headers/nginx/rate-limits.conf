
# MedOrbits -- Request rate limiting
# Include limit_req_zone directives inside the http context.

limit_req_zone $binary_remote_addr
    zone=medorbits_general:10m
    rate=10r/s;

limit_req_zone $binary_remote_addr
    zone=medorbits_api:10m
    rate=5r/s;

limit_conn_zone $binary_remote_addr
    zone=medorbits_connections:10m;
