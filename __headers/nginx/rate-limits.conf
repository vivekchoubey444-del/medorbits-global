
# =============================================================================
# MedOrbits -- Nginx Rate Limiting
# File: /__headers/nginx/rate-limits.conf
#
# Purpose:
#   - API request rate limiting
#   - Authentication endpoint protection
#   - Connection limiting
#   - Abuse and burst traffic control
#
# Include context: http
# =============================================================================


# -----------------------------------------------------------------------------
# 1. General API rate limit
# -----------------------------------------------------------------------------

# Average: 30 requests per second per client IP.
# Shared memory zone: 10 MB.

limit_req_zone $binary_remote_addr
    zone=medorbits_api:10m
    rate=30r/s;


# -----------------------------------------------------------------------------
# 2. Authentication rate limit
# -----------------------------------------------------------------------------

# Average: 5 requests per minute per client IP.
# Apply specifically to login, registration and password recovery routes.

limit_req_zone $binary_remote_addr
    zone=medorbits_auth:10m
    rate=5r/m;


# -----------------------------------------------------------------------------
# 3. Sensitive endpoint rate limit
# -----------------------------------------------------------------------------

# Average: 10 requests per minute per client IP.
# Apply to expensive or sensitive endpoints.

limit_req_zone $binary_remote_addr
    zone=medorbits_sensitive:10m
    rate=10r/m;


# -----------------------------------------------------------------------------
# 4. Concurrent connection limit
# -----------------------------------------------------------------------------

limit_conn_zone $binary_remote_addr
    zone=medorbits_connections:10m;


# -----------------------------------------------------------------------------
# 5. Rate-limit response status
# -----------------------------------------------------------------------------

limit_req_status 429;
limit_conn_status 429;


# -----------------------------------------------------------------------------
# 6. Optional dry-run mode
# -----------------------------------------------------------------------------

# Enable temporarily to observe rate-limit violations without rejecting
# requests. Requires a compatible Nginx version.
#
# limit_req_dry_run on;
# limit_conn_dry_run on;


# =============================================================================
# LOCATION-LEVEL RULES
# =============================================================================
#
# The following directives belong inside their respective location blocks.
# Do not uncomment them at http context level.
#
# General API:
#   limit_req zone=medorbits_api burst=60 nodelay;
#   limit_conn medorbits_connections 30;
#
# Authentication:
#   limit_req zone=medorbits_auth burst=5 nodelay;
#   limit_conn medorbits_connections 10;
#
# Sensitive endpoints:
#   limit_req zone=medorbits_sensitive burst=10 nodelay;
#   limit_conn medorbits_connections 10;
#
# =============================================================================
