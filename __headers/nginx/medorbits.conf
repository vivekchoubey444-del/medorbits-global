
# =============================================================================
# MedOrbits -- Main Nginx Virtual Host
# File: /__headers/nginx/medorbits.conf
#
# Domains:
#   medorbits.in
#   www.medorbits.in
#
# Document root:
#   /var/www/medorbits
#
# API upstream:
#   127.0.0.1:3000
#
# Include context:
#   http
#
# Requirements:
#   - Nginx with HTTP/2 support
#   - Valid TLS certificate covering both hostnames
#   - Node.js API listening on 127.0.0.1:3000
# =============================================================================


# -----------------------------------------------------------------------------
# 1. HTTP -- Redirect to canonical HTTPS hostname
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    server_name medorbits.in www.medorbits.in;

    return 301 https://medorbits.in$request_uri;
}


# -----------------------------------------------------------------------------
# 2. HTTPS -- Redirect www to canonical hostname
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name www.medorbits.in;

    ssl_certificate
        /etc/letsencrypt/live/medorbits.in/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/medorbits.in/privkey.pem;

    include /etc/nginx/medorbits/ssl-params.conf;

    return 301 https://medorbits.in$request_uri;
}


# -----------------------------------------------------------------------------
# 3. HTTPS -- Main MedOrbits website
# -----------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name medorbits.in;

    root /var/www/medorbits;
    index index.html;

    server_tokens off;

    # -------------------------------------------------------------------------
    # 3.1 TLS certificates
    # -------------------------------------------------------------------------

    ssl_certificate
        /etc/letsencrypt/live/medorbits.in/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/medorbits.in/privkey.pem;

    include /etc/nginx/medorbits/ssl-params.conf;


    # -------------------------------------------------------------------------
    # 3.2 Security headers
    # -------------------------------------------------------------------------

    include /etc/nginx/medorbits/security-headers.conf;


    # -------------------------------------------------------------------------
    # 3.3 Security deny rules
    # -------------------------------------------------------------------------

    include /etc/nginx/medorbits/security-deny.conf;


    # -------------------------------------------------------------------------
    # 3.4 Main website routing
    # -------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ $uri.html =404;
    }


    # -------------------------------------------------------------------------
    # 3.5 API reverse proxy
    # -------------------------------------------------------------------------

    location ^~ /api/ {

        # General API rate limiting.
        limit_req zone=medorbits_api burst=60 nodelay;

        limit_conn medorbits_connections 30;

        proxy_pass http://127.0.0.1:3000;

        include /etc/nginx/medorbits/proxy-params.conf;

        # Explicitly preserve required response security headers because
        # this location defines its own add_header directives.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }


    # -------------------------------------------------------------------------
    # 3.6 Authentication endpoint limits
    # -------------------------------------------------------------------------

    location = /api/v1/auth/login {

        limit_req zone=medorbits_auth burst=5 nodelay;

        limit_conn medorbits_connections 10;

        proxy_pass http://127.0.0.1:3000;

        include /etc/nginx/medorbits/proxy-params.conf;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }


    # -------------------------------------------------------------------------
    # 3.7 Account pages
    # -------------------------------------------------------------------------

    location ^~ /account/ {

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }


    # -------------------------------------------------------------------------
    # 3.8 Admin pages
    # -------------------------------------------------------------------------

    location ^~ /admin/ {

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }


    # -------------------------------------------------------------------------
    # 3.9 Private document protection
    # -------------------------------------------------------------------------

    location ^~ /official-documents/private/ {

        deny all;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }


    # -------------------------------------------------------------------------
    # 3.10 Cache rules
    # -------------------------------------------------------------------------

    # This file must NOT define duplicate API, account, admin or
    # private-document location blocks.

    include /etc/nginx/medorbits/cache-rules.conf;


    # -------------------------------------------------------------------------
    # 3.11 Directory listing
    # -------------------------------------------------------------------------

    autoindex off;


    # -------------------------------------------------------------------------
    # 3.12 Error handling
    # -------------------------------------------------------------------------

    error_page 403 /403.html;
    error_page 404 /404.html;

    location = /403.html {
        internal;
    }

    location = /404.html {
        internal;
    }
}
