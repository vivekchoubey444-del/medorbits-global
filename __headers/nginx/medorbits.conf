
server {
    listen 80;
    listen [::]:80;

    server_name medorbits.in www.medorbits.in;

    return 301 https://medorbits.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name medorbits.in www.medorbits.in;

    root /var/www/medorbits;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/medorbits.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medorbits.in/privkey.pem;

    include /etc/nginx/snippets/medorbits-ssl-params.conf;

    include /etc/nginx/snippets/medorbits-security-headers.conf;
    include /etc/nginx/snippets/medorbits-security-deny.conf;

    access_log /var/log/nginx/medorbits-access.log;
    error_log /var/log/nginx/medorbits-error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
