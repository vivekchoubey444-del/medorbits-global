
# =============================================================================
# MedOrbits -- Reverse Proxy Parameters
# File: /__headers/nginx/proxy-params.conf
#
# Purpose:
#   - Standardize reverse-proxy request forwarding
#   - Preserve client and original request information
#   - Configure upstream connection behavior
#   - Apply safe proxy timeouts
#
# Include context: location
# Intended upstream: MedOrbits Node.js API
# =============================================================================


# -----------------------------------------------------------------------------
# 1. HTTP proxy protocol
# -----------------------------------------------------------------------------

proxy_http_version 1.1;


# -----------------------------------------------------------------------------
# 2. Forwarded request headers
# -----------------------------------------------------------------------------

proxy_set_header Host $host;

proxy_set_header X-Real-IP $remote_addr;

proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header X-Forwarded-Host $host;

proxy_set_header X-Forwarded-Port $server_port;

# Avoid trusting client-supplied Forwarded headers unless your
# application explicitly validates the trusted proxy chain.
proxy_set_header Forwarded "";


# -----------------------------------------------------------------------------
# 3. Connection handling
# -----------------------------------------------------------------------------

# Empty Connection header allows upstream keep-alive when configured.
proxy_set_header Connection "";


# -----------------------------------------------------------------------------
# 4. Proxy buffering
# -----------------------------------------------------------------------------

proxy_buffering on;

proxy_buffer_size 16k;

proxy_buffers 8 16k;

proxy_busy_buffers_size 32k;


# -----------------------------------------------------------------------------
# 5. Request buffering
# -----------------------------------------------------------------------------

proxy_request_buffering on;


# -----------------------------------------------------------------------------
# 6. Upstream timeouts
# -----------------------------------------------------------------------------

proxy_connect_timeout 10s;

proxy_send_timeout 30s;

proxy_read_timeout 30s;


# -----------------------------------------------------------------------------
# 7. Upstream error handling
# -----------------------------------------------------------------------------

proxy_intercept_errors off;

proxy_next_upstream error timeout;

proxy_next_upstream_tries 2;

proxy_next_upstream_timeout 10s;


# -----------------------------------------------------------------------------
# 8. Response header handling
# -----------------------------------------------------------------------------

proxy_hide_header X-Powered-By;

# Do not blindly hide Set-Cookie, authentication or security headers.
# Do not rewrite upstream Cache-Control without a specific requirement.


# -----------------------------------------------------------------------------
# 9. WebSocket support
# -----------------------------------------------------------------------------

# For WebSocket endpoints, use a dedicated location and configure:
#
# proxy_set_header Upgrade $http_upgrade;
# proxy_set_header Connection "upgrade";
#
# Do not use this configuration globally for ordinary API requests.


# -----------------------------------------------------------------------------
# 10. Security notes
# -----------------------------------------------------------------------------

# - Restrict access to the API upstream at the network/firewall level.
# - Trust X-Forwarded-* only from known reverse proxies.
# - Configure Express trust proxy to match the actual proxy topology.
# - Do not expose the Node.js upstream port publicly.
# - Use request-size limits in Nginx and the application.
# - Keep authentication and authorization enforcement in the API.
