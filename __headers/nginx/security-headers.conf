
# =============================================================================
# MedOrbits -- HTTP Security Headers
# File: /__headers/nginx/security-headers.conf
#
# Purpose:
#   - Browser security controls
#   - MIME sniffing protection
#   - Clickjacking protection
#   - Referrer privacy
#   - Cross-origin isolation controls
#   - Permissions restrictions
#
# Include context: http or server
# Recommended include location: HTTPS server block
# =============================================================================


# -----------------------------------------------------------------------------
# 1. MIME sniffing protection
# -----------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;


# -----------------------------------------------------------------------------
# 2. Clickjacking protection
# -----------------------------------------------------------------------------

add_header X-Frame-Options "SAMEORIGIN" always;


# -----------------------------------------------------------------------------
# 3. Referrer policy
# -----------------------------------------------------------------------------

add_header Referrer-Policy "strict-origin-when-cross-origin" always;


# -----------------------------------------------------------------------------
# 4. Browser permissions
# -----------------------------------------------------------------------------

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;


# -----------------------------------------------------------------------------
# 5. Cross-origin isolation
# -----------------------------------------------------------------------------

# Test OAuth, payment gateways, embedded content and popup workflows first.
add_header Cross-Origin-Opener-Policy "same-origin" always;


# -----------------------------------------------------------------------------
# 6. Cross-origin resource policy
# -----------------------------------------------------------------------------

# Enable only if MedOrbits does not intentionally serve resources to
# other origins (for example, external websites using public assets).
# add_header Cross-Origin-Resource-Policy "same-origin" always;


# -----------------------------------------------------------------------------
# 7. Content Security Policy -- REPORT ONLY
# -----------------------------------------------------------------------------

# Start in report-only mode. Monitor browser console violations and
# adjust directives before enforcing a Content Security Policy.
#
# Do not enable this policy blindly: external fonts, analytics,
# payment gateways, authentication providers and embedded services
# may require additional trusted origins.

# add_header Content-Security-Policy-Report-Only
#     "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'"
#     always;


# -----------------------------------------------------------------------------
# 8. HTTP Strict Transport Security
# -----------------------------------------------------------------------------

# Enable only after HTTPS is verified for the domain and every subdomain
# that would be covered by this directive.
#
# Do not enable preload until preload eligibility and operational
# readiness have been independently verified.

# add_header Strict-Transport-Security "max-age=31536000" always;


# -----------------------------------------------------------------------------
# 9. Server information
# -----------------------------------------------------------------------------

# Also configure "server_tokens off;" in the Nginx server or http context.
# This suppresses the Nginx version, not every possible server fingerprint.


# -----------------------------------------------------------------------------
# 10. Security implementation notes
# -----------------------------------------------------------------------------

# - Never use Access-Control-Allow-Origin: * with credentials.
# - Configure CORS explicitly at the API layer.
# - Use server-side authorization for account and admin resources.
# - Do not rely on browser security headers as authentication.
# - Test OAuth, payment, iframe and popup integrations after deployment.
