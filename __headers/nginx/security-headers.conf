# Include inside the appropriate `server` block.
# Validate with `nginx -t` before reload.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# HSTS: enable only on HTTPS server blocks after confirming all covered hosts.
# add_header Strict-Transport-Security "max-age=86400" always;

# CSP must be built from the real application dependency inventory.
