name: Generate Package Lockfile

on:
workflow_dispatch:
push:
paths:
- "medorbits-local-agent/package.json"
- "medorbits-local-agent/package-lock.json"
- ".github/workflows/generate-lockfile.yml"

permissions:
contents: read

jobs:
generate-lockfile:
name: Generate and Validate Lockfile
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: medorbits-local-agent
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"
  - name: Verify package.json
    run: |
      test -f package.json
      node -e "const p = require('./package.json'); if (!p.name || !p.version) process.exit(1); console.log('Package manifest is valid:', p.name, p.version)"
  - name: Generate complete package-lock.json
    run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
  - name: Validate generated lockfile
    run: |
      node --input-type=module -e "
        import fs from 'node:fs';
        const lock = JSON.parse(
          fs.readFileSync('package-lock.json', 'utf8')
        );
        const manifest = JSON.parse(
          fs.readFileSync('package.json', 'utf8')
        );
        if (lock.name !== manifest.name) {
          throw new Error('Package name mismatch');
        }
        if (lock.version !== manifest.version) {
          throw new Error('Package version mismatch');
        }
        if (!lock.packages || !lock.packages['']) {
          throw new Error('Missing root package entry');
        }
        if (lock.lockfileVersion !== 3) {
          throw new Error('Expected lockfileVersion 3');
        }
        console.log('Lockfile validation passed.');
        console.log('Lockfile version:', lock.lockfileVersion);
        console.log('Package:', lock.name);
        console.log('Resolved package entries:', Object.keys(lock.packages).length);
      "
  - name: Upload generated lockfile
    uses: actions/upload-artifact@v4
    with:
      name: medorbits-local-agent-package-lock
      path: medorbits-local-agent/package-lock.json
      if-no-files-found: error
      retention-days: 14