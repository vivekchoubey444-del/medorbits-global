
# ==============================================================================
# MedOrbits -- Local Agent Python Configuration
# File: local-agent/pyproject.toml
# Release: 1.0.0
# ==============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medorbits-local-agent"
version = "1.0.0"
description = "Local automation, repository validation, and maintenance utilities for MedOrbits."
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
dependencies = []

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
