
# ==============================================================================
# MedOrbits -- Local Agent Lockfile Generator
# File: .github/workflows/generate-lockfile.yml
# Release: 1.0.0
#
# Purpose:
#   Generate and validate local-agent/package-lock.json.
#
# Security:
#   - Manual execution by default.
#   - No repository write permissions.
#   - npm lifecycle scripts disabled during lockfile generation.
#   - No automatic commits, pushes, or deployments.
# ==============================================================================

name: Generate Local Agent Lockfile

on:
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        description: "Regenerate the lockfile from package.json"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: generate-local-agent-lockfile
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and validate npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Verify package manifest
        run: |
          set -euo pipefail

          test -f local-agent/package.json || {
            echo "::error::local-agent/package.json does not exist."
            exit 1
          }

          node -e "
            const fs = require('fs');
            const p = JSON.parse(
              fs.readFileSync('local-agent/package.json', 'utf8')
            );

            if (!p.name || !p.version) {
              throw new Error('package.json must define name and version');
            }

            console.log('Package:', p.name);
            console.log('Version:', p.version);
          "

      - name: Generate lockfile
        if: ${{ inputs.refresh_lockfile }}
        run: |
          set -euo pipefail

          cd local-agent

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Validate lockfile
        run: |
          set -euo pipefail

          test -s local-agent/package-lock.json || {
            echo "::error::Lockfile is missing or empty."
            exit 1
          }

          node <<'NODE'
          const fs = require('fs');

          const packagePath = 'local-agent/package.json';
          const lockPath = 'local-agent/package-lock.json';

          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));

          if (lock.lockfileVersion === undefined) {
            throw new Error('Lockfile version is missing.');
          }

          if (lock.name && lock.name !== pkg.name) {
            throw new Error('Lockfile package name does not match package.json.');
          }

          if (lock.version && lock.version !== pkg.version) {
            throw new Error('Lockfile package version does not match package.json.');
          }

          if (!lock.packages || !lock.packages['']) {
            throw new Error('Lockfile is missing the root package entry.');
          }

          console.log('Lockfile JSON is valid.');
          console.log('Lockfile version:', lock.lockfileVersion);
          console.log('Package:', pkg.name);
          NODE

      - name: Check dependency consistency
        run: |
          set -euo pipefail

          cd local-agent

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

          git diff --check

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-package-lock
          path: local-agent/package-lock.json
          if-no-files-found: error
          retention-days: 7
