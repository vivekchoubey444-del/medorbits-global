============================================================

MedOrbits -- Python Quality, Security and Testing Toolchain

File: pyproject.toml

Python target: 3.12+

Purpose: Linting, formatting, coverage and static type checking

============================================================

[project]
name = "medorbits"
version = "1.0.0"
description = "MedOrbits application, integrations and quality tooling"
requires-python = ">=3.12"

----------------------------------------

1. RUFF -- CORE CONFIGURATION

----------------------------------------

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"

Primary Python source and supported repository layouts.

src = [
"python",
"src",
"tests",
]

Respect repository ignore rules and exclude configured paths

even when individual files are explicitly passed to Ruff.

respect-gitignore = true
force-exclude = true

Concise diagnostics are suitable for local development and CI.

output-format = "concise"
show-fixes = true
show-source = true

Avoid generated code, third-party code and environment folders.

exclude = [
".git",
".github",
".hg",
".svn",
".mypy_cache",
".pytest_cache",
".ruff_cache",
".tox",
".nox",
".venv",
"venv",
"env",
"ENV",
"build",
"dist",
"site-packages",
"node_modules",
"vendor",
"generated",
"pycache",
"htmlcov",
".coverage",
]

----------------------------------------

2. RUFF -- LINTING RULES

----------------------------------------

[tool.ruff.lint]

Start with high-value correctness, import, security and

maintainability checks. More specialized rules can be enabled

incrementally after the existing codebase has been reviewed.

select = [
"E4",       # Import and syntax-related pycodestyle errors
"E7",       # Statement and control-flow errors
"E9",       # Runtime-risk errors
"F",        # Pyflakes: undefined names and related defects
"W",        # Important pycodestyle warnings
"I",        # Import sorting
"UP",       # Python modernization
"B",        # Bugbear correctness and common bug patterns
"S",        # Security-oriented static checks
"ASYNC",    # Async programming checks
"BLE",      # Blind exception handling
"C4",       # Comprehension improvements
"DTZ",      # Timezone-aware datetime checks
"EM",       # Exception message practices
"FURB",     # Modern Python idioms
"G",        # Logging format checks
"LOG",      # Logging practices
"PERF",     # Performance checks
"PIE",      # Miscellaneous improvements
"PT",       # Pytest best practices
"PTH",      # pathlib recommendations
"RET",      # Return statement checks
"RSE",      # Raise statement checks
"RUF",      # Ruff-specific checks
"SIM",      # Code simplification
"T10",      # Debugger detection
"T20",      # Accidental print statements
"TC",       # Type-checking import practices
"TID",      # Import hygiene
"YTT",      # Python version checks
]

Keep the default rule set manageable.

E501 is intentionally omitted because formatting is handled

by Ruff’s formatter and long strings may require exceptions.

ignore = [
"E501",
]

Never silently modify source code during normal linting.

fix = false
unsafe-fixes = false

Avoid preview rules until the project explicitly adopts them.

preview = false

----------------------------------------

3. RUFF -- IMPORT SORTING

----------------------------------------

[tool.ruff.lint.isort]
known-first-party = [
"medorbits",
]

combine-as-imports = true
force-sort-within-sections = true
force-single-line = false
order-by-type = true
split-on-trailing-comma = true

----------------------------------------

4. RUFF -- BUGBEAR

----------------------------------------

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
"fastapi.Depends",
"fastapi.Query",
"fastapi.Path",
]

----------------------------------------

5. RUFF -- EXCEPTION MESSAGE LENGTH

----------------------------------------

[tool.ruff.lint.flake8-errmsg]
max-string-length = 100

----------------------------------------

6. RUFF -- COMPLEXITY LIMITS

----------------------------------------

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 15
max-returns = 8
max-statements = 60

----------------------------------------

7. RUFF -- FILE-SPECIFIC EXCEPTIONS

----------------------------------------

[tool.ruff.lint.per-file-ignores]

Python test suites need assertions and sometimes use fixed

values for deterministic validation.

"python/tests/**/*.py" = [
"S101",     # Assertions are expected in tests.
"PLR2004",  # Numeric constants may be meaningful in assertions.
]

"tests/**/*.py" = [
"S101",
"PLR2004",
]

"**/test_*.py" = [
"S101",
"PLR2004",
]

"**/*_test.py" = [
"S101",
"PLR2004",
]

"**/conftest.py" = [
"S101",
]

CLI scripts may intentionally print user-facing output.

"python/scripts/**/*.py" = [
"T201",
]

"scripts/**/*.py" = [
"T201",
]

IMPORTANT:

Do not globally suppress S105/S106 in tests. These checks can

reveal hardcoded credential-like values, including accidental

real secrets. Use obviously fake test credentials and add a

narrowly scoped exception only when a reviewed test requires it.

----------------------------------------

8. RUFF -- FORMATTER

----------------------------------------

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

Format code examples in docstrings where supported.

docstring-code-format = true
docstring-code-line-length = 88

Keep trailing-comma behavior deterministic.

skip-magic-trailing-comma = false

Avoid adopting preview formatting behavior implicitly.

preview = false

----------------------------------------

9. COVERAGE -- EXECUTION

----------------------------------------

[tool.coverage.run]

Measure branch coverage in addition to executed lines.

branch = true

Primary Python source tree.

source = [
"python",
]

Use paths relative to the project where practical.

relative_files = true

Keep generated code, tests and external packages out of the

measured application source.

omit = [
"python/tests/",
"tests/",
"/tests/",
"/migrations/",
"/generated/",
"/pycache/",
"/site-packages/",
"/.venv/",
"/venv/",
]

----------------------------------------

10. COVERAGE -- REPORTING AND QUALITY GATE

----------------------------------------

[tool.coverage.report]

precision = 2
show_missing = true
skip_covered = true

Enforce an overall coverage threshold.

This gate applies to the measured source and is not a claim

that the current repository already meets the threshold.

fail_under = 80

Exclude only standard non-executable or intentionally

non-coverable lines from coverage calculations.

exclude_lines = [
"pragma: no cover",
"if TYPE_CHECKING:",
"if name == .main.:",
]

Do not broadly exclude NotImplementedError or AssertionError.

Those statements may represent real execution paths and should

remain visible unless a specific line is intentionally excluded.

----------------------------------------

11. MYPY -- STATIC TYPE CHECKING

----------------------------------------

[tool.mypy]

python_version = "3.12"

Keep static analysis focused on the main Python source tree.

files = [
"python",
]

Resolve first-party imports from the primary source directory.

mypy_path = "python"

Diagnostic quality.

pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
show_traceback = false

Detect unused, ineffective or unnecessary type-checking options.

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

Type safety.

no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

Adopt strict annotations incrementally.

Keep these false initially to reduce unnecessary failures in

an existing codebase; enable after correcting the relevant code.

disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_subclassing_any = false

Follow normal import resolution.

follow_imports = "normal"

Exclude generated, environment, build and migration paths.

Migration exclusion is deliberate only if these files are not

part of the project’s static-analysis scope.

exclude = ‘(?x)(^|/)(build|dist|generated|migrations|.venv|venv|site-packages)/’

----------------------------------------

12. QUALITY TOOLING POLICY

----------------------------------------

Recommended local commands:

Lint:

python -m ruff check .

Apply safe automatic lint fixes explicitly:

python -m ruff check . –fix

Check formatting:

python -m ruff format –check .

Format source intentionally:

python -m ruff format .

Type-check:

python -m mypy

Run tests:

python -m pytest

Run tests with coverage:

python -m pytest –cov=python –cov-branch –cov-report=term-missing

Generate an XML coverage report:

python -m pytest –cov=python –cov-branch –cov-report=xml:coverage.xml

These commands require the corresponding tools and pytest-cov

to be installed in the active development environment.

----------------------------------------

13. QUALITY GATE POLICY

----------------------------------------

1. Resolve undefined names, syntax risks and correctness issues.

2. Review security-related findings instead of suppressing them

globally.

3. Keep lint and formatter checks separate.

4. Improve typing incrementally without blocking unrelated work.

5. Keep coverage thresholds measurable and meaningful.

6. Review exclusions periodically to avoid hiding untested code.

7. Record tool versions in the project’s dependency-management

files to make CI results reproducible.

8. Reassess this configuration when Python or tool versions change.

============================================================

END OF CONFIGURATION

