
# ============================================================
# MedOrbits -- Python Quality, Security and Testing Toolchain
# File: pyproject.toml
# Python target: 3.12+
# ============================================================

[project]
name = "medorbits"
version = "1.0.0"
description = "MedOrbits application, integrations and quality tooling"
requires-python = ">=3.12"

# ============================================================
# 1. RUFF -- CORE CONFIGURATION
# ============================================================

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"

src = [
    "python",
    "src",
    "tests",
]

respect-gitignore = true
force-exclude = true
output-format = "concise"
show-fixes = true
show-source = true

exclude = [
    ".git",
    ".github",
    ".hg",
    ".svn",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".nox",
    ".venv",
    "venv",
    "env",
    "ENV",
    "build",
    "dist",
    "site-packages",
    "node_modules",
    "vendor",
    "generated",
    "__pycache__",
    "htmlcov",
    ".coverage",
]

# ============================================================
# 2. RUFF -- LINTING RULES
# ============================================================

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "S",
    "ASYNC",
    "BLE",
    "C4",
    "DTZ",
    "EM",
    "FURB",
    "G",
    "LOG",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T10",
    "T20",
    "TC",
    "TID",
    "YTT",
]

ignore = [
    "E501",
]

fix = false
unsafe-fixes = false
preview = false

# ============================================================
# 3. RUFF -- IMPORT SORTING
# ============================================================

[tool.ruff.lint.isort]
known-first-party = [
    "medorbits",
]

combine-as-imports = true
force-sort-within-sections = true
force-single-line = false
order-by-type = true
split-on-trailing-comma = true

# ============================================================
# 4. RUFF -- BUGBEAR
# ============================================================

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

# ============================================================
# 5. RUFF -- EXCEPTION MESSAGE LENGTH
# ============================================================

[tool.ruff.lint.flake8-errmsg]
max-string-length = 100

# ============================================================
# 6. RUFF -- COMPLEXITY LIMITS
# ============================================================

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 15
max-returns = 8
max-statements = 60

# ============================================================
# 7. RUFF -- FILE-SPECIFIC EXCEPTIONS
# ============================================================

[tool.ruff.lint.per-file-ignores]

"python/tests/**/*.py" = [
    "S101",
    "PLR2004",
]

"tests/**/*.py" = [
    "S101",
    "PLR2004",
]

"**/test_*.py" = [
    "S101",
    "PLR2004",
]

"**/*_test.py" = [
    "S101",
    "PLR2004",
]

"**/conftest.py" = [
    "S101",
]

"python/scripts/**/*.py" = [
    "T201",
]

"scripts/**/*.py" = [
    "T201",
]

# Do not globally suppress S105/S106.
# Use fake credentials in tests and narrowly scoped exceptions
# only after reviewing a specific finding.

# ============================================================
# 8. RUFF -- FORMATTER
# ============================================================

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88
skip-magic-trailing-comma = false
preview = false

# ============================================================
# 9. COVERAGE -- EXECUTION
# ============================================================

[tool.coverage.run]
branch = true
source = [
    "python",
]
relative_files = true

omit = [
    "python/tests/*",
    "tests/*",
    "*/tests/*",
    "*/migrations/*",
    "*/generated/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
]

# ============================================================
# 10. COVERAGE -- REPORTING AND QUALITY GATE
# ============================================================

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 80

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ============================================================
# 11. MYPY -- STATIC TYPE CHECKING
# ============================================================

[tool.mypy]
python_version = "3.12"

files = [
    "python",
]

mypy_path = "python"

pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
show_traceback = false

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_subclassing_any = false

follow_imports = "normal"

exclude = '(?x)(^|/)(build|dist|generated|migrations|\.venv|venv|site-packages)/'

# ============================================================
# 12. PYTEST -- TEST DISCOVERY AND EXECUTION
# ============================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "python/tests",
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: isolated unit tests",
    "integration: tests integrating multiple components",
    "e2e: end-to-end tests",
    "security: security-focused tests",
    "regression: regression tests",
    "slow: tests that take significant time",
    "network: tests requiring network access",
    "database: tests requiring a database",
    "smoke: basic system health tests",
]

# ============================================================
# 13. TOOLING POLICY
# ============================================================
# Install and pin Ruff, pytest, pytest-cov and mypy in the
# project's development dependency file or lockfile.
#
# Lint:
#   python -m ruff check .
#
# Apply safe automatic fixes explicitly:
#   python -m ruff check . --fix
#
# Check formatting:
#   python -m ruff format --check .
#
# Format intentionally:
#   python -m ruff format .
#
# Type-check:
#   python -m mypy
#
# Run tests:
#   python -m pytest
#
# Run tests with coverage:
#   python -m pytest --cov=python --cov-branch --cov-report=term-missing
#
# Generate XML coverage:
#   python -m pytest --cov=python --cov-branch --cov-report=xml:coverage.xml
#
# ============================================================
# QUALITY GATE POLICY
# ============================================================
# 1. Resolve undefined names, syntax risks and correctness issues.
# 2. Review security findings instead of suppressing them globally.
# 3. Keep lint and formatter checks separate.
# 4. Improve typing incrementally.
# 5. Keep coverage thresholds measurable and meaningful.
# 6. Review exclusions periodically.
# 7. Pin tooling versions for reproducible CI.
# 8. Reassess configuration when Python or tool versions change.
