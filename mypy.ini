============================================================

MedOrbits -- Professional Pytest Configuration

File: pytest.ini

Python target: 3.12+

Scope: Discovery, strictness, diagnostics, reporting and CI

============================================================

[pytest]

----------------------------------------

1. TEST DISCOVERY

----------------------------------------

Keep automated test discovery within the Python test suite.

testpaths =
python/tests

python_files =
test_*.py
*_test.py

python_classes =
Test*

python_functions =
test_*

Add the repository root to Python’s import path.

Prefer installing the project package in CI when packaging

configuration is available.

pythonpath =
.

----------------------------------------

2. STRICTNESS AND COLLECTION

----------------------------------------

Fail early when configuration or marker definitions are invalid.

strict_config = true
strict_markers = true

Unexpected passes for xfail tests must fail the suite.

xfail_strict = true

Empty parameter sets indicate a test-definition problem.

empty_parameter_set_mark = fail_at_collect

Avoid recursively collecting tests from environments,

generated assets, caches and third-party source directories.

norecursedirs =
.git
.hg
.svn
.tox
.nox
.venv
venv
env
ENV
build
dist
node_modules
.pytest_cache
.ruff_cache
.mypy_cache
.coverage
htmlcov
pycache
generated
vendor
.next
.nuxt
.turbo

----------------------------------------

3. DEFAULT EXECUTION AND DIAGNOSTICS

----------------------------------------

addopts =
-ra
–strict-config
–strict-markers
–tb=short
–durations=10

Show a progress indicator during ordinary local runs.

console_output_style = progress

Keep assertion output readable.

verbosity_assertions = plain

Preserve normal pytest behavior:

- Tests continue after ordinary failures.

- Use -x to stop after the first failure.

- Use –showlocals for local-variable diagnostics.

- Use -vv for more detailed test output.

----------------------------------------

4. REGISTERED TEST MARKERS

----------------------------------------

markers =
unit: isolated tests that do not require external services
integration: tests involving multiple application components
security: authentication, authorization, permissions and input validation
regression: tests covering previously identified defects
smoke: essential checks for basic application functionality
api: API endpoint and request-response tests
database: tests requiring database access
external: tests requiring external services or network access
slow: tests that take additional time to execute
performance: performance, resource-usage and load-related tests
contract: external API contract, payload and schema tests
auth: authentication, session and identity lifecycle tests
authorization: role-based access control and permission tests
validation: request, configuration and data validation tests
migration: database migration and schema compatibility tests
concurrency: concurrent execution and race-condition tests
e2e: end-to-end tests across complete application workflows
flaky: tests identified as intermittently unreliable; investigate and fix rather than routinely ignoring failures

----------------------------------------

5. WARNING POLICY

----------------------------------------

Surface Python deprecation warnings as test failures.

Third-party exceptions should be narrowly scoped, justified

and documented rather than broadly suppressing warnings.

filterwarnings =
error::DeprecationWarning
error::PendingDeprecationWarning

Note:

Strict warning handling may expose warnings originating from

dependencies. Update or explicitly review affected dependencies

before adding targeted warning exceptions.

----------------------------------------

6. LOGGING

----------------------------------------

Capture application logs without streaming every log message

to the terminal during successful test runs.

log_cli = false
log_level = INFO

log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

----------------------------------------

7. TEST REPORT COMPATIBILITY

----------------------------------------

Produce the modern JUnit XML schema when reports are requested.

junit_family = xunit2

Generate a CI report explicitly when needed:

pytest –junitxml=artifacts/pytest-junit.xml

Create the artifacts directory in the CI workflow before running

pytest. Pytest does not create arbitrary parent directories for

the requested report path.

----------------------------------------

8. EXPECTED-FAILURE POLICY

----------------------------------------

xfail_strict=true makes unexpected passes fail the suite.

Use pytest.mark.xfail only for documented, known defects.

Prefer linking the defect or issue in the test’s reason.

Example:

@pytest.mark.xfail(

reason="Tracked defect: issue reference",

strict=True,

)

----------------------------------------

9. TEST SELECTION CONVENTIONS

----------------------------------------

Run the complete suite:

pytest

Run unit tests:

pytest -m unit

Run integration tests:

pytest -m integration

Run security-related tests:

pytest -m security

Run API tests:

pytest -m api

Exclude slow tests:

pytest -m "not slow"

Run tests that do not require external services:

pytest -m "not external"

Run a specific test file:

pytest python/tests/test_example.py

Stop after the first failure:

pytest -x

Show local variables on failure:

pytest –showlocals

Generate a JUnit XML report:

pytest –junitxml=artifacts/pytest-junit.xml

Marker selection depends on tests being correctly decorated.

A marker does not automatically classify a test by its behavior.

----------------------------------------

10. CI AND ENVIRONMENT GUIDANCE

----------------------------------------

Keep environment-specific settings outside this shared file.

Configure secrets, database URLs, service endpoints, credentials

and environment-specific feature flags through the CI environment.

Do not place secrets or production credentials in pytest.ini.

Install test dependencies explicitly in the development and CI

environments. This configuration does not install plugins.

If coverage is required, install pytest-cov and configure its

options in the project test command or a dedicated CI profile.

If parallel execution is required, install pytest-xdist and

configure worker counts in the CI command rather than assuming

that the plugin is available.

Keep integration tests isolated from production services and

use a dedicated test database with controlled test data.

----------------------------------------

11. MAINTENANCE AND COMPATIBILITY

----------------------------------------

Review this configuration when:

- The supported Python or pytest version changes.

- The test directory structure changes.

- New test markers or test plugins are introduced.

- CI reporting or coverage requirements change.

- Warning policies expose dependency compatibility problems.

Verify the configuration with:

pytest –version

pytest –trace-config

pytest –collect-only

pytest

============================================================

END OF CONFIGURATION

