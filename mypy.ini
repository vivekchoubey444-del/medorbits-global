=============================================================================

MEDORBITS

PYTHON STATIC TYPE CHECKING & CODE QUALITY POLICY

=============================================================================

Configuration file : mypy.ini

Project            : MedOrbits

Website            : https://medorbits.in

Configuration      : mypy

Target Python      : 3.12

Purpose            : Static type analysis, defect prevention, maintainability

and consistent Python code-quality enforcement

STANDARD EXECUTION

python -m mypy .

CI EXECUTION

python -m mypy .

CONFIGURATION VALIDATION

python -m mypy –warn-unused-configs .

IMPORTANT

This configuration defines analysis policy. It does not guarantee that

the codebase passes type checking. Run mypy against the actual repository

and resolve findings before treating the project as compliant.

=============================================================================

[mypy]

--------------------------------------------------–

01. PYTHON LANGUAGE & RUNTIME TARGET

--------------------------------------------------–

python_version = 3.12

--------------------------------------------------–

02. CORE TYPE SAFETY

--------------------------------------------------–

Warn when a function returns a value typed as Any.

warn_return_any = True

Require explicit annotations on function definitions.

disallow_untyped_defs = True
disallow_incomplete_defs = True

Check function bodies even when annotations are incomplete.

check_untyped_defs = True

Prevent implicit Optional types in annotations.

no_implicit_optional = True

Detect redundant casts and unused type-ignore comments.

warn_redundant_casts = True
warn_unused_ignores = True

Detect functions that are expected to return but can fall through.

warn_no_return = True

Require compatible and meaningful equality comparisons.

strict_equality = True

Detect configuration sections that do not match any checked modules.

warn_unused_configs = True

--------------------------------------------------–

03. OPTIONAL VALUES & NULLABILITY

--------------------------------------------------–

Keep None handling explicit.

implicit_optional = False

Do not silently treat untyped definitions as fully typed.

Function bodies are still checked using check_untyped_defs.

For gradual adoption, add targeted module overrides rather than weakening

the global policy.

--------------------------------------------------–

04. IMPORT RESOLUTION & THIRD-PARTY PACKAGES

--------------------------------------------------–

Follow imports normally so imported code can contribute type information.

follow_imports = normal

Report missing imports or type information rather than hiding them globally.

ignore_missing_imports = False

Allow supported namespace-package layouts.

namespace_packages = True

Do not assume the repository root is always the package root.

explicit_package_bases = True

Install third-party type stubs where available and appropriate.

Resolve missing stubs deliberately instead of suppressing all import errors.

--------------------------------------------------–

05. ERROR REPORTING & DIAGNOSTICS

--------------------------------------------------–

Include stable error codes in diagnostics.

show_error_codes = True

Display column positions for faster navigation.

show_column_numbers = True

Improve terminal formatting and readability.

pretty = True

Display an error summary after analysis.

error_summary = True

Keep output useful for local development and CI logs.

show_traceback = False

--------------------------------------------------–

06. INCREMENTAL ANALYSIS & CACHE

--------------------------------------------------–

Reuse cached analysis information to accelerate repeated runs.

incremental = True

Store the cache in a dedicated local directory.

cache_dir = .mypy_cache

Keep cache data local and exclude it from source control.

Add .mypy_cache/ to .gitignore if it is not already covered.

--------------------------------------------------–

07. ERROR-CODE POLICY

--------------------------------------------------–

The following additional error codes may be enabled after the project has

reviewed existing findings and is ready to enforce them.

Enable individually or as a reviewed group when appropriate:

enable_error_code =

ignore-without-code,

redundant-expr,

truthy-bool,

possibly-undefined

Do not enable a new error category in CI without reviewing the resulting

findings and resolving or documenting legitimate exceptions.

--------------------------------------------------–

08. SUPPRESSION & EXCEPTION POLICY

--------------------------------------------------–

Prefer specific, justified suppressions over broad exclusions.

Preferred:

value = external_call()  # type: ignore[return-value]

Avoid:

# type: ignore

Keep warn_unused_ignores enabled so obsolete suppressions are detected.

Document why a suppression is required when the reason is not self-evident.

--------------------------------------------------–

09. PROJECT PACKAGE & MODULE POLICY

--------------------------------------------------–

Keep the global configuration consistent across project modules.

For generated code, migrations or external integration modules that require

different treatment, create narrowly scoped module overrides below.

Example override -- use only when a real project module needs it:

[mypy-some.generated.module]

ignore_errors = True

Never add placeholder module overrides to production configuration without

confirming that the corresponding module exists and requires the exception.

--------------------------------------------------–

10. SECURITY & DATA-VALIDATION GUIDANCE

--------------------------------------------------–

Type checking is not a security boundary.

Use explicit types and validation for:

- User-submitted form values.

- External API responses.

- JSON and configuration files.

- Database records and query results.

- File uploads and parsed documents.

- Environment variables and external service responses.

Treat data from external sources as untrusted until validated.

Use runtime validation for values whose correctness cannot be established

by static type analysis alone.

--------------------------------------------------–

11. CONTINUOUS-INTEGRATION POLICY

--------------------------------------------------–

Recommended CI command:

python -m mypy .

Recommended configuration check:

python -m mypy –warn-unused-configs .

CI should use a declared and supported Python version, install the project’s

reviewed dependencies, and execute mypy against the intended source scope.

Keep CI and local developer configuration aligned to reduce inconsistent

results between development, testing and release environments.

--------------------------------------------------–

12. MAINTENANCE & GOVERNANCE

--------------------------------------------------–

Review this configuration when:

- The supported Python version changes.

- New packages or external integrations are introduced.

- The project adopts additional typing rules.

- Module layouts or namespace-package structures change.

- CI behavior or type-checking scope changes.

Update the policy deliberately and validate it against the installed mypy

version. Configuration options can vary between tool versions.

Do not use a passing type-check result as a substitute for automated tests,

security review, runtime validation or code review.

=============================================================================

