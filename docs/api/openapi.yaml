
openapi: 3.1.0

info:
  title: MedOrbits API
  version: 1.2.0
  summary: API contract for the MedOrbits education and career platform.
  description: |
    MedOrbits API specification for education discovery, applications,
    careers, authentication, and payment-provider integrations.

    IMPORTANT:
    This specification describes the intended contract. Verify every
    endpoint, schema, status code, middleware, and response envelope against
    the deployed implementation before releasing generated clients.

    Security requirements:
      - Enforce authentication and authorization server-side.
      - Validate all input and reject unsupported fields.
      - Derive resource ownership from authenticated identity.
      - Never trust client-supplied roles, payment status, or payable amounts.
      - Do not expose secrets, password hashes, private records, or stack traces.
      - Verify payment-provider webhook signatures against the exact raw body.
      - Use idempotency and transactional protections for financial operations.
      - Apply rate limits to authentication, recovery, search, and public forms.

  contact:
    name: MedOrbits API Team

  license:
    name: Proprietary

servers:
  - url: https://example.invalid/api
    description: PLACEHOLDER -- replace with the deployed API base URL.

externalDocs:
  description: Replace with the published MedOrbits API documentation URL.
  url: https://example.invalid/docs/api

tags:
  - name: Health
    description: Health and readiness checks.
  - name: Authentication
    description: Authentication and session management.
  - name: Courses
    description: Public course discovery.
  - name: Applications
    description: Authenticated application management.
  - name: Jobs
    description: Public job discovery.
  - name: Payments
    description: Payment-provider event processing.

security:
  - sessionAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check service health
      x-implementation-status: verify
      security: []
      responses:
        '200':
          description: Service health check succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a user
      x-implementation-status: verify
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: Session cookie if cookie authentication is implemented.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credentials were rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      x-implementation-status: verify
      responses:
        '204':
          description: Session invalidated successfully; no response body.
          headers:
            Set-Cookie:
              description: Expired session cookie, if applicable.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      x-implementation-status: verify
      responses:
        '200':
          description: Current user's permitted account information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List publicly available courses
      x-implementation-status: verify
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Search supported public course fields.
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: category
          in: query
          description: Filter by a supported course category.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Paginated course results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List the current user's applications
      x-implementation-status: verify
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Applications accessible to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create an application
      x-implementation-status: verify
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
      responses:
        '201':
          description: Application created and persisted.
          headers:
            Location:
              description: URI identifying the created resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Related course or institution is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Application conflicts with business rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Search published jobs
      x-implementation-status: verify
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: location
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: employmentType
          in: query
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Paginated public job results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /payments/webhook:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Receive a payment-provider event
      x-implementation-status: verify
      description: |
        This contract is provider-neutral. Configure the exact signature
        header, event schema, content type, and response behavior for the
        selected payment provider before enabling this endpoint.

        Verify the signature against the exact raw body. Validate the event
        and merchant identity. Process events idempotently and prevent
        duplicate fulfilment or subscription entitlement changes.

        This endpoint uses provider signature authentication, not the normal
        user session cookie.
      security:
        - paymentProviderSignature: []
      parameters:
        - name: X-Provider-Signature
          in: header
          required: true
          description: Placeholder header; replace with the provider's actual header.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific event schema must be defined before release.
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or already processed.
        '400':
          description: Event is malformed or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Provider signature verification failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured limit.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Placeholder cookie name. Replace with the actual configured cookie.
        If the application uses bearer tokens, replace this scheme with the
        implemented authentication scheme.

    paymentProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: |
        Illustrative provider signature header only. OpenAPI describes the
        header location, but server-side code must perform cryptographic
        signature verification using the provider's documented algorithm.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of results per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client correlation identifier. Validate and limit its length.
      schema:
        type: string
        maxLength: 128

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional idempotency key for safe retry handling. This header only
        has an effect if the server implements durable idempotency handling.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed request or invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: The caller lacks permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnsupportedMediaType:
      description: Unsupported request content type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimitExceeded:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when provided.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Service or required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true

    LoginResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: [string, 'null']
          maxLength: 200
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        role:
          type: string
          description: Only expose role information permitted by the access policy.

    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    Course:
      type: object
      additionalProperties: true
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 220
        category:
          type: string
          maxLength: 100
        description:
          type: [string, 'null']
        durationMonths:
          type: [integer, 'null']
          minimum: 1

    CourseListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApplicationCreateRequest:
      type: object
      additionalProperties: false
      required: [courseId]
      properties:
        courseId:
          type: string
          minLength: 1
          maxLength: 100
        institutionId:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
      description: |
        The client must not submit userId as an ownership authority.
        The server derives the applicant identity from authentication.

    Application:
      type: object
      additionalProperties: true
      required: [id, courseId, status]
      properties:
        id:
          type: string
          minLength: 1
        courseId:
          type: string
          minLength: 1
        institutionId:
          type: [string, 'null']
        status:
          type: string
          description: Must match the implemented application state model.
        createdAt:
          type: string
          format: date-time

    ApplicationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Application'

    ApplicationListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Job:
      type: object
      additionalProperties: true
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 250
        slug:
          type: string
          maxLength: 270
        employmentType:
          type: string
          maxLength: 50
        workplaceType:
          type: string
          maxLength: 50
        location:
          type: [string, 'null']
          maxLength: 200
        publishedAt:
          type: [string, 'null']
          format: date-time

    JobListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 100
            message:
              type: string
              minLength: 1
              maxLength: 500
            requestId:
              type: string
              maxLength: 128
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [message]
                properties:
                  field:
                    type: string
                    maxLength: 200
                  message:
                    type: string
                    minLength: 1
                    maxLength: 500
