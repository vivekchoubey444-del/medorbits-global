
#!/usr/bin/env bash
set -euo pipefail

# MedOrbits -- OpenAI OpenAPI Specification Setup

DIRECTORY="openai"
FILE="$DIRECTORY/openapi.yaml"
SOURCE="https://raw.githubusercontent.com/openai/openai-openapi/main/openapi.yaml"

mkdir -p "$DIRECTORY"

echo "Downloading official OpenAI OpenAPI specification..."

TEMP_FILE="$(mktemp)"

cleanup() {
  rm -f "$TEMP_FILE"
}

trap cleanup EXIT

curl --fail --location --silent --show-error \
  "$SOURCE" \
  --output "$TEMP_FILE"

if [ ! -s "$TEMP_FILE" ]; then
  echo "ERROR: Downloaded specification is empty."
  exit 1
fi

if ! grep -q "^openapi:" "$TEMP_FILE"; then
  echo "ERROR: Invalid OpenAPI specification."
  exit 1
fi

mv "$TEMP_FILE" "$FILE"

echo "SUCCESS: $FILE created."
echo "Size: $(wc -c < "$FILE") bytes"
